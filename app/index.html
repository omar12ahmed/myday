<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fff5ec" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <!-- Installable as an app (Android: Chrome → Install app; Mac: Chrome → Install, or Safari → Add to Dock). -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="MyDay" />
    <title>MyDay</title>
    <script>
      // Apply the saved theme before the first paint, so there's no flash of the wrong colours.
      // (Same as the current MyDay. It only reads; it never saves.)
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem('myday.data.v4') || localStorage.getItem('myday.data.v3'));
          var t = s && s.settings && s.settings.theme;
          if (t === 'dark' || t === 'light' || t === 'auto') document.documentElement.setAttribute('data-theme', t);
        } catch (e) { /* fall back to the default light theme */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
