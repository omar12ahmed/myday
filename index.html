<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161a">
<title>MyDay</title>
<style>
  :root {
    --bg: #14161a;
    --surface: #1c1f24;
    --surface2: #23272d;
    --line: #2f343b;
    --text: #dfe2e6;
    --muted: #9aa0a8;
    --faint: #6e747d;
    --accent: #8fb3a3;
    --accent-ink: #12201a;
    --learning: #8ea6c4;
    --admin: #c2ae8c;
    --health: #92b39a;
    --rest: #ad9cbd;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 24px 16px 56px; }

  header { margin-bottom: 20px; }
  .brand { font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); margin: 0; }
  .date { font-size: 28px; font-weight: 600; margin: 2px 0 0; letter-spacing: -.01em; }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 16px;
  }
  h2 { font-size: 21px; font-weight: 600; margin: 0 0 6px; }
  h3 { font-size: 15px; font-weight: 600; margin: 0 0 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  p { margin: 0 0 12px; }
  .muted { color: var(--muted); }
  .small { font-size: 15px; }

  button, .btn {
    font: inherit;
    min-height: 52px;
    padding: 12px 20px;
    border-radius: 14px;
    border: 1px solid var(--line);
    background: var(--surface2);
    color: var(--text);
    cursor: pointer;
    width: 100%;
    text-align: center;
  }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button.ghost { background: transparent; color: var(--muted); }
  button.inline { width: auto; min-height: 44px; padding: 8px 14px; font-size: 15px; }
  .stack > * + * { margin-top: 10px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }

  /* Energy slider */
  .energy-value { font-size: 20px; font-weight: 600; margin: 14px 0 4px; text-align: center; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 48px; background: transparent; margin: 0; }
  input[type=range]::-webkit-slider-runnable-track { height: 8px; border-radius: 8px; background: var(--line); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 36px; height: 36px; border-radius: 50%; background: var(--accent); margin-top: -14px; border: 0; }
  input[type=range]::-moz-range-track { height: 8px; border-radius: 8px; background: var(--line); }
  input[type=range]::-moz-range-thumb { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); border: 0; }
  .ticks { display: flex; justify-content: space-between; color: var(--faint); font-size: 14px; padding: 0 10px; margin-bottom: 18px; }

  /* Tasks */
  ul.tasks { list-style: none; padding: 0; margin: 14px 0 0; }
  ul.tasks li { margin-bottom: 10px; }
  .task {
    display: flex; gap: 14px; align-items: flex-start;
    background: var(--surface2); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px; cursor: pointer; min-height: 64px;
  }
  .task input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .box {
    flex: none; width: 30px; height: 30px; border-radius: 9px; border: 2px solid var(--faint);
    display: grid; place-items: center; margin-top: 2px; transition: background .15s, border-color .15s;
  }
  .task input:checked + .box { background: var(--accent); border-color: var(--accent); }
  .task input:checked + .box::after { content: ""; width: 9px; height: 15px; border: solid var(--accent-ink); border-width: 0 3px 3px 0; transform: rotate(45deg) translate(-1px, -2px); }
  .task input:focus-visible + .box { outline: 2px solid var(--accent); outline-offset: 2px; }
  .task.done .title { color: var(--muted); }
  .title { font-size: 17px; }
  .meta { font-size: 14px; color: var(--faint); margin-top: 2px; }
  .chip { display: inline-block; font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; margin-bottom: 2px; }
  .chip.learning { color: var(--learning); }
  .chip.admin { color: var(--admin); }
  .chip.health { color: var(--health); }
  .chip.rest { color: var(--rest); }
  .roll { margin: 8px 0 0 44px; }
  .roll button.on { border-color: var(--accent); color: var(--accent); }

  .summary { background: var(--surface2); border-radius: 12px; padding: 14px 16px; margin: 14px 0; color: var(--text); }

  /* Streak */
  .streak { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .streak strong { font-size: 18px; font-weight: 600; }
  .dots { display: flex; gap: 6px; flex: none; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--line); }
  .dot.on { background: var(--learning); }

  /* Nudge */
  .nudge { border-color: #3b4a44; background: #1b2420; }

  /* Edit lists */
  .edit-row { display: grid; grid-template-columns: 1fr auto auto auto auto; gap: 8px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
  .edit-row:first-of-type { border-top: 0; }
  .edit-row .t { grid-column: 1 / -1; }
  .edit-row input { font: inherit; color: var(--text); background: var(--surface2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 48px; width: 100%; }
  .edit-row .m { width: 84px; }
  .edit-row button { width: 48px; min-height: 48px; padding: 0; }
  .minlabel { color: var(--faint); font-size: 14px; }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px);
    background: var(--surface2); border: 1px solid var(--line); color: var(--text);
    padding: 12px 18px; border-radius: 12px; max-width: calc(100% - 32px);
    opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; font-size: 15px;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  footer { margin-top: 28px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="brand">MyDay</p>
    <p class="date" id="date"></p>
  </header>
  <div id="nudge"></div>
  <main id="app"></main>
  <div id="streak"></div>
  <footer id="footer"></footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  // ---------- Storage ----------
  const KEYS = {
    tasks: 'myday.tasks',   // editable task lists per category
    days:  'myday.days',    // one record per date: energy + planned tasks + done/rolled state
    nudge: 'myday.nudge',   // when the learning nudge was last shown / accepted
    meta:  'myday.meta'     // schema version + first-used date
  };
  const CATS = ['learning', 'admin', 'health'];
  const CAT_LABEL = { learning: 'Learning', admin: 'Admin', health: 'Health', rest: 'Rest' };
  const ENERGY_LABEL = { 1: 'Running on empty', 2: 'Low', 3: 'Okay', 4: 'Good', 5: 'Great' };

  const SEED = {
    learning: [
      { id: 'l1', title: 'TryHackMe: Pre-Security path — one section', minutes: 30 },
      { id: 'l2', title: 'OverTheWire Bandit — one level', minutes: 20 },
      { id: 'l3', title: 'HTB Academy: Networking module — one section', minutes: 30 },
      { id: 'l4', title: 'HTB Academy: Web Requests module — one section', minutes: 30 }
    ],
    admin: [
      { id: 'a1', title: 'Laundry', minutes: 15 },
      { id: 'a2', title: 'Bulk cook 2 meals', minutes: 60 },
      { id: 'a3', title: 'Clean room (10 min timer)', minutes: 10 },
      { id: 'a4', title: 'Groceries', minutes: 30 }
    ],
    health: [
      { id: 'h1', title: 'Gym', minutes: 60 },
      { id: 'h2', title: 'Meal prep', minutes: 45 },
      { id: 'h3', title: '20-min walk', minutes: 20 }
    ]
  };

  function load(key, fallback) {
    try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
    catch (e) { return fallback; }
  }
  function save(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); }
    catch (e) { toast("Couldn't save — your browser may be blocking storage."); }
  }

  let tasks = load(KEYS.tasks, null);
  if (!tasks) { tasks = JSON.parse(JSON.stringify(SEED)); save(KEYS.tasks, tasks); }
  let days = load(KEYS.days, {});
  let nudge = load(KEYS.nudge, {});
  let meta = load(KEYS.meta, null);
  if (!meta) { meta = { version: 1, firstUsed: todayKey() }; save(KEYS.meta, meta); }

  const saveDays = () => save(KEYS.days, days);
  const saveTasks = () => save(KEYS.tasks, tasks);
  const saveNudge = () => save(KEYS.nudge, nudge);

  // ---------- Dates (local time, YYYY-MM-DD) ----------
  function keyOf(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function todayKey() { return keyOf(new Date()); }
  function parseKey(k) { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); }
  function shift(k, n) { const d = parseKey(k); d.setDate(d.getDate() + n); return keyOf(d); }
  function prettyDate(k) {
    return parseKey(k).toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' });
  }

  // ---------- Helpers ----------
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const keysDesc = () => Object.keys(days).sort().reverse();

  function learningDoneOn(k) {
    const d = days[k];
    return !!d && d.tasks.some(t => t.category === 'learning' && t.done);
  }
  function doneIdsOn(k) {
    const d = days[k];
    return new Set(d ? d.tasks.filter(t => t.done && t.taskId).map(t => t.taskId) : []);
  }
  // Most recent taskId in a category (before a given date) matching a condition.
  function lastId(cat, pred, beforeKey) {
    for (const k of keysDesc()) {
      if (k >= beforeKey) continue;
      const t = days[k].tasks.find(x => x.category === cat && pred(x));
      if (t) return t.taskId;
    }
    return null;
  }
  // Next item in a list after `afterId` (wrapping), skipping anything in `exclude`.
  function nextFrom(list, afterId, exclude) {
    if (!list || !list.length) return null;
    let i = list.findIndex(t => t.id === afterId);
    i = i < 0 ? 0 : i + 1;
    for (let n = 0; n < list.length; n++) {
      const t = list[(i + n) % list.length];
      if (!exclude.has(t.id)) return t;
    }
    return null;
  }

  function planItem(t, category, rolledFrom) {
    return {
      uid: uid(), taskId: t.id, category, title: t.title,
      minutes: t.minutes, baseMinutes: t.minutes,
      done: false, rolled: false, rolledFrom: rolledFrom || null, shrunk: false
    };
  }
  function restItem() {
    return {
      uid: uid(), taskId: null, category: 'rest', title: "Rest. That's the whole plan.",
      minutes: 0, baseMinutes: 0, done: false, rolled: false, rolledFrom: null, shrunk: false
    };
  }
  function shrinkItem(t) { t.minutes = Math.min(t.baseMinutes || 15, 15); t.shrunk = true; }

  // Tasks marked "Roll to tomorrow" on the most recent non-rest-day plan.
  function rolledIn(k) {
    for (const p of keysDesc()) {
      if (p >= k) continue;
      if (days[p].skipped) continue; // rest days carry rolled tasks through untouched
      return { from: p, list: days[p].tasks.filter(t => t.rolled && !t.done && t.category !== 'rest') };
    }
    return { from: null, list: [] };
  }

  function nextLearning(k) {
    return nextFrom(tasks.learning, lastId('learning', t => t.done, k), doneIdsOn(shift(k, -1)));
  }

  // ---------- Day generation ----------
  function buildDay(energy) {
    const k = todayKey();
    const doneYesterday = doneIdsOn(shift(k, -1));
    const rolled = rolledIn(k);

    const pick = cat => {
      const r = rolled.list.find(t => t.category === cat);
      if (r) return planItem({ id: r.taskId, title: r.title, minutes: r.baseMinutes || r.minutes }, cat, rolled.from);
      // Learning follows the roadmap: next one after the last *completed* item.
      // Admin & health rotate: next one after the last *planned* item.
      const after = cat === 'learning' ? lastId(cat, t => t.done, k) : lastId(cat, () => true, k);
      const t = nextFrom(tasks[cat], after, doneYesterday);
      return t ? planItem(t, cat, null) : null;
    };

    const shrink = nudge.shrinkFor === k;
    const candidates = CATS.map(pick).filter(Boolean);
    let list;
    if (energy <= 2) {
      let chosen = shrink ? candidates.find(t => t.category === 'learning') : null;
      if (!chosen && candidates.length) chosen = candidates.reduce((a, b) => (b.minutes < a.minutes ? b : a));
      list = chosen ? [chosen] : [restItem()];
    } else {
      list = candidates.slice(0, energy === 3 ? 2 : 3);
      if (!list.length) list = [restItem()];
    }
    if (shrink) list.forEach(t => { if (t.category === 'learning') shrinkItem(t); });

    days[k] = { energy, skipped: false, createdAt: new Date().toISOString(), tasks: list };
    saveDays();
  }

  function restDay() {
    const k = todayKey();
    days[k] = { energy: days[k] ? days[k].energy : null, skipped: true, createdAt: new Date().toISOString(), tasks: [restItem()] };
    saveDays();
  }

  // ---------- Streak & nudge ----------
  function streakDays() {
    const k = todayKey(), out = [];
    for (let i = 6; i >= 0; i--) out.push(learningDoneOn(shift(k, -i)));
    return out;
  }

  let nudgeVisible = false;
  function checkNudge() {
    const k = todayKey();
    if (nudge.lastShown === k) return;
    if (!tasks.learning || !tasks.learning.length) return;
    if (!meta.firstUsed || meta.firstUsed > shift(k, -3)) return; // give new users a few days first
    for (let i = 0; i <= 3; i++) if (learningDoneOn(shift(k, -i))) return;
    nudgeVisible = true;
    nudge.lastShown = k;
    saveNudge();
  }

  function acceptShrink() {
    const k = todayKey();
    nudge.shrinkFor = k;
    saveNudge();
    nudgeVisible = false;
    const d = days[k];
    if (!d) { toast("Got it — today's learning will be just 15 minutes."); return render(); }
    let l = d.tasks.find(t => t.category === 'learning' && !t.done);
    if (!l) {
      const lt = nextLearning(k);
      if (lt) {
        l = planItem(lt, 'learning', null);
        const ri = d.tasks.findIndex(t => t.category === 'rest');
        if (ri >= 0) d.tasks.splice(ri, 1, l);
        else if (d.tasks.length < 3) d.tasks.unshift(l);
        else {
          const j = d.tasks.findIndex(t => !t.done);
          if (j >= 0) d.tasks.splice(j, 1, l); else d.tasks.unshift(l);
        }
        d.skipped = false;
      }
    }
    if (l) shrinkItem(l);
    saveDays();
    toast("Done — today's learning is just 15 minutes.");
    render();
  }

  // ---------- Rendering ----------
  let view = 'auto';      // 'auto' | 'evening' | 'edit'
  let eveningKey = null;  // which day the check-in is for
  let energy = 3;

  const $ = id => document.getElementById(id);

  function render() {
    const k = todayKey();
    $('date').textContent = prettyDate(k);
    renderNudge();
    if (view === 'edit') { $('app').innerHTML = editView(); }
    else if (view === 'evening' && eveningKey && days[eveningKey]) { $('app').innerHTML = eveningView(eveningKey); }
    else if (days[k]) { view = 'auto'; $('app').innerHTML = planView(k); }
    else { view = 'auto'; $('app').innerHTML = morningView(k); }
    renderStreak();
    renderFooter();
  }

  function renderNudge() {
    $('nudge').innerHTML = !nudgeVisible ? '' : `
      <section class="card nudge">
        <p>No learning in a few days — want to shrink today's task to just 15 minutes?</p>
        <div class="row2">
          <button class="primary" data-action="shrink">Yes, shrink it</button>
          <button class="ghost" data-action="dismiss-nudge">Not today</button>
        </div>
      </section>`;
  }

  function renderStreak() {
    if (view === 'edit') { $('streak').innerHTML = ''; return; }
    const s = streakDays(), n = s.filter(Boolean).length;
    $('streak').innerHTML = `
      <section class="card">
        <div class="streak">
          <strong>Learning days in the last 7: ${n}</strong>
          <div class="dots" aria-hidden="true">${s.map(on => `<span class="dot${on ? ' on' : ''}"></span>`).join('')}</div>
        </div>
        <p class="muted small" style="margin:8px 0 0">This is a rolling 7-day count. A missed day never resets it to zero — it just gently slides along.</p>
      </section>`;
  }

  function renderFooter() {
    $('footer').innerHTML = view === 'edit' ? '' : `
      <div class="row2">
        <button class="ghost inline" style="width:100%" data-action="edit">Edit task lists</button>
        <button class="ghost inline" style="width:100%" data-action="export">Export my data</button>
      </div>`;
  }

  function morningView(k) {
    const y = shift(k, -1), yd = days[y];
    const openYesterday = yd && !yd.skipped && !yd.checkedIn &&
      yd.tasks.some(t => t.category !== 'rest' && !t.done && !t.rolled);
    const rolled = rolledIn(k).list;
    return `
      <section class="card">
        <h2>How's your energy today?</h2>
        <p class="muted small">There's no wrong answer. The plan fits you, not the other way round.</p>
        <div class="energy-value" id="energyLabel">${energy} · ${ENERGY_LABEL[energy]}</div>
        <input type="range" min="1" max="5" step="1" value="${energy}" id="energy" aria-label="Energy from 1 to 5">
        <div class="ticks"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span></div>
        ${rolled.length ? `<p class="muted small">Carrying forward: ${rolled.map(t => esc(t.title)).join(', ')}.</p>` : ''}
        <div class="stack">
          <button class="primary" data-action="build">Build my day</button>
          <button data-action="skip">Skip today — make it a rest day</button>
        </div>
        <p class="muted small" style="margin:12px 0 0">Skipping never affects your learning count.</p>
      </section>
      ${openYesterday ? `
      <section class="card">
        <p class="small muted">Yesterday's check-in is still open, if you'd like to tick things off or roll them forward first.</p>
        <button data-action="evening-yesterday">Open yesterday's check-in</button>
      </section>` : ''}`;
  }

  function energyLine(d) {
    if (d.skipped) return 'Rest day. Nothing to catch up on, nothing lost.';
    if (d.energy <= 2) return 'Low-energy day — one small thing is plenty.';
    if (d.energy === 3) return 'Medium energy — two things, no rush.';
    return 'Good energy — three things, and stopping early is still fine.';
  }

  function taskRow(t, opts) {
    const metaBits = [];
    if (t.minutes) metaBits.push(t.shrunk ? 'just 15 min' : `${t.minutes} min`);
    if (t.rolledFrom) metaBits.push('carried forward');
    return `
      <li>
        <label class="task${t.done ? ' done' : ''}">
          <input type="checkbox" data-action="toggle" data-uid="${t.uid}" data-day="${opts.day}" ${t.done ? 'checked' : ''}>
          <span class="box"></span>
          <div>
            <span class="chip ${t.category}">${CAT_LABEL[t.category]}</span>
            <div class="title">${esc(t.title)}</div>
            ${metaBits.length ? `<div class="meta">${metaBits.join(' · ')}</div>` : ''}
          </div>
        </label>
        ${opts.roll && !t.done && t.category !== 'rest' ? `
        <div class="roll">
          <button class="inline${t.rolled ? ' on' : ''}" data-action="roll" data-uid="${t.uid}" data-day="${opts.day}">
            ${t.rolled ? '✓ Rolling to tomorrow' : 'Roll to tomorrow'}
          </button>
        </div>` : ''}
      </li>`;
  }

  function planView(k) {
    const d = days[k];
    return `
      <section class="card">
        <h2>${d.skipped ? 'Today is a rest day' : "Here's your day"}</h2>
        <p class="muted small">${energyLine(d)}</p>
        <ul class="tasks">${d.tasks.map(t => taskRow(t, { day: k, roll: false })).join('')}</ul>
        <div class="stack" style="margin-top:14px">
          <button class="primary" data-action="evening">Evening check-in</button>
        </div>
        <div class="row2">
          ${d.skipped ? '' : '<button class="ghost inline" style="width:100%" data-action="swap-rest">Swap for a rest day</button>'}
          <button class="ghost inline" style="width:100%${d.skipped ? ';grid-column:1/-1' : ''}" data-action="restart">Start today over</button>
        </div>
      </section>`;
  }

  function summary(list) {
    const real = list.filter(t => t.category !== 'rest');
    if (!real.length) return 'Rest day — resting was the plan, and that counts.';
    const done = real.filter(t => t.done).length, n = real.length;
    if (done === n) return n === 1
      ? '1 of 1 done — that was the whole plan, and you did it.'
      : `${done} of ${n} done — that's the whole plan. Go easy on yourself tonight.`;
    if (done === 0) return `0 of ${n} done — some days are like that. Rolling it forward is exactly how this is supposed to work.`;
    return `${done} of ${n} done — rolling the rest forward is exactly how this is supposed to work.`;
  }

  function eveningView(k) {
    const d = days[k], isToday = k === todayKey();
    return `
      <section class="card">
        <h2>${isToday ? 'Evening check-in' : "Yesterday's check-in"}</h2>
        <p class="muted small">Tick what got done. Anything else can simply roll forward.</p>
        <ul class="tasks">${d.tasks.map(t => taskRow(t, { day: k, roll: true })).join('')}</ul>
        <div class="summary">${summary(d.tasks)}</div>
        <div class="stack">
          <button class="primary" data-action="finish-evening">All set</button>
        </div>
      </section>`;
  }

  function editView() {
    const section = cat => `
      <section class="card">
        <h3>${CAT_LABEL[cat]}${cat === 'learning' ? ' — in roadmap order' : ''}</h3>
        ${(tasks[cat] || []).map((t, i) => `
          <div class="edit-row" data-cat="${cat}" data-id="${t.id}">
            <input class="t" data-field="title" value="${esc(t.title)}" aria-label="Task name">
            <input class="m" data-field="minutes" type="number" inputmode="numeric" min="1" max="600" value="${t.minutes}" aria-label="Minutes">
            <span class="minlabel">min</span>
            <button data-action="up" aria-label="Move up" ${i === 0 ? 'disabled' : ''}>↑</button>
            <button data-action="down" aria-label="Move down" ${i === tasks[cat].length - 1 ? 'disabled' : ''}>↓</button>
            <button data-action="del" aria-label="Remove">✕</button>
          </div>`).join('')}
        <button class="inline" style="margin-top:10px" data-action="add" data-cat="${cat}">+ Add a ${CAT_LABEL[cat].toLowerCase()} task</button>
      </section>`;
    return `
      <section class="card">
        <h2>Your task lists</h2>
        <p class="muted small">Changes save automatically and apply from the next day you build.</p>
        <button class="primary" data-action="back">Done</button>
      </section>
      ${CATS.map(section).join('')}
      <button class="ghost" data-action="reset-lists">Reset to the starter lists</button>`;
  }

  // ---------- Toast ----------
  let toastTimer;
  function toast(msg) {
    const el = $('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
  }

  // ---------- Events ----------
  function findTask(dayKey, id) {
    const d = days[dayKey];
    return d ? d.tasks.find(t => t.uid === id) : null;
  }

  document.addEventListener('input', e => {
    if (e.target.id === 'energy') {
      energy = Number(e.target.value);
      $('energyLabel').textContent = `${energy} · ${ENERGY_LABEL[energy]}`;
    }
  });

  document.addEventListener('change', e => {
    const el = e.target;
    if (el.dataset.action === 'toggle') {
      const t = findTask(el.dataset.day, el.dataset.uid);
      if (!t) return;
      t.done = el.checked;
      if (t.done) t.rolled = false;
      saveDays();
      if (t.done) toast(t.category === 'rest' ? 'Rested. Well done.' : 'Nice. That counts.');
      render();
      return;
    }
    const row = el.closest('.edit-row');
    if (row && el.dataset.field) {
      const item = tasks[row.dataset.cat].find(t => t.id === row.dataset.id);
      if (!item) return;
      if (el.dataset.field === 'title') {
        const v = el.value.trim();
        if (v) item.title = v; else el.value = item.title;
      } else {
        const m = Math.round(Number(el.value));
        if (m > 0) item.minutes = m; else el.value = item.minutes;
      }
      saveTasks();
      toast('Saved.');
    }
  });

  document.addEventListener('click', e => {
    const btn = e.target.closest('button[data-action]');
    if (!btn) return;
    const a = btn.dataset.action;
    const k = todayKey();

    switch (a) {
      case 'build':
        buildDay(energy);
        toast('Your day is ready.');
        break;
      case 'skip':
      case 'swap-rest':
        restDay();
        toast('Rest day it is. Your learning count is untouched.');
        break;
      case 'restart':
        if (!confirm('Start today over? Your plan for today will be cleared so you can pick your energy again.')) return;
        delete days[k];
        saveDays();
        break;
      case 'evening':
        view = 'evening'; eveningKey = k;
        break;
      case 'evening-yesterday':
        view = 'evening'; eveningKey = shift(k, -1);
        break;
      case 'finish-evening': {
        const d = days[eveningKey];
        if (d) { d.checkedIn = true; saveDays(); }
        view = 'auto'; eveningKey = null;
        toast('All saved. See you tomorrow.');
        break;
      }
      case 'roll': {
        const t = findTask(btn.dataset.day, btn.dataset.uid);
        if (!t) return;
        t.rolled = !t.rolled;
        saveDays();
        break;
      }
      case 'shrink':
        return acceptShrink();
      case 'dismiss-nudge':
        nudgeVisible = false;
        break;
      case 'edit':
        view = 'edit';
        window.scrollTo(0, 0);
        break;
      case 'back':
        view = 'auto';
        break;
      case 'add': {
        const cat = btn.dataset.cat;
        tasks[cat].push({ id: cat[0] + uid(), title: 'New task', minutes: 20 });
        saveTasks();
        render();
        const rows = document.querySelectorAll(`.edit-row[data-cat="${cat}"] input.t`);
        const last = rows[rows.length - 1];
        if (last) { last.focus(); last.select(); }
        return;
      }
      case 'up':
      case 'down':
      case 'del': {
        const row = btn.closest('.edit-row');
        const list = tasks[row.dataset.cat];
        const i = list.findIndex(t => t.id === row.dataset.id);
        if (i < 0) return;
        if (a === 'del') {
          if (!confirm(`Remove "${list[i].title}"? Past days keep their history.`)) return;
          list.splice(i, 1);
        } else {
          const j = a === 'up' ? i - 1 : i + 1;
          if (j < 0 || j >= list.length) return;
          [list[i], list[j]] = [list[j], list[i]];
        }
        saveTasks();
        break;
      }
      case 'reset-lists':
        if (!confirm('Reset all three lists to the starter tasks? Your day history stays as it is.')) return;
        tasks = JSON.parse(JSON.stringify(SEED));
        saveTasks();
        toast('Lists reset.');
        break;
      case 'export': {
        const data = {};
        Object.values(KEYS).forEach(key => { data[key] = load(key, null); });
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `myday-export-${k}.json`;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(link.href), 1000);
        toast('Exported.');
        return;
      }
    }
    render();
  });

  // Re-check when the app is brought back (e.g. opened the next morning from a tab left open).
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') { checkNudge(); render(); }
  });

  checkNudge();
  render();
})();
</script>
</body>
</html>
