<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101315">
<title>MyDay</title>
<script>
  // Apply the saved theme before the first paint, so there's no flash of the wrong colours.
  (function () {
    try {
      var s = JSON.parse(localStorage.getItem('myday.data.v3'));
      var t = s && s.settings && s.settings.theme;
      if (t === 'light' || t === 'auto') document.documentElement.setAttribute('data-theme', t);
    } catch (e) { /* fall back to the default dark theme */ }
  })();
</script>
<style>
  /* ======================================================================
     Design tokens. Dark is the default; [data-theme="light"] and
     [data-theme="auto"] (follows the device) switch to the light palette.
     All text pairs below meet WCAG AA contrast.
     ====================================================================== */
  :root {
    color-scheme: dark;
    --bg: #101315;
    --glow-1: rgba(147, 197, 176, .08);
    --glow-2: rgba(166, 189, 221, .06);
    --glass: rgba(16, 19, 21, .72);
    --surface: #171b1e;
    --surface-2: #1e2327;
    --surface-3: #252b2f;
    --outline: #2b3135;
    --outline-strong: #737c82;
    --text: #e2e5e7;
    --text-2: #b3babf;
    --text-3: #929aa0;
    --primary: #93c5b0;
    --on-primary: #0d2a20;
    --primary-container: #1f3a31;
    --on-primary-container: #c4e8d8;
    --primary-outline: #3d6a5a;
    --tonal: #26302d;
    --on-tonal: #d7e6df;
    --track: #343a3e;
    --learning: #a6bddd; --learning-c: #1f2b3b;
    --admin: #d8c29c;    --admin-c: #33291a;
    --health: #a6cbae;   --health-c: #1c2f22;
    --rest: #c3b2d6;     --rest-c: #2b2436;
    --work: #ddae9f;     --work-c: #3a2520;
    --appt: #b3b9de;     --appt-c: #25283a;
    --warn-c: #3a2f1a;   --on-warn-c: #f0d4a4;
    --inverse: #e2e5e7;  --on-inverse: #1b1f21;
    --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 6px 20px rgba(0, 0, 0, .18);
    --shadow-btn: 0 1px 3px rgba(0, 0, 0, .35);
    --radius-lg: 22px;
    --radius: 16px;
    --btn-radius: 18px;
    --tap: 52px;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #f4f6f4;
    --glow-1: rgba(44, 106, 85, .08);
    --glow-2: rgba(52, 89, 139, .06);
    --glass: rgba(244, 246, 244, .78);
    --surface: #ffffff;
    --surface-2: #f0f3f1;
    --surface-3: #ffffff;
    --outline: #e0e5e2;
    --outline-strong: #7b8580;
    --text: #191d1b;
    --text-2: #454e49;
    --text-3: #5f6863;
    --primary: #2c6a55;
    --on-primary: #ffffff;
    --primary-container: #d3ebe0;
    --on-primary-container: #0d2a20;
    --primary-outline: #9cc8b6;
    --tonal: #e2ebe7;
    --on-tonal: #1d3a30;
    --track: #d4dbd7;
    --learning: #34598b; --learning-c: #e0e9f6;
    --admin: #70521a;    --admin-c: #f4ead6;
    --health: #30663f;   --health-c: #ddf0e2;
    --rest: #604a85;     --rest-c: #ece5f6;
    --work: #87432f;     --work-c: #f7e3dd;
    --appt: #434a8c;     --appt-c: #e3e5f7;
    --warn-c: #fbedd5;   --on-warn-c: #5b3a00;
    --inverse: #2b302d;  --on-inverse: #eef1ef;
    --shadow: 0 1px 2px rgba(20, 35, 28, .06), 0 6px 20px rgba(20, 35, 28, .06);
    --shadow-btn: 0 1px 3px rgba(20, 35, 28, .18);
  }
  @media (prefers-color-scheme: light) {
    :root[data-theme="auto"] {
      color-scheme: light;
      --bg: #f4f6f4;
      --glow-1: rgba(44, 106, 85, .08);
      --glow-2: rgba(52, 89, 139, .06);
      --glass: rgba(244, 246, 244, .78);
      --surface: #ffffff;
      --surface-2: #f0f3f1;
      --surface-3: #ffffff;
      --outline: #e0e5e2;
      --outline-strong: #7b8580;
      --text: #191d1b;
      --text-2: #454e49;
      --text-3: #5f6863;
      --primary: #2c6a55;
      --on-primary: #ffffff;
      --primary-container: #d3ebe0;
      --on-primary-container: #0d2a20;
      --primary-outline: #9cc8b6;
      --tonal: #e2ebe7;
      --on-tonal: #1d3a30;
      --track: #d4dbd7;
      --learning: #34598b; --learning-c: #e0e9f6;
      --admin: #70521a;    --admin-c: #f4ead6;
      --health: #30663f;   --health-c: #ddf0e2;
      --rest: #604a85;     --rest-c: #ece5f6;
      --work: #87432f;     --work-c: #f7e3dd;
      --appt: #434a8c;     --appt-c: #e3e5f7;
      --warn-c: #fbedd5;   --on-warn-c: #5b3a00;
      --inverse: #2b302d;  --on-inverse: #eef1ef;
      --shadow: 0 1px 2px rgba(20, 35, 28, .06), 0 6px 20px rgba(20, 35, 28, .06);
      --shadow-btn: 0 1px 3px rgba(20, 35, 28, .18);
    }
  }

  /* ---------- Base ---------- */
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    min-height: 100vh;
  }
  /* Soft, fixed background glow so the glass app bar has something gentle to blur. */
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(48rem 32rem at 0% -10%, var(--glow-1), transparent 70%),
      radial-gradient(40rem 32rem at 100% 0%, var(--glow-2), transparent 70%);
  }
  h2 { font-size: 20px; font-weight: 650; margin: 0 0 6px; letter-spacing: -.005em; }
  h3 { font-size: 13px; font-weight: 700; margin: 0 0 10px; color: var(--text-2); text-transform: uppercase; letter-spacing: .08em; }
  h4 { font-size: 15px; font-weight: 650; margin: 16px 0 6px; color: var(--text-2); }
  p { margin: 0 0 12px; }
  .muted { color: var(--text-2); }
  .small { font-size: 15px; }
  :focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }

  /* ---------- App bar (frosted glass) ---------- */
  .appbar {
    position: sticky; top: 0; z-index: 20;
    background: var(--glass);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    backdrop-filter: blur(18px) saturate(140%);
    border-bottom: 1px solid var(--outline);
  }
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    .appbar { background: var(--bg); }
  }
  .appbar-inner {
    max-width: 640px; margin: 0 auto;
    padding: 10px 16px; padding-top: max(10px, env(safe-area-inset-top));
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .brand { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--primary); margin: 0; }
  .date { font-size: 22px; font-weight: 650; margin: 0; letter-spacing: -.01em; line-height: 1.25; }
  .icon-btn {
    flex: none; width: 48px; height: 48px; min-height: 48px; padding: 0; border-radius: 999px;
    display: grid; place-items: center;
    background: var(--surface-2); color: var(--text); border: 1px solid var(--outline);
  }

  /* ---------- Layout: one column on phones, dashboard on wide screens ---------- */
  .layout { max-width: 640px; margin: 0 auto; padding: 16px 16px 0; }
  .card { scroll-margin-top: 88px; }
  @media (max-width: 959.98px) {
    .layout { display: flex; flex-direction: column; }
    .col-main, .col-side, #app { display: contents; }
    #nudge { order: 0; }
    #app > * { order: 1; }
    #slot-glance { order: 2; }
    #streak, #garden { order: 8; }
    #footer { order: 9; }
    .layout[data-mode="plan"] #slot-context { order: 3; }
    .layout[data-mode="plan"] #slot-actions { order: 4; }
    .layout[data-mode="morning"] #slot-actions { order: 3; }
    .layout[data-mode="morning"] #slot-yesterday { order: 4; }
  }
  @media (min-width: 960px) {
    .appbar-inner, .layout { max-width: 1120px; }
    .appbar-inner { padding-left: 24px; padding-right: 24px; }
    .date { font-size: 24px; }
    .layout {
      display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 380px);
      gap: 24px; align-items: start; padding: 24px 24px 0;
    }
    .col-side {
      position: sticky; top: 92px;
      max-height: calc(100vh - 108px); overflow-y: auto; overscroll-behavior: contain;
      scrollbar-width: thin; border-radius: var(--radius-lg);
    }
  }

  /* ---------- Cards ---------- */
  .card {
    background: var(--surface);
    border: 1px solid var(--outline);
    border-radius: var(--radius-lg);
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
  }
  .nudge { background: var(--primary-container); color: var(--on-primary-container); border-color: transparent; }
  .nudge button.ghost { color: var(--on-primary-container); border-color: var(--primary-outline); }
  .notice { background: var(--warn-c); color: var(--on-warn-c); border-color: transparent; }
  .notice .muted { color: var(--on-warn-c); }
  .proposal { border-color: var(--primary-outline); }
  .eyebrow { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--primary); margin-bottom: 2px; }

  /* ---------- Buttons (Material-style: filled, tonal, outlined) ---------- */
  button {
    font: inherit; font-weight: 550;
    min-height: var(--tap);
    padding: 12px 20px;
    border-radius: var(--btn-radius);
    border: 1px solid transparent;
    background: var(--tonal);
    color: var(--on-tonal);
    cursor: pointer;
    width: 100%;
    text-align: center;
    transition: background-color .15s, box-shadow .15s, transform .1s;
  }
  button:active { transform: scale(.985); }
  button:disabled { opacity: .4; cursor: default; transform: none; }
  button.primary { background: var(--primary); color: var(--on-primary); font-weight: 650; box-shadow: var(--shadow-btn); }
  button.ghost { background: transparent; color: var(--text-2); border-color: var(--outline); }
  button.inline { width: auto; min-height: 44px; padding: 8px 16px; font-size: 15px; }
  @media (hover: hover) {
    button:hover:not(:disabled) { box-shadow: var(--shadow-btn); }
    button.ghost:hover:not(:disabled) { background: var(--surface-2); }
  }
  .stack > * + * { margin-top: 10px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .row2 > .full { grid-column: 1 / -1; }
  .row2 > button.inline { width: 100%; }

  /* ---------- Form fields ---------- */
  input[type=text], input[type=number], input[type=time], input[type=datetime-local], select {
    font: inherit; color: var(--text); background: var(--surface-3);
    border: 1px solid var(--outline-strong); border-radius: 12px;
    padding: 10px 12px; min-height: 48px; width: 100%;
  }
  input:focus-visible, select:focus-visible { outline: 3px solid var(--primary); outline-offset: 0; border-color: var(--primary); }
  .field { display: grid; gap: 6px; margin-bottom: 12px; align-content: start; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .lbl { font-size: 14px; color: var(--text-2); }
  .inline-field { display: flex; align-items: center; gap: 10px; }
  .inline-field input { width: 96px; flex: none; }
  .ctx-block + .ctx-block { border-top: 1px solid var(--outline); padding-top: 16px; margin-top: 16px; }
  details > summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; gap: 8px; color: var(--text-2); font-size: 15px; list-style: none; }
  details > summary::-webkit-details-marker { display: none; }
  details:not(.card) > summary::before { content: "▸"; font-size: 13px; transition: transform .15s; }
  details:not(.card)[open] > summary::before { transform: rotate(90deg); }
  details.card > summary { justify-content: space-between; color: var(--text); }
  details.card > summary h2 { margin: 0; }
  details.card > summary::after {
    content: "Show"; font-size: 14px; font-weight: 600; color: var(--on-tonal);
    background: var(--tonal); border-radius: 999px; padding: 6px 14px;
  }
  details.card[open] > summary::after { content: "Hide"; }
  details.card[open] > summary { margin-bottom: 12px; }

  /* ---------- Energy slider ---------- */
  .energy-value { font-size: 20px; font-weight: 650; margin: 4px 0; text-align: center; }
  input[type=range] { --fill: 50%; -webkit-appearance: none; appearance: none; width: 100%; height: 48px; background: transparent; margin: 0; }
  input[type=range]::-webkit-slider-runnable-track {
    height: 10px; border-radius: 10px;
    background: linear-gradient(to right, var(--primary) 0 var(--fill), var(--track) var(--fill) 100%);
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 34px; height: 34px; border-radius: 50%; margin-top: -12px;
    background: var(--primary); border: 4px solid var(--surface); box-shadow: 0 1px 4px rgba(0, 0, 0, .35);
  }
  input[type=range]::-moz-range-track { height: 10px; border-radius: 10px; background: var(--track); }
  input[type=range]::-moz-range-progress { height: 10px; border-radius: 10px; background: var(--primary); }
  input[type=range]::-moz-range-thumb { width: 26px; height: 26px; border-radius: 50%; background: var(--primary); border: 4px solid var(--surface); }
  .ticks { display: flex; justify-content: space-between; color: var(--text-3); font-size: 14px; padding: 0 12px; margin-bottom: 10px; }

  /* ---------- Category colours ---------- */
  .cat-learning, .chip.learning { --cat: var(--learning); --cat-c: var(--learning-c); }
  .cat-admin, .chip.admin { --cat: var(--admin); --cat-c: var(--admin-c); }
  .cat-health, .chip.health { --cat: var(--health); --cat-c: var(--health-c); }
  .cat-rest, .chip.rest { --cat: var(--rest); --cat-c: var(--rest-c); }
  .kind-work, .chip.work { --cat: var(--work); --cat-c: var(--work-c); }
  .kind-appointment, .chip.appointment { --cat: var(--appt); --cat-c: var(--appt-c); }
  .chip {
    display: inline-flex; align-items: center;
    font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
    padding: 2px 9px; border-radius: 999px; margin-bottom: 4px;
    background: var(--cat-c, var(--surface-3)); color: var(--cat, var(--text-2));
  }

  /* ---------- Tasks ---------- */
  ul.tasks { list-style: none; padding: 0; margin: 14px 0 0; }
  ul.tasks li { margin-bottom: 10px; }
  .task {
    display: flex; gap: 14px; align-items: flex-start;
    background: var(--surface-2); border: 1px solid var(--outline);
    border-left: 4px solid var(--cat, var(--outline-strong));
    border-radius: var(--radius); padding: 14px 14px 14px 12px;
    cursor: pointer; min-height: 64px; transition: background-color .15s;
  }
  @media (hover: hover) { .task:not(.static):hover { background: var(--surface-3); } }
  .task.static { cursor: default; }
  .task input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .box {
    flex: none; width: 30px; height: 30px; border-radius: 10px; border: 2px solid var(--outline-strong);
    display: grid; place-items: center; margin-top: 2px; transition: background-color .15s, border-color .15s;
  }
  .task input:checked + .box { background: var(--primary); border-color: var(--primary); }
  .task input:checked + .box::after { content: ""; width: 8px; height: 14px; border: solid var(--on-primary); border-width: 0 3px 3px 0; transform: rotate(45deg) translate(-1px, -2px); }
  .task input:focus-visible + .box { outline: 3px solid var(--primary); outline-offset: 2px; }
  .task.done .title { color: var(--text-2); }
  .rest-icon { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--rest); background: var(--rest-c); margin-top: 2px; }
  .title { font-size: 17px; }
  .meta { font-size: 14px; color: var(--text-3); margin-top: 2px; font-variant-numeric: tabular-nums; }
  .roll { margin: 8px 0 0 48px; }
  .roll button.on { background: var(--primary-container); color: var(--on-primary-container); border-color: var(--primary-outline); }
  .warn { display: inline-block; background: var(--warn-c); color: var(--on-warn-c); border-radius: 8px; padding: 3px 9px; font-size: 14px; margin-top: 6px; }
  .warn:empty { display: none; }
  .why { font-size: 14px; color: var(--text-2); margin: 8px 0 0; }
  .change { font-size: 14px; font-weight: 600; color: var(--primary); margin-top: 4px; }
  .summary { background: var(--primary-container); color: var(--on-primary-container); border-radius: 14px; padding: 14px 16px; margin: 14px 0; }
  .queue-list { margin: 6px 0 0; padding-left: 20px; color: var(--text-2); font-size: 15px; }

  /* ---------- Plan stats (dashboard tiles) ---------- */
  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 14px 0 4px; }
  .stat { background: var(--surface-2); border: 1px solid var(--outline); border-radius: 14px; padding: 10px 12px; min-width: 0; }
  .stat-l { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); }
  .stat-v { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.3; white-space: nowrap; }
  @media (max-width: 420px) { .stat { padding: 10px; } .stat-v { font-size: 16px; } }
  .stat-s { font-size: 13px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ---------- Proposal ---------- */
  .prop-item {
    background: var(--surface-2); border: 1px solid var(--outline);
    border-left: 4px solid var(--cat, var(--outline-strong));
    border-radius: var(--radius); padding: 14px;
  }
  .prop-item.later { background: transparent; border-style: dashed; }
  .prop-when { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; margin-bottom: 6px; }
  .edit-ctl { margin-top: 12px; border-top: 1px solid var(--outline); padding-top: 12px; }
  .stale { background: var(--warn-c); color: var(--on-warn-c); border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; }

  /* ---------- Commitments ---------- */
  .c-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--outline); }
  .c-row:first-child { border-top: 0; }
  .c-actions { display: flex; gap: 6px; flex: none; }
  .c-actions button { min-width: 44px; }
  .c-form { background: var(--surface-2); border: 1px solid var(--outline); border-radius: var(--radius); padding: 16px; margin-top: 10px; }

  /* ---------- At a glance (vertical timeline) ---------- */
  ul.glance { list-style: none; padding: 0; margin: 12px 0 0; }
  ul.glance li { display: grid; grid-template-columns: 7.4em 20px minmax(0, 1fr); gap: 0 10px; padding: 8px 0; }
  .g-time { color: var(--text-2); font-size: 14px; font-variant-numeric: tabular-nums; padding-top: 2px; text-align: right; }
  .g-rail { position: relative; display: flex; justify-content: center; }
  .g-rail::before { content: ""; position: absolute; top: -8px; bottom: -8px; width: 2px; background: var(--outline); }
  ul.glance li:first-child .g-rail::before { top: 12px; }
  ul.glance li:last-child .g-rail::before { bottom: calc(100% - 12px); }
  .g-dot { position: relative; width: 12px; height: 12px; border-radius: 50%; margin-top: 7px; background: var(--dot, var(--outline-strong)); box-shadow: 0 0 0 3px var(--surface); }
  .g-label { font-size: 16px; font-weight: 550; }
  .g-sub { font-size: 13px; color: var(--text-3); }
  .g-free { --dot: var(--primary); }
  .g-free .g-dot { background: var(--surface); border: 2px solid var(--primary); }
  .g-free .g-label { color: var(--primary); }
  .g-commit, .g-task { --dot: var(--cat); }
  .g-sleep { --dot: var(--rest); }
  .g-proposed .g-dot { background: var(--surface); border: 2px dashed var(--cat); }
  .g-proposed .g-label { color: var(--text-2); font-style: italic; }

  /* ---------- Rolling count ---------- */
  .streak strong { font-size: 18px; font-weight: 650; }
  .week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; margin: 14px 0 10px; }
  .wd { display: grid; justify-items: center; gap: 6px; font-size: 12px; color: var(--text-3); }
  .pip { width: 100%; max-width: 38px; aspect-ratio: 1; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--outline); display: grid; place-items: center; font-weight: 700; color: var(--learning); }
  .wd.on .pip { background: var(--learning-c); border-color: var(--learning); }
  .wd.today .dl { color: var(--text); font-weight: 700; }

  /* ---------- Edit lists ---------- */
  .edit-row { display: grid; grid-template-columns: 1fr auto auto auto auto; gap: 8px; align-items: center; padding: 10px 0; border-top: 1px solid var(--outline); }
  .edit-row:first-of-type { border-top: 0; }
  .edit-row .t { grid-column: 1 / -1; }
  .edit-row .count { grid-column: 1 / -1; font-size: 14px; color: var(--text-3); margin-top: -4px; }
  .edit-row .m { width: 84px; }
  .edit-row button { width: 48px; min-height: 48px; padding: 0; border-radius: 14px; }
  .minlabel { color: var(--text-3); font-size: 14px; }
  .q-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; border-top: 1px solid var(--outline); }
  .q-row:first-of-type { border-top: 0; }

  /* ---------- Snackbar & footer ---------- */
  .toast {
    position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom)); z-index: 30;
    transform: translateX(-50%) translateY(20px);
    background: var(--inverse); color: var(--on-inverse);
    padding: 12px 18px; border-radius: 12px; max-width: calc(100% - 32px);
    box-shadow: 0 6px 20px rgba(0, 0, 0, .25);
    opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; font-size: 15px;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #footer { padding-bottom: max(40px, env(safe-area-inset-bottom)); }
  .storage-note { text-align: center; color: var(--text-3); font-size: 13px; margin-top: 14px; }

  /* ---------- Focus timer ---------- */
  .timer-card { border-color: var(--primary-outline); text-align: center; }
  .timer-wrap { position: relative; width: 200px; max-width: 70%; margin: 8px auto 12px; aspect-ratio: 1; }
  .ring { width: 100%; height: 100%; transform: rotate(-90deg); display: block; }
  .ring-track { fill: none; stroke: var(--track); stroke-width: 10; }
  .ring-fill { fill: none; stroke: var(--cat, var(--primary)); stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
  .ring-center { position: absolute; inset: 0; display: grid; place-content: center; }
  .ring-time { font-size: 40px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.02em; line-height: 1.1; }
  .ring-sub { font-size: 14px; color: var(--text-2); }
  .timer-card .title { font-weight: 600; }
  .timer-msg { background: var(--primary-container); color: var(--on-primary-container); border-radius: 14px; padding: 12px 14px; margin: 10px 0 0; }
  .task-actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 0 48px; }

  /* ---------- Learning garden ---------- */
  .garden svg { width: 100%; height: auto; display: block; margin: 6px 0 8px; }
  .gd-ground { fill: var(--health-c); }
  .gd-stem { stroke: var(--health); stroke-width: 2.5; stroke-linecap: round; }
  .gd-leaf, .gd-bud { fill: var(--health); }
  .gd-seed, .gd-center { fill: var(--admin); }
  .pf-0 { fill: var(--learning); }
  .pf-1 { fill: var(--rest); }
  .pf-2 { fill: var(--appt); }
  .pf-3 { fill: var(--work); }
  .gd-more { fill: var(--text-3); font-size: 11px; }

  /* ---------- Motion (short, gentle, and switched off on request) ---------- */
  @keyframes enter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes pop { 0% { transform: scale(.6); } 60% { transform: scale(1.18); } 100% { transform: scale(1); } }
  @keyframes glow { from { box-shadow: 0 0 0 0 var(--cat); } to { box-shadow: 0 0 0 14px transparent; } }
  @keyframes grow { from { transform: scale(0); } to { transform: scale(1); } }
  @keyframes burst {
    0% { transform: translate(0, 0) scale(.4); opacity: 0; }
    15% { opacity: .9; }
    100% { transform: translate(var(--dx), var(--dy)) scale(1); opacity: 0; }
  }
  .enter { animation: enter .28s ease-out both; }
  .stagger { animation: enter .34s ease-out both; animation-delay: calc(var(--i, 0) * 80ms); }
  .task.just-done { animation: glow .9s ease-out; }
  .task.just-done .box { animation: pop .4s cubic-bezier(.3, 1.6, .5, 1); }
  .wd.just .pip { animation: pop .5s cubic-bezier(.3, 1.6, .5, 1); }
  .stat-v.changed { animation: enter .3s ease-out; }
  .gd-grow { transform-box: fill-box; animation: grow .7s cubic-bezier(.2, 1.4, .4, 1) both; }
  .burst { position: fixed; width: 0; height: 0; pointer-events: none; z-index: 40; }
  .burst span { position: absolute; left: -5px; top: -5px; width: 10px; height: 10px; border-radius: 50%; opacity: 0; animation: burst 1.2s cubic-bezier(.2, .7, .3, 1) forwards; }
  ::view-transition-old(root), ::view-transition-new(root) { animation-duration: .3s; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
  :root[data-motion="off"] *, :root[data-motion="off"] *::before, :root[data-motion="off"] *::after { animation: none !important; transition: none !important; }
</style>
</head>
<body>
<header class="appbar">
  <div class="appbar-inner">
    <div>
      <p class="brand">MyDay</p>
      <p class="date" id="date"></p>
    </div>
    <button class="icon-btn" id="themeBtn" data-action="theme" aria-label="Change theme"></button>
  </div>
</header>
<div class="layout" id="layout" data-mode="morning">
  <div class="col-main">
    <div id="nudge"></div>
    <main id="app"></main>
    <footer id="footer"></footer>
  </div>
  <aside class="col-side" aria-label="Today at a glance and learning days">
    <div id="slot-glance"></div>
    <div id="streak"></div>
    <div id="garden"></div>
  </aside>
</div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  // ======================================================================
  // Constants
  // ======================================================================
  const STORAGE_KEY = 'myday.data.v3';   // the only localStorage key this app writes
  const SCHEMA_VERSION = 3;
  const PREVIOUS_KEY = 'myday.data.v2';  // version 2, migrated once
  const EXPORT_FORMAT = 'myday-export';
  const LEGACY_KEYS = ['myday.tasks', 'myday.days', 'myday.nudge', 'myday.meta']; // version 1, migrated once

  const CATS = ['learning', 'admin', 'health'];
  const CAT_LABEL = { learning: 'Learning', admin: 'Admin', health: 'Health', rest: 'Rest' };
  const KIND_LABEL = { work: 'Work shift', appointment: 'Appointment' };
  const ENERGY_LABEL = { 1: 'Running on empty', 2: 'Low', 3: 'Okay', 4: 'Good', 5: 'Great' };
  const DEFAULT_SETTINGS = { bufferMinutes: 30, earliestTime: '08:00', latestTime: '21:00', gapMinutes: 10, theme: 'dark', motion: 'auto' };
  const THEMES = ['dark', 'light', 'auto'];
  const THEME_LABEL = { dark: 'Dark', light: 'Light', auto: 'Match device' };
  const svg = body => `<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${body}</svg>`;
  const THEME_ICON = {
    dark: svg('<path d="M20.5 14.2A8.5 8.5 0 1 1 9.8 3.5a6.8 6.8 0 0 0 10.7 10.7z"/>'),
    light: svg('<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/>'),
    auto: svg('<circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor" stroke="none"/>')
  };

  const SEED = {
    learning: [
      { id: 'l1', title: 'TryHackMe: Pre-Security path — one section', minutes: 30 },
      { id: 'l2', title: 'OverTheWire Bandit — one level', minutes: 20 },
      { id: 'l3', title: 'HTB Academy: Networking module — one section', minutes: 30 },
      { id: 'l4', title: 'HTB Academy: Web Requests module — one section', minutes: 30 }
    ],
    admin: [
      { id: 'a1', title: 'Laundry', minutes: 15 },
      { id: 'a2', title: 'Bulk cook 2 meals', minutes: 60 },
      { id: 'a3', title: 'Clean room (10 min timer)', minutes: 10 },
      { id: 'a4', title: 'Groceries', minutes: 30 }
    ],
    health: [
      { id: 'h1', title: 'Gym', minutes: 60 },
      { id: 'h2', title: 'Meal prep', minutes: 45 },
      { id: 'h3', title: '20-min walk', minutes: 20 }
    ]
  };

  const clone = o => JSON.parse(JSON.stringify(o));
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const isObj = o => !!o && typeof o === 'object' && !Array.isArray(o);

  // ======================================================================
  // Local calendar dates and times. Dates are "YYYY-MM-DD" and date-times are
  // "YYYY-MM-DDTHH:MM", both in the device's local time — never UTC ISO strings.
  // ======================================================================
  const pad = n => String(n).padStart(2, '0');
  function keyOf(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function todayKey() { return keyOf(new Date()); }
  // Noon avoids daylight-saving edge cases where local midnight doesn't exist.
  function parseKey(k) { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d, 12); }
  function shift(k, n) { const d = parseKey(k); d.setDate(d.getDate() + n); return keyOf(d); }
  function isDateKey(s) { return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && keyOf(parseKey(s)) === s; }
  function isTime(s) { return typeof s === 'string' && /^([01]\d|2[0-3]):[0-5]\d$/.test(s); }
  function isDateTime(s) { return typeof s === 'string' && s.length === 16 && s[10] === 'T' && isDateKey(s.slice(0, 10)) && isTime(s.slice(11)); }
  function localStamp(d) { d = d || new Date(); return keyOf(d) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function prettyDate(k) { return parseKey(k).toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' }); }
  function shortDate(k) { return parseKey(k).toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' }); }

  // Times are handled as minutes from the start of a given calendar day (wall-clock),
  // so a shift from 22:00 to 06:00 the next day is simply 1320 → 1800.
  const timeToMin = t => Number(t.slice(0, 2)) * 60 + Number(t.slice(3, 5));
  const minToTime = m => { const r = ((m % 1440) + 1440) % 1440; return pad(Math.floor(r / 60)) + ':' + pad(r % 60); };
  const dayDiff = (a, b) => Math.round((parseKey(a) - parseKey(b)) / 86400000);
  const dtToMin = (dt, k) => dayDiff(dt.slice(0, 10), k) * 1440 + timeToMin(dt.slice(11));
  const minToDt = (m, k) => shift(k, Math.floor(m / 1440)) + 'T' + minToTime(m);
  function nowMin(k) { const d = new Date(); return dayDiff(keyOf(d), k) * 1440 + d.getHours() * 60 + d.getMinutes(); }
  function fmtDuration(m) { const h = Math.floor(m / 60), r = m % 60; return h ? (r ? `${h} h ${r} min` : `${h} h`) : `${r} min`; }
  function relDay(dateKey, k) {
    const n = dayDiff(dateKey, k);
    if (n === 0) return '';
    if (n === -1) return 'yesterday';
    if (n === 1) return 'tomorrow';
    return shortDate(dateKey);
  }
  function fmtDT(dt, k) { const r = relDay(dt.slice(0, 10), k); return r ? `${r} ${dt.slice(11)}` : dt.slice(11); }
  function fmtRange(s, e, k) {
    if (s.slice(0, 10) === e.slice(0, 10)) {
      const r = relDay(s.slice(0, 10), k);
      return (r ? r + ' ' : '') + s.slice(11) + '–' + e.slice(11);
    }
    return fmtDT(s, k) + ' – ' + fmtDT(e, k);
  }
  const rangeMin = (s, e) => minToTime(s) + '–' + minToTime(e);

  // ======================================================================
  // Data shape, validation and migration
  // ======================================================================
  function freshState() {
    return {
      schemaVersion: SCHEMA_VERSION,
      createdOn: todayKey(),
      lists: clone(SEED),
      queue: [],
      days: {},
      nudge: { lastShownOn: null, shrinkOn: null },
      settings: Object.assign({}, DEFAULT_SETTINGS),
      commitments: [],
      context: {},
      timer: null,        // the running focus timer, if any
      celebratedOn: null  // last date the "whole plan done" moment played (once a day)
    };
  }

  function cleanMinutes(v, fallback) {
    const m = Math.round(Number(v));
    return m > 0 && m <= 600 ? m : fallback;
  }
  function intIn(v, lo, hi, fallback) {
    if (v === null || v === undefined || v === '') return fallback;
    const n = Math.round(Number(v));
    return Number.isFinite(n) && n >= lo && n <= hi ? n : fallback;
  }
  function cleanListItem(o) {
    if (!isObj(o) || typeof o.title !== 'string' || !o.title.trim()) return null;
    return { id: typeof o.id === 'string' && o.id ? o.id : 'x' + uid(), title: o.title.trim(), minutes: cleanMinutes(o.minutes, 20) };
  }
  function cleanQueueItem(o) {
    if (!isObj(o) || !CATS.includes(o.category) || typeof o.title !== 'string' || !o.title.trim()) return null;
    return {
      qid: typeof o.qid === 'string' && o.qid ? o.qid : uid(),
      taskId: typeof o.taskId === 'string' ? o.taskId : null,
      category: o.category,
      title: o.title.trim(),
      minutes: cleanMinutes(o.minutes, 20),
      queuedOn: isDateKey(o.queuedOn) ? o.queuedOn : todayKey(),
      sourceUid: typeof o.sourceUid === 'string' ? o.sourceUid : null
    };
  }
  function cleanTask(o) {
    if (!isObj(o) || !CATS.includes(o.category) || typeof o.title !== 'string' || !o.title.trim()) return null;
    const base = cleanMinutes(o.baseMinutes, cleanMinutes(o.minutes, 20));
    let s = isDateTime(o.scheduledStart) ? o.scheduledStart : null;
    let e = isDateTime(o.scheduledEnd) ? o.scheduledEnd : null;
    if (!s || !e || e <= s) { s = null; e = null; }
    return {
      uid: typeof o.uid === 'string' && o.uid ? o.uid : uid(),
      taskId: typeof o.taskId === 'string' ? o.taskId : null,
      category: o.category,
      title: o.title.trim(),
      minutes: cleanMinutes(o.minutes, base),
      baseMinutes: base,
      done: o.done === true,
      shrunk: o.shrunk === true,
      fromQueue: o.fromQueue ? cleanQueueItem(o.fromQueue) : null,
      rolledQid: typeof o.rolledQid === 'string' ? o.rolledQid : null,
      scheduledStart: s,
      scheduledEnd: e
    };
  }
  function cleanCommitment(o) {
    if (!isObj(o) || !isDateTime(o.start) || !isDateTime(o.end) || o.end <= o.start) return null;
    const kind = o.kind === 'work' ? 'work' : 'appointment';
    const title = typeof o.title === 'string' && o.title.trim() ? o.title.trim() : KIND_LABEL[kind];
    return { id: typeof o.id === 'string' && o.id ? o.id : 'c' + uid(), kind, title, start: o.start, end: o.end };
  }
  function emptyContext() { return { energy: null, sleep: { start: null, end: null, estimatedHours: null } }; }
  function cleanContext(o) {
    if (!isObj(o)) return null;
    const sl = isObj(o.sleep) ? o.sleep : {};
    const est = Number(sl.estimatedHours);
    return {
      energy: Number.isInteger(o.energy) && o.energy >= 1 && o.energy <= 5 ? o.energy : null,
      sleep: {
        start: isDateTime(sl.start) ? sl.start : null,
        end: isDateTime(sl.end) ? sl.end : null,
        estimatedHours: sl.estimatedHours !== null && sl.estimatedHours !== undefined && est > 0 && est <= 24 ? Math.round(est * 4) / 4 : null
      }
    };
  }

  // Turns anything roughly the right shape (version 2 or 3) into a valid version-3 state.
  // Throws only if the input isn't an object at all; otherwise drops bad entries and counts them.
  function normalize(raw, report) {
    report = report || { dropped: 0 };
    if (!isObj(raw)) throw new Error('Not a MyDay data object.');
    const s = freshState();

    if (isObj(raw.lists)) {
      for (const cat of CATS) {
        if (!Array.isArray(raw.lists[cat])) { s.lists[cat] = clone(SEED[cat]); continue; }
        const seen = new Set();
        s.lists[cat] = [];
        for (const item of raw.lists[cat]) {
          const c = cleanListItem(item);
          if (!c) { report.dropped++; continue; }
          if (seen.has(c.id)) c.id = cat[0] + uid();
          seen.add(c.id);
          s.lists[cat].push(c);
        }
      }
    }

    if (isObj(raw.days)) {
      for (const k of Object.keys(raw.days)) {
        const d = raw.days[k];
        if (!isDateKey(k) || !isObj(d)) { report.dropped++; continue; }
        const tasks = [];
        if (Array.isArray(d.tasks)) {
          for (const t of d.tasks) { const c = cleanTask(t); if (c) tasks.push(c); else report.dropped++; }
        }
        const energy = Number.isInteger(d.energy) && d.energy >= 1 && d.energy <= 5 ? d.energy : null;
        const rest = d.rest === true || (!tasks.length && energy === null);
        s.days[k] = {
          energy,
          rest,
          builtAt: typeof d.builtAt === 'string' ? d.builtAt : '',
          checkedIn: d.checkedIn === true,
          tasks: rest ? [] : tasks
        };
      }
    }

    if (Array.isArray(raw.queue)) {
      const seenQ = new Set(), seenTask = new Set();
      for (const q of raw.queue) {
        const c = cleanQueueItem(q);
        if (!c) { report.dropped++; continue; }
        if (seenQ.has(c.qid) || (c.taskId && seenTask.has(c.taskId))) continue; // never keep duplicates
        seenQ.add(c.qid);
        if (c.taskId) seenTask.add(c.taskId);
        s.queue.push(c);
      }
      sortQueue(s.queue);
    }

    if (isDateKey(raw.createdOn)) s.createdOn = raw.createdOn;
    else { const first = Object.keys(s.days).sort()[0]; if (first) s.createdOn = first; }

    if (isObj(raw.nudge)) {
      if (isDateKey(raw.nudge.lastShownOn)) s.nudge.lastShownOn = raw.nudge.lastShownOn;
      if (isDateKey(raw.nudge.shrinkOn)) s.nudge.shrinkOn = raw.nudge.shrinkOn;
    }

    // ---- Added in version 3 (absent in version 2, so defaults apply) ----
    if (isObj(raw.settings)) {
      const st = raw.settings;
      s.settings.bufferMinutes = intIn(st.bufferMinutes, 0, 240, DEFAULT_SETTINGS.bufferMinutes);
      s.settings.gapMinutes = intIn(st.gapMinutes, 0, 60, DEFAULT_SETTINGS.gapMinutes);
      if (THEMES.includes(st.theme)) s.settings.theme = st.theme;
      if (st.motion === 'off' || st.motion === 'auto') s.settings.motion = st.motion;
      if (isTime(st.earliestTime) && isTime(st.latestTime) && st.earliestTime < st.latestTime) {
        s.settings.earliestTime = st.earliestTime;
        s.settings.latestTime = st.latestTime;
      }
    }
    if (Array.isArray(raw.commitments)) {
      const seen = new Set();
      for (const c of raw.commitments) {
        const cc = cleanCommitment(c);
        if (!cc) { report.dropped++; continue; }
        if (seen.has(cc.id)) cc.id = 'c' + uid();
        seen.add(cc.id);
        s.commitments.push(cc);
      }
      s.commitments.sort((a, b) => (a.start < b.start ? -1 : a.start > b.start ? 1 : 0));
    }
    if (isDateKey(raw.celebratedOn)) s.celebratedOn = raw.celebratedOn;
    if (isObj(raw.timer)) {
      const t = raw.timer;
      if (typeof t.uid === 'string' && isDateKey(t.dayKey) && (t.kind === 'focus' || t.kind === 'start') &&
          Number.isInteger(t.durationSec) && t.durationSec >= 60 && t.durationSec <= 36000 &&
          Number.isFinite(t.accumulatedMs) && t.accumulatedMs >= 0 && (t.startedAt === null || Number.isFinite(t.startedAt))) {
        s.timer = { uid: t.uid, dayKey: t.dayKey, kind: t.kind, durationSec: t.durationSec, startedAt: t.startedAt, accumulatedMs: t.accumulatedMs, finished: t.finished === true };
      }
    }
    if (isObj(raw.context)) {
      for (const k of Object.keys(raw.context)) {
        const c = isDateKey(k) ? cleanContext(raw.context[k]) : null;
        if (c) s.context[k] = c; else report.dropped++;
      }
    }
    return s;
  }

  // Converts version-1 data (four separate keys, or an old export) into the version-2/3 shape.
  function migrateV1(o) {
    const oldDays = isObj(o['myday.days']) ? o['myday.days'] : {};
    const oldNudge = isObj(o['myday.nudge']) ? o['myday.nudge'] : {};
    const oldMeta = isObj(o['myday.meta']) ? o['myday.meta'] : {};
    const days = {};
    const keys = Object.keys(oldDays).filter(isDateKey).sort();
    for (const k of keys) {
      const d = oldDays[k];
      if (!isObj(d)) continue;
      const tasks = Array.isArray(d.tasks) ? d.tasks.filter(t => isObj(t) && t.category !== 'rest') : [];
      days[k] = {
        energy: d.energy, rest: !!d.skipped, builtAt: '', checkedIn: !!d.checkedIn,
        tasks: d.skipped ? [] : tasks.map(t => Object.assign({}, t, { fromQueue: null, rolledQid: null }))
      };
    }
    const queue = [];
    const today = todayKey();
    const prev = keys.slice().reverse().find(k => k < today && days[k] && !days[k].rest);
    const todayTookThem = isObj(oldDays[today]) && Array.isArray(oldDays[today].tasks) &&
      oldDays[today].tasks.some(t => isObj(t) && t.rolledFrom === prev);
    if (prev && !todayTookThem) {
      for (const t of days[prev].tasks) {
        if (t.rolled && !t.done && !queue.some(q => q.taskId === t.taskId)) {
          const q = { qid: uid(), taskId: t.taskId, category: t.category, title: t.title, minutes: t.baseMinutes || t.minutes, queuedOn: prev, sourceUid: t.uid };
          queue.push(q);
          t.rolledQid = q.qid;
        }
      }
    }
    return {
      createdOn: oldMeta.firstUsed,
      lists: o['myday.tasks'],
      days,
      queue,
      nudge: { lastShownOn: oldNudge.lastShown || null, shrinkOn: oldNudge.shrinkFor || null }
    };
  }

  function sortQueue(q) { q.sort((a, b) => (a.queuedOn < b.queuedOn ? -1 : a.queuedOn > b.queuedOn ? 1 : 0)); }

  // ======================================================================
  // Storage
  // ======================================================================
  let state;
  let storageAvailable = true;
  let saveBlocked = false;   // true while unreadable saved data is waiting for the user's decision
  let damagedRaw = null;
  let damagedKey = null;
  let damagedReason = '';
  let bootNotice = '';

  function persist() {
    if (!storageAvailable || saveBlocked) return false;
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); return true; }
    catch (e) { toast("Couldn't save just now — storage may be full or blocked."); return false; }
  }
  function removeKey(k) { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } }

  function readLegacy() {
    const o = {};
    let found = false;
    for (const k of LEGACY_KEYS) {
      try {
        const v = localStorage.getItem(k);
        if (v !== null) { o[k] = JSON.parse(v); found = true; }
      } catch (e) { /* skip an unreadable legacy key */ }
    }
    return found ? o : null;
  }

  function markDamaged(raw, key, reason) {
    damagedRaw = raw;
    damagedKey = key;
    damagedReason = reason || "It looks damaged and can't be read.";
    saveBlocked = true;
    state = freshState();
  }

  function boot() {
    let raw = null;
    try { raw = localStorage.getItem(STORAGE_KEY); }
    catch (e) { storageAvailable = false; }

    if (!storageAvailable) {
      state = freshState();
      bootNotice = "This browser isn't letting MyDay save, so changes won't be kept after closing.";
      return;
    }

    // 1. Current version.
    if (raw !== null) {
      let parsed;
      try { parsed = JSON.parse(raw); } catch (e) { return markDamaged(raw, STORAGE_KEY); }
      if (!isObj(parsed)) return markDamaged(raw, STORAGE_KEY);
      if (parsed.schemaVersion !== SCHEMA_VERSION && parsed.schemaVersion !== 2) {
        return markDamaged(raw, STORAGE_KEY, parsed.schemaVersion > SCHEMA_VERSION
          ? 'It was saved by a newer version of MyDay.'
          : "It's in a format this version doesn't recognise.");
      }
      try { state = normalize(parsed); } catch (e) { markDamaged(raw, STORAGE_KEY); }
      return;
    }

    // 2. Version 2 (single key "myday.data.v2") → migrate, then remove the old key.
    let prev = null;
    try { prev = localStorage.getItem(PREVIOUS_KEY); } catch (e) { /* ignore */ }
    if (prev !== null) {
      let parsed;
      try { parsed = JSON.parse(prev); } catch (e) { return markDamaged(prev, PREVIOUS_KEY); }
      if (!isObj(parsed) || parsed.schemaVersion !== 2) return markDamaged(prev, PREVIOUS_KEY, "It's in a format this version doesn't recognise.");
      try { state = normalize(parsed); } catch (e) { return markDamaged(prev, PREVIOUS_KEY); }
      if (persist()) {
        removeKey(PREVIOUS_KEY);
        bootNotice = 'MyDay has been updated — your plans and history came with you.';
      }
      return;
    }

    // 3. Version 1 (four keys) → migrate, then remove the old keys.
    const legacy = readLegacy();
    if (legacy) {
      try {
        state = normalize(migrateV1(legacy));
        if (persist()) {
          LEGACY_KEYS.forEach(removeKey);
          bootNotice = 'Your earlier MyDay data has been moved to the new format.';
        }
        return;
      } catch (e) { /* fall through to a fresh start; legacy keys are left untouched */ }
    }

    // 4. Nothing saved yet.
    state = freshState();
    persist();
  }

  // ======================================================================
  // History helpers
  // ======================================================================
  const keysDesc = () => Object.keys(state.days).sort().reverse();

  function doneIdsOn(k) {
    const d = state.days[k];
    return new Set(d ? d.tasks.filter(t => t.done && t.taskId).map(t => t.taskId) : []);
  }
  function learningDoneOn(k) {
    const d = state.days[k];
    return !!d && d.tasks.some(t => t.category === 'learning' && t.done);
  }
  function sessionCounts() {
    const c = {};
    for (const d of Object.values(state.days)) {
      for (const t of d.tasks) if (t.done && t.taskId) c[t.taskId] = (c[t.taskId] || 0) + 1;
    }
    return c;
  }
  function lastTaskId(cat, pred, beforeKey) {
    for (const k of keysDesc()) {
      if (k >= beforeKey) continue;
      const t = state.days[k].tasks.find(x => x.category === cat && pred(x));
      if (t) return t.taskId;
    }
    return null;
  }
  // Next item after `afterId`, wrapping round to the start, skipping anything in `exclude`.
  function nextFrom(list, afterId, exclude) {
    if (!list || !list.length) return null;
    let i = list.findIndex(t => t.id === afterId);
    i = i < 0 ? 0 : i + 1;
    for (let n = 0; n < list.length; n++) {
      const t = list[(i + n) % list.length];
      if (!exclude.has(t.id)) return t;
    }
    return null;
  }
  // Learning follows the roadmap: the session after the last *completed* one (cycling after the last).
  // Admin and health rotate: the one after the last *planned* one.
  function freshPick(cat, k, exclude) {
    const after = cat === 'learning' ? lastTaskId('learning', t => t.done, k) : lastTaskId(cat, () => true, k);
    return nextFrom(state.lists[cat], after, exclude);
  }
  const limitFor = energy => (energy <= 2 ? 1 : energy === 3 ? 2 : 3);

  function makeTask(src, cat, fromQueue) {
    return {
      uid: uid(), taskId: src.id || null, category: cat, title: src.title,
      minutes: src.minutes, baseMinutes: src.minutes,
      done: false, shrunk: false, fromQueue: fromQueue ? Object.assign({}, fromQueue) : null, rolledQid: null,
      scheduledStart: null, scheduledEnd: null
    };
  }
  const taskFromQueue = q => makeTask({ id: q.taskId, title: q.title, minutes: q.minutes }, q.category, q);
  function shrinkTask(t) { t.minutes = Math.min(t.baseMinutes || 15, 15); t.shrunk = true; }
  function minutesLabel(minutes, base, shrunk) {
    if (shrunk) return 'just 15 min';
    if (base && minutes < base) return `${minutes} min (shortened from ${base})`;
    return `${minutes} min`;
  }

  // ======================================================================
  // Choosing tasks (pure: nothing is saved here)
  // ======================================================================
  function picker(k) {
    const doneYesterday = doneIdsOn(shift(k, -1));
    const usedQ = new Set();
    const chosen = new Set();
    const blocked = () => new Set([...doneYesterday, ...chosen]);
    const queued = cats => state.queue.find(q => cats.includes(q.category) && !usedQ.has(q.qid) && !blocked().has(q.taskId));
    const take = t => {
      if (!t) return null;
      if (t.fromQueue) usedQ.add(t.fromQueue.qid);
      if (t.taskId) chosen.add(t.taskId);
      return t;
    };
    // Oldest eligible queued task in this category first, otherwise a fresh one.
    const slot = cat => {
      const q = queued([cat]);
      if (q) return take(taskFromQueue(q));
      const f = freshPick(cat, k, blocked());
      return take(f ? makeTask(f, cat, null) : null);
    };
    return { doneYesterday, usedQ, chosen, queued, take, slot };
  }

  function chooseTasks(k, energy) {
    const P = picker(k);
    const shrink = state.nudge.shrinkOn === k;
    const n = limitFor(energy);
    let tasks = [];
    if (n === 1) {
      let one = shrink ? P.slot('learning') : null;
      if (!one) {
        const cands = [];
        state.queue.forEach(q => { if (!P.doneYesterday.has(q.taskId)) cands.push({ q, minutes: q.minutes }); });
        CATS.forEach(cat => { const f = freshPick(cat, k, P.doneYesterday); if (f) cands.push({ f, cat, minutes: f.minutes }); });
        if (cands.length) {
          const best = cands.reduce((a, b) => (b.minutes < a.minutes ? b : a)); // ties keep the older queued task
          one = P.take(best.q ? taskFromQueue(best.q) : makeTask(best.f, best.cat, null));
        }
      }
      tasks = [one];
    } else {
      tasks.push(P.slot('learning'));
      if (n === 2) {
        // Second slot: a carried-over admin/health task if one is waiting, otherwise admin.
        const q = P.queued(['admin', 'health']);
        tasks.push(q ? P.take(taskFromQueue(q)) : P.slot('admin'));
      } else {
        tasks.push(P.slot('admin'), P.slot('health'));
      }
      // If a list was empty, fill the gap from the other categories without exceeding the limit.
      for (const cat of CATS) {
        if (tasks.filter(Boolean).length >= n) break;
        if (!tasks.some(t => t && t.category === cat)) tasks.push(P.slot(cat));
      }
    }
    tasks = tasks.filter(Boolean).slice(0, n);
    if (shrink) tasks.forEach(t => { if (t.category === 'learning') shrinkTask(t); });
    return tasks;
  }

  // Extra tasks for a review when energy went up: one per category not already in the plan.
  function chooseAdditional(k, existing, count) {
    const P = picker(k);
    existing.forEach(t => { if (t.taskId) P.chosen.add(t.taskId); if (t.fromQueue) P.usedQ.add(t.fromQueue.qid); });
    const out = [];
    for (const cat of CATS) {
      if (out.length >= count) break;
      if (existing.some(t => t.category === cat)) continue;
      const t = P.slot(cat);
      if (t) out.push(t);
    }
    return out;
  }

  // ======================================================================
  // Queue
  // ======================================================================
  // Undo a task's effect on the queue: drop the entry it created, and return the entry it came from.
  function releaseTask(t) {
    if (t.rolledQid) {
      state.queue = state.queue.filter(q => !(q.qid === t.rolledQid && q.sourceUid === t.uid));
      t.rolledQid = null;
    }
    if (t.fromQueue && !state.queue.some(q => q.qid === t.fromQueue.qid || (q.taskId && q.taskId === t.fromQueue.taskId))) {
      state.queue.push(Object.assign({}, t.fromQueue));
      sortQueue(state.queue);
    }
  }
  function queueTask(t, k) {
    if (t.taskId && state.queue.some(q => q.taskId === t.taskId)) return; // never duplicate
    state.queue.push({ qid: uid(), taskId: t.taskId, category: t.category, title: t.title, minutes: t.baseMinutes, queuedOn: k, sourceUid: null });
    sortQueue(state.queue);
  }
  function sendToQueue(t, k) {
    const cameFromQueue = !!t.fromQueue;
    releaseTask(t);
    if (!cameFromQueue) queueTask(t, k);
  }

  function makeRestDay(k, energy) {
    const d = state.days[k];
    if (d) d.tasks.forEach(releaseTask);
    state.days[k] = { energy: energy || null, rest: true, builtAt: localStamp(), checkedIn: false, tasks: [] };
    persist();
  }

  function toggleRoll(dayKey, t) {
    if (t.done) return;
    if (t.rolledQid) {
      state.queue = state.queue.filter(q => !(q.qid === t.rolledQid && q.sourceUid === t.uid));
      t.rolledQid = null;
    } else {
      // Queue it once. If the same activity is already waiting, point at that entry instead of duplicating.
      const existing = state.queue.find(q => q.taskId && q.taskId === t.taskId);
      if (existing) t.rolledQid = existing.qid;
      else {
        const q = { qid: uid(), taskId: t.taskId, category: t.category, title: t.title, minutes: t.baseMinutes, queuedOn: dayKey, sourceUid: t.uid };
        state.queue.push(q);
        sortQueue(state.queue);
        t.rolledQid = q.qid;
      }
    }
    persist();
  }

  function setDone(t, done) {
    t.done = done;
    if (done && t.rolledQid) {
      state.queue = state.queue.filter(q => !(q.qid === t.rolledQid && q.sourceUid === t.uid));
      t.rolledQid = null;
    }
    persist();
  }

  // ======================================================================
  // Day context: sleep, energy, commitments, settings
  // ======================================================================
  function contextFor(k) { return state.context[k] || emptyContext(); }
  function ensureContext(k) { if (!state.context[k]) state.context[k] = emptyContext(); return state.context[k]; }
  function validSleep(ctx) {
    const s = ctx && ctx.sleep;
    if (!s || !s.start || !s.end || s.end <= s.start) return null;
    if (dtToMin(s.end, s.start.slice(0, 10)) - dtToMin(s.start, s.start.slice(0, 10)) > 1440) return null;
    return s;
  }
  function commitmentsOn(k) {
    return state.commitments.filter(c => dtToMin(c.end, k) > 0 && dtToMin(c.start, k) < 1440);
  }

  // Busy blocks for a day, in minutes from that day's midnight (may extend before 0 or past 1440).
  function blocksFor(k) {
    const out = [];
    const b = state.settings.bufferMinutes;
    for (const ck of [k, shift(k, 1)]) {
      const sl = validSleep(state.context[ck]);
      if (!sl) continue;
      const s = dtToMin(sl.start, k), e = dtToMin(sl.end, k);
      if (e > 0 && s < 1440 && !out.some(x => x.type === 'sleep' && x.start === s)) out.push({ type: 'sleep', start: s, end: e, label: 'Sleep' });
    }
    for (const c of state.commitments) {
      const s = dtToMin(c.start, k), e = dtToMin(c.end, k);
      if (e + b <= 0 || s - b >= 1440) continue;
      out.push({ type: c.kind, start: s, end: e, label: c.title, c });
      if (b > 0) {
        out.push({ type: 'buffer', start: s - b, end: s, label: `Prep/travel for ${c.title}` });
        out.push({ type: 'buffer', start: e, end: e + b, label: `Travel after ${c.title}` });
      }
    }
    return out.sort((x, y) => x.start - y.start);
  }

  // The part of the day where tasks may be suggested (never in the past for today).
  function taskWindow(k) {
    const st = state.settings;
    let start = timeToMin(st.earliestTime);
    const end = timeToMin(st.latestTime);
    if (k === todayKey()) start = Math.max(start, Math.ceil(nowMin(k) / 5) * 5);
    return { start, end };
  }
  function subtract(segs, s, e) {
    const out = [];
    for (const g of segs) {
      if (e <= g.start || s >= g.end) { out.push(g); continue; }
      if (s > g.start) out.push({ start: g.start, end: s });
      if (e < g.end) out.push({ start: e, end: g.end });
    }
    return out;
  }
  function freeSegments(k, busy) {
    const w = taskWindow(k);
    let segs = w.end > w.start ? [{ start: w.start, end: w.end }] : [];
    for (const bl of blocksFor(k)) segs = subtract(segs, bl.start, bl.end);
    for (const x of busy || []) segs = subtract(segs, x.start, x.end);
    return segs.filter(g => g.end - g.start >= 1);
  }

  // Overlap warnings for a task at [start, start+minutes).
  function conflictsFor(k, start, minutes, others, strict) {
    const end = start + minutes, st = state.settings;
    const hard = [], soft = [], extra = [];
    for (const bl of blocksFor(k)) {
      if (!(start < bl.end && end > bl.start)) continue;
      if (bl.type === 'buffer') soft.push('Overlaps ' + bl.label.charAt(0).toLowerCase() + bl.label.slice(1));
      else if (bl.type === 'sleep') hard.push('Overlaps sleep');
      else hard.push(`Overlaps ${bl.label} (${rangeMin(bl.start, bl.end)})`);
    }
    for (const o of others || []) if (start < o.end && end > o.start) extra.push(`Overlaps ${o.label}`);
    if (strict) {
      if (start < timeToMin(st.earliestTime)) extra.push(`Starts before ${st.earliestTime}, your earliest time`);
      if (end > timeToMin(st.latestTime)) extra.push(`Ends after ${st.latestTime}, your latest time`);
      if (k === todayKey() && start < nowMin(k)) extra.push('That time has already passed today');
    }
    return hard.concat(hard.length ? [] : soft.slice(0, 1), extra);
  }

  function explainNoFit(k, need, longest) {
    const st = state.settings;
    if (!longest) {
      if (k === todayKey() && nowMin(k) >= timeToMin(st.latestTime)) {
        return `It's already past ${st.latestTime}, the latest time for suggested tasks today.`;
      }
      return `There's no free time left between ${st.earliestTime} and ${st.latestTime} once commitments, prep/travel and sleep are blocked out.`;
    }
    return `It needs ${fmtDuration(need)}, but the longest free stretch left is ${fmtDuration(longest.end - longest.start)} (${rangeMin(longest.start, longest.end)}).`;
  }

  // ======================================================================
  // Proposals (kept in memory only — nothing is saved until "Apply")
  // ======================================================================
  let proposal = null;

  function itemFromTask(t, isNew) {
    return {
      uid: t.uid, task: t, isNew, done: !!t.done, status: 'today',
      start: null, minutes: t.minutes, anytime: false, reason: null, maxFit: null, note: null, orig: null
    };
  }

  // Fill in times for items that don't have one yet, first-fit, in plan order.
  function placeItems(p) {
    const k = p.dayKey, gap = state.settings.gapMinutes;
    const busy = [];
    for (const it of p.items) {
      if (it.status === 'today' && it.start !== null) busy.push({ start: it.start, end: it.start + it.minutes + (it.done ? 0 : gap) });
    }
    let free = freeSegments(k, busy);
    for (const it of p.items) {
      if (it.done || it.status !== 'today' || it.start !== null || it.anytime) { it.reason = null; it.maxFit = null; continue; }
      const seg = free.find(g => g.end - g.start >= it.minutes);
      if (seg) {
        it.start = seg.start;
        it.reason = null;
        it.maxFit = null;
        free = subtract(free, it.start, it.start + it.minutes + gap);
      } else {
        const longest = free.reduce((a, g) => (!a || g.end - g.start > a.end - a.start ? g : a), null);
        const len = longest ? longest.end - longest.start : 0;
        it.reason = explainNoFit(k, it.minutes, longest);
        it.maxFit = len >= 10 ? Math.floor(len / 5) * 5 : null;
      }
    }
  }

  function proposeBuild(k, energy) {
    const tasks = chooseTasks(k, energy);
    const p = { mode: 'build', dayKey: k, energy, items: tasks.map(t => itemFromTask(t, true)), editing: false, touched: false, stale: false };
    placeItems(p);
    return p;
  }

  function proposeReview(k) {
    const d = state.days[k];
    const energy = contextFor(k).energy || d.energy || 3;
    const limit = limitFor(energy);
    const gap = state.settings.gapMinutes;
    const items = d.tasks.map(t => {
      const it = itemFromTask(t, false);
      it.orig = { start: t.scheduledStart ? dtToMin(t.scheduledStart, k) : null, minutes: t.minutes };
      it.start = it.orig.start;
      return it;
    });
    // Completed tasks are kept exactly; open ones fill the remaining room.
    let room = Math.max(0, limit - items.filter(i => i.done).length);
    for (const it of items) {
      if (it.done) continue;
      if (room > 0) { room--; continue; }
      it.status = 'later';
      it.start = null;
      it.note = `Your energy is ${energy} now, so today has room for ${limit} task${limit === 1 ? '' : 's'}.`;
    }
    if (room > 0) {
      for (const t of chooseAdditional(k, d.tasks, room)) {
        const it = itemFromTask(t, true);
        it.note = `your energy is ${energy} now`;
        items.push(it);
      }
    }
    const p = { mode: 'review', dayKey: k, energy, items, editing: false, touched: false, stale: false };
    // Keep existing times that still fit; anything that no longer fits gets a new suggestion.
    const busy = items.filter(i => i.done && i.start !== null).map(i => ({ start: i.start, end: i.start + i.minutes }));
    const timed = items.filter(i => !i.done && i.status === 'today' && i.start !== null).sort((a, b) => a.start - b.start);
    for (const it of timed) {
      const fits = freeSegments(k, busy).some(g => g.start <= it.start && it.start + it.minutes <= g.end);
      if (fits) busy.push({ start: it.start, end: it.start + it.minutes + gap });
      else it.start = null;
    }
    placeItems(p);
    return p;
  }

  function propChanges(p) {
    return p.items.filter(it => !it.done && (it.isNew
      ? it.status === 'today'
      : it.status === 'later' || it.start !== it.orig.start || it.minutes !== it.orig.minutes)).length;
  }

  function setTimes(t, it, k) {
    if (it.start !== null && it.status === 'today') {
      t.scheduledStart = minToDt(it.start, k);
      t.scheduledEnd = minToDt(it.start + it.minutes, k);
    } else {
      t.scheduledStart = null;
      t.scheduledEnd = null;
    }
  }

  function applyProposal() {
    const p = proposal;
    if (!p) return;
    const k = p.dayKey;
    proposal = null;
    if (k !== todayKey()) { toast('That proposal was for a different day, so nothing was changed.'); return; }

    if (p.mode === 'build') {
      if (state.days[k]) return; // never overwrite a saved plan
      const tasks = [], usedQ = new Set();
      for (const it of p.items) {
        const t = it.task;
        if (it.status === 'today') {
          t.minutes = it.minutes;
          setTimes(t, it, k);
          tasks.push(t);
          if (t.fromQueue) usedQ.add(t.fromQueue.qid);
        } else if (!t.fromQueue) {
          queueTask(t, k); // "Leave for later": wait in the queue (queued ones simply stay there)
        }
      }
      state.queue = state.queue.filter(q => !usedQ.has(q.qid));
      ensureContext(k).energy = p.energy;
      state.days[k] = tasks.length
        ? { energy: p.energy, rest: false, builtAt: localStamp(), checkedIn: false, tasks }
        : { energy: p.energy, rest: true, builtAt: localStamp(), checkedIn: false, tasks: [] };
      persist();
      toast('Your day is ready.');
      return;
    }

    const d = state.days[k];
    if (!d || d.rest) return;
    for (const it of p.items) {
      if (it.isNew) {
        const t = it.task;
        if (it.status === 'today') {
          t.minutes = it.minutes;
          setTimes(t, it, k);
          d.tasks.push(t);
          if (t.fromQueue) state.queue = state.queue.filter(q => q.qid !== t.fromQueue.qid);
        } else if (!t.fromQueue) {
          queueTask(t, k);
        }
        continue;
      }
      const t = d.tasks.find(x => x.uid === it.uid);
      if (!t || t.done) continue; // completed tasks and their history are never touched
      if (it.status === 'later') {
        sendToQueue(t, k);
        d.tasks = d.tasks.filter(x => x !== t);
      } else {
        t.minutes = it.minutes;
        setTimes(t, it, k);
      }
    }
    d.energy = p.energy;
    persist();
    toast('Plan updated.');
  }

  // Context changed while a proposal is open: refresh it, unless the user has edited it.
  function onContextChanged() {
    if (!proposal) return;
    if (proposal.touched) { proposal.stale = true; return; }
    const k = todayKey();
    if (proposal.mode === 'build') proposal = state.days[k] ? null : proposeBuild(k, contextFor(k).energy || proposal.energy);
    else proposal = state.days[k] && !state.days[k].rest ? proposeReview(k) : null;
  }

  // ======================================================================
  // Rolling count & nudge
  // ======================================================================
  function windowDays() {
    const k = todayKey(), out = [];
    for (let i = 6; i >= 0; i--) out.push(learningDoneOn(shift(k, -i)));
    return out;
  }

  let nudgeVisible = false;
  let nudgeChoosing = false;

  function nudgeEligible(k) {
    if (!state.lists.learning.length) return false;
    if (state.createdOn > shift(k, -3)) return false;            // needs three full days of history
    const d = state.days[k];
    if (d && d.rest) return false;                                // never on a rest day
    if (learningDoneOn(k)) return false;
    if (d && d.tasks.some(t => t.category === 'learning' && t.shrunk)) return false;
    for (let i = 1; i <= 3; i++) if (learningDoneOn(shift(k, -i))) return false;
    return true;
  }
  function checkNudge() {
    const k = todayKey();
    if (saveBlocked || state.nudge.lastShownOn === k || !nudgeEligible(k)) return;
    nudgeVisible = true;
    nudgeChoosing = false;
    state.nudge.lastShownOn = k;
    persist();
  }

  function retime(t) {
    if (t.scheduledStart) t.scheduledEnd = minToDt(dtToMin(t.scheduledStart, t.scheduledStart.slice(0, 10)) + t.minutes, t.scheduledStart.slice(0, 10));
  }

  function acceptShrink() {
    const k = todayKey(), d = state.days[k];
    if (!d) {
      state.nudge.shrinkOn = k;
      persist();
      nudgeVisible = false;
      onContextChanged();
      toast("Got it — when you build today's plan, learning will be just 15 minutes.");
      return;
    }
    const l = d.tasks.find(t => t.category === 'learning' && !t.done);
    if (l) {
      shrinkTask(l);
      retime(l);
      persist();
      nudgeVisible = false;
      toast("Done — today's learning is just 15 minutes.");
      return;
    }
    nudgeChoosing = true; // no learning in today's plan: offer a swap
  }

  function learningForToday(k, d) {
    const doneY = doneIdsOn(shift(k, -1));
    const inPlan = new Set(d.tasks.map(t => t.taskId));
    const q = state.queue.find(x => x.category === 'learning' && !doneY.has(x.taskId) && !inPlan.has(x.taskId));
    if (q) { state.queue = state.queue.filter(x => x.qid !== q.qid); return taskFromQueue(q); }
    const f = freshPick('learning', k, new Set([...doneY, ...inPlan]));
    return f ? makeTask(f, 'learning', null) : null;
  }

  function swapInLearning(replaceUid) {
    const k = todayKey(), d = state.days[k];
    if (!d || d.rest) return;
    const i = replaceUid ? d.tasks.findIndex(t => t.uid === replaceUid && !t.done) : -1;
    if (replaceUid && i < 0) return;
    if (!replaceUid && d.tasks.length >= limitFor(d.energy)) return;
    const lt = learningForToday(k, d);
    if (!lt) { toast("There isn't a learning task available right now."); return; }
    shrinkTask(lt);
    if (i >= 0) {
      const old = d.tasks[i];
      lt.scheduledStart = old.scheduledStart; // take over the replaced task's time slot
      retime(lt);
      releaseTask(old);
      d.tasks.splice(i, 1, lt);
    } else d.tasks.unshift(lt);
    nudgeVisible = false;
    nudgeChoosing = false;
    persist();
    toast('Swapped in: 15 minutes of learning.');
  }

  // ======================================================================
  // Export / import
  // ======================================================================
  function download(filename, text) {
    const blob = new Blob([text], { type: 'application/json' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(link.href), 1000);
  }
  function exportData() {
    const payload = { format: EXPORT_FORMAT, schemaVersion: SCHEMA_VERSION, exportedAt: localStamp(), data: state };
    download(`myday-export-${todayKey()}.json`, JSON.stringify(payload, null, 2));
    toast('Exported.');
  }

  // Returns { state, report } or throws an Error with a friendly message.
  function parseImport(text) {
    let obj;
    try { obj = JSON.parse(text); } catch (e) { throw new Error("That file isn't readable JSON."); }
    if (!isObj(obj)) throw new Error("That file isn't a MyDay export.");
    let data;
    if (obj.format === EXPORT_FORMAT) {
      if (obj.schemaVersion > SCHEMA_VERSION) throw new Error('That file came from a newer version of MyDay.');
      if (obj.schemaVersion !== 2 && obj.schemaVersion !== 3) throw new Error("That file's version isn't supported.");
      if (!isObj(obj.data) || obj.data.schemaVersion !== obj.schemaVersion || !isObj(obj.data.lists) || !isObj(obj.data.days)) {
        throw new Error('That file is missing parts MyDay needs.');
      }
      data = obj.data; // version 2 files are upgraded by normalize()
    } else if (LEGACY_KEYS.some(k => k in obj)) {
      data = migrateV1(obj); // export from the first version of MyDay
    } else {
      throw new Error("That file isn't a MyDay export.");
    }
    const report = { dropped: 0 };
    const s = normalize(data, report);
    s.timer = null; // a running timer from another device doesn't make sense here
    return { state: s, report };
  }

  async function importFile(file) {
    let text;
    try { text = await file.text(); } catch (e) { toast("Couldn't open that file."); return; }
    let result;
    try { result = parseImport(text); } catch (e) { toast(e.message + ' Nothing was changed.'); return; }
    const s = result.state;
    const n = (x, word) => `${x} ${word}${x === 1 ? '' : 's'}`;
    const dayCount = Object.keys(s.days).length;
    const lines = [
      'Replace your saved MyDay data with this file?',
      '',
      `It has ${dayCount} day${dayCount === 1 ? '' : 's'} of history, ${n(s.queue.length, 'queued task')}, ${n(CATS.reduce((a, c) => a + s.lists[c].length, 0), 'task')} in your lists and ${n(s.commitments.length, 'commitment')}.`
    ];
    if (result.report.dropped) lines.push(`${result.report.dropped} unreadable entr${result.report.dropped === 1 ? 'y' : 'ies'} will be skipped.`);
    lines.push('', 'Your current data on this device will be overwritten. You might want to export it first.');
    if (!confirm(lines.join('\n'))) { toast('Import cancelled. Nothing was changed.'); return; }
    state = s;
    if (saveBlocked && damagedKey === PREVIOUS_KEY) removeKey(PREVIOUS_KEY);
    saveBlocked = false;
    damagedRaw = null;
    view = 'auto';
    eveningKey = null;
    proposal = null;
    commitForm = null;
    nudgeVisible = false;
    if (persist()) toast('Imported.');
    checkNudge();
    render();
  }

  // ======================================================================
  // Rendering
  // ======================================================================
  let view = 'auto';      // 'auto' | 'evening' | 'edit'
  let eveningKey = null;
  let renderedDay = null;
  let contextOpen = false;
  let commitForm = null;  // { id, kind, title, start, end } while adding/editing a commitment

  const $ = id => document.getElementById(id);
  const setHTML = (id, html) => { const el = $(id); if (el) el.innerHTML = html; };

  function render() {
    const k = todayKey();
    if (renderedDay && renderedDay !== k) { proposal = null; commitForm = null; }
    renderedDay = k;
    if (proposal && proposal.dayKey !== k) proposal = null;
    snapshotCommitForm();
    applyTheme();
    $('date').textContent = prettyDate(k);
    const layout = $('layout');
    if (saveBlocked) {
      layout.dataset.mode = 'other';
      $('nudge').innerHTML = '';
      $('app').innerHTML = damagedView();
      $('slot-glance').innerHTML = '';
      $('streak').innerHTML = '';
      $('garden').innerHTML = '';
      $('footer').innerHTML = '';
      return;
    }
    activeTimer(); // drops a timer left over from another day or for a task that's gone or done
    renderNudge(k);
    if (view === 'edit') { layout.dataset.mode = 'other'; $('app').innerHTML = editView(); $('slot-glance').innerHTML = ''; }
    else if (view === 'evening' && eveningKey && state.days[eveningKey]) { layout.dataset.mode = 'other'; $('app').innerHTML = eveningView(eveningKey); $('slot-glance').innerHTML = ''; }
    else {
      view = 'auto';
      layout.dataset.mode = state.days[k] ? 'plan' : 'morning';
      $('app').innerHTML = state.days[k]
        ? `<div id="slot-timer"></div><div id="slot-plan"></div><div id="slot-context">${contextCard(k)}</div><div id="slot-actions"></div>`
        : `<div id="slot-context">${contextCard(k)}</div><div id="slot-actions"></div><div id="slot-yesterday"></div>`;
      fillDerived();
    }
    renderStreak();
    renderGarden();
    renderFooter();
    // A gentle fade when moving between screens (not on first load).
    const screen = view === 'auto' ? layout.dataset.mode : view;
    if (lastScreen !== null && screen !== lastScreen && motionAllowed()) {
      document.querySelectorAll('#app .card').forEach(c => c.classList.add('enter'));
    }
    lastScreen = screen;
    justDoneUid = null;
    justLearned = false;
  }

  // ---------- Theme ----------
  const lightQuery = window.matchMedia ? window.matchMedia('(prefers-color-scheme: light)') : null;
  function applyTheme() {
    const t = state ? state.settings.theme : 'dark';
    document.documentElement.setAttribute('data-theme', t);
    document.documentElement.setAttribute('data-motion', state && state.settings.motion === 'off' ? 'off' : 'auto');
    const meta = document.querySelector('meta[name="theme-color"]');
    const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
    if (meta && bg) meta.setAttribute('content', bg);
    const b = $('themeBtn');
    if (b) {
      const label = `Theme: ${THEME_LABEL[t]}. Tap to change.`;
      b.innerHTML = THEME_ICON[t];
      b.setAttribute('aria-label', label);
      b.title = label;
    }
  }
  if (lightQuery && lightQuery.addEventListener) lightQuery.addEventListener('change', applyTheme);

  // Re-renders everything that depends on the context, without touching the context inputs themselves.
  function fillDerived() {
    if (view !== 'auto' || saveBlocked) return;
    const k = todayKey(), d = state.days[k];
    setHTML('slot-timer', d ? timerCard() : '');
    setHTML('slot-plan', d ? planCard(k) : '');
    setHTML('slot-glance', glanceCard(k));
    const animateProposal = !!(proposal && !proposal.animated && motionAllowed());
    setHTML('slot-actions', proposal ? proposalCard(animateProposal) : d ? '' : buildActions(k));
    if (proposal) proposal.animated = true;
    setHTML('slot-yesterday', d ? '' : yesterdayCard(k));
    setHTML('sleepSummary', sleepSummary(k));
    setHTML('reviewHint', reviewHint(k));
  }
  function refresh() { renderNudge(todayKey()); fillDerived(); renderStreak(); }

  function damagedView() {
    return `
      <section class="card notice">
        <h2>Your saved data couldn't be opened</h2>
        <p class="small">${esc(damagedReason)} Nothing has been deleted — it's still saved exactly as it was.</p>
        <p class="small muted">You can download that copy to keep it safe, load a backup you exported earlier, or start fresh.</p>
        <div class="stack">
          <button data-action="download-damaged">Download the saved copy</button>
          <button data-action="import">Import a backup</button>
          <button class="ghost" data-action="start-fresh">Start fresh</button>
        </div>
      </section>`;
  }

  function renderNudge(k) {
    if (!nudgeVisible || !nudgeEligible(k)) { $('nudge').innerHTML = ''; return; }
    const d = state.days[k];
    if (!nudgeChoosing) {
      $('nudge').innerHTML = `
        <section class="card nudge">
          <p>No learning in a few days — want to shrink today's task to just 15 minutes?</p>
          <div class="row2">
            <button class="primary" data-action="shrink">Yes, shrink it</button>
            <button class="ghost" data-action="dismiss-nudge">Not today</button>
          </div>
        </section>`;
      return;
    }
    const open = d ? d.tasks.filter(t => !t.done) : [];
    const room = d && d.tasks.length < limitFor(d.energy);
    $('nudge').innerHTML = `
      <section class="card nudge">
        <p>Today's plan doesn't have a learning task. Want to swap one optional task for a 15-minute learning session?</p>
        ${open.length || room ? '' : '<p class="small muted">Everything on today\'s plan is already done — learning can happily wait for another day.</p>'}
        <div class="stack">
          ${open.map(t => `<button data-action="swap-learning" data-uid="${t.uid}">Swap out “${esc(t.title)}”</button>`).join('')}
          ${room ? '<button data-action="add-learning">Add it — there\'s room in today\'s plan</button>' : ''}
          <button class="ghost" data-action="dismiss-nudge">Never mind</button>
        </div>
        ${open.some(t => t.fromQueue) ? '<p class="small muted" style="margin:10px 0 0">Anything that was carried over goes back to your queue.</p>' : ''}
      </section>`;
  }

  function renderStreak() {
    if (view === 'edit') { $('streak').innerHTML = ''; return; }
    const k = todayKey(), s = windowDays(), n = s.filter(Boolean).length;
    const tiles = s.map((on, i) => {
      const day = shift(k, i - 6);
      const name = parseKey(day).toLocaleDateString(undefined, { weekday: 'narrow' });
      const full = parseKey(day).toLocaleDateString(undefined, { weekday: 'long' });
      return `<div class="wd${on ? ' on' : ''}${i === 6 ? ' today' : ''}${i === 6 && on && justLearned ? ' just' : ''}" title="${esc(full)}${on ? ': learning done' : ''}"><span class="pip">${on ? '✓' : ''}</span><span class="dl">${esc(name)}</span></div>`;
    }).join('');
    $('streak').innerHTML = `
      <section class="card">
        <div class="streak">
          <strong>Learning days in the last 7: ${n}</strong>
        </div>
        <div class="week" aria-hidden="true">${tiles}</div>
        <p class="muted small" style="margin:0">A rolling count of today and the 6 days before. Missed days and rest days never reset it to zero — older days simply slide out of the window.</p>
      </section>`;
  }

  function renderFooter() {
    $('footer').innerHTML = view === 'edit' ? '' : `
      <div class="row2">
        <button class="ghost inline full" data-action="edit">Edit task lists</button>
        <button class="ghost inline" data-action="export">Export my data</button>
        <button class="ghost inline" data-action="import">Import my data</button>
        <button class="ghost inline full" data-action="motion" aria-pressed="${state.settings.motion !== 'off'}">${
          state.settings.motion === 'off' ? 'Animations: Off' : deviceReducesMotion() ? 'Animations: Off (your device asks for less motion)' : 'Animations: On'}</button>
      </div>
      <p class="storage-note">${storageAvailable ? 'Saved only in this browser.' : 'Saving is unavailable in this browser.'}</p>`;
  }

  function queueNote(prefix) {
    if (!state.queue.length) return '';
    return `<p class="muted small" style="margin-top:12px">${prefix}</p>
      <ul class="queue-list">${state.queue.map(q => `<li>${esc(q.title)}</li>`).join('')}</ul>`;
  }

  // ---------- Context card ----------
  function sleepSummary(k) {
    const sl = contextFor(k).sleep;
    if (sl.start && sl.end) {
