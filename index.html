  // ======================================================================
  // Study: actions and inputs (all saved automatically)
  // ======================================================================
  // Returns 'none' when it has already navigated or re-rendered.
  function studyAction(a, btn) {
    const d = btn.dataset, ix = stIndex();
    switch (a) {
      case 's-setup': applySetup(d.with === '1'); toast('Your roadmap is ready — add modules and sections whenever you like.'); return;
      case 's-edit': stEdit = !stEdit; return;
      case 's-focus': if (ix.course.has(d.id)) { ST().focusCourseId = d.id; persist(); toast('Focus updated.'); } go('study'); return 'none';
      case 's-add': {
        const level = d.level, parent = level === 'stage' ? null : stFind(ix, d.parent);
        if (level !== 'stage' && !parent) return 'none';
        const n = newStudyItem(level, parent && parent.level === 'section' ? parent.course : null);
        (parent ? parent.node[stChildren[parent.level]] : ST().stages).push(n);
        for (const p of [n, parent && parent.node, parent && parent.module, parent && parent.course]) if (p) stOpen.set(p.id, true); // so the new name box is visible
        persist(); render();
        const input = document.querySelector(`input[data-s="title"][data-id="${n.id}"]`);
        if (input) { input.focus(); input.select(); }
        return 'none';
      }
      case 's-move': {
        const e = stFind(ix, d.id), i = e ? e.list.indexOf(e.node) : -1, j = i + Number(d.d);
        if (i < 0 || j < 0 || j >= e.list.length) return 'none';
        [e.list[i], e.list[j]] = [e.list[j], e.list[i]];
        persist();
        return;
      }
      case 's-del': {
        const e = stFind(ix, d.id);
        if (!e) return 'none';
        const n = e.level === 'task' ? 0 : tasksUnder(e.level, e.node).length;
        if (!confirm(`Remove “${e.node.title}”${n ? ` and the ${n} task${n === 1 ? '' : 's'} in it` : ''}?`)) return 'none';
        removeStudyItem(e);
        persist();
        if (route()[1] === 'course' || route()[1] === 'task') { go('study/roadmap'); return 'none'; }
        return;
      }

      // ----- Learning sessions -----
      case 's-len': stLength[d.key] = Math.max(5, Math.min(240, Number(d.m) + Number(d.d))); return;
      case 's-start': {
        if (!activeStudy() && !startStudySession(d.course, d.task || null, intIn(d.m, 1, 600, 30), d.short === '1')) return 'none';
        go('study/session');
        return 'none';
      }
      case 's-pause': { const s = activeStudy(); if (s) pauseStudy(s); return; }
      case 's-resume': { const s = activeStudy(); if (s) resumeStudy(s); return; }
      case 's-finish': {
        const s = activeStudy();
        if (!s) return;
        finishStudy(s);
        go('study/checkin/' + s.id);
        return 'none';
      }
      case 's-discard': {
        const s = activeStudy();
        if (!s || !confirm("Discard this session? It won't be saved or counted.")) return 'none';
        ST().sessions = ST().sessions.filter(x => x !== s);
        ST().activeId = null;
        persist();
        go('study');
        return 'none';
      }

      // ----- Check-in (all optional) -----
      case 's-ci-task': case 's-ci-concept': case 's-ci-add': case 's-ci-clarity': {
        const s = ST().sessions.find(x => x.id === route()[2]);
        if (!s) return 'none';
        if (a === 's-ci-task') {
          const t = s.taskId && ix.task.get(s.taskId);
          if (!t) return 'none';
          s.taskDone = d.v === '1';
          t.node.done = s.taskDone;
          t.node.doneOn = s.taskDone ? t.node.doneOn || todayKey() : null;
        } else if (a === 's-ci-concept') {
          const ci = ensureCheckin(s);
          ci.conceptIds = ci.conceptIds.includes(d.id) ? ci.conceptIds.filter(x => x !== d.id) : ci.conceptIds.concat(d.id);
        } else if (a === 's-ci-clarity') {
          const ci = ensureCheckin(s);
          ci.clarity = ci.clarity === d.v ? null : d.v;
        } else {
          const title = ($('ciNew') ? $('ciNew').value : '').trim();
          if (!title) return 'none';
          const c = conceptNamed(title, s.taskId); // reuses one with the same name rather than making a duplicate
          const ci = ensureCheckin(s);
          if (!ci.conceptIds.includes(c.id)) ci.conceptIds.push(c.id);
          persist(); render();
          if ($('ciNew')) $('ciNew').focus();
          return 'none';
        }
        persist();
        return;
      }
      case 's-tick-today': {
        const s = ST().sessions.find(x => x.id === d.id), t = s && todayTaskFor(s);
        if (!t || t.done) return;
        setDone(t, true);
        s.todayUid = t.uid;
        persist();
        toast("Ticked on today's plan.");
        return;
      }
      case 's-task-concept': {
        const title = ($('tkConcept') ? $('tkConcept').value : '').trim();
        if (!title || !ix.task.has(d.id)) return 'none';
        conceptNamed(title, d.id);
        persist(); render();
        if ($('tkConcept')) $('tkConcept').focus();
        return 'none';
      }

      // ----- Revision -----
      case 's-rev-start': startRound(); go('study/revise'); return 'none';
      case 's-rev-choose': case 's-rev-show': case 's-rev-notsure': case 's-rev-hint': case 's-rev-self': case 's-rev-support': case 's-rev-rate': {
        const r = revRound, c = r && conceptById(r.ids[r.i]);
        if (!c) return;
        if (r.phase === 'ask') {
          if (a === 's-rev-hint') { r.hint = true; r.support = 'hint'; }
          else if (a === 's-rev-choose') { r.chosen = Number(d.i); r.outcome = r.chosen === c.correct ? 'right' : 'wrong'; r.phase = 'shown'; }
          else if (a === 's-rev-show') r.phase = 'shown';
          else if (a === 's-rev-notsure') { r.outcome = 'notsure'; r.phase = 'shown'; }
          return;
        }
        if (a === 's-rev-self' && OUTCOME[d.v]) r.outcome = d.v;
        else if (a === 's-rev-support' && SUPPORT[d.v]) r.support = d.v;
        else if (a === 's-rev-rate' && RATING[d.v]) { rateConcept(d.v); window.scrollTo(0, 0); }
        return;
      }

      // ----- Concepts -----
      case 's-concept-new': {
        const c = newConcept('New concept', null);
        ST().concepts.push(c);
        persist();
        go('study/concept/' + c.id);
        setTimeout(() => { if ($('cp-title')) { $('cp-title').focus(); $('cp-title').select(); } }, 50);
        return 'none';
      }
      case 's-cp-link': { const c = conceptById(d.id), t = $('cpLink') ? $('cpLink').value : ''; if (c && ix.task.has(t) && !c.taskIds.includes(t)) { c.taskIds.push(t); persist(); } return; }
      case 's-cp-unlink': { const c = conceptById(d.id); if (c) { c.taskIds = c.taskIds.filter(x => x !== d.task); persist(); } return; }
      case 's-cp-del': {
        const c = conceptById(d.id);
        if (!c || !confirm(`Remove “${c.title}”? Its past reviews stay in your study history.`)) return 'none';
        ST().concepts = ST().concepts.filter(x => x !== c);
        for (const s of ST().sessions) if (s.checkin) s.checkin.conceptIds = s.checkin.conceptIds.filter(x => x !== c.id);
        revRound = null;
        persist();
        go('study/concepts');
        return 'none';
      }

      case 's-ci-done': case 's-ci-skip': {
        const s = ST().sessions.find(x => x.id === d.id);
        if (a === 's-ci-done' && s && s.checkin) toast('Check-in saved.');
        go('study');
        return 'none';
      }
    }
  }

  function studyInput(el, type) {
    const d = el.dataset, key = d.s, ix = stIndex();
    if (key === 'rev-typed') { if (revRound) revRound.typed = el.value.slice(0, 2000); return; } // kept in memory only
    if (type !== 'change') return;
    if (key === 'vault') { ST().settings.vault = el.value.trim().slice(0, 100); persist(); return; }
    if (key.startsWith('cp-')) {
      const c = conceptById(d.id), f = key.slice(3);
      if (!c) return;
      if (f === 'title') { const v = el.value.trim(); if (v) c.title = v.slice(0, 120); else el.value = c.title; }
      else if (f === 'kind') c.kind = el.value === 'choice' ? 'choice' : 'written';
      else if (f === 'choice') {
        while (c.choices.length < 4) c.choices.push('');
        c.choices[Number(d.i)] = el.value.trim().slice(0, 200);
        if (c.correct !== null && !c.choices[c.correct]) c.correct = null;
      } else if (f === 'correct') c.correct = c.choices[Number(el.value)] ? Number(el.value) : null; // only a filled-in choice can be the answer
      else c[f] = el.value.trim().slice(0, { prompt: 1000, answer: 2000, explanation: 4000, hint: 500, source: 400, note: 300 }[f] || 400);
      persist();
      if (f === 'kind' || f === 'correct' || f === 'title') render();
      return;
    }
    if (key === 'show-clock') { ST().settings.showClock = el.checked; persist(); render(); return; }
    if (key.startsWith('ci-')) {
      const s = ST().sessions.find(x => x.id === d.id);
      if (s) { ensureCheckin(s)[key.slice(3)] = el.value.trim().slice(0, key === 'ci-note' ? 300 : 500); persist(); }
      return;
    }
    if (key === 'setup-keep' || key === 'setup-stage') {
      const r = stSetup && stSetup[+d.i];
      if (r) { if (key === 'setup-keep') r.keep = el.checked; else if (STARTER_STAGES.includes(el.value)) r.stage = el.value; }
      return;
    }
    const e = stFind(ix, d.id);
    if (!e) return;
    const n = e.node;
    if (key === 'title') { const v = el.value.trim(); if (v) { n.title = v.slice(0, 120); persist(); } else el.value = n.title; return; }
    if (key === 'url') { const v = safeUrl(el.value.trim()); if (el.value.trim() && !v) toast('Links need to start with http:// or https://'); n.url = v.slice(0, 400); persist(); render(); return; }
    if (key === 'minutes') { n.minutes = intIn(el.value, 5, 600, n.minutes); el.value = n.minutes; persist(); return; }
    if (key === 'kind') { n.kind = el.value === 'practical' ? 'practical' : 'learn'; persist(); return; }
    if (key === 'archived') { n.archived = el.checked; persist(); render(); return; }
    if (key === 'task-done') { n.done = el.checked; n.doneOn = el.checked ? todayKey() : null; persist(); render(); return; }
    if (key === 'course-stage') {
      const to = ix.stage.get(el.value);
      if (to && to.node !== e.stage) { e.list.splice(e.list.indexOf(n), 1); to.node.courses.push(n); persist(); render(); }
      return;
    }
    if (key === 'task-section') {
      const to = ix.section.get(el.value);
      if (to && to.node !== e.section) { e.list.splice(e.list.indexOf(n), 1); to.node.tasks.push(n); persist(); render(); }
    }
  }

  // ======================================================================
  // Toast
  // ======================================================================
  let toastTimer;
  function toast(msg) {
    const el = $('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
  }

  // ======================================================================
  // Context editing
  // ======================================================================
  function saveSleepFromDom() {
    const k = todayKey(), c = ensureContext(k);
    const v = id => ($(id) ? $(id).value : '');
    const st = v('sst').slice(0, 5), et = v('set').slice(0, 5);
    c.sleep.start = isTime(st) && isDateKey(v('ssd')) ? `${v('ssd')}T${st}` : null;
    c.sleep.end = isTime(et) && isDateKey(v('sed')) ? `${v('sed')}T${et}` : null;
    const est = v('sest');
    const n = Number(est);
    if (est === '') c.sleep.estimatedHours = null;
    else if (n > 0 && n <= 24) c.sleep.estimatedHours = Math.round(n * 4) / 4;
    else { toast('A sleep estimate needs to be between 0 and 24 hours.'); $('sest').value = c.sleep.estimatedHours ?? ''; }
    persist();
  }

  function saveSetting(el) {
    const st = state.settings, key = el.dataset.setting;
    if (key === 'bufferMinutes' || key === 'gapMinutes') {
      const max = key === 'bufferMinutes' ? 240 : 60;
      const n = intIn(el.value, 0, max, null);
      if (n === null) { el.value = st[key]; toast(`Please use a number from 0 to ${max}.`); return false; }
      st[key] = n;
    } else {
      const t = el.value.slice(0, 5);
      const ok = isTime(t) && (key === 'earliestTime' ? t < st.latestTime : t > st.earliestTime);
      if (!ok) { el.value = st[key]; toast('The earliest task time needs to be before the finish time.'); return false; }
      st[key] = t;
    }
    persist();
    return true;
  }

  function defaultCommitTimes(kind) {
    const k = todayKey();
    let s = Math.ceil((nowMin(k) + 1) / 60) * 60;
    if (s > 1380) s = 1440 + 9 * 60; // late evening: suggest tomorrow morning
    const len = kind === 'work' ? 480 : 60;
    return { start: minToDt(s, k), end: minToDt(s + len, k) };
  }

  function saveCommitment() {
    snapshotCommitForm();
    const f = commitForm;
    const kind = f.kind === 'work' ? 'work' : 'appointment';
    const err = msg => { $('cfError').textContent = msg; return false; };
    if (!isDateTime(f.start) || !isDateTime(f.end)) return err('Please add a start and an end, each with a date and time.');
    if (f.end <= f.start) return err('The end needs to be after the start. For a night shift, set the end to the next day.');
    if (dtToMin(f.end, f.start.slice(0, 10)) - dtToMin(f.start, f.start.slice(0, 10)) > 7 * 1440) return err("That's longer than a week — please check the dates.");
    const title = f.title.trim() || KIND_LABEL[kind];
    if (f.id) {
      const c = state.commitments.find(x => x.id === f.id);
      if (c) Object.assign(c, { kind, title, start: f.start, end: f.end });
    } else {
      state.commitments.push({ id: 'c' + uid(), kind, title, start: f.start, end: f.end });
    }
    state.commitments.sort((a, b) => (a.start < b.start ? -1 : a.start > b.start ? 1 : 0));
    persist();
    commitForm = null;
    return true;
  }

  // ======================================================================
  // Events
  // ======================================================================
  function findTask(dayKey, id) {
    const d = state.days[dayKey];
    return d ? d.tasks.find(t => t.uid === id) : null;
  }
  const propItem = id => (proposal ? proposal.items.find(i => i.uid === id) : null);
  function scrollToProposal() {
    const el = $('proposalCard');
    if (el && el.scrollIntoView) el.scrollIntoView({ block: 'start' });
  }

  document.addEventListener('input', e => {
    if (e.target.id === 'foodQ') { onFoodTyping(e.target.value); return; }
    if (e.target.dataset && e.target.dataset.s) { studyInput(e.target, 'input'); return; }
    if (e.target.dataset && e.target.dataset.h) { healthInput(e.target, 'input'); return; }
    if (e.target.id === 'energy') {
      const v = Number(e.target.value);
      $('energyLabel').textContent = `${v} · ${ENERGY_LABEL[v]}`;
      e.target.style.setProperty('--fill', `${(v - 1) * 25}%`);
    }
  });

  document.addEventListener('toggle', e => {
    if (e.target.id === 'ctxDetails') contextOpen = e.target.open;
    if (e.target.dataset && e.target.dataset.node) stOpen.set(e.target.dataset.node, e.target.open); // roadmap items
  }, true);

  document.addEventListener('change', e => {
    const el = e.target;
    const k = todayKey();
    if (el.id === 'importFile') {
      const file = el.files && el.files[0];
      el.value = '';
      if (file) importFile(file);
      return;
    }
    if (el.dataset.h) { healthInput(el, 'change'); return; }
    if (el.dataset.s) { studyInput(el, 'change'); return; }
    if (el.dataset.cal) { handleCalChange(el); return; }
    if (el.dataset.pf) { handlePatternInput(el); return; }
    if (el.dataset.colour) {
      if (isHex(el.value)) { state.rota.colours[el.dataset.colour] = el.value.toLowerCase(); persist(); render(); }
      return;
    }
    if (el.dataset.pay) {
      if (!savePaySetting(el)) return;
      if (['sickPay', 'frequency'].includes(el.dataset.pay)) render(); else $('app').innerHTML = payMain();
      return;
    }
    if (el.hasAttribute('data-bh-region')) {
      if (BH_REGIONS[el.value]) { state.bankHolidays.region = el.value; bhIndex = null; persist(); render(); }
      return;
    }
    if (el.id === 'energy') {
      ensureContext(k).energy = Number(el.value);
      persist();
      onContextChanged();
      refresh();
      return;
    }
    if (el.dataset.ctx === 'sleep') { saveSleepFromDom(); onContextChanged(); refresh(); return; }
    if (el.dataset.setting) { if (saveSetting(el)) { onContextChanged(); refresh(); } return; }
    if (el.dataset.action === 'prop-time' || el.dataset.action === 'prop-minutes') {
      const it = propItem(el.dataset.uid);
      if (!it) return;
      if (el.dataset.action === 'prop-time') {
        const t = el.value.slice(0, 5);
        it.start = isTime(t) ? timeToMin(t) : null;
        it.anytime = !isTime(t);
      } else {
        const m = intIn(el.value, 5, 600, null);
        if (m === null) { el.value = it.minutes; toast('Please use 5 to 600 minutes.'); return; }
        it.minutes = m;
      }
      proposal.touched = true;
      refresh();
      return;
    }
    if (el.dataset.action === 'toggle') {
      const t = findTask(el.dataset.day, el.dataset.uid);
      if (!t) return;
      markDone(el.dataset.day, t, el.checked);
      return;
    }
    const row = el.closest('.edit-row');
    if (row && el.dataset.field) {
      const item = state.lists[row.dataset.cat].find(t => t.id === row.dataset.id);
      if (!item) return;
      if (el.dataset.field === 'title') {
        const v = el.value.trim();
        if (v) item.title = v; else el.value = item.title;
      } else {
        const m = cleanMinutes(el.value, null);
        if (m) item.minutes = m; else el.value = item.minutes;
      }
      persist();
      toast('Saved.');
    }
  });

  document.addEventListener('click', e => {
    const btn = e.target.closest('button[data-action]');
    if (!btn) return;
    const a = btn.dataset.action;
    const k = todayKey();
    if (a.startsWith('h-')) { if (healthAction(a, btn) !== 'none') render(); return; }
    if (a.startsWith('s-')) { if (studyAction(a, btn) !== 'none') render(); return; }

    switch (a) {
      case 'cal-prev':
      case 'cal-next': {
        const dir = a === 'cal-next' ? 1 : -1;
        if (calView === 'month') calMonth = shiftMonth(calMonth + '-01', dir).slice(0, 7);
        else agendaStart = shift(agendaStart || k, dir * 28);
        break;
      }
      case 'cal-today':
        calMonth = k.slice(0, 7); calSelected = k; agendaStart = k;
        break;
      case 'cal-view':
        calView = btn.dataset.v === 'agenda' ? 'agenda' : 'month';
        if (calView === 'agenda') agendaStart = calMonth === k.slice(0, 7) ? k : calMonth + '-01';
        break;
      case 'cal-select': {
        calSelected = btn.dataset.date;
        if (calForm && calForm.kind === 'entry') calForm = null;
        commitForm = null;
        if (calView === 'month' && calSelected.slice(0, 7) !== calMonth) calMonth = calSelected.slice(0, 7);
        render();
        const det = $('detailsCard');
        if (det && det.scrollIntoView) det.scrollIntoView({ block: 'start', behavior: motionAllowed() ? 'smooth' : 'auto' });
        return;
      }
      case 'pattern-new': {
        openPatternForm();
        render();
        const pc = $('patternCard');
        if (pc && pc.scrollIntoView) pc.scrollIntoView({ block: 'start', behavior: motionAllowed() ? 'smooth' : 'auto' });
        return;
      }
      case 'pattern-cancel':
        calForm = null;
        break;
      case 'pattern-save':
        if (!savePattern()) return;
        break;
      case 'seg-add':
        if (calForm && calForm.segments.length < 12) calForm.segments.push({ type: 'off', count: 1 });
        break;
      case 'seg-remove':
        if (calForm && calForm.segments.length > 1) calForm.segments.splice(+btn.dataset.i, 1);
        break;
      case 'pattern-remove': {
        const v = state.rota.patterns.find(x => x.id === btn.dataset.id);
        if (!v || !confirm(`Remove the pattern change starting ${shortDate(v.effectiveFrom)}?`)) return;
        state.rota.patterns = state.rota.patterns.filter(x => x !== v);
        persist();
        onContextChanged();
        break;
      }
      case 'entry-new': {
        const d = calSelected, p = plannedFor(d), ot = btn.dataset.kind === 'overtime';
        const base = p && p.works ? (ot ? p.endDt : p.startDt) : d + 'T09:00';
        calForm = { kind: 'entry', type: ot ? 'overtime' : 'unauthorised', date: d, start: base, end: minToDt(dtToMin(base, d) + 120, d) };
        break;
      }
      case 'entry-cancel':
        calForm = null;
        break;
      case 'entry-save':
        if (!saveEntry()) return;
        break;
      case 'entry-del': {
        const e = state.rota.entries.find(x => x.id === btn.dataset.id);
        if (!e || !confirm(`Remove this ${STATUS_LABEL[e.kind].toLowerCase()}?`)) return;
        state.rota.entries = state.rota.entries.filter(x => x !== e);
        persist();
        onContextChanged();
        break;
      }
      case 'cal-appt': {
        const d = btn.dataset.date;
        commitForm = { key: uid(), id: null, kind: 'appointment', title: '', start: d + 'T09:00', end: d + 'T10:00' };
        render();
        if ($('cfTitle')) $('cfTitle').focus();
        return;
      }
      case 'cal-reset-date':
        if (!confirm('Clear the changes for this date? Overtime, absences and appointments stay.')) return;
        delete state.rota.overrides[calSelected];
        persist();
        onContextChanged();
        break;
      case 'colours-reset':
        state.rota.colours = Object.assign({}, DEFAULT_COLOURS);
        persist();
        break;
      case 'bh-refresh':
        fetchBankHolidays(true);
        return;
      case 'pay-prev': payOffset--; break;
      case 'pay-next': payOffset++; break;
      case 'pay-now': payOffset = 0; break;
      case 'theme': {
        state.settings.theme = THEMES[(THEMES.indexOf(state.settings.theme) + 1) % THEMES.length];
        persist();
        if (motionAllowed() && document.startViewTransition) document.startViewTransition(applyTheme); // soft cross-fade
        else applyTheme();
        toast(`Theme: ${THEME_LABEL[state.settings.theme]}`);
        return;
      }
      case 'motion':
        state.settings.motion = state.settings.motion === 'off' ? 'auto' : 'off';
        persist();
        applyTheme();
        toast(state.settings.motion === 'off' ? 'Animations off.' : deviceReducesMotion() ? 'Animations on — but your device asks for less motion, so they stay off.' : 'Animations on.');
        break;
      case 'timer-start':
      case 'timer-focus': {
        const t = findTask(k, btn.dataset.uid);
        if (!t || t.done) return;
        const switching = state.timer && state.timer.uid !== t.uid;
        startTimer(t.uid, a === 'timer-start' ? 'start' : 'focus', a === 'timer-start' ? 2 : t.minutes);
        if (switching) toast('Switched the timer to this task.');
        render();
        const card = $('timerCard');
        if (card && card.scrollIntoView) card.scrollIntoView({ block: 'start', behavior: motionAllowed() ? 'smooth' : 'auto' });
        return;
      }
      case 'timer-pause': {
        const t = state.timer;
        if (t && t.startedAt && !t.finished) { t.accumulatedMs += Date.now() - t.startedAt; t.startedAt = null; persist(); }
        refresh();
        return;
      }
      case 'timer-resume': {
        const t = state.timer;
        if (t && !t.startedAt && !t.finished) { t.startedAt = Date.now(); persist(); }
        refresh();
        return;
      }
      case 'timer-plus5': {
        const t = state.timer;
        if (!t) return;
        t.accumulatedMs = Math.min(t.accumulatedMs, t.durationSec * 1000);
        t.durationSec += 300;
        t.finished = false;
        t.startedAt = Date.now();
        persist();
        ensureTicking();
        refresh();
        return;
      }
      case 'timer-keep': {
        const t = state.timer, task = timerTask();
        if (!t || !task) return;
        Object.assign(t, { kind: 'focus', durationSec: Math.max(5, task.minutes - 2) * 60, accumulatedMs: 0, startedAt: Date.now(), finished: false });
        persist();
        ensureTicking();
        refresh();
        return;
      }
      case 'timer-done': {
        const task = timerTask();
        if (task && !task.done) { markDone(state.timer.dayKey, task, true); return; }
        state.timer = null;
        persist();
        ensureTicking();
        break;
      }
      case 'timer-stop':
        state.timer = null;
        persist();
        ensureTicking();
        toast("Timer stopped — that's completely fine.");
        break;
      case 'build': {
        if (state.days[k]) break;
        const energy = Number(($('energy') || {}).value) || contextFor(k).energy || 3;
        ensureContext(k).energy = energy;
        persist();
        proposal = proposeBuild(k, energy);
        render();
        scrollToProposal();
        return;
      }
      case 'review':
        if (!state.days[k] || state.days[k].rest) break;
        proposal = proposeReview(k);
        render();
        scrollToProposal();
        return;
      case 'prop-apply':
        applyProposal();
        break;
      case 'prop-cancel':
        proposal = null;
        break;
      case 'prop-edit':
        if (proposal) proposal.editing = true;
        refresh();
        return;
      case 'prop-done-edit':
        if (proposal) proposal.editing = false;
        refresh();
        return;
      case 'prop-refresh':
        proposal = proposal && proposal.mode === 'review'
          ? (state.days[k] && !state.days[k].rest ? proposeReview(k) : null)
          : (state.days[k] ? null : proposeBuild(k, contextFor(k).energy || 3));
        refresh();
        return;
      case 'prop-resuggest':
        if (!proposal) return;
        proposal.items.forEach(it => { if (!it.done && it.status === 'today') { it.start = null; it.anytime = false; } });
        placeItems(proposal);
        proposal.touched = true;
        refresh();
        return;
      case 'prop-shorten': {
        const it = propItem(btn.dataset.uid);
        if (!it || !it.maxFit) return;
        it.minutes = it.maxFit;
        it.start = null;
        placeItems(proposal);
        proposal.touched = true;
        refresh();
        return;
      }
      case 'prop-later': {
        const it = propItem(btn.dataset.uid);
        if (!it) return;
        it.status = 'later';
        it.start = null;
        it.anytime = false;
        proposal.touched = true;
        refresh();
        return;
      }
      case 'prop-keep': {
        const it = propItem(btn.dataset.uid);
        if (!it) return;
        it.status = 'today';
        it.note = null;
        it.start = null;
        placeItems(proposal);
        proposal.touched = true;
        refresh();
        return;
      }
      case 'prop-anytime': {
        const it = propItem(btn.dataset.uid);
        if (!it) return;
        it.start = null;
        it.anytime = true;
        it.reason = null;
        proposal.touched = true;
        refresh();
        return;
      }
      case 'commit-new': {
        const kind = btn.dataset.kind === 'work' ? 'work' : 'appointment';
        commitForm = Object.assign({ key: uid(), id: null, kind, title: kind === 'work' ? 'Work shift' : '' }, defaultCommitTimes(kind));
        render();
        if ($('cfTitle')) $('cfTitle').focus();
        return;
      }
      case 'commit-edit': {
        const c = state.commitments.find(x => x.id === btn.dataset.id);
        if (!c) return;
        commitForm = { key: uid(), id: c.id, kind: c.kind, title: c.title, start: c.start, end: c.end };
        render();
        return;
      }
      case 'commit-save':
        if (!saveCommitment()) return;
        onContextChanged();
        toast('Saved.');
        break;
      case 'commit-cancel':
        commitForm = null;
        break;
      case 'commit-del': {
        const c = state.commitments.find(x => x.id === btn.dataset.id);
        if (!c || !confirm(`Remove "${c.title}"?`)) return;
        state.commitments = state.commitments.filter(x => x !== c);
        persist();
        onContextChanged();
        break;
      }
      case 'skip':
        if (!state.days[k]) { proposal = null; makeRestDay(k, null); toast('Rest day it is. Your learning count is untouched.'); }
        break;
      case 'swap-rest': {
        const d = state.days[k];
        if (!d || d.tasks.some(t => t.done)) return;
        proposal = null;
        makeRestDay(k, d.energy);
        toast('Rest day it is. Anything carried over is back in your queue.');
        break;
      }
      case 'restart': {
        const d = state.days[k];
        if (!d) break;
        const msg = d.tasks.some(t => t.done)
          ? "Start today over? Today's plan and its ticks will be cleared so you can choose your energy again."
          : "Start today over? Today's plan will be cleared so you can choose your energy again.";
        if (!confirm(msg)) return;
        d.tasks.forEach(releaseTask);
        delete state.days[k];
        proposal = null;
        persist();
        break;
      }
      case 'evening':
        view = 'evening'; eveningKey = k;
        break;
      case 'evening-yesterday':
        view = 'evening'; eveningKey = shift(k, -1);
        break;
      case 'finish-evening': {
        const d = state.days[eveningKey];
        if (d) { d.checkedIn = true; persist(); }
        view = 'auto'; eveningKey = null;
        toast('All saved. See you tomorrow.');
        break;
      }
      case 'roll': {
        const t = findTask(btn.dataset.day, btn.dataset.uid);
        if (t) toggleRoll(btn.dataset.day, t);
        break;
      }
      case 'shrink':
        acceptShrink();
        break;
      case 'swap-learning':
        swapInLearning(btn.dataset.uid);
        break;
      case 'add-learning':
        swapInLearning(null);
        break;
      case 'dismiss-nudge':
        nudgeVisible = false;
        break;
      case 'edit':
        view = 'edit';
        window.scrollTo(0, 0);
        break;
      case 'back':
        view = 'auto';
        break;
      case 'add': {
        const cat = btn.dataset.cat;
        state.lists[cat].push({ id: cat[0] + uid(), title: 'New task', minutes: 20 });
        persist();
        render();
        const inputs = document.querySelectorAll(`.edit-row[data-cat="${cat}"] input.t`);
        const last = inputs[inputs.length - 1];
        if (last) { last.focus(); last.select(); }
        return;
      }
      case 'up':
      case 'down':
      case 'del': {
        const row = btn.closest('.edit-row');
        const list = state.lists[row.dataset.cat];
        const i = list.findIndex(t => t.id === row.dataset.id);
        if (i < 0) return;
        if (a === 'del') {
          if (!confirm(`Remove "${list[i].title}"? Past days keep their history.`)) return;
          list.splice(i, 1);
        } else {
          const j = a === 'up' ? i - 1 : i + 1;
          if (j < 0 || j >= list.length) return;
          [list[i], list[j]] = [list[j], list[i]];
        }
        persist();
        break;
      }
      case 'unqueue':
        state.queue = state.queue.filter(q => q.qid !== btn.dataset.qid);
        persist();
        break;
      case 'reset-lists':
        if (!confirm('Reset all three lists to the starter tasks? Your history and queue stay as they are.')) return;
        state.lists = clone(SEED);
        persist();
        toast('Lists reset.');
        break;
      case 'export':
        exportData();
        return;
      case 'import':
        $('importFile').click();
        return;
      case 'download-damaged':
        download(`myday-unreadable-${todayKey()}.json`, damagedRaw || '');
        return;
      case 'start-fresh':
        if (!confirm('Start fresh? The unreadable saved data will be replaced. Download it first if you might want it later.')) return;
        if (damagedKey && damagedKey !== STORAGE_KEY) removeKey(damagedKey);
        saveBlocked = false;
        damagedRaw = null;
        state = freshState();
        persist();
        checkNudge();
        break;
    }
    render();
  });

  // Keep the date honest: re-check when the app comes back into view and every 30 seconds (covers midnight).
  function onClock() {
    if (todayKey() !== renderedDay) { checkNudge(); render(); }
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') { checkNudge(); render(); tickTimer(); }
  });
  setInterval(onClock, 30000);
  setInterval(healthTick, 1000);
  setInterval(studyTick, 1000);
  document.addEventListener('pointerover', chartTip);
  document.addEventListener('focusin', chartTip);
  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter' || !e.target) return;
    if (e.target.id === 'foodQ') { e.preventDefault(); healthAction('h-food-search', e.target); }
    if (e.target.id === 'shopAdd') { e.preventDefault(); healthAction('h-shop-add', e.target); }
    if (e.target.id === 'ciNew') { e.preventDefault(); studyAction('s-ci-add', e.target); }
    if (e.target.id === 'tkConcept') { e.preventDefault(); studyAction('s-task-concept', document.querySelector('[data-action=s-task-concept]')); }
  });
  // Opening your notes during a revision question is recorded as "Checked notes".
  document.addEventListener('click', e => {
    if (revRound && e.target.closest && e.target.closest('a[data-rev-notes]')) { revRound.support = 'notes'; }
  });
  // Search suggestions: arrow keys move through them, Escape closes them.
  document.addEventListener('keydown', e => {
    if (!typeahead.open || !e.target || !e.target.closest || !e.target.closest('.food-search')) return;
    const items = [...document.querySelectorAll('#foodSuggest .ta-item')], i = items.indexOf(e.target);
    if (e.key === 'Escape') { e.preventDefault(); closeTypeahead(); $('foodQ').focus(); }
    else if (e.key === 'ArrowDown' && items.length) { e.preventDefault(); items[Math.min(i + 1, items.length - 1)].focus(); }
    else if (e.key === 'ArrowUp' && i >= 0) { e.preventDefault(); (i === 0 ? $('foodQ') : items[i - 1]).focus(); }
  });
  window.addEventListener('hashchange', () => {
    const next = sectionFromHash();
    if (next !== section) { section = next; view = 'auto'; eveningKey = null; commitForm = null; calForm = null; }
    shopEdit = null; wsMoveFor = null;
    closeTypeahead();
    render();
    window.scrollTo(0, 0);
    if (section === 'calendar' || section === 'pay') maybeFetchBankHolidays();
  });
  if (reduceQuery && reduceQuery.addEventListener) reduceQuery.addEventListener('change', () => renderFooter());

  boot();
  ensureTicking();
  checkNudge();
  render();
  if (section === 'calendar' || section === 'pay') maybeFetchBankHolidays();
  if (bootNotice) toast(bootNotice);
})();
</script>
</body>
</html>
