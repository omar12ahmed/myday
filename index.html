  // "200 g pasta" → { measure: '200 g', name: 'pasta' }; anything without a leading number stays as the name.
  function parseIngredientLine(line) {
    const t = line.trim();
    const m = t.match(NUM_RE);
    if (!m) return { measure: '', name: t };
    let rest = t.slice(m[0].length).trim(), measure = m[0].trim();
    const um = rest.match(/^([A-Za-z]+)\.?(?=\s)/);
    if (um && UNIT_ALIASES[um[1].toLowerCase()]) { measure += ' ' + um[1]; rest = rest.slice(um[0].length).trim(); }
    rest = rest.replace(/^of\s+/i, '');
    return rest ? { measure, name: rest } : { measure: '', name: t };
  }
  function saveRecipeForm(id) {
    const v = x => ($(x) ? $(x).value : '');
    const title = v('rfTitle').trim();
    if (!title) { setHTML('rfError', 'Please give the recipe a name.'); return null; }
    const num = (x, lo, hi) => optNum(v(x), lo, hi);
    const nut = { kcal: num('rfKcal', 0, 10000), protein: num('rfPro', 0, 1000), carbs: num('rfCarb', 0, 1000), fat: num('rfFat', 0, 1000) };
    const hasNut = Object.values(nut).some(x => x !== null);
    const rec = cleanRecipe({
      id: id || 'r' + uid(), source: 'manual', title,
      servings: num('rfServ', 1, 100), servingsSource: num('rfServ', 1, 100) ? 'recipe' : null,
      prepMin: num('rfPrep', 0, 1440), cookMin: num('rfCook', 0, 1440), effort: v('rfEffort') || null, batch: $('rfBatch') ? $('rfBatch').checked : false,
      ingredients: v('rfIng').split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(parseIngredientLine),
      instructions: v('rfMethod'), sourceName: v('rfSrc'), sourceUrl: safeUrl(v('rfUrl').trim()),
      nutrition: hasNut ? nut : null, nutritionSource: hasNut ? 'user' : null, savedAt: localStamp()
    });
    F().recipes[rec.id] = rec;
    persist();
    return rec;
  }

  // ---------- Timers that tick every second (rest + cooking) ----------
  function healthTick() {
    if (!state || !state.health) return;
    const w = W();
    if (w.rest) {
      if (restRemaining() <= 0) {
        w.rest = null; restDone = true; persist();
        try { if (navigator.vibrate) navigator.vibrate(120); } catch (e) { /* not supported */ }
        setHTML('restBar', restBarHtml());
      } else if ($('restTime')) $('restTime').textContent = fmtClock(restRemaining());
    }
    const c = F().cooking, t = c && c.timer;
    if (t && t.startedAt) {
      const rem = t.durationSec * 1000 - (t.accumulatedMs + Date.now() - t.startedAt);
      if (rem <= 0) {
        c.timer = null; cookTimerDone = true; persist();
        try { if (navigator.vibrate) navigator.vibrate(120); } catch (e) { /* not supported */ }
        setHTML('cookTimer', cookTimerHtml());
      } else if ($('cookTime')) $('cookTime').textContent = fmtClock(rem);
    }
  }

  // ======================================================================
  // Health: actions and inputs (all saved automatically)
  // ======================================================================
  function newItem(ex) {
    const base = { id: 'ti' + uid(), exerciseId: ex.id, sets: 3, restSec: 90, reps: null, weight: null, loadMode: 'none', load: null, durationMin: null, distanceKm: null };
    if (ex.type === 'cardio') return Object.assign(base, { sets: 1, durationMin: 20 });
    return Object.assign(base, { reps: 10 });
  }
  const ctxSession = () => (route()[2] === 'log' ? sessionById(route()[3]) : activeSession());

  // Returns 'none' when it has already navigated or re-rendered.
  function healthAction(a, btn) {
    const w = W(), f = F(), k = todayKey(), d = btn.dataset;
    switch (a) {
      // ----- Workout templates and exercises -----
      case 'h-tpl-new': {
        const t = { id: 't' + uid(), name: 'New workout', minutes: 45, archived: false, items: [] };
        w.templates.push(t); persist();
        go('health/workout/template/' + t.id);
        setTimeout(() => { if ($('tplName')) { $('tplName').focus(); $('tplName').select(); } }, 50);
        return 'none';
      }
      case 'h-tpl-archive': {
        const t = tplById(d.tpl);
        if (!t) return;
        t.archived = !t.archived; persist();
        toast(t.archived ? 'Archived — its history is kept.' : 'Restored.');
        if (t.archived) { go('health/workout'); return 'none'; }
        return;
      }
      case 'h-item-add': {
        const t = tplById(d.tpl), ex = $('tplAddEx') && exById($('tplAddEx').value);
        if (t && ex) { t.items.push(newItem(ex)); persist(); }
        return;
      }
      case 'h-ex-create': {
        const name = ($('newExName') ? $('newExName').value : '').trim(), type = $('newExType') ? $('newExType').value : 'strength';
        if (!name) { setHTML('newExError', 'Please give the exercise a name.'); return 'none'; }
        if (w.exercises.some(e => e.name.toLowerCase() === name.toLowerCase())) { setHTML('newExError', 'You already have an exercise with that name — pick it from the list above.'); return 'none'; }
        const ex = { id: 'x' + uid(), name: name.slice(0, 80), type: EX_TYPES.includes(type) ? type : 'strength', archived: false };
        w.exercises.push(ex);
        const t = tplById(d.tpl);
        if (t) t.items.push(newItem(ex));
        persist();
        return;
      }
      case 'h-ex-common': {
        let ex = w.exercises.find(e => e.name.toLowerCase() === String(d.name).toLowerCase());
        if (!ex) { ex = { id: 'x' + uid(), name: d.name, type: EX_TYPES.includes(d.type) ? d.type : 'bodyweight', archived: false }; w.exercises.push(ex); }
        const t = tplById(d.tpl);
        if (t) t.items.push(newItem(ex));
        persist();
        return;
      }
      case 'h-item-move': {
        const t = tplById(d.tpl), i = t ? t.items.findIndex(x => x.id === d.item) : -1, j = i + Number(d.dir);
        if (i < 0 || j < 0 || j >= t.items.length) return 'none';
        [t.items[i], t.items[j]] = [t.items[j], t.items[i]]; persist();
        return;
      }
      case 'h-item-remove': { const t = tplById(d.tpl); if (t) { t.items = t.items.filter(x => x.id !== d.item); persist(); } return; }
      case 'h-ex-archive': { const ex = exById(d.id); if (ex) { ex.archived = !ex.archived; persist(); } return; }

      // ----- Logging a workout -----
      case 'h-ws-start': {
        if (!activeSession() && !startSession(d.tpl, d.planned || null)) return;
        go('health/workout/session');
        return 'none';
      }
      case 'h-set-done': {
        const s = ctxSession(), e = s && s.exercises.find(x => x.key === d.ex), x = e && e.sets[+d.set];
        if (!x) return 'none';
        x.done = !x.done;
        if (s.status !== 'active') s.editedAt = localStamp();
        else if (x.done && w.restTimer.enabled) { w.rest = { startedAt: Date.now(), durationSec: e.plan.restSec || w.restTimer.seconds }; restDone = false; }
        persist();
        return;
      }
      case 'h-set-add': {
        const s = ctxSession(), e = s && s.exercises.find(x => x.key === d.ex);
        if (!e) return 'none';
        e.sets.push(Object.assign(cleanSetValues(e.sets[e.sets.length - 1] || e.plan), { done: false }));
        if (s.status !== 'active') s.editedAt = localStamp();
        persist();
        return;
      }
      case 'h-set-remove': {
        const s = ctxSession(), e = s && s.exercises.find(x => x.key === d.ex), last = e && e.sets[e.sets.length - 1];
        if (!last || (last.done && !confirm('Remove the last set? It was marked done.'))) return 'none';
        e.sets.pop();
        if (s.status !== 'active') s.editedAt = localStamp();
        persist();
        return;
      }
      case 'h-prefill': {
        const s = activeSession(), e = s && s.exercises.find(x => x.key === d.ex);
        if (!e) return 'none';
        const last = d.from === 'last' ? lastResultFor(e.exerciseId, s.id) : null, lastDone = last ? last.ex.sets.filter(x => x.done) : [];
        e.sets.forEach((x, i) => { if (!x.done) Object.assign(x, cleanSetValues(d.from === 'last' && lastDone.length ? lastDone[Math.min(i, lastDone.length - 1)] : e.plan)); });
        e.prefill = d.from === 'last' && lastDone.length ? 'last' : 'plan';
        persist();
        return;
      }
      case 'h-rest-skip': w.rest = null; restDone = false; persist(); return;
      case 'h-ws-finish': {
        const s = activeSession();
        if (!s) return;
        const done = setsDone(s), total = setsTotal(s);
        if (done < total && !confirm(`Finish now? You've done ${done} of ${total} sets — a shorter session still counts.`)) return 'none';
        toast(finishSession(s) === 'done' ? 'Workout saved — nice work.' : 'Shorter session saved — every bit counts.');
        go('health/workout');
        return 'none';
      }
      case 'h-ws-discard': {
        const s = activeSession();
        if (!s || setsDone(s) > 0 || !confirm('Cancel this workout? Nothing has been logged yet.')) return 'none';
        w.sessions = w.sessions.filter(x => x !== s); w.activeId = null; w.rest = null; persist();
        go('health/workout');
        return 'none';
      }
      case 'h-ws-delete': {
        const s = sessionById(d.id);
        if (!s || !confirm("Delete this workout from your history? This can't be undone.")) return 'none';
        w.sessions = w.sessions.filter(x => x !== s); persist();
        go('health/workout/history');
        return 'none';
      }

      // ----- Missed sessions: Move, Skip or Continue (no backlog) -----
      case 'h-missed-move': wsMoveFor = (missedSession() || {}).date || null; return;
      case 'h-missed-move-cancel': wsMoveFor = null; return;
      case 'h-missed-move-save': {
        const m = missedSession(), nd = $('wsMoveDate') ? $('wsMoveDate').value : '';
        if (!m || !isDateKey(nd) || nd < k) { toast('Please choose today or a later date.'); return 'none'; }
        w.planned[m.date] = { templateId: m.templateId, time: null, status: 'moved', source: 'manual' };
        w.planned[nd] = { templateId: m.templateId, time: null, status: 'planned', source: 'manual' };
        wsMoveFor = null; persist();
        toast(`Moved to ${shortDate(nd)}.`);
        return;
      }
      case 'h-missed-skip': {
        const m = missedSession();
        if (!m) return;
        w.planned[m.date] = { templateId: m.templateId, time: null, status: 'skipped', source: 'manual' };
        persist(); toast('Skipped — no catching up needed.');
        return;
      }
      case 'h-missed-continue': {
        const m = missedSession();
        if (!m) return;
        w.planned[m.date] = { templateId: m.templateId, time: null, status: 'continued', source: 'manual' };
        advanceSequence(m.templateId);
        persist(); toast('Carrying on with the next session.');
        return;
      }

      // ----- Schedule -----
      case 'h-propose': wsProposal = { items: proposeSessions() }; return;
      case 'h-prop-apply': {
        if (!wsProposal) return;
        const n = wsProposal.items.filter(p => p.pick && p.kind !== 'nofit').length;
        applyWorkoutProposal();
        toast(`Added ${n} session${n === 1 ? '' : 's'} to your plan.`);
        return;
      }
      case 'h-prop-cancel': wsProposal = null; return;
      case 'h-seq-add': { const id = $('seqAdd') && $('seqAdd').value; if (tplById(id)) { w.schedule.sequence.push(id); persist(); } return; }
      case 'h-seq-remove': {
        const i = +d.i, s = w.schedule;
        s.sequence.splice(i, 1);
        if (s.next >= s.sequence.length) s.next = 0; else if (i < s.next) s.next--;
        persist();
        return;
      }
      case 'h-seq-next': w.schedule.next = +d.i; persist(); return;
      case 'h-plan-remove': delete w.planned[d.date]; persist(); return;
      case 'h-plan-add': {
        const dt = $('planDate') ? $('planDate').value : '', tm = ($('planTime') ? $('planTime').value : '').slice(0, 5), tpl = $('planTpl') ? $('planTpl').value : '';
        if (!isDateKey(dt) || !tplById(tpl)) return 'none';
        w.planned[dt] = { templateId: tpl, time: isTime(tm) ? tm : null, status: 'planned', source: 'manual' };
        persist(); toast(`Planned for ${shortDate(dt)}.`);
        return;
      }

      // ----- Food: discovery and recipes -----
      case 'h-food-search': {
        const q = ($('foodQ') ? $('foodQ').value : '').trim();
        if (!q) return 'none';
        closeTypeahead();
        typeahead.text = q;
        go('health/food/search');
        runSearch(q);
        return 'none';
      }
      case 'h-suggest-more': foodSuggest.shown += 3; loadSuggestions(); return 'none';
      case 'h-suggest-retry': foodSuggest.error = null; loadSuggestions(); return 'none';
      case 'h-recipe-retry': Object.assign(recipeLoad, { id: null, error: null }); loadRecipe(d.id); return 'none';
      case 'h-fav': {
        const r = getRecipe(d.id);
        if (!r) return;
        if (f.favourites.includes(r.id)) { f.favourites = f.favourites.filter(x => x !== r.id); tidyRecipe(r.id); toast('Removed from favourites.'); }
        else { keepRecipe(r); f.favourites.push(r.id); toast('Saved to favourites.'); }
        persist();
        return;
      }
      case 'h-serv': {
        const r = getRecipe(d.id);
        if (r && r.servings) recipeServings[r.id] = Math.max(1, Math.min(100, (recipeServings[r.id] || r.servings) + Number(d.d)));
        return;
      }
      case 'h-serv-base': {
        const r = getRecipe(d.id), n = optNum($('servBase') ? $('servBase').value : '', 1, 100);
        if (!r || !n) { toast('Please enter how many it serves.'); return 'none'; }
        const kept = keepRecipe(r); kept.servings = Math.round(n); kept.servingsSource = 'user'; persist();
        toast('Saved as your own entry.');
        return;
      }
      case 'h-nutr-save': {
        const r = getRecipe(d.id), v = id => optNum($(id) ? $(id).value : '', 0, 10000);
        const nut = { kcal: v('nKcal'), protein: v('nPro'), carbs: v('nCarb'), fat: v('nFat') };
        if (!r || !Object.values(nut).some(x => x !== null)) { toast('Enter at least one figure.'); return 'none'; }
        const kept = keepRecipe(r); kept.nutrition = nut; kept.nutritionSource = 'user'; persist();
        toast('Saved — shown as your own figures.');
        return;
      }
      case 'h-nutr-clear': { const r = f.recipes[d.id]; if (r) { r.nutrition = null; r.nutritionSource = null; tidyRecipe(r.id); persist(); } return; }
      case 'h-recipe-save': {
        const rec = saveRecipeForm(d.id || null);
        if (!rec) return 'none';
        toast('Recipe saved.');
        go('health/food/recipe/' + encodeURIComponent(rec.id));
        return 'none';
      }
      case 'h-recipe-delete': {
        const r = f.recipes[d.id];
        if (!r || !confirm(`Delete "${r.title}"? Your cooking history keeps its name.`)) return 'none';
        delete f.recipes[d.id];
        f.favourites = f.favourites.filter(x => x !== d.id);
        f.want = f.want.filter(x => x.recipeId !== d.id);
        if (f.cooking && f.cooking.recipeId === d.id) f.cooking = null;
        persist();
        go('health/food');
        return 'none';
      }

      // ----- Want to cook → shopping list -----
      case 'h-want-serv': if (wantDraft && wantDraft.servings) wantDraft.servings = Math.max(1, Math.min(100, wantDraft.servings + Number(d.d))); return;
      case 'h-want-add': {
        const r = wantDraft && getRecipe(wantDraft.recipeId);
        if (!r) return;
        keepRecipe(r);
        const factor = r.servings && wantDraft.servings ? wantDraft.servings / r.servings : 1;
        let n = 0;
        r.ingredients.forEach((ing, i) => { if (!wantDraft.have.includes(i)) { addToShopping(shoppingFrom(ing.name, ing.measure, factor, r.title)); n++; } });
        const ex = f.want.find(x => x.recipeId === r.id);
        if (ex) ex.servings = wantDraft.servings; else f.want.push({ id: 'w' + uid(), recipeId: r.id, servings: wantDraft.servings, addedOn: k });
        wantDraft = null; persist();
        toast(n ? `Added ${n} item${n === 1 ? '' : 's'} to your shopping list.` : 'Saved to Want to cook.');
        go(n ? 'health/food/shopping' : 'health/food');
        return 'none';
      }
      case 'h-want-remove': {
        const x = f.want.find(y => y.id === d.id);
        f.want = f.want.filter(y => y !== x);
        if (x) tidyRecipe(x.recipeId);
        persist();
        return;
      }
      case 'h-shop-add': {
        const raw = ($('shopAdd') ? $('shopAdd').value : '').trim();
        if (!raw) return 'none';
        const p = parseIngredientLine(raw);
        addToShopping(shoppingFrom(p.name, p.measure, 1, null));
        shopUndo = null; persist(); render();
        if ($('shopAdd')) $('shopAdd').focus();
        return 'none';
      }
      case 'h-shop-remove': {
        const i = f.shopping.findIndex(x => x.id === d.id);
        if (i < 0) return;
        shopUndo = { item: f.shopping[i], index: i };
        f.shopping.splice(i, 1); persist();
        return;
      }
      case 'h-shop-undo': if (shopUndo) { f.shopping.splice(Math.min(shopUndo.index, f.shopping.length), 0, shopUndo.item); shopUndo = null; persist(); } return;
      case 'h-shop-edit': shopEdit = d.id; return;
      case 'h-shop-edit-cancel': shopEdit = null; return;
      case 'h-shop-edit-save': {
        const x = f.shopping.find(y => y.id === d.id);
        if (!x) return;
        const name = ($('seName') ? $('seName').value : '').trim() || x.name, q = ($('seQty') ? $('seQty').value : '').trim();
        const p = shoppingFrom(name, q, 1, null);
        Object.assign(x, { name: name.slice(0, 80), family: p.family, amount: p.amount, unit: p.unit, text: p.text, category: categoryFor(name) });
        shopEdit = null; persist();
        return;
      }
      case 'h-shop-clear': {
        const ticked = f.shopping.filter(x => x.checked).length;
        if (!ticked || !confirm(`Clear ${ticked} ticked item${ticked === 1 ? '' : 's'}?`)) return 'none';
        f.shopping = f.shopping.filter(x => !x.checked); shopUndo = null; persist();
        return;
      }

      // ----- Cooking -----
      case 'h-cook-start': {
        const r = getRecipe(d.id);
        if (!r) return;
        const cur = f.cooking && getRecipe(f.cooking.recipeId);
        if (cur && cur.id !== r.id && !confirm(`Stop cooking ${cur.title} and start this instead?`)) return 'none';
        if (!cur || cur.id !== r.id) {
          const kept = keepRecipe(r), wanted = f.want.find(x => x.recipeId === kept.id);
          f.cooking = { recipeId: kept.id, step: 0, servings: kept.servings ? recipeServings[kept.id] || (wanted && wanted.servings) || kept.servings : null, startedAt: localStamp(), timer: null };
          cookTimerDone = false; persist();
        }
        go('health/food/cook');
        return 'none';
      }
      case 'h-cook-step': {
        const c = f.cooking, r = c && getRecipe(c.recipeId);
        if (!r) return;
        c.step = Math.max(0, Math.min(recipeSteps(r.instructions).length - 1, c.step + Number(d.d)));
        cookTimerDone = false; persist();
        return;
      }
      case 'h-cook-finish': {
        const c = f.cooking, r = c && getRecipe(c.recipeId);
        if (!r) return;
        f.cooked.push({ id: 'c' + uid(), recipeId: r.id, title: r.title, date: k, servings: c.servings });
        f.cooking = null;
        f.want = f.want.filter(x => x.recipeId !== r.id);
        cookTimerDone = false; persist();
        toast('Cooked — saved to your cooking history.');
        go('health/food');
        return 'none';
      }
      case 'h-cook-stop': {
        if (!confirm("Stop cooking? Your place in the recipe won't be kept.")) return 'none';
        const id = f.cooking && f.cooking.recipeId;
        f.cooking = null;
        if (id) tidyRecipe(id);
        persist();
        go('health/food');
        return 'none';
      }
      case 'h-ctimer': if (f.cooking) { f.cooking.timer = { label: String(d.label).slice(0, 40), durationSec: +d.sec, startedAt: Date.now(), accumulatedMs: 0, finished: false }; cookTimerDone = false; persist(); } return;
      case 'h-ctimer-pause': { const t = f.cooking && f.cooking.timer; if (t && t.startedAt) { t.accumulatedMs += Date.now() - t.startedAt; t.startedAt = null; persist(); } return; }
      case 'h-ctimer-resume': { const t = f.cooking && f.cooking.timer; if (t && !t.startedAt) { t.startedAt = Date.now(); persist(); } return; }
      case 'h-ctimer-stop': if (f.cooking) { f.cooking.timer = null; persist(); } return;
    }
  }

  function healthInput(el, type) {
    if (el.type === 'checkbox' && type !== 'change') return;
    const w = W(), f = F(), d = el.dataset, key = d.h;
    if (key === 'set') {
      const s = ctxSession(), e = s && s.exercises.find(x => x.key === d.ex), x = e && e.sets[+d.set];
      if (!x) return;
      if (d.field === 'loadMode') {
        if (type !== 'change') return;
        x.loadMode = LOAD_MODES.includes(el.value) ? el.value : 'none';
        if (x.loadMode === 'none') x.load = null;
      } else x[d.field] = optNum(el.value, 0, d.field === 'durationMin' ? 1440 : 1000);
      if (s.status !== 'active') s.editedAt = localStamp();
      persist();
      if (d.field === 'loadMode') render();
      return;
    }
    if (key === 'rest-enabled') { w.restTimer.enabled = el.checked; if (!el.checked) w.rest = null; persist(); render(); return; }
    if (key === 'tpl-name') { const t = tplById(d.tpl); if (t && el.value.trim()) { t.name = el.value.trim().slice(0, 80); persist(); } return; }
    if (key === 'tpl-minutes') { if (type !== 'change') return; const t = tplById(d.tpl); if (t) { t.minutes = intIn(el.value, 5, 300, t.minutes); el.value = t.minutes; persist(); } return; }
    if (key === 'tpl-item') {

      if (!it || type !== 'change') return;
      if (d.field === 'loadMode') { it.loadMode = LOAD_MODES.includes(el.value) ? el.value : 'none'; if (it.loadMode === 'none') it.load = null; persist(); render(); return; }
      if (d.field === 'sets') it.sets = intIn(el.value, 1, 20, it.sets);
      else if (d.field === 'restSec') it.restSec = intIn(el.value, 0, 900, it.restSec);

    }

    if (key === 'sch-mode') {

      if (w.schedule.mode === 'weekdays') w.schedule.since = todayKey(); // never treat earlier days as missed
      wsProposal = null; persist(); render();
      return;
    }
    if (key === 'sch-weekday') { if (type !== 'change') return; if (tplById(el.value)) w.schedule.weekdays[d.dow] = el.value; else delete w.schedule.weekdays[d.dow]; persist(); render(); return; }
    if (key === 'sch-rest') { if (type !== 'change') return; w.schedule.restDays = intIn(el.value, 0, 6, 1); persist(); return; }
    if (key === 'prop-pick') { if (wsProposal && wsProposal.items[+d.i]) wsProposal.items[+d.i].pick = el.checked; render(); return; }
    if (key === 'pref-ex') {
      const set = new Set(f.prefs.exclude);
      if (el.checked) set.add(d.key); else set.delete(d.key);
      f.prefs.exclude = Object.keys(EXCLUSIONS).filter(x => set.has(x));
      persist(); resetSuggestions();
      return;
    }
    if (key === 'pref-dislikes') { if (type !== 'change') return; f.prefs.dislikes = el.value.split(',').map(x => x.trim().toLowerCase()).filter(Boolean).slice(0, 30); persist(); resetSuggestions(); return; }
    if (key === 'pref-max') { if (type !== 'change') return; f.prefs.maxMinutes = optNum(el.value, 5, 600); persist(); resetSuggestions(); return; }
    if (key === 'pref-batch') { f.prefs.batchOnly = el.checked; persist(); resetSuggestions(); return; }
    if (key === 'want-have' && wantDraft) { const i = +d.i; wantDraft.have = el.checked ? [...new Set(wantDraft.have.concat(i))] : wantDraft.have.filter(x => x !== i); render(); return; }
