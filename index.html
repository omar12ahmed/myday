    const hasRota = state.rota.patterns.length > 0;
    const head = `
      <section class="card">
        <div class="cal-head">
          <button class="icon-btn" data-action="cal-prev" aria-label="Previous ${calView === 'month' ? 'month' : 'four weeks'}">‹</button>
          <h2 class="cal-title">${calView === 'month' ? monthLabel(calMonth) : esc(shortDate(agendaStart || k)) + ' – ' + esc(shortDate(shift(agendaStart || k, 27)))}</h2>
          <button class="icon-btn" data-action="cal-next" aria-label="Next ${calView === 'month' ? 'month' : 'four weeks'}">›</button>
        </div>
        <div class="seg" role="group" aria-label="Calendar view">
          <button class="${calView === 'month' ? 'on' : ''}" data-action="cal-view" data-v="month" aria-pressed="${calView === 'month'}">Month</button>
          <button class="${calView === 'agenda' ? 'on' : ''}" data-action="cal-view" data-v="agenda" aria-pressed="${calView === 'agenda'}">Agenda</button>
          <button data-action="cal-today">Today</button>
        </div>
        ${hasRota ? '' : '<p class="small muted" style="margin:12px 0 0">No shift pattern yet — set one up below to fill the calendar.</p>'}
      </section>`;
    const setup = !hasRota && !calForm ? `
      <section class="card">
        <h2>Set up your shift pattern</h2>
        <p class="small muted">Tell MyDay how your rota repeats. You can change it later from any date without rewriting the past.</p>
        <button class="primary" data-action="pattern-new">Set up my pattern</button>
      </section>` : '';
    const form = calForm && calForm.kind === 'pattern' ? `<section class="card" id="patternCard">${patternFormHtml()}</section>` : '';
    const body = calView === 'month' ? monthGridHtml() + `<div id="calDetails">${detailsCard(calSelected)}</div>` : agendaHtml();
    return head + form + setup + body;
  }

  function cellMarks(d) {
    const marks = [];
    const ents = entriesOn(d);
    if (ents.some(e => e.kind === 'overtime')) marks.push(chip('overtime', '+OT', 'mini'));
    const ua = absenceOn(d);
    if (ua.any && !ua.whole) marks.push(chip('unauthorised', 'UA', 'mini'));
    const appts = state.commitments.filter(c => c.start.slice(0, 10) <= d && c.end.slice(0, 10) >= d && c.end > d + 'T00:00').length;
    if (appts) marks.push(chip('appointment', String(appts), 'mini'));
    if (overlapsOn(d).length) marks.push('<span class="mark-warn" title="Overlapping entries">!</span>');
    return marks.join('');
  }
  function describeDay(d) {
    const s = displayStatus(d), bh = bankHolidayOn(d), parts = [longDate(d)];
    if (s.key) parts.push(s.label + (s.p && s.p.works && s.key !== 'off' && s.key === s.p.type ? ` ${s.p.start}–${s.p.end}` : ''));
    if (s.a && !s.a.assumed && s.p && s.key !== s.p.type && s.p.type !== 'off') parts.push(`planned ${STATUS_LABEL[s.p.type] || s.p.label}`);
    if (bh) parts.push(`bank holiday: ${bh}`);
    if (entriesOn(d).some(e => e.kind === 'overtime')) parts.push('overtime');
    if (absenceOn(d).any) parts.push('unauthorised absence');
    const o = overlapsOn(d).length;
    if (o) parts.push(`${o} overlap${o === 1 ? '' : 's'}`);
    return parts.join(', ');
  }

  function monthGridHtml() {
    const first = calMonth + '-01', k = todayKey();
    const gridStart = shift(first, -mod(parseKey(first).getDay() - 1, 7)); // Monday
    const names = [];
    for (let i = 0; i < 7; i++) names.push(parseKey(shift(gridStart, i)).toLocaleDateString(undefined, { weekday: 'narrow' }));
    let cells = '';
    for (let i = 0; i < 42; i++) {
      const d = shift(gridStart, i);
      const s = displayStatus(d), bh = bankHolidayOn(d);
      const cls = ['cal-cell', d.slice(0, 7) !== calMonth ? 'out' : '', d === k ? 'today' : '', d === calSelected ? 'sel' : ''].filter(Boolean).join(' ');
      cells += `
        <button class="${cls}" data-action="cal-select" data-date="${d}" aria-label="${esc(describeDay(d))}" ${d === calSelected ? 'aria-pressed="true"' : ''}>
          <span class="cal-num">${+d.slice(8)}${bh ? '<span class="cal-bh" title="' + esc(bh) + '">BH</span>' : ''}</span>
          ${s.key && s.key !== 'off' ? chip(s.key, s.short, 'cell') : s.key === 'off' ? '<span class="cal-off">Off</span>' : ''}
          <span class="cal-marks">${cellMarks(d)}</span>
        </button>`;
    }
    return `
      <section class="card cal-card">
        <div class="cal-grid" role="grid" aria-label="${esc(monthLabel(calMonth))}">
          ${names.map(n => `<div class="cal-dow" aria-hidden="true">${esc(n)}</div>`).join('')}
          ${cells}
        </div>
      </section>`;
  }

  function agendaHtml() {
    const from = agendaStart || todayKey();
    let rows = '';
    for (let i = 0; i < 28; i++) {
      const d = shift(from, i);
      const s = displayStatus(d), bh = bankHolidayOn(d);
      const ents = entriesOn(d), appts = state.commitments.filter(c => c.start.slice(0, 10) === d);
      const ov = overlapsOn(d);
      const bits = [];
      if (s.key) bits.push(chip(s.key, s.label) + (s.p && s.p.works && (s.key === s.p.type || s.key === 'custom') && s.p.start ? ` <span class="ag-time">${s.p.start}–${s.p.end}</span>` : ''));
      if (s.a && !s.a.assumed && s.p && s.p.works && s.key !== s.p.type) bits.push(`<span class="ag-time">planned ${esc(s.p.type === 'custom' ? s.p.label : STATUS_LABEL[s.p.type])} ${s.p.start}–${s.p.end}</span>`);
      for (const e of ents) bits.push(chip(e.kind, STATUS_LABEL[e.kind]) + ` <span class="ag-time">${esc(fmtShiftRange(e.start, e.end, d))}</span>`);
      for (const c of appts) bits.push(chip('appointment', c.title) + ` <span class="ag-time">${esc(fmtShiftRange(c.start, c.end, d))}</span>`);
      rows += `
        <li class="ag-row${d === calSelected ? ' sel' : ''}">
          <button class="ag-btn" data-action="cal-select" data-date="${d}" aria-label="${esc(describeDay(d))}">
            <span class="ag-date"><strong>${esc(parseKey(d).toLocaleDateString(undefined, { weekday: 'short' }))}</strong> ${+d.slice(8)} ${esc(parseKey(d).toLocaleDateString(undefined, { month: 'short' }))}</span>
            <span class="ag-items">${bh ? `<span class="cal-bh">BH</span> <span class="ag-time">${esc(bh)}</span> ` : ''}${bits.join(' ') || '<span class="ag-time">Nothing planned</span>'}${ov.length ? ' <span class="mark-warn">!</span>' : ''}</span>
          </button>
          ${d === calSelected ? `<div class="ag-details">${detailsCard(d, true)}</div>` : ''}
        </li>`;
    }
    return `<section class="card"><ul class="agenda">${rows}</ul></section>`;
  }

  function timeField(id, label, value, attr) {
    return `<div class="field"><label class="lbl" for="${id}">${label}</label><input id="${id}" type="time" ${attr} value="${value || ''}"></div>`;
  }

  function detailsCard(d, inline) {
    const p = plannedFor(d), a = actualFor(d), ov = state.rota.overrides[d] || {}, bh = bankHolidayOn(d);
    const s = displayStatus(d);
    const plannedSel = ov.planned ? ov.planned.type : 'rota';
    const rotaType = (() => { const v = patternFor(d); return v ? v.cycle[mod(dayDiff(d, v.anchor), v.cycle.length)] : null; })();
    const actualSel = ov.actual ? ov.actual.status : 'planned';
    const plannedText = p
      ? (p.works ? `${p.type === 'custom' ? esc(p.label) : STATUS_LABEL[p.type]} · ${fmtShiftRange(p.startDt, p.endDt, d)}` : p.type === 'custom' ? `${esc(p.label)} (no times)` : 'Off')
      + (p.source === 'changed' ? ' · changed for this date' : ' · from your rota')
      : 'No rota for this date';
    const ents = entriesTouching(d);
    const appts = state.commitments.filter(c => c.start.slice(0, 10) <= d && c.end.slice(0, 10) >= d && c.end > d + 'T00:00');
    const overlaps = overlapsOn(d);
    const isFuture = d > todayKey();
    const opt = (v, label, sel) => `<option value="${v}" ${v === sel ? 'selected' : ''}>${label}</option>`;
    const entryForm = calForm && calForm.kind === 'entry' && calForm.date === d ? `
      <div class="c-form" id="entryForm">
        <h4 style="margin-top:0">${calForm.type === 'overtime' ? 'Add overtime' : 'Add unauthorised absence'}</h4>
        <div class="field"><label class="lbl" for="efStart">Starts</label><input id="efStart" type="datetime-local" value="${calForm.start}"></div>
        <div class="field"><label class="lbl" for="efEnd">Ends</label><input id="efEnd" type="datetime-local" value="${calForm.end}"></div>
        <div class="field"><label class="lbl" for="efNote">Note (optional)</label><input id="efNote" type="text" maxlength="80" value=""></div>
        <p class="warn" id="efError" role="alert"></p>
        <div class="row2"><button class="primary" data-action="entry-save">Save</button><button class="ghost" data-action="entry-cancel">Cancel</button></div>
      </div>` : '';
    const apptForm = commitForm && section === 'calendar' ? commitFormHtml() : '';
    return `
      <section class="card details" id="detailsCard">
        <h2>${esc(longDate(d))}</h2>
        ${bh ? `<p class="small"><span class="cal-bh">BH</span> Bank holiday: ${esc(bh)}</p>` : ''}
        <div class="ctx-block">
          <h3>Planned</h3>
          <p class="small" style="margin-bottom:8px">${s.p && s.p.type ? chip(s.p.type === 'custom' ? 'custom' : s.p.type, s.p.type === 'custom' ? s.p.label : STATUS_LABEL[s.p.type]) : ''} ${plannedText}</p>
          <div class="field"><label class="lbl" for="calPlanned">Planned shift for this date</label>
            <select id="calPlanned" data-cal="planned">
              ${opt('rota', `Follow the rota${rotaType ? ' (' + STATUS_LABEL[rotaType] + ')' : ''}`, plannedSel)}
              ${opt('day', 'Day shift', plannedSel)}${opt('night', 'Night shift', plannedSel)}${opt('off', 'Off', plannedSel)}${opt('custom', 'Custom', plannedSel)}
            </select></div>
          ${plannedSel === 'custom' ? `
            <div class="field"><label class="lbl" for="calPLabel">Label</label><input id="calPLabel" type="text" maxlength="40" data-cal="planned-label" value="${esc(ov.planned.label || 'Custom')}"></div>
            <div class="field-row">${timeField('calPStart', 'Starts', ov.planned.start, 'data-cal="planned-start"')}${timeField('calPEnd', 'Ends', ov.planned.end, 'data-cal="planned-end"')}</div>` : ''}
          ${plannedSel === 'day' || plannedSel === 'night' ? `
            <div class="field-row">${timeField('calPStart', 'Starts', p && p.start, 'data-cal="planned-start"')}${timeField('calPEnd', 'Ends', p && p.end, 'data-cal="planned-end"')}</div>` : ''}
          <p class="small muted" style="margin:0">Changing one date never moves the rest of your rota.</p>
        </div>
        <div class="ctx-block">
          <h3>What happened</h3>
          <div class="field"><label class="lbl" for="calActual">Status</label>
            <select id="calActual" data-cal="actual">
              ${opt('planned', isFuture ? 'As planned' : 'As planned (not marked)', actualSel)}
              ${opt('worked', 'Worked — different hours', actualSel)}${opt('sick', 'Sick', actualSel)}${opt('annual_leave', 'Annual leave', actualSel)}
              ${opt('cancelled', 'Cancelled', actualSel)}${opt('off', 'Off instead', actualSel)}${opt('custom', 'Custom', actualSel)}
            </select></div>
          ${actualSel === 'worked' ? `<div class="field-row">${timeField('calAStart', 'Actually started', (ov.actual && ov.actual.start) || (p && p.start), 'data-cal="actual-start"')}${timeField('calAEnd', 'Actually finished', (ov.actual && ov.actual.end) || (p && p.end), 'data-cal="actual-end"')}</div>` : ''}
          ${actualSel === 'custom' ? `
            <div class="field"><label class="lbl" for="calALabel">Label</label><input id="calALabel" type="text" maxlength="40" data-cal="actual-label" value="${esc(ov.actual.label || 'Custom')}"></div>
            <div class="field-row">${timeField('calAStart', 'Starts (optional)', ov.actual.start, 'data-cal="actual-start"')}${timeField('calAEnd', 'Ends', ov.actual.end, 'data-cal="actual-end"')}</div>
            <label class="check"><input type="checkbox" data-cal="actual-paid" ${ov.actual.paid ? 'checked' : ''}> Paid</label>` : ''}
          ${actualSel === 'sick' ? `<p class="small muted" style="margin:0">Your planned ${p && p.works ? esc(p.type === 'custom' ? p.label : STATUS_LABEL[p.type]) : 'day'} is kept. For sick pay, mark every full day you were too unwell to work.</p>` : ''}
          ${a.assumed && p && p.works && !isFuture ? '<p class="small muted" style="margin:0">Not marked yet — pay treats it as worked as planned.</p>' : ''}
        </div>
        <div class="ctx-block">
          <h3>Overtime &amp; absence</h3>
          ${ents.length ? ents.map(e => `<div class="c-row"><div>${chip(e.kind, STATUS_LABEL[e.kind])}<div class="meta">${esc(fmtShiftRange(e.start, e.end, d))}${e.note ? ' · ' + esc(e.note) : ''}</div></div><div class="c-actions"><button class="inline" data-action="entry-del" data-id="${esc(e.id)}" aria-label="Remove ${esc(STATUS_LABEL[e.kind])}">✕</button></div></div>`).join('') : '<p class="small muted" style="margin:0">None.</p>'}
          ${entryForm || `<div class="row2"><button class="inline" data-action="entry-new" data-kind="overtime">+ Overtime</button><button class="inline" data-action="entry-new" data-kind="unauthorised">+ Unauthorised absence</button></div>`}
        </div>
        <div class="ctx-block">
          <h3>Appointments</h3>
          ${appts.length ? commitmentRows(appts, d) : '<p class="small muted" style="margin:0">None.</p>'}
          ${apptForm || `<div class="row2"><button class="inline full" data-action="cal-appt" data-date="${d}">+ Appointment</button></div>`}
        </div>
        ${overlaps.length ? `<div class="ctx-block"><h3>Overlaps</h3>${overlaps.map(o => `<div class="warn">⚠ ${esc(o)}</div>`).join('<br>')}</div>` : ''}
        ${state.rota.overrides[d] ? `<div class="ctx-block"><button class="ghost" data-action="cal-reset-date">Clear changes for this date</button></div>` : ''}
      </section>`;
  }

  function handleCalChange(el) {
    const d = calSelected, ov = state.rota.overrides[d] || {}, p = plannedFor(d);
    const v = el.value, key = el.dataset.cal;
    if (key === 'planned') {
      if (v === 'rota') setOverride(d, 'planned', null);
      else if (v === 'custom') setOverride(d, 'planned', { type: 'custom', label: 'Custom', start: '09:00', end: '17:00' });
      else setOverride(d, 'planned', { type: v });
    } else if (key === 'planned-start' || key === 'planned-end' || key === 'planned-label') {
      const po = Object.assign({}, ov.planned || { type: 'custom' });
      if (key === 'planned-label') po.label = v.trim() || 'Custom';
      else {
        const t = v.slice(0, 5);
        if (!isTime(t)) return;
        po.start = key === 'planned-start' ? t : (po.start || (p && p.start) || '09:00');
        po.end = key === 'planned-end' ? t : (po.end || (p && p.end) || '17:00');
        if (po.start === po.end) { toast('Start and end need to be different.'); render(); return; }
      }
      setOverride(d, 'planned', po);
    } else if (key === 'actual') {
      if (v === 'planned') setOverride(d, 'actual', null);
      else if (v === 'custom') setOverride(d, 'actual', { status: 'custom', label: 'Custom', paid: false });
      else setOverride(d, 'actual', { status: v });
    } else if (key === 'actual-start' || key === 'actual-end' || key === 'actual-label' || key === 'actual-paid') {
      const ao = Object.assign({}, ov.actual || { status: 'worked' });
      if (key === 'actual-label') ao.label = v.trim() || 'Custom';
      else if (key === 'actual-paid') ao.paid = el.checked;
      else {
        const t = v.slice(0, 5);
        if (!isTime(t)) return;
        ao.start = key === 'actual-start' ? t : (ao.start || (p && p.start) || '09:00');
        ao.end = key === 'actual-end' ? t : (ao.end || (p && p.end) || '17:00');
        if (ao.start === ao.end) { toast('Start and end need to be different.'); render(); return; }
      }
      setOverride(d, 'actual', ao);
    }
    render();
  }

  // ---------- Pattern editor ----------
  function segmentsOf(cycle) {
    const segs = [];
    for (const t of cycle) {
      const last = segs[segs.length - 1];
      if (last && last.type === t) last.count++; else segs.push({ type: t, count: 1 });
    }
    return segs;
  }
  const cycleOf = segs => segs.flatMap(s => Array(s.count).fill(s.type));
  function openPatternForm() {
    const cur = patternFor(todayKey()) || state.rota.patterns[state.rota.patterns.length - 1];
    calForm = {
      kind: 'pattern',
      first: !state.rota.patterns.length,
      effectiveFrom: todayKey(),
      anchor: cur ? cur.anchor : todayKey(),
      segments: segmentsOf(cur ? cur.cycle : DEFAULT_CYCLE),
      times: clone(cur ? cur.times : DEFAULT_TIMES),
      breaks: clone(cur ? cur.breaks : { day: 0, night: 0 })
    };
  }
  function patternSummary(v) {
    return segmentsOf(v.cycle).map(s => `${s.count} ${STATUS_LABEL[s.type].replace(' shift', '')}`).join(' · ');
  }
  function patternPreview(f) {
    const cycle = cycleOf(f.segments);
    if (!cycle.length || !isDateKey(f.anchor)) return '';
    const from = f.first ? f.anchor : f.effectiveFrom;
    let out = '';
    for (let i = 0; i < Math.min(cycle.length, 28); i++) {
      const d = shift(from, i), t = cycle[mod(dayDiff(d, f.anchor), cycle.length)];
      out += `<div class="pv"><span class="pv-d">${+d.slice(8)}</span>${t === 'off' ? '<span class="cal-off">Off</span>' : chip(t, SHORT_LABEL[t], 'cell')}</div>`;
    }
    return `<p class="lbl" style="margin:12px 0 6px">Preview from ${esc(shortDate(from))}</p><div class="pv-strip">${out}</div>`;
  }
  function patternFormHtml() {
    const f = calForm;
    const typeOpts = sel => SHIFT_TYPES.map(t => `<option value="${t}" ${t === sel ? 'selected' : ''}>${STATUS_LABEL[t]}</option>`).join('');
    return `
      <h2>${f.first ? 'Set up your shift pattern' : 'Change your shift pattern'}</h2>
      <p class="small muted">${f.first ? 'Pick a date that was (or will be) the first day of your cycle.' : 'The change starts on the date you choose. Earlier dates, and anything you\'ve recorded, stay as they are.'}</p>
      ${f.first ? '' : `<div class="field"><label class="lbl" for="pfFrom">Change starts on</label><input id="pfFrom" type="date" data-pf="effectiveFrom" value="${f.effectiveFrom}"></div>`}
      <div class="field"><label class="lbl" for="pfAnchor">First day of the cycle (anchor date)</label><input id="pfAnchor" type="date" data-pf="anchor" value="${f.anchor}"></div>
      <h4>Repeating blocks</h4>
      ${f.segments.map((s, i) => `
        <div class="seg-row">
          <select data-pf="seg-type" data-i="${i}" aria-label="Block ${i + 1} type">${typeOpts(s.type)}</select>
          <input type="number" min="1" max="28" inputmode="numeric" data-pf="seg-count" data-i="${i}" value="${s.count}" aria-label="Block ${i + 1} days">
          <span class="minlabel">days</span>
          <button class="inline" data-action="seg-remove" data-i="${i}" aria-label="Remove block ${i + 1}" ${f.segments.length === 1 ? 'disabled' : ''}>✕</button>
        </div>`).join('')}
      <button class="inline" data-action="seg-add" style="margin-top:6px">+ Add a block</button>
      <p class="small muted" id="pfCycle" style="margin:8px 0 0">Cycle length: ${cycleOf(f.segments).length} days</p>
      <h4>Shift times</h4>
      <div class="field-row">${timeField('pfDayS', 'Day starts', f.times.day.start, 'data-pf="day-start"')}${timeField('pfDayE', 'Day ends', f.times.day.end, 'data-pf="day-end"')}</div>
      <div class="field-row">${timeField('pfNightS', 'Night starts', f.times.night.start, 'data-pf="night-start"')}${timeField('pfNightE', 'Night ends', f.times.night.end, 'data-pf="night-end"')}</div>
      <p class="small muted" style="margin-top:-4px">An end time earlier than the start means the shift finishes the next morning.</p>
      <div class="field-row">
        <div class="field"><label class="lbl" for="pfBD">Unpaid break, day (min)</label><input id="pfBD" type="number" min="0" max="240" inputmode="numeric" data-pf="break-day" value="${f.breaks.day}"></div>
        <div class="field"><label class="lbl" for="pfBN">Unpaid break, night (min)</label><input id="pfBN" type="number" min="0" max="240" inputmode="numeric" data-pf="break-night" value="${f.breaks.night}"></div>
      </div>
      <div id="pfPreview">${patternPreview(f)}</div>
      <p class="warn" id="pfError" role="alert"></p>
      <div class="row2"><button class="primary" data-action="pattern-save">Save pattern</button><button class="ghost" data-action="pattern-cancel">Cancel</button></div>`;
  }
  function handlePatternInput(el) {
    const f = calForm, key = el.dataset.pf, v = el.value;
    if (key === 'effectiveFrom' || key === 'anchor') f[key] = v;
    else if (key === 'seg-type') f.segments[+el.dataset.i].type = v;
    else if (key === 'seg-count') f.segments[+el.dataset.i].count = intIn(v, 1, 28, f.segments[+el.dataset.i].count);
    else if (key.endsWith('-start') || key.endsWith('-end')) { const [t, which] = key.split('-'); if (isTime(v.slice(0, 5))) f.times[t][which] = v.slice(0, 5); }
    else if (key.startsWith('break-')) f.breaks[key.slice(6)] = intIn(v, 0, 240, 0);
    setHTML('pfPreview', patternPreview(f));
    setHTML('pfCycle', `Cycle length: ${cycleOf(f.segments).length} days`);
  }
  function savePattern() {
    const f = calForm, err = m => { setHTML('pfError', esc(m)); return false; };
    const cycle = cycleOf(f.segments);
    if (!isDateKey(f.anchor)) return err('Please choose the first day of the cycle.');
    if (!cycle.length || cycle.length > 56) return err('The cycle needs between 1 and 56 days.');
    for (const t of ['day', 'night']) if (f.times[t].start === f.times[t].end) return err(`The ${t} shift needs different start and end times.`);
    const version = { id: 'p' + uid(), effectiveFrom: f.first ? null : f.effectiveFrom, anchor: f.anchor, cycle, times: clone(f.times), breaks: clone(f.breaks) };
    if (!f.first) {
      if (!isDateKey(f.effectiveFrom)) return err('Please choose when the change starts.');
      if (f.effectiveFrom < todayKey() && !confirm(`This changes planned shifts from ${shortDate(f.effectiveFrom)}, which is in the past. Anything you've recorded (sickness, leave, overtime, actual hours) stays as it is. Continue?`)) return false;
    }
    state.rota.patterns = state.rota.patterns.filter(v => (v.effectiveFrom || '') !== (version.effectiveFrom || ''));
    state.rota.patterns.push(version);
    state.rota.patterns.sort((a, b) => ((a.effectiveFrom || '') < (b.effectiveFrom || '') ? -1 : 1));
    persist();
    calForm = null;
    onContextChanged();
    toast(f.first ? 'Pattern saved — your calendar is filled in.' : `Pattern changes from ${shortDate(f.effectiveFrom)}.`);
    return true;
  }

  // ---------- Side cards: legend, pattern, bank holidays, colours ----------
  function legendCard() {
    const keys = ['day', 'night', 'off', 'sick', 'annual_leave', 'cancelled', 'custom', 'unauthorised', 'overtime', 'appointment'];
    return `
      <section class="card">

  function savePaySetting(el) {
    const P = state.pay, key = el.dataset.pay;
    if (key.startsWith('sl-')) { P.studentLoans[key.slice(3)] = el.checked; persist(); return true; }
    if (key === 'annualLeavePaid' || key === 'cancelledPaid') { P[key] = el.checked; persist(); return true; }
    if (key === 'bankHolidayHours' || key === 'sickPay' || key === 'niCategory') { P[key] = el.value; persist(); return true; }
    if (key === 'frequency') { P[key] = el.value; payOffset = 0; persist(); return true; } // the periods themselves change
    if (key === 'periodAnchor') { if (!isDateKey(el.value)) { el.value = P.periodAnchor; return false; } P.periodAnchor = el.value; payOffset = 0; persist(); return true; }
    if (key === 'taxCode') {
      const v = el.value.trim().toUpperCase();
      if (!v || parseTaxCode(v).error) { toast(v ? parseTaxCode(v).error : 'Please enter a tax code.'); }
      P.taxCode = v || '1257L';
      persist();
      return true;
    }
    const limits = { hourlyRate: [0, 1000], nightMultiplier: [1, 5], overtimeMultiplier: [1, 5], bankHolidayMultiplier: [1, 5], sickPercent: [0, 100], averageWeeklyEarnings: [0, 100000] };
    const [lo, hi] = limits[key] || [0, 0];
    if (el.value === '' && (key === 'hourlyRate' || key === 'averageWeeklyEarnings')) { P[key] = null; persist(); return true; }
    const n = numIn(el.value, lo, hi, null);

  function saveEntry() {

  // ======================================================================
  // Health: Workout + Food. Stored under state.health (added alongside the

  // ======================================================================
  const EX_TYPES = ['strength', 'bodyweight', 'cardio'];
  const EX_TYPE_LABEL = { strength: 'Strength', bodyweight: 'Bodyweight', cardio: 'Cardio' };
  const LOAD_MODES = ['none', 'added', 'assisted'];
  const COMMON_EXERCISES = [
    { name: 'Push-ups', type: 'bodyweight' }, { name: 'Pull-ups', type: 'bodyweight' }, { name: 'Kettlebell swings', type: 'strength' },
    { name: 'Squats', type: 'bodyweight' }, { name: 'Bench press', type: 'strength' }, { name: 'Running', type: 'cardio' }

  function emptyHealth() {
    return {
      workout: {
        exercises: [],    // { id, name, type, archived }
        templates: [],    // { id, name, minutes, archived, items: [{ id, exerciseId, sets, reps, weight, loadMode, load, durationMin, distanceKm, restSec }] }
        schedule: { mode: 'off', weekdays: {}, sequence: [], next: 0, restDays: 1, since: null }, // since: when the weekday schedule started

        sessions: [],     // completed and in-progress session snapshots

        restTimer: { enabled: false, seconds: 90 },
        rest: null        // running rest countdown { startedAt, durationSec }
      },
      food: {
        prefs: { exclude: [], dislikes: [], maxMinutes: null, batchOnly: false },
        recipes: {},      // id → recipe (your own, plus TheMealDB recipes you saved, favourited, planned or cooked)
        favourites: [],   // recipe ids
        want: [],         // { id, recipeId, servings, addedOn }
        cooked: [],       // { id, recipeId, title, date, servings } — cooking history only, never food eaten
        shopping: [],     // { id, name, family, amount, unit, text, category, checked, recipes, manual }

      }
    };
  }

  const str = (v, max) => (typeof v === 'string' ? v.trim().slice(0, max || 200) : '');
  const optNum = (v, lo, hi) => numIn(v, lo, hi, null);

  function cleanSetValues(o) {
    o = isObj(o) ? o : {};
    return {
      reps: optNum(o.reps, 0, 1000), weight: optNum(o.weight, 0, 1000),

  }
  function cleanSession(o, report) {
    if (!isObj(o) || typeof o.id !== 'string' || !isDateKey(o.date) || !Array.isArray(o.exercises)) { report.dropped++; return null; }
    const exercises = [];
    for (const e of o.exercises) {

      exercises.push({
        key: typeof e.key === 'string' && e.key ? e.key : 'se' + uid(),
        exerciseId: typeof e.exerciseId === 'string' ? e.exerciseId : null,
        name: str(e.name, 80), type: e.type,

        prefill: e.prefill === 'last' ? 'last' : 'plan',

    return {

  function cleanRecipe(o) {

    const n = isObj(o.nutrition) ? o.nutrition : null;
    return {
      id: o.id, source: o.source === 'themealdb' ? 'themealdb' : 'manual', title: str(o.title, 120),
      sourceUrl: str(o.sourceUrl, 400), sourceName: str(o.sourceName, 80), mealDbUrl: str(o.mealDbUrl, 200), video: str(o.video, 300),
      thumb: /^https:\/\//.test(o.thumb || '') ? str(o.thumb, 300) : '',
      category: str(o.category, 40), area: str(o.area, 40), tags: Array.isArray(o.tags) ? o.tags.filter(t => typeof t === 'string').slice(0, 10).map(t => t.slice(0, 30)) : [],

  function normalizeHealth(raw, report) {
    const h = emptyHealth();
    if (!isObj(raw)) return h;
    const w = isObj(raw.workout) ? raw.workout : {}, hw = h.workout;
    if (Array.isArray(w.exercises)) for (const e of w.exercises) {
      if (isObj(e) && typeof e.id === 'string' && e.id && str(e.name) && EX_TYPES.includes(e.type)) hw.exercises.push({ id: e.id, name: str(e.name, 80), type: e.type, archived: e.archived === true });

    }
    if (Array.isArray(w.templates)) for (const t of w.templates) {
      if (!isObj(t) || typeof t.id !== 'string' || !t.id || !str(t.name)) { report.dropped++; continue; }
      hw.templates.push({ id: t.id, name: str(t.name, 80), minutes: intIn(t.minutes, 5, 300, 45), archived: t.archived === true, items: (Array.isArray(t.items) ? t.items : []).map(cleanTemplateItem).filter(Boolean) });
    }
    if (isObj(w.schedule)) {
      const s = w.schedule;
      hw.schedule.mode = ['off', 'weekdays', 'sequence'].includes(s.mode) ? s.mode : 'off';
      if (isObj(s.weekdays)) for (const d of WEEKDAYS) if (typeof s.weekdays[d] === 'string') hw.schedule.weekdays[d] = s.weekdays[d];
      if (Array.isArray(s.sequence)) hw.schedule.sequence = s.sequence.filter(x => typeof x === 'string').slice(0, 20);
      hw.schedule.next = intIn(s.next, 0, 19, 0);
      hw.schedule.restDays = intIn(s.restDays, 0, 6, 1);
      hw.schedule.since = isDateKey(s.since) ? s.since : null;
    }
    if (isObj(w.planned)) for (const d of Object.keys(w.planned)) {
      const p = w.planned[d];
      if (isDateKey(d) && isObj(p) && typeof p.templateId === 'string') hw.planned[d] = { templateId: p.templateId, time: isTime(p.time) ? p.time : null, status: ['planned', 'skipped', 'moved', 'continued'].includes(p.status) ? p.status : 'planned', source: p.source === 'proposal' ? 'proposal' : 'manual' };
      else report.dropped++;
    }
    if (Array.isArray(w.sessions)) for (const s of w.sessions) { const c = cleanSession(s, report); if (c) hw.sessions.push(c); }
    hw.sessions.sort((a, b) => (a.date + a.startedAt < b.date + b.startedAt ? -1 : 1));
    if (typeof w.activeId === 'string' && hw.sessions.some(s => s.id === w.activeId && s.status === 'active')) hw.activeId = w.activeId;
    if (isObj(w.restTimer)) hw.restTimer = { enabled: w.restTimer.enabled === true, seconds: intIn(w.restTimer.seconds, 10, 900, 90) };
    if (isObj(w.rest) && Number.isFinite(w.rest.startedAt) && Number.isInteger(w.rest.durationSec)) hw.rest = { startedAt: w.rest.startedAt, durationSec: w.rest.durationSec };

    const f = isObj(raw.food) ? raw.food : {}, hf = h.food;
    if (isObj(f.prefs)) {
      hf.prefs.exclude = Array.isArray(f.prefs.exclude) ? f.prefs.exclude.filter(x => EXCLUSIONS[x]) : [];
      hf.prefs.dislikes = Array.isArray(f.prefs.dislikes) ? f.prefs.dislikes.map(x => str(x, 40).toLowerCase()).filter(Boolean).slice(0, 30) : [];
      hf.prefs.maxMinutes = optNum(f.prefs.maxMinutes, 5, 600);
      hf.prefs.batchOnly = f.prefs.batchOnly === true;
    }
    if (isObj(f.recipes)) for (const id of Object.keys(f.recipes)) { const r = cleanRecipe(f.recipes[id]); if (r && r.id === id) hf.recipes[id] = r; else report.dropped++; }
    if (Array.isArray(f.favourites)) hf.favourites = [...new Set(f.favourites.filter(id => typeof id === 'string' && hf.recipes[id]))];
    if (Array.isArray(f.want)) for (const x of f.want) if (isObj(x) && typeof x.recipeId === 'string' && hf.recipes[x.recipeId]) hf.want.push({ id: typeof x.id === 'string' ? x.id : 'w' + uid(), recipeId: x.recipeId, servings: optNum(x.servings, 1, 100), addedOn: isDateKey(x.addedOn) ? x.addedOn : todayKey() });
    if (Array.isArray(f.cooked)) for (const x of f.cooked) if (isObj(x) && typeof x.recipeId === 'string' && isDateKey(x.date)) hf.cooked.push({ id: typeof x.id === 'string' ? x.id : 'c' + uid(), recipeId: x.recipeId, title: str(x.title, 120), date: x.date, servings: optNum(x.servings, 1, 100) });
    if (Array.isArray(f.shopping)) for (const x of f.shopping) {
      if (!isObj(x) || !str(x.name)) { report.dropped++; continue; }
      const family = UNIT_FAMILIES[x.family] && optNum(x.amount, 0, 1e6) !== null ? x.family : null;
      hf.shopping.push({ id: typeof x.id === 'string' && x.id ? x.id : 's' + uid(), name: str(x.name, 80), family, amount: family ? optNum(x.amount, 0, 1e6) : null, unit: family === 'count' ? str(x.unit, 30) : '', text: family ? '' : str(x.text, 60), category: SHOP_CATEGORIES.includes(x.category) ? x.category : 'Other', checked: x.checked === true, recipes: Array.isArray(x.recipes) ? x.recipes.filter(t => typeof t === 'string').slice(0, 10) : [], manual: x.manual === true });
    }
    if (isObj(f.cooking) && typeof f.cooking.recipeId === 'string' && hf.recipes[f.cooking.recipeId]) {
      const c = f.cooking, t = isObj(c.timer) ? c.timer : null;
      hf.cooking = { recipeId: c.recipeId, step: intIn(c.step, 0, 500, 0), servings: optNum(c.servings, 1, 100), startedAt: str(c.startedAt, 20),
        timer: t && Number.isInteger(t.durationSec) && Number.isFinite(t.accumulatedMs) ? { label: str(t.label, 40), durationSec: t.durationSec, startedAt: Number.isFinite(t.startedAt) ? t.startedAt : null, accumulatedMs: t.accumulatedMs, finished: t.finished === true } : null };
    }
    return h;
  }

  // ---------- Health routing: #health/workout/…, #health/food/… ----------
  const route = () => (location.hash || '').replace('#', '').split('/').map(decodeURIComponent);
  const go = hash => { if (location.hash !== '#' + hash) location.hash = hash; else render(); };
  function healthMain() {
    const r = route(), sub = r[1] === 'food' ? 'food' : 'workout';
    const tabs = `
      <section class="card health-tabs">
        <div class="seg" role="tablist" aria-label="Health sections">
          <a class="seg-link${sub === 'workout' ? ' on' : ''}" href="#health/workout" role="tab" aria-selected="${sub === 'workout'}">Workout</a>
          <a class="seg-link${sub === 'food' ? ' on' : ''}" href="#health/food" role="tab" aria-selected="${sub === 'food'}">Food</a>
        </div>
      </section>`;
    return tabs + (sub === 'food' ? foodMain(r.slice(2)) : workoutMain(r.slice(2)));
  }
  function healthSide() {
    const r = route();
    return r[1] === 'food' ? foodSide(r.slice(2)) : workoutSide(r.slice(2));
  }

  // ======================================================================
  // Workout
  // ======================================================================
  const W = () => state.health.workout;
  const exById = id => W().exercises.find(e => e.id === id) || null;
  const tplById = id => W().templates.find(t => t.id === id) || null;
  const activeSession = () => (W().activeId ? W().sessions.find(s => s.id === W().activeId) || null : null);
  const finishedSessions = () => W().sessions.filter(s => s.status !== 'active');
  let wsProposal = null;   // proposed dates, kept in memory until confirmed
  let wsMoveFor = null;    // date whose missed session is being moved
  let restDone = false;    // show "rest done" once

  const n1 = v => (v === null || v === undefined ? '' : String(Math.round(v * 100) / 100));
  function fmtSet(type, s) {
    if (type === 'cardio') return [s.durationMin !== null ? `${n1(s.durationMin)} min` : '', s.distanceKm !== null ? `${n1(s.distanceKm)} km` : ''].filter(Boolean).join(' · ') || '—';
    const reps = s.reps !== null ? `${n1(s.reps)} reps` : '— reps';
    if (type === 'strength') return s.weight !== null ? `${n1(s.reps)} × ${n1(s.weight)} kg` : reps;
    if (s.loadMode === 'added' && s.load) return `${reps} +${n1(s.load)} kg`;
    if (s.loadMode === 'assisted' && s.load) return `${reps} (${n1(s.load)} kg assist)`;
    return reps;
  }
  function planText(type, p) {
    const sets = p.sets ? `${p.sets} × ` : '';
    if (type === 'cardio') return [p.durationMin !== null ? `${n1(p.durationMin)} min` : '', p.distanceKm !== null ? `${n1(p.distanceKm)} km` : ''].filter(Boolean).join(' · ') || 'No target set';
    const reps = p.reps !== null ? `${n1(p.reps)}` : '?';
    if (type === 'strength') return `${sets}${reps}${p.weight !== null ? ` @ ${n1(p.weight)} kg` : ''}`;
    return `${sets}${reps}${p.loadMode === 'added' && p.load ? ` +${n1(p.load)} kg` : p.loadMode === 'assisted' && p.load ? ` (${n1(p.load)} kg assist)` : ''}`;
  }
  // Most recent finished session that has done sets for this exercise.
  function lastResultFor(exerciseId, excludeId) {
    const list = finishedSessions();
    for (let i = list.length - 1; i >= 0; i--) {
      const s = list[i];
      if (s.id === excludeId) continue;
      const e = s.exercises.find(x => x.exerciseId === exerciseId && x.sets.some(y => y.done));
      if (e) return { session: s, ex: e };
    }
    return null;
  }
  const setsDone = s => s.exercises.reduce((a, e) => a + e.sets.filter(x => x.done).length, 0);
  const setsTotal = s => s.exercises.reduce((a, e) => a + e.sets.length, 0);

  // ---------- Scheduling ----------
  function completedOn(d) { return finishedSessions().some(s => s.date === d || s.plannedDate === d); }
  // The session planned for a date: an explicit plan, or the weekday schedule.
  function sessionPlanFor(d) {
    const w = W(), p = w.planned[d];
    if (p) return p.status === 'planned' && tplById(p.templateId) ? { templateId: p.templateId, time: p.time, explicit: true } : null;
    if (w.schedule.mode === 'weekdays' && (!w.schedule.since || d >= w.schedule.since)) {
      const t = tplById(w.schedule.weekdays[parseKey(d).getDay()]);
      if (t && !t.archived) return { templateId: t.id, time: null, explicit: false };
    }
    return null;
  }
  // Only the most recent missed session (last 7 days) is offered. Older ones quietly lapse — no backlog.
  function missedSession() {
    const k = todayKey();
    for (let i = 1; i <= 7; i++) {
      const d = shift(k, -i), handled = W().planned[d];
      if (handled && handled.status !== 'planned') return null; // already moved/skipped: nothing older is brought back
      const p = sessionPlanFor(d);
      if (p) return completedOn(d) ? null : Object.assign({ date: d }, p);
      if (completedOn(d)) return null;
    }
    return null;
  }
  const nextInSequence = () => { const s = W().schedule; return s.sequence.length ? tplById(s.sequence[s.next % s.sequence.length]) : null; };
  function advanceSequence(templateId) {
    const s = W().schedule;
    if (s.mode === 'sequence' && s.sequence.length && s.sequence[s.next % s.sequence.length] === templateId) s.next = (s.next + 1) % s.sequence.length;
  }
  function upcomingPlans(days) {
    const out = [], k = todayKey();
    for (let i = 0; i < days; i++) { const d = shift(k, i), p = sessionPlanFor(d); if (p && !completedOn(d)) out.push(Object.assign({ date: d }, p)); }
    return out;
  }
  // Free time on a date that fits a session of `minutes` (uses shifts, appointments, sleep and your task window).
  function slotFor(d, minutes) {
    const seg = freeSegments(d, []).find(g => g.end - g.start >= minutes);
    return seg ? minToTime(seg.start) : null;
  }
  function proposeSessions() {
    const w = W(), s = w.schedule, k = todayKey(), out = [];
    const busy = new Set(Object.keys(w.planned).filter(d => w.planned[d].status === 'planned'));
    finishedSessions().forEach(x => busy.add(x.date));
    const farEnough = d => [...busy].every(b => Math.abs(dayDiff(d, b)) > s.restDays);
    if (s.mode === 'sequence') {
      let idx = s.next;
      for (let i = 0; i < 21 && out.length < 4; i++) {
        const d = shift(k, i), t = tplById(s.sequence[idx % s.sequence.length]);
        if (!t || busy.has(d) || !farEnough(d)) continue;
        const time = slotFor(d, t.minutes);
        if (!time) continue;
        out.push({ date: d, templateId: t.id, time, kind: 'new', pick: true });
        busy.add(d);
        idx++;
      }
    } else if (s.mode === 'weekdays') {
      for (let i = 0; i < 14; i++) {
        const d = shift(k, i), p = sessionPlanFor(d);
        if (!p || p.explicit || completedOn(d)) continue;
        const t = tplById(p.templateId), time = slotFor(d, t.minutes);
        if (time) { out.push({ date: d, templateId: t.id, time, kind: 'fits', pick: true }); continue; }
        let alt = null;
        for (const off of [1, -1, 2, -2]) {
          const a = shift(d, off);
          if (a < k || sessionPlanFor(a) || completedOn(a)) continue;
          const at = slotFor(a, t.minutes);
          if (at) { alt = { date: a, time: at }; break; }
        }
        out.push(alt ? { date: alt.date, from: d, templateId: t.id, time: alt.time, kind: 'move', pick: true } : { date: d, templateId: t.id, time: null, kind: 'nofit', pick: false });
      }
    }
    return out;
  }
  function applyWorkoutProposal() {
    const w = W();
    for (const p of wsProposal.items) {
      if (!p.pick || p.kind === 'nofit') continue;
      if (p.kind === 'move') w.planned[p.from] = { templateId: p.templateId, time: null, status: 'moved', source: 'proposal' };
      w.planned[p.date] = { templateId: p.templateId, time: p.time, status: 'planned', source: 'proposal' };
    }
    wsProposal = null;
    persist();
  }

  // ---------- Sessions ----------
  function startSession(templateId, plannedDate) {
    const cur = activeSession();
    if (cur) return cur;
    const t = tplById(templateId);
    if (!t) return null;
    const s = { id: 'ws' + uid(), date: todayKey(), templateId: t.id, templateName: t.name, startedAt: localStamp(), finishedAt: null, status: 'active', plannedDate: plannedDate || null, editedAt: null, exercises: [] };
    for (const it of t.items) {
      const ex = exById(it.exerciseId);
      if (!ex) continue;
      const plan = Object.assign({ sets: it.sets, restSec: it.restSec }, cleanSetValues(it));
      const last = lastResultFor(ex.id, null);
      const lastDone = last ? last.ex.sets.filter(x => x.done) : [];
      const sets = [];
      for (let i = 0; i < it.sets; i++) sets.push(Object.assign(cleanSetValues(lastDone.length ? lastDone[Math.min(i, lastDone.length - 1)] : plan), { done: false }));
      s.exercises.push({ key: 'se' + uid(), exerciseId: ex.id, name: ex.name, type: ex.type, plan, prefill: lastDone.length ? 'last' : 'plan', sets });
    }
    W().sessions.push(s);
    W().activeId = s.id;
    persist();
    return s;
  }
  function finishSession(s) {
    const done = setsDone(s), total = setsTotal(s);
    s.status = done >= total && total > 0 ? 'done' : 'short';
    s.finishedAt = localStamp();
    W().activeId = null;
    W().rest = null;
    advanceSequence(s.templateId);
    persist();
    return s.status;
  }
  function sessionById(id) { return W().sessions.find(s => s.id === id) || null; }

  // ---------- Rest timer (optional, wall-clock based) ----------
  function restRemaining() { const r = W().rest; return r ? Math.max(0, r.durationSec * 1000 - (Date.now() - r.startedAt)) : 0; }
  function restBarHtml() {
    const r = W().rest;
    if (r) return `<div class="rest-bar" role="status"><span>Rest</span><strong id="restTime" role="timer">${fmtClock(restRemaining())}</strong><button class="inline" data-action="h-rest-skip">Skip rest</button></div>`;
    if (restDone) return '<div class="rest-bar done" role="status">Rest done — go when you\'re ready.</div>';
    return '';
  }

  // ---------- Views ----------
  function workoutMain(r) {
    const view = r[0] || 'home';
    if (view === 'session') return sessionView(activeSession(), true);
    if (view === 'log') return sessionView(sessionById(r[1]), false);
    if (view === 'template') return templateEditor(tplById(r[1]));
    if (view === 'history') return historyView();
    if (view === 'exercise') return exerciseHistoryView(exById(r[1]));
    if (view === 'exercises') return exercisesView();
    if (view === 'schedule') return scheduleView();
    return workoutHome();
  }
  function workoutSide(r) {
    if ((r[0] || 'home') !== 'home') return '';
    const recent = finishedSessions().slice(-3).reverse();
    return `
      <section class="card">
        <h2>Recent workouts</h2>
        ${recent.length ? `<ul class="plain-list">${recent.map(s => `<li><a href="#health/workout/log/${esc(s.id)}">${esc(s.templateName)}</a><div class="meta">${esc(shortDate(s.date))} · ${setsDone(s)} sets${s.status === 'short' ? ' · shorter session' : ''}</div></li>`).join('')}</ul>` : '<p class="small muted">Nothing logged yet.</p>'}
        <div class="row2"><a class="btn-link" href="#health/workout/history">All history</a><a class="btn-link" href="#health/workout/exercises">Exercises</a></div>
      </section>`;
  }

  function nextActionCard() {
    const w = W(), k = todayKey(), cur = activeSession();
    if (cur) {
      return `<section class="card next-card"><span class="eyebrow">In progress</span><h2>${esc(cur.templateName)}</h2>
        <p class="small muted">${setsDone(cur)} of ${setsTotal(cur)} sets done · started ${esc(cur.startedAt.slice(11))}</p>
        <a class="btn primary" href="#health/workout/session">Resume workout</a></section>`;
    }
    if (!w.templates.some(t => !t.archived)) {
      return `<section class="card next-card"><span class="eyebrow">Next step</span><h2>Create your first workout</h2>
        <p class="small muted">A workout is a list of exercises you do together, like "Chest" or "Home workout".</p>
        <button class="primary" data-action="h-tpl-new">Create a workout</button></section>`;
    }
    const missed = missedSession();
    if (missed) {
      const t = tplById(missed.templateId), seq = w.schedule.mode === 'sequence';
      return `<section class="card next-card"><span class="eyebrow">From ${esc(shortDate(missed.date))}</span>
        <h2>${esc(t.name)} didn't happen — that's okay</h2>
        <p class="small muted">What would you like to do with it?</p>
        ${wsMoveFor === missed.date ? `
          <div class="field"><label class="lbl" for="wsMoveDate">Move it to</label><input id="wsMoveDate" type="date" min="${k}" value="${k}"></div>
          <div class="row2"><button class="primary" data-action="h-missed-move-save">Move</button><button class="ghost" data-action="h-missed-move-cancel">Cancel</button></div>` : `
          <div class="stack">
            <button data-action="h-missed-move">Move to another day</button>
            <button data-action="h-missed-skip">Skip it</button>
            ${seq ? '<button data-action="h-missed-continue">Continue with next session</button>' : ''}
          </div>
          <p class="small muted" style="margin:10px 0 0">${seq ? 'Skip keeps it next in your sequence. Continue moves on to the following session.' : 'Skipping just lets it go — nothing piles up.'}</p>`}
      </section>`;
    }
    const today = sessionPlanFor(k);
    if (today && !completedOn(k)) {
      const t = tplById(today.templateId);
      return `<section class="card next-card"><span class="eyebrow">Today</span><h2>${esc(t.name)}</h2>
        <p class="small muted">About ${t.minutes} min${today.time ? ` · planned for ${today.time}` : ''} · ${t.items.length} exercise${t.items.length === 1 ? '' : 's'}</p>
        <button class="primary" data-action="h-ws-start" data-tpl="${esc(t.id)}" data-planned="${k}">Start workout</button></section>`;
    }
    const up = upcomingPlans(21)[0];
    const seqNext = w.schedule.mode === 'sequence' ? nextInSequence() : null;
    const t = up ? tplById(up.templateId) : seqNext;
    return `<section class="card next-card"><span class="eyebrow">${up ? 'Next planned' : seqNext ? 'Next in your sequence' : 'Whenever you like'}</span>
      <h2>${t ? esc(t.name) : 'No workout planned'}</h2>
      <p class="small muted">${up ? `${esc(shortDate(up.date))}${up.time ? ' at ' + up.time : ''}` : completedOn(k) ? 'Already moved today — nice.' : 'Rest days count too.'}</p>
      ${t ? `<button data-action="h-ws-start" data-tpl="${esc(t.id)}">Start ${esc(t.name)} now</button>` : ''}</section>`;
  }

  function workoutHome() {
    const w = W(), live = w.templates.filter(t => !t.archived), archived = w.templates.filter(t => t.archived);
    const up = upcomingPlans(14).slice(0, 5);
    return nextActionCard() + `
      <section class="card">
        <div class="card-head"><h2>Your workouts</h2><button class="inline" data-action="h-tpl-new">+ New</button></div>
        ${live.length ? `<ul class="tpl-list">${live.map(t => `
          <li class="tpl-row">
            <div><div class="title">${esc(t.name)}</div><div class="meta">${t.items.length} exercise${t.items.length === 1 ? '' : 's'} · about ${t.minutes} min</div></div>
            <div class="c-actions"><a class="btn-link" href="#health/workout/template/${esc(t.id)}">Edit</a><button class="inline" data-action="h-ws-start" data-tpl="${esc(t.id)}" ${activeSession() ? 'disabled' : ''}>Start</button></div>
          </li>`).join('')}</ul>` : '<p class="small muted">No workouts yet.</p>'}
        ${archived.length ? `<details><summary>Archived (${archived.length})</summary><ul class="tpl-list">${archived.map(t => `<li class="tpl-row"><div class="title">${esc(t.name)}</div><div class="c-actions"><button class="inline" data-action="h-tpl-archive" data-tpl="${esc(t.id)}">Restore</button></div></li>`).join('')}</ul></details>` : ''}
      </section>
      <section class="card">
        <div class="card-head"><h2>Schedule</h2><a class="btn-link" href="#health/workout/schedule">Change</a></div>
        <p class="small">${w.schedule.mode === 'weekdays' ? 'By weekday.' : w.schedule.mode === 'sequence' ? `A repeating sequence — next up: ${esc((nextInSequence() || {}).name || '—')}.` : 'No schedule — start whenever you like.'}</p>
        ${up.length ? `<ul class="plain-list">${up.map(p => `<li>${esc(shortDate(p.date))}${p.time ? ' · ' + p.time : ''} — ${esc(tplById(p.templateId).name)}</li>`).join('')}</ul>` : ''}
      </section>`;
  }

  function setRowHtml(e, i, x, active) {
    const id = `${e.key}-${i}`;
    const num = (field, label, val, step) => `<label class="set-field"><span class="lbl">${label}</span><input type="number" inputmode="decimal" min="0" step="${step}" data-h="set" data-ex="${e.key}" data-set="${i}" data-field="${field}" value="${n1(val)}" aria-label="Set ${i + 1} ${label}"></label>`;
    let fields = '';
    if (e.type === 'strength') fields = num('reps', 'Reps', x.reps, 1) + num('weight', 'kg', x.weight, 0.5);
    else if (e.type === 'bodyweight') {
      fields = num('reps', 'Reps', x.reps, 1) + `
        <label class="set-field"><span class="lbl">Load</span><select data-h="set" data-ex="${e.key}" data-set="${i}" data-field="loadMode" aria-label="Set ${i + 1} load type">
          <option value="none" ${x.loadMode === 'none' ? 'selected' : ''}>Bodyweight</option><option value="added" ${x.loadMode === 'added' ? 'selected' : ''}>+ Added</option><option value="assisted" ${x.loadMode === 'assisted' ? 'selected' : ''}>Assisted</option></select></label>
        ${x.loadMode !== 'none' ? num('load', 'kg', x.load, 0.5) : ''}`;
    } else fields = num('durationMin', 'Min', x.durationMin, 1) + num('distanceKm', 'km', x.distanceKm, 0.1);
    return `
      <div class="set-row${x.done ? ' done' : ''}" id="set-${id}">

  // ---------- Exercise history + chart ----------
  function exerciseRecords(id) {
    return finishedSessions().map(s => ({ s, e: s.exercises.find(x => x.exerciseId === id) })).filter(x => x.e && x.e.sets.some(y => y.done));
  }
  // One measure per chart; added weight and assistance are never mixed.
  function exerciseSeries(type, records) {
    const out = [];
    const pts = (label, unit, pick, lowerIsBetter) => {
      const p = records.map(({ s, e }) => { const v = pick(e.sets.filter(x => x.done)); return v === null ? null : { date: s.date, v }; }).filter(Boolean);
      if (p.length) out.push({ label, unit, points: p, lowerIsBetter: !!lowerIsBetter });
    };
    const maxOf = (sets, f) => { const v = sets.map(f).filter(x => x !== null && x !== undefined); return v.length ? Math.max(...v) : null; };
    const minOf = (sets, f) => { const v = sets.map(f).filter(x => x !== null && x !== undefined); return v.length ? Math.min(...v) : null; };
    if (type === 'strength') pts('Heaviest set', 'kg', sets => maxOf(sets, x => x.weight));
    if (type === 'bodyweight') {
      pts('Most reps in a set (bodyweight only)', 'reps', sets => maxOf(sets.filter(x => x.loadMode === 'none'), x => x.reps));
      pts('Heaviest added weight', 'kg', sets => maxOf(sets.filter(x => x.loadMode === 'added'), x => x.load));
      pts('Least assistance used', 'kg', sets => minOf(sets.filter(x => x.loadMode === 'assisted'), x => x.load), true);
    }
    if (type === 'cardio') {
      pts('Longest distance', 'km', sets => maxOf(sets, x => x.distanceKm));
      pts('Longest duration', 'min', sets => maxOf(sets, x => x.durationMin));
    }
    return out;
  }
  function chartSvg(series) {
    const W2 = 320, H = 150, L = 40, R = 12, T = 14, B = 26;
    const p = series.points, vs = p.map(x => x.v);
    let lo = Math.min(...vs), hi = Math.max(...vs);
    if (lo === hi) { lo = lo - 1; hi = hi + 1; }
    const pad = (hi - lo) * 0.1; lo = Math.max(0, Math.floor(lo - pad)); hi = Math.ceil(hi + pad); // whole-number axis ends
    const x = i => L + (p.length === 1 ? 0 : (i * (W2 - L - R)) / (p.length - 1));
    const y = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
    const line = p.map((pt, i) => `${x(i).toFixed(1)},${y(pt.v).toFixed(1)}`).join(' ');
    const last = p[p.length - 1];
    return `
      <figure class="chart">
        <svg viewBox="0 0 ${W2} ${H}" role="img" aria-label="${esc(series.label)}: ${p.map(pt => `${shortDate(pt.date)} ${n1(pt.v)} ${series.unit}`).join(', ')}">
          <line class="ch-grid" x1="${L}" x2="${W2 - R}" y1="${y(hi)}" y2="${y(hi)}"/><line class="ch-grid" x1="${L}" x2="${W2 - R}" y1="${y(lo)}" y2="${y(lo)}"/>
          <text class="ch-axis" x="${L - 6}" y="${y(hi) + 4}" text-anchor="end">${n1(Math.round(hi * 10) / 10)}</text>
          <text class="ch-axis" x="${L - 6}" y="${y(lo) + 4}" text-anchor="end">${n1(Math.round(lo * 10) / 10)}</text>
          <text class="ch-axis" x="${L}" y="${H - 6}">${esc(shortDate(p[0].date))}</text>
          <text class="ch-axis" x="${W2 - R}" y="${H - 6}" text-anchor="end">${esc(shortDate(last.date))}</text>
          <polyline class="ch-line" points="${line}"/>
          ${p.map((pt, i) => `<g class="ch-pt" tabindex="0" data-tip="${esc(`${shortDate(pt.date)}: ${n1(pt.v)} ${series.unit}`)}"><circle class="ch-hit" cx="${x(i)}" cy="${y(pt.v)}" r="14"/><circle class="ch-dot" cx="${x(i)}" cy="${y(pt.v)}" r="4.5"/></g>`).join('')}
        </svg>
        <figcaption class="small muted">${esc(series.label)} (${series.unit})${series.lowerIsBetter ? ' — lower means less help needed' : ''}. Latest: ${n1(last.v)} ${series.unit}.</figcaption>
        <div class="ch-tip" aria-hidden="true"></div>
      </figure>`;
  }
  function exerciseHistoryView(ex) {
    if (!ex) return '<section class="card"><h2>Exercise not found</h2><a class="btn" href="#health/workout/exercises">Back</a></section>';
    const recs = exerciseRecords(ex.id);
    const series = exerciseSeries(ex.type, recs);
    const charts = series.filter(s => s.points.length >= 3);
    return `
      <section class="card">
        <a class="btn-link" href="#health/workout/exercises">‹ Exercises</a>
        <h2>${esc(ex.name)}</h2>
        <p class="small muted">${EX_TYPE_LABEL[ex.type]} · ${recs.length} logged session${recs.length === 1 ? '' : 's'}. MyDay never changes your targets for you.</p>
        ${charts.length ? charts.map(chartSvg).join('') : `<p class="small muted">A progress chart appears once there are at least 3 comparable sessions${series.length > 1 ? ' of the same kind (bodyweight, added weight and assistance are kept apart)' : ''}.</p>`}
      </section>
      <section class="card">
        <h3>Every session</h3>
        ${recs.length ? `<table class="hist-table"><thead><tr><th scope="col">Date</th><th scope="col">Sets done</th></tr></thead><tbody>${recs.slice().reverse().map(({ s, e }) => `<tr><td><a href="#health/workout/log/${esc(s.id)}">${esc(shortDate(s.date))}</a></td><td>${esc(e.sets.filter(x => x.done).map(x => fmtSet(e.type, x)).join(', '))}</td></tr>`).join('')}</tbody></table>` : '<p class="small muted">Nothing logged yet.</p>'}

  }

          ${live.length ? `<div class="inline-add"><select id="seqAdd" aria-label="Workout to add">${live.map(t => opt(t.id, t.name, '')).join('')}</select><button class="inline" data-action="h-seq-add">Add to sequence</button></div>` : '<p class="small muted">Create a workout first.</p>'}` : ''}
        ${s.mode !== 'off' ? `<div class="field"><label class="lbl" for="schRest">Rest days between proposed sessions</label><input id="schRest" type="number" inputmode="numeric" min="0" max="6" data-h="sch-rest" value="${s.restDays}"></div>

        ${live.length ? `<details><summary>Plan a session on a date</summary>

          <button class="inline" data-action="h-plan-add">Add</button></details>` : ''}

  // ---------- Today card (shown on Today; nothing is added to the task list) ----------
  function healthTodayCard(k) {
    if (!state.health) return '';
    const items = [], cur = activeSession(), food = state.health.food;
    if (cur) items.push(`<div class="c-row"><div><strong>Workout in progress</strong><div class="meta">${esc(cur.templateName)} · ${setsDone(cur)} of ${setsTotal(cur)} sets</div></div><a class="btn-link" href="#health/workout/session">Resume</a></div>`);
    else {
      const missed = missedSession();
      if (missed) items.push(`<div class="c-row"><div><strong>${esc(tplById(missed.templateId).name)}</strong><div class="meta">From ${esc(shortDate(missed.date))} — move, skip or carry on?</div></div><a class="btn-link" href="#health/workout">Decide</a></div>`);
      const p = sessionPlanFor(k);
      if (p && !completedOn(k)) { const t = tplById(p.templateId); items.push(`<div class="c-row"><div><strong>Workout: ${esc(t.name)}</strong><div class="meta">About ${t.minutes} min${p.time ? ' · ' + p.time : ''}</div></div><a class="btn-link" href="#health/workout">Open</a></div>`); }

  const NUM_RE = /^(\d+\s+\d+\/\d+|\d+\/\d+|\d+(?:\.\d+)?\s*[½¼¾⅓⅔⅛]|\d+(?:\.\d+)?|[½¼¾⅓⅔⅛])/;

        t.remote = remote.filter(r => !F().recipes[r.id]);
      } catch (e) {
        if (seq !== t.seq) return;
        t.error = fetchError(e);
      }

  }
  function closeTypeahead() {
    clearTimeout(typeahead.timer);
    typeahead.seq++;
    if (!typeahead.open) return;

    showTypeahead();
  }
  function typeaheadList() {
    const t = typeahead, all = t.local.concat(t.remote), ok = all.filter(passesPrefs);
    return { list: ok.slice(0, TYPEAHEAD_MAX), more: ok.length > TYPEAHEAD_MAX, hidden: all.length - ok.length };
  }
  // Only the suggestions are redrawn, so the search box keeps its focus and keyboard.
  function showTypeahead() {
    setHTML('foodSuggest', typeaheadHtml());
    const n = typeahead.open ? typeaheadList().list.length : 0;
    setHTML('foodSuggestCount', !typeahead.open || (typeahead.loading && !n) ? '' : n ? `${n} suggestion${n === 1 ? '' : 's'}` : 'No suggestions');

  // Bold the part of a title that matches what you typed.
  function markMatch(text, q) {
    const i = text.toLowerCase().indexOf(q.toLowerCase());

  }
  function typeaheadHtml() {
    const t = typeahead;
    if (!t.open) return '';
    const { list, more, hidden } = typeaheadList(), ql = t.q.toLowerCase();
    const row = r => {
      const own = !!F().recipes[r.id];
      const ing = r.title.toLowerCase().includes(ql) ? null : r.ingredients.find(i => i.name.toLowerCase().includes(ql));
      const meta = [own ? (r.source === 'manual' ? 'Your recipe' : 'Saved') : [r.category, r.area].filter(Boolean).join(' · '), ing ? `has ${ing.name}` : ''].filter(Boolean).join(' · ');
      return `<li><a class="ta-item" href="#health/food/recipe/${encodeURIComponent(r.id)}"><span class="ta-title">${markMatch(r.title, t.q)}</span>${meta ? `<span class="meta">${esc(meta)}</span>` : ''}</a></li>`;
    };
    const notes = [];
    if (t.loading) notes.push('Looking on TheMealDB…');
    if (t.error) notes.push(`${t.error} Showing your saved recipes only.`);
    if (!t.loading && !list.length) notes.push(`No suggestions for “${t.q}”.`);
    if (hidden) notes.push(`${hidden} left out because of your preferences.`);
    if (more) notes.push('Press Search to see them all.');
    return `${list.length ? `<ul class="ta-list" aria-label="Suggestions">${list.map(row).join('')}</ul>` : ''}${notes.length ? `<p class="small muted ta-note">${esc(notes.join(' '))}</p>` : ''}`;
  }
  // The search box, with suggestions underneath while you type.
  function searchBoxHtml() {
    return `
      <div class="food-search">
        <div class="search-row">
          <label class="sr-only" for="foodQ">Search recipes</label>
          <input id="foodQ" type="search" placeholder="Search recipes" value="${esc(typeahead.text)}" enterkeyhint="search" autocomplete="off" aria-controls="foodSuggest">
          <button class="inline" data-action="h-food-search">Search</button>
        </div>
        <div id="foodSuggest">${typeaheadHtml()}</div>
        <p class="sr-only" id="foodSuggestCount" role="status"></p>
      </div>`;
  }

  async function loadRecipe(id) {
    if (recipeLoad.loading && recipeLoad.id === id) return;
    Object.assign(recipeLoad, { id, loading: true, error: null });
    rerenderFood();
    try {
      const j = await mdbGet('lookup.php?i=' + encodeURIComponent(id.replace(/^mdb-/, '')));
      const r = Array.isArray(j.meals) ? fromMealDb(j.meals[0]) : null;
      if (!r) throw new Error("TheMealDB doesn't have that recipe any more.");
      mdbCache.set(r.id, r);
    } catch (e) {
      recipeLoad.error = fetchError(e);
    } finally {
      recipeLoad.loading = false;
      rerenderFood();
    }
  }

  // ---------- Views ----------
  function foodMain(r) {
    const v = r[0] || 'home';
    if (v === 'recipe') return recipeView(r[1]);
    if (v === 'want') return wantView(r[1]);
    if (v === 'shopping') return shoppingView();
    if (v === 'cook') return cookView();
    if (v === 'search') return searchView();
    if (v === 'prefs') return prefsView();
    if (v === 'new' || v === 'edit') return recipeFormView(v === 'edit' ? r[1] : null);
    return foodHome();
  }
  function foodSide(r) {
    if ((r[0] || 'home') !== 'home') return '';
    const p = F().prefs, active = p.exclude.map(k => EXCLUSIONS[k].label).concat(p.dislikes.map(d => `not ${d}`));
    return `
      <section class="card">
        <h2>Your preferences</h2>
        <p class="small">${active.length ? esc(active.join(' · ')) : 'No filters set.'}${p.maxMinutes ? ` · up to ${p.maxMinutes} min` : ''}${p.batchOnly ? ' · batch cooking' : ''}</p>
        <a class="btn" href="#health/food/prefs">Change preferences</a>
      </section>
      <section class="card">
        <h2>About recipe ideas</h2>
        <p class="small muted">Ideas and photos come from <a href="https://www.themealdb.com" target="_blank" rel="noopener">TheMealDB</a>, using its free test key for personal and educational use. TheMealDB doesn't list servings, times or nutrition, so MyDay shows those as "not listed" rather than guessing.</p>
      </section>`;
  }
  function factsLine(r) {
    const bits = [], t = totalMinutes(r);
    if (t !== null) bits.push(`${t} min`);
    if (r.servings) bits.push(`Serves ${r.servings}${r.servingsSource === 'user' ? ' (your entry)' : ''}`);
    if (r.effort) bits.push(`${r.effort[0].toUpperCase()}${r.effort.slice(1)} effort`);
    if (r.nutrition && r.nutrition.kcal !== null) bits.push(`${n1(r.nutrition.kcal)} kcal per serving (your entry)`);
    if (r.batch) bits.push('Good for batch cooking');
    const missing = [t === null ? 'time' : '', !r.servings ? 'servings' : '', !r.nutrition ? 'nutrition' : ''].filter(Boolean);
    return `${bits.length ? `<div class="rfacts">${esc(bits.join(' · '))}</div>` : ''}${missing.length ? `<div class="meta">${esc(missing.join(', ').replace(/^./, c => c.toUpperCase()))} not listed</div>` : ''}`;
  }
  function recipeCard(r) {
    return `
      <article class="rcard">
        <a class="rcard-link" href="#health/food/recipe/${encodeURIComponent(r.id)}">
          ${r.thumb ? `<img src="${esc(r.thumb)}/small" alt="" loading="lazy" decoding="async">` : '<div class="rcard-noimg" aria-hidden="true">🍲</div>'}
          <div class="rcard-body">
            <h3>${esc(r.title)}</h3>
            <div class="meta">${esc([r.category, r.area].filter(Boolean).join(' · ') || (r.source === 'manual' ? 'Your recipe' : ''))}</div>
            ${factsLine(r)}
          </div>
        </a>
      </article>`;
  }
  function miniList(ids) {
    return `<ul class="plain-list">${ids.map(id => { const r = getRecipe(id); return r ? `<li><a href="#health/food/recipe/${encodeURIComponent(id)}">${esc(r.title)}</a></li>` : ''; }).join('')}</ul>`;
  }
  function foodHome() {
    const f = F(), toBuy = f.shopping.filter(x => !x.checked).length;
    if (!foodSuggest.loaded && !foodSuggest.loading && !foodSuggest.error) setTimeout(loadSuggestions, 0);
    let next;
    if (f.cooking && f.recipes[f.cooking.recipeId]) {
      const r = f.recipes[f.cooking.recipeId];
      next = `<section class="card next-card"><span class="eyebrow">Cooking</span><h2>${esc(r.title)}</h2><p class="small muted">Step ${f.cooking.step + 1} of ${Math.max(1, recipeSteps(r.instructions).length)}</p><a class="btn primary" href="#health/food/cook">Resume cooking</a></section>`;
    } else if (toBuy) {
      next = `<section class="card next-card"><span class="eyebrow">Next step</span><h2>Shopping list</h2><p class="small muted">${toBuy} item${toBuy === 1 ? '' : 's'} to get${f.want.length ? ` for ${f.want.length} recipe${f.want.length === 1 ? '' : 's'}` : ''}.</p><a class="btn primary" href="#health/food/shopping">Open shopping list</a></section>`;
    } else if (f.want.length) {
      const r = getRecipe(f.want[0].recipeId);

    } else next = '';
    const shown = foodSuggest.items.slice(0, foodSuggest.shown);
    const seenCooked = new Set(), cooked = f.cooked.slice().reverse().filter(c => !seenCooked.has(c.recipeId) && seenCooked.add(c.recipeId)).slice(0, 5);
    const mine = Object.values(f.recipes).filter(r => r.source === 'manual');
    return next + `
      <section class="card">
        ${searchBoxHtml()}
        <div class="row2"><a class="btn-link" href="#health/food/new">+ Add my own recipe</a><a class="btn-link" href="#health/food/prefs">Preferences</a></div>
      </section>
      <section class="card">
        <h2>Ideas for you</h2>
        ${foodSuggest.error ? `<p class="warn">${esc(foodSuggest.error)} Your saved recipes below still work.</p><button class="inline" data-action="h-suggest-retry">Try again</button>` : ''}
        <div class="rgrid">${shown.map(recipeCard).join('')}${foodSuggest.loading ? '<div class="rcard skeleton" aria-hidden="true"></div>'.repeat(Math.max(1, foodSuggest.shown - shown.length)) : ''}</div>
        ${foodSuggest.loading ? '<p class="small muted" role="status">Finding ideas…</p>' : ''}

      ${mine.length ? `<section class="card"><h2>My recipes</h2><div class="rgrid">${mine.map(recipeCard).join('')}</div></section>` : ''}

  function searchView() {

      <section class="card">

        ${s.loading ? '<p class="small muted" role="status">Searching…</p>' : ''}

      </section>

  }

  function recipeView(id) {
    const r = getRecipe(id);
    if (!r) {
      if (/^mdb-\d+$/.test(id || '') && !recipeLoad.loading && recipeLoad.id !== id) setTimeout(() => loadRecipe(id), 0);
      const failed = recipeLoad.id === id && recipeLoad.error;
      return `<section class="card"><a class="btn-link" href="#health/food">‹ Food</a>
        <h2>${failed ? "Couldn't load this recipe" : /^mdb-/.test(id || '') ? 'Loading recipe…' : 'Recipe not found'}</h2>
        ${failed ? `<p class="warn">${esc(recipeLoad.error)}</p><button class="inline" data-action="h-recipe-retry" data-id="${esc(id)}">Try again</button>` : ''}</section>`;
    }
    const f = F(), fav = f.favourites.includes(r.id), want = f.want.some(x => x.recipeId === r.id);
    const base = r.servings, cur = base ? (recipeServings[r.id] || base) : null, factor = base ? cur / base : 1;
    const steps = recipeSteps(r.instructions), hits = prefHits(r);
    const ing = r.ingredients.map(i => { const m = scaledMeasure(i.measure, factor); return `<li><span class="ing-qty">${esc(m.text || '')}${!m.scaled ? ' <span class="meta">(as written)</span>' : ''}</span> <span>${esc(i.name)}</span></li>`; }).join('');
    const nut = r.nutrition;
    return `
      <section class="card recipe-head">
        <a class="btn-link" href="#health/food">‹ Food</a>
        ${r.thumb ? `<img class="recipe-img" src="${esc(r.thumb)}/medium" alt="Photo of ${esc(r.title)}" loading="lazy">` : ''}
        <h2>${esc(r.title)}</h2>
        <div class="meta">${esc([r.category, r.area].concat(r.tags).filter(Boolean).join(' · '))}</div>
        ${factsLine(r)}
        <div class="action-row">
          <button class="${fav ? 'on' : ''}" data-action="h-fav" data-id="${esc(r.id)}" aria-pressed="${fav}">${fav ? '★ Favourite' : '☆ Favourite'}</button>
          <a class="btn" href="#health/food/want/${encodeURIComponent(r.id)}">${want ? 'Want to cook ✓' : 'Want to cook'}</a>
          <button class="primary" data-action="h-cook-start" data-id="${esc(r.id)}">Start cooking</button>
        </div>
      </section>
      ${hits.length ? `<section class="card notice"><p class="small" style="margin:0">Heads up: ${esc(hits.map(h => `${h.what} (${h.why.toLowerCase()})`).join('; '))}.</p></section>` : ''}
      <section class="card">
        <h2>Ingredients</h2>
        ${base ? `<div class="serv-stepper"><button class="icon-btn" data-action="h-serv" data-id="${esc(r.id)}" data-d="-1" aria-label="Fewer servings" ${cur <= 1 ? 'disabled' : ''}>−</button><span><strong id="servNow">${cur}</strong> serving${cur === 1 ? '' : 's'}${r.servingsSource === 'user' ? ' <span class="meta">(base set by you)</span>' : ''}</span><button class="icon-btn" data-action="h-serv" data-id="${esc(r.id)}" data-d="1" aria-label="More servings">+</button></div>`
          : `<p class="small muted">The source doesn't say how many this serves, so quantities are shown as written.</p>
             <details><summary>I know how many it serves</summary><div class="inline-add"><input id="servBase" type="number" inputmode="numeric" min="1" max="100" placeholder="e.g. 4" aria-label="Servings"><button class="inline" data-action="h-serv-base" data-id="${esc(r.id)}">Save</button></div><p class="small muted">Saved as your own entry, then you can scale the quantities.</p></details>`}
        <ul class="ing-list">${ing || '<li class="muted">No ingredients listed.</li>'}</ul>
        <p class="small muted" style="margin:10px 0 0">MyDay only reads ingredient names — it can't confirm a recipe is free from any allergen. Check the original recipe and packaging.</p>
      </section>
      <section class="card">
        <h2>Method</h2>
        ${steps.length ? `<ol class="steps">${steps.map(s => `<li>${esc(s)}</li>`).join('')}</ol>` : '<p class="small muted">No method text.</p>'}
        ${r.instructions ? `<details><summary>Original text</summary><p class="orig">${esc(r.instructions)}</p></details>` : ''}
      </section>
      <section class="card">
        <h2>Nutrition per serving</h2>
        ${nut ? `<p class="small">${esc([nut.kcal !== null ? `${n1(nut.kcal)} kcal` : '', nut.protein !== null ? `protein ${n1(nut.protein)} g` : '', nut.carbs !== null ? `carbs ${n1(nut.carbs)} g` : '', nut.fat !== null ? `fat ${n1(nut.fat)} g` : ''].filter(Boolean).join(' · '))}</p><p class="small muted">Entered by you — not from the recipe source.</p>` : '<p class="small muted">Not available from the source.</p>'}
        <details><summary>${nut ? 'Change your figures' : 'Add your own figures'}</summary>
          <div class="field-row"><div class="field"><label class="lbl" for="nKcal">kcal</label><input id="nKcal" type="number" inputmode="decimal" min="0" value="${nut ? n1(nut.kcal) : ''}"></div><div class="field"><label class="lbl" for="nPro">Protein (g)</label><input id="nPro" type="number" inputmode="decimal" min="0" value="${nut ? n1(nut.protein) : ''}"></div></div>

          <div class="row2"><button class="inline" data-action="h-nutr-save" data-id="${esc(r.id)}">Save</button>${nut ? `<button class="inline ghost" data-action="h-nutr-clear" data-id="${esc(r.id)}">Remove</button>` : ''}</div>
        </details>
      </section>
      <section class="card">
        <h2>Source</h2>
        ${r.source === 'themealdb' ? `<p class="small">From <a href="${esc(r.mealDbUrl)}" target="_blank" rel="noopener">TheMealDB</a>${r.sourceUrl ? ` · <a href="${esc(r.sourceUrl)}" target="_blank" rel="noopener">original recipe</a>` : ''}${r.video ? ` · <a href="${esc(r.video)}" target="_blank" rel="noopener">video</a>` : ''}. Photo: TheMealDB.</p>`
          : `<p class="small">Your recipe${r.sourceName ? ` · from ${esc(r.sourceName)}` : ''}${safeUrl(r.sourceUrl) ? ` · <a href="${esc(r.sourceUrl)}" target="_blank" rel="noopener">link</a>` : ''}.</p>
             <div class="row2"><a class="btn" href="#health/food/edit/${encodeURIComponent(r.id)}">Edit</a><button class="ghost" data-action="h-recipe-delete" data-id="${esc(r.id)}">Delete</button></div>`}
      </section>`;
  }

  function wantView(id) {
    const r = getRecipe(id);
    if (!r) return recipeView(id);
    if (!wantDraft || wantDraft.recipeId !== id) {
      const existing = F().want.find(x => x.recipeId === id);
      wantDraft = { recipeId: id, servings: r.servings ? (existing && existing.servings) || recipeServings[id] || r.servings : null, have: [] };
    }
    const factor = r.servings && wantDraft.servings ? wantDraft.servings / r.servings : 1;
    const need = r.ingredients.filter((_, i) => !wantDraft.have.includes(i)).length;
    return `
      <section class="card">
        <a class="btn-link" href="#health/food/recipe/${encodeURIComponent(id)}">‹ ${esc(r.title)}</a>
        <span class="eyebrow">Want to cook</span>
        <h2>${esc(r.title)}</h2>
        <h3>1 · Servings</h3>
        ${r.servings ? `<div class="serv-stepper"><button class="icon-btn" data-action="h-want-serv" data-d="-1" aria-label="Fewer servings" ${wantDraft.servings <= 1 ? 'disabled' : ''}>−</button><span><strong>${wantDraft.servings}</strong> serving${wantDraft.servings === 1 ? '' : 's'}</span><button class="icon-btn" data-action="h-want-serv" data-d="1" aria-label="More servings">+</button></div>`
          : '<p class="small muted">Servings aren\'t listed, so quantities stay as written.</p>'}
        <h3>2 · Tick what you already have</h3>
        <ul class="have-list">${r.ingredients.map((ing, i) => { const m = scaledMeasure(ing.measure, factor); return `<li><label class="check"><input type="checkbox" data-h="want-have" data-i="${i}" ${wantDraft.have.includes(i) ? 'checked' : ''}> <span><strong>${esc(ing.name)}</strong> <span class="meta">${esc(m.text)}</span></span></label></li>`; }).join('')}</ul>
        <h3>3 · Add the rest to your list</h3>
        <div class="stack">
          <button class="primary" data-action="h-want-add">${need ? `Add ${need} item${need === 1 ? '' : 's'} to my shopping list` : 'Save — I have everything'}</button>
        </div>
      </section>`;
  }

  function shoppingView() {
    const f = F(), open = f.shopping.filter(x => !x.checked), got = f.shopping.filter(x => x.checked);
    const row = x => shopEdit === x.id ? `
      <li class="shop-row editing">
        <div class="field-row"><div class="field"><label class="lbl" for="seName">Item</label><input id="seName" type="text" maxlength="80" value="${esc(x.name)}"></div>
        <div class="field"><label class="lbl" for="seQty">Quantity</label><input id="seQty" type="text" maxlength="40" value="${esc(shopQty(x))}"></div></div>
        <div class="row2"><button class="inline primary" data-action="h-shop-edit-save" data-id="${esc(x.id)}">Save</button><button class="inline ghost" data-action="h-shop-edit-cancel">Cancel</button></div>
      </li>` : `
      <li class="shop-row${x.checked ? ' done' : ''}">
        <label class="check shop-check"><input type="checkbox" data-h="shop-check" data-id="${esc(x.id)}" ${x.checked ? 'checked' : ''}>
          <span><strong>${esc(x.name)}</strong>${shopQty(x) ? ` <span class="shop-qty">${esc(shopQty(x))}</span>` : ''}${x.recipes.length ? `<span class="meta"> · for ${esc(x.recipes.join(', '))}</span>` : ''}</span></label>
        <div class="c-actions"><button class="inline" data-action="h-shop-edit" data-id="${esc(x.id)}" aria-label="Edit ${esc(x.name)}">Edit</button><button class="inline" data-action="h-shop-remove" data-id="${esc(x.id)}" aria-label="Remove ${esc(x.name)}">✕</button></div>
      </li>`;
    const groups = SHOP_CATEGORIES.map(c => [c, open.filter(x => x.category === c)]).filter(([, l]) => l.length);
    return `
      <section class="card">
        <a class="btn-link" href="#health/food">‹ Food</a>
        <h2>Shopping list</h2>
        <p class="small muted">${open.length} to get${got.length ? ` · ${got.length} ticked` : ''}. Saved as you go.</p>
        <div class="inline-add">
          <label class="sr-only" for="shopAdd">Add an item</label><input id="shopAdd" type="text" maxlength="80" placeholder="Add an item, e.g. 2 lemons" enterkeyhint="done">
          <button class="inline" data-action="h-shop-add">Add</button>
        </div>
        ${shopUndo ? `<div class="undo-bar" role="status">Removed ${esc(shopUndo.item.name)}. <button class="inline" data-action="h-shop-undo">Undo</button></div>` : ''}
      </section>
      ${groups.length ? groups.map(([c, l]) => `<section class="card"><h3>${esc(c)}</h3><ul class="shop-list">${l.map(row).join('')}</ul></section>`).join('') : '<section class="card"><p class="small muted">Nothing to get right now.</p></section>'}
      ${got.length ? `<section class="card"><details><summary>Ticked (${got.length})</summary><ul class="shop-list">${got.map(row).join('')}</ul></details><button class="inline ghost" data-action="h-shop-clear">Clear ticked items</button></section>` : ''}

  function cookTimerHtml() {

          <div class="field-row"><div class="field"><label class="lbl" for="rfCarb">Carbs (g)</label><input id="rfCarb" type="number" inputmode="decimal" min="0" value="${nut ? n1(nut.carbs) : ''}"></div><div class="field"><label class="lbl" for="rfFat">Fat (g)</label><input id="rfFat" type="number" inputmode="decimal" min="0" value="${nut ? n1(nut.fat) : ''}"></div></div>

          <div class="field"><label class="lbl" for="rfUrl">Link (optional)</label><input id="rfUrl" type="url" maxlength="400" value="${esc(v('sourceUrl', ''))}"></div></div>
        <p class="warn" id="rfError" role="alert"></p>
