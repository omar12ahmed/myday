      </section>` : '';
    const form = calForm && calForm.kind === 'pattern' ? `<section class="card" id="patternCard">${patternFormHtml()}</section>` : '';
    const body = calView === 'month' ? monthGridHtml() + `<div id="calDetails">${detailsCard(calSelected)}</div>` : agendaHtml();
    return head + form + setup + body;
  }

  function cellMarks(d) {
    const marks = [];
    const ents = entriesOn(d);
    if (ents.some(e => e.kind === 'overtime')) marks.push(chip('overtime', '+OT', 'mini'));
    const ua = absenceOn(d);
    if (ua.any && !ua.whole) marks.push(chip('unauthorised', 'UA', 'mini'));
    const appts = state.commitments.filter(c => c.start.slice(0, 10) <= d && c.end.slice(0, 10) >= d && c.end > d + 'T00:00').length;
    if (appts) marks.push(chip('appointment', String(appts), 'mini'));
    if (overlapsOn(d).length) marks.push('<span class="mark-warn" title="Overlapping entries">!</span>');
    return marks.join('');
  }
  function describeDay(d) {
    const s = displayStatus(d), bh = bankHolidayOn(d), parts = [longDate(d)];
    if (s.key) parts.push(s.label + (s.p && s.p.works && s.key !== 'off' && s.key === s.p.type ? ` ${s.p.start}–${s.p.end}` : ''));
    if (s.a && !s.a.assumed && s.p && s.key !== s.p.type && s.p.type !== 'off') parts.push(`planned ${STATUS_LABEL[s.p.type] || s.p.label}`);
    if (bh) parts.push(`bank holiday: ${bh}`);
    if (entriesOn(d).some(e => e.kind === 'overtime')) parts.push('overtime');
    if (absenceOn(d).any) parts.push('unauthorised absence');
    const o = overlapsOn(d).length;
    if (o) parts.push(`${o} overlap${o === 1 ? '' : 's'}`);
    return parts.join(', ');
  }

  function monthGridHtml() {
    const first = calMonth + '-01', k = todayKey();
    const gridStart = shift(first, -mod(parseKey(first).getDay() - 1, 7)); // Monday
    const names = [];
    for (let i = 0; i < 7; i++) names.push(parseKey(shift(gridStart, i)).toLocaleDateString(undefined, { weekday: 'narrow' }));
    let cells = '';
    for (let i = 0; i < 42; i++) {
      const d = shift(gridStart, i);
      const s = displayStatus(d), bh = bankHolidayOn(d);
      const cls = ['cal-cell', d.slice(0, 7) !== calMonth ? 'out' : '', d === k ? 'today' : '', d === calSelected ? 'sel' : ''].filter(Boolean).join(' ');
      cells += `
        <button class="${cls}" data-action="cal-select" data-date="${d}" aria-label="${esc(describeDay(d))}" ${d === calSelected ? 'aria-pressed="true"' : ''}>

          ${s.key && s.key !== 'off' ? chip(s.key, s.short, 'cell') : s.key === 'off' ? '<span class="cal-off">Off</span>' : ''}

    }

      <section class="card cal-card">
        <div class="cal-grid" role="grid" aria-label="${esc(monthLabel(calMonth))}">
          ${names.map(n => `<div class="cal-dow" aria-hidden="true">${esc(n)}</div>`).join('')}
          ${cells}
        </div>
      </section>`;
  }

  function agendaHtml() {
    const from = agendaStart || todayKey();
    let rows = '';
    for (let i = 0; i < 28; i++) {
      const d = shift(from, i);
      const s = displayStatus(d), bh = bankHolidayOn(d);
      const ents = entriesOn(d), appts = state.commitments.filter(c => c.start.slice(0, 10) === d);
      const ov = overlapsOn(d);
      const bits = [];
      if (s.key) bits.push(chip(s.key, s.label) + (s.p && s.p.works && (s.key === s.p.type || s.key === 'custom') && s.p.start ? ` <span class="ag-time">${s.p.start}–${s.p.end}</span>` : ''));
      if (s.a && !s.a.assumed && s.p && s.p.works && s.key !== s.p.type) bits.push(`<span class="ag-time">planned ${esc(s.p.type === 'custom' ? s.p.label : STATUS_LABEL[s.p.type])} ${s.p.start}–${s.p.end}</span>`);
      for (const e of ents) bits.push(chip(e.kind, STATUS_LABEL[e.kind]) + ` <span class="ag-time">${esc(fmtShiftRange(e.start, e.end, d))}</span>`);
      for (const c of appts) bits.push(chip('appointment', c.title) + ` <span class="ag-time">${esc(fmtShiftRange(c.start, c.end, d))}</span>`);
      rows += `
        <li class="ag-row${d === calSelected ? ' sel' : ''}">
          <button class="ag-btn" data-action="cal-select" data-date="${d}" aria-label="${esc(describeDay(d))}">
            <span class="ag-date"><strong>${esc(parseKey(d).toLocaleDateString(undefined, { weekday: 'short' }))}</strong> ${+d.slice(8)} ${esc(parseKey(d).toLocaleDateString(undefined, { month: 'short' }))}</span>
            <span class="ag-items">${bh ? `<span class="cal-bh">BH</span> <span class="ag-time">${esc(bh)}</span> ` : ''}${bits.join(' ') || '<span class="ag-time">Nothing planned</span>'}${ov.length ? ' <span class="mark-warn">!</span>' : ''}</span>
          </button>
          ${d === calSelected ? `<div class="ag-details">${detailsCard(d, true)}</div>` : ''}
        </li>`;
    }
    return `<section class="card"><ul class="agenda">${rows}</ul></section>`;
  }

  function timeField(id, label, value, attr) {
    return `<div class="field"><label class="lbl" for="${id}">${label}</label><input id="${id}" type="time" ${attr} value="${value || ''}"></div>`;
  }

  function detailsCard(d, inline) {
    const p = plannedFor(d), a = actualFor(d), ov = state.rota.overrides[d] || {}, bh = bankHolidayOn(d);
    const s = displayStatus(d);
    const plannedSel = ov.planned ? ov.planned.type : 'rota';
    const rotaType = (() => { const v = patternFor(d); return v ? v.cycle[mod(dayDiff(d, v.anchor), v.cycle.length)] : null; })();
    const actualSel = ov.actual ? ov.actual.status : 'planned';
    const plannedText = p
      ? (p.works ? `${p.type === 'custom' ? esc(p.label) : STATUS_LABEL[p.type]} · ${fmtShiftRange(p.startDt, p.endDt, d)}` : p.type === 'custom' ? `${esc(p.label)} (no times)` : 'Off')
      + (p.source === 'changed' ? ' · changed for this date' : ' · from your rota')
      : 'No rota for this date';
    const ents = entriesTouching(d);
    const appts = state.commitments.filter(c => c.start.slice(0, 10) <= d && c.end.slice(0, 10) >= d && c.end > d + 'T00:00');
    const overlaps = overlapsOn(d);
    const isFuture = d > todayKey();
    const opt = (v, label, sel) => `<option value="${v}" ${v === sel ? 'selected' : ''}>${label}</option>`;
    const entryForm = calForm && calForm.kind === 'entry' && calForm.date === d ? `
      <div class="c-form" id="entryForm">
        <h4 style="margin-top:0">${calForm.type === 'overtime' ? 'Add overtime' : 'Add unauthorised absence'}</h4>
        <div class="field"><label class="lbl" for="efStart">Starts</label><input id="efStart" type="datetime-local" value="${calForm.start}"></div>
        <div class="field"><label class="lbl" for="efEnd">Ends</label><input id="efEnd" type="datetime-local" value="${calForm.end}"></div>
        <div class="field"><label class="lbl" for="efNote">Note (optional)</label><input id="efNote" type="text" maxlength="80" value=""></div>
        <p class="warn" id="efError" role="alert"></p>
        <div class="row2"><button class="primary" data-action="entry-save">Save</button><button class="ghost" data-action="entry-cancel">Cancel</button></div>
      </div>` : '';
    const apptForm = commitForm && section === 'calendar' ? commitFormHtml() : '';
    return `
      <section class="card details" id="detailsCard">
        <h2>${esc(longDate(d))}</h2>
        ${bh ? `<p class="small"><span class="cal-bh">BH</span> Bank holiday: ${esc(bh)}</p>` : ''}
        <div class="ctx-block">
          <h3>Planned</h3>
          <p class="small" style="margin-bottom:8px">${s.p && s.p.type ? chip(s.p.type === 'custom' ? 'custom' : s.p.type, s.p.type === 'custom' ? s.p.label : STATUS_LABEL[s.p.type]) : ''} ${plannedText}</p>
          <div class="field"><label class="lbl" for="calPlanned">Planned shift for this date</label>
            <select id="calPlanned" data-cal="planned">
              ${opt('rota', `Follow the rota${rotaType ? ' (' + STATUS_LABEL[rotaType] + ')' : ''}`, plannedSel)}
              ${opt('day', 'Day shift', plannedSel)}${opt('night', 'Night shift', plannedSel)}${opt('off', 'Off', plannedSel)}${opt('custom', 'Custom', plannedSel)}
            </select></div>
          ${plannedSel === 'custom' ? `
            <div class="field"><label class="lbl" for="calPLabel">Label</label><input id="calPLabel" type="text" maxlength="40" data-cal="planned-label" value="${esc(ov.planned.label || 'Custom')}"></div>

          ${plannedSel === 'day' || plannedSel === 'night' ? `
            <div class="field-row">${timeField('calPStart', 'Starts', p && p.start, 'data-cal="planned-start"')}${timeField('calPEnd', 'Ends', p && p.end, 'data-cal="planned-end"')}</div>` : ''}
          <p class="small muted" style="margin:0">Changing one date never moves the rest of your rota.</p>

              ${opt('cancelled', 'Cancelled', actualSel)}${opt('off', 'Off instead', actualSel)}${opt('custom', 'Custom', actualSel)}
            </select></div>
          ${actualSel === 'worked' ? `<div class="field-row">${timeField('calAStart', 'Actually started', (ov.actual && ov.actual.start) || (p && p.start), 'data-cal="actual-start"')}${timeField('calAEnd', 'Actually finished', (ov.actual && ov.actual.end) || (p && p.end), 'data-cal="actual-end"')}</div>` : ''}
          ${actualSel === 'custom' ? `
            <div class="field"><label class="lbl" for="calALabel">Label</label><input id="calALabel" type="text" maxlength="40" data-cal="actual-label" value="${esc(ov.actual.label || 'Custom')}"></div>

            <label class="check"><input type="checkbox" data-cal="actual-paid" ${ov.actual.paid ? 'checked' : ''}> Paid</label>` : ''}
          ${actualSel === 'sick' ? `<p class="small muted" style="margin:0">Your planned ${p && p.works ? esc(p.type === 'custom' ? p.label : STATUS_LABEL[p.type]) : 'day'} is kept. For sick pay, mark every full day you were too unwell to work.</p>` : ''}
          ${a.assumed && p && p.works && !isFuture ? '<p class="small muted" style="margin:0">Not marked yet — pay treats it as worked as planned.</p>' : ''}
        </div>
        <div class="ctx-block">
          <h3>Overtime &amp; absence</h3>
          ${ents.length ? ents.map(e => `<div class="c-row"><div>${chip(e.kind, STATUS_LABEL[e.kind])}<div class="meta">${esc(fmtShiftRange(e.start, e.end, d))}${e.note ? ' · ' + esc(e.note) : ''}</div></div><div class="c-actions"><button class="inline" data-action="entry-del" data-id="${esc(e.id)}" aria-label="Remove ${esc(STATUS_LABEL[e.kind])}">✕</button></div></div>`).join('') : '<p class="small muted" style="margin:0">None.</p>'}
          ${entryForm || `<div class="row2"><button class="inline" data-action="entry-new" data-kind="overtime">+ Overtime</button><button class="inline" data-action="entry-new" data-kind="unauthorised">+ Unauthorised absence</button></div>`}
        </div>
        <div class="ctx-block">
          <h3>Appointments</h3>
          ${appts.length ? commitmentRows(appts, d) : '<p class="small muted" style="margin:0">None.</p>'}
          ${apptForm || `<div class="row2"><button class="inline full" data-action="cal-appt" data-date="${d}">+ Appointment</button></div>`}
        </div>
        ${overlaps.length ? `<div class="ctx-block"><h3>Overlaps</h3>${overlaps.map(o => `<div class="warn">⚠ ${esc(o)}</div>`).join('<br>')}</div>` : ''}
        ${state.rota.overrides[d] ? `<div class="ctx-block"><button class="ghost" data-action="cal-reset-date">Clear changes for this date</button></div>` : ''}
      </section>`;
  }

  function handleCalChange(el) {
    const d = calSelected, ov = state.rota.overrides[d] || {}, p = plannedFor(d);
    const v = el.value, key = el.dataset.cal;
    if (key === 'planned') {
      if (v === 'rota') setOverride(d, 'planned', null);
      else if (v === 'custom') setOverride(d, 'planned', { type: 'custom', label: 'Custom', start: '09:00', end: '17:00' });
      else setOverride(d, 'planned', { type: v });
    } else if (key === 'planned-start' || key === 'planned-end' || key === 'planned-label') {
      const po = Object.assign({}, ov.planned || { type: 'custom' });
      if (key === 'planned-label') po.label = v.trim() || 'Custom';
      else {
        const t = v.slice(0, 5);
        if (!isTime(t)) return;
        po.start = key === 'planned-start' ? t : (po.start || (p && p.start) || '09:00');
        po.end = key === 'planned-end' ? t : (po.end || (p && p.end) || '17:00');
        if (po.start === po.end) { toast('Start and end need to be different.'); render(); return; }
      }
      setOverride(d, 'planned', po);
    } else if (key === 'actual') {
      if (v === 'planned') setOverride(d, 'actual', null);
      else if (v === 'custom') setOverride(d, 'actual', { status: 'custom', label: 'Custom', paid: false });
      else setOverride(d, 'actual', { status: v });
    } else if (key === 'actual-start' || key === 'actual-end' || key === 'actual-label' || key === 'actual-paid') {
      const ao = Object.assign({}, ov.actual || { status: 'worked' });
      if (key === 'actual-label') ao.label = v.trim() || 'Custom';
      else if (key === 'actual-paid') ao.paid = el.checked;
      else {
        const t = v.slice(0, 5);
        if (!isTime(t)) return;
        ao.start = key === 'actual-start' ? t : (ao.start || (p && p.start) || '09:00');
        ao.end = key === 'actual-end' ? t : (ao.end || (p && p.end) || '17:00');
        if (ao.start === ao.end) { toast('Start and end need to be different.'); render(); return; }
      }
      setOverride(d, 'actual', ao);
    }
    render();
  }

  // ---------- Pattern editor ----------
  function segmentsOf(cycle) {
    const segs = [];
    for (const t of cycle) {
      const last = segs[segs.length - 1];
      if (last && last.type === t) last.count++; else segs.push({ type: t, count: 1 });
    }
    return segs;
  }
  const cycleOf = segs => segs.flatMap(s => Array(s.count).fill(s.type));
  function openPatternForm() {
    const cur = patternFor(todayKey()) || state.rota.patterns[state.rota.patterns.length - 1];
    calForm = {
      kind: 'pattern',
      first: !state.rota.patterns.length,
      effectiveFrom: todayKey(),
      anchor: cur ? cur.anchor : todayKey(),
      segments: segmentsOf(cur ? cur.cycle : DEFAULT_CYCLE),
      times: clone(cur ? cur.times : DEFAULT_TIMES),

  function patternPreview(f) {

      const d = shift(from, i), t = cycle[mod(dayDiff(d, f.anchor), cycle.length)];

  function handlePatternInput(el) {
    const f = calForm, key = el.dataset.pf, v = el.value;
    if (key === 'effectiveFrom' || key === 'anchor') f[key] = v;
    else if (key === 'seg-type') f.segments[+el.dataset.i].type = v;
    else if (key === 'seg-count') f.segments[+el.dataset.i].count = intIn(v, 1, 28, f.segments[+el.dataset.i].count);
    else if (key.endsWith('-start') || key.endsWith('-end')) { const [t, which] = key.split('-'); if (isTime(v.slice(0, 5))) f.times[t][which] = v.slice(0, 5); }
    else if (key.startsWith('break-')) f.breaks[key.slice(6)] = intIn(v, 0, 240, 0);

  function savePattern() {
    const f = calForm, err = m => { setHTML('pfError', esc(m)); return false; };
    const cycle = cycleOf(f.segments);
    if (!isDateKey(f.anchor)) return err('Please choose the first day of the cycle.');
    if (!cycle.length || cycle.length > 56) return err('The cycle needs between 1 and 56 days.');
    for (const t of ['day', 'night']) if (f.times[t].start === f.times[t].end) return err(`The ${t} shift needs different start and end times.`);
    const version = { id: 'p' + uid(), effectiveFrom: f.first ? null : f.effectiveFrom, anchor: f.anchor, cycle, times: clone(f.times), breaks: clone(f.breaks) };
    if (!f.first) {

    }
    state.rota.patterns = state.rota.patterns.filter(v => (v.effectiveFrom || '') !== (version.effectiveFrom || ''));
    state.rota.patterns.push(version);
    state.rota.patterns.sort((a, b) => ((a.effectiveFrom || '') < (b.effectiveFrom || '') ? -1 : 1));
    persist();
    calForm = null;
    onContextChanged();
    toast(f.first ? 'Pattern saved — your calendar is filled in.' : `Pattern changes from ${shortDate(f.effectiveFrom)}.`);

  function savePaySetting(el) {
    const P = state.pay, key = el.dataset.pay;
    if (key.startsWith('sl-')) { P.studentLoans[key.slice(3)] = el.checked; persist(); return true; }
    if (key === 'annualLeavePaid' || key === 'cancelledPaid') { P[key] = el.checked; persist(); return true; }
    if (key === 'bankHolidayHours' || key === 'sickPay' || key === 'niCategory') { P[key] = el.value; persist(); return true; }
    if (key === 'frequency') { P[key] = el.value; payOffset = 0; persist(); return true; } // the periods themselves change
    if (key === 'periodAnchor') { if (!isDateKey(el.value)) { el.value = P.periodAnchor; return false; } P.periodAnchor = el.value; payOffset = 0; persist(); return true; }
    if (key === 'taxCode') {
      const v = el.value.trim().toUpperCase();
      if (!v || parseTaxCode(v).error) { toast(v ? parseTaxCode(v).error : 'Please enter a tax code.'); }
      P.taxCode = v || '1257L';
      persist();
      return true;
    }
    const limits = { hourlyRate: [0, 1000], nightMultiplier: [1, 5], overtimeMultiplier: [1, 5], bankHolidayMultiplier: [1, 5], sickPercent: [0, 100], averageWeeklyEarnings: [0, 100000] };
    const [lo, hi] = limits[key] || [0, 0];
    if (el.value === '' && (key === 'hourlyRate' || key === 'averageWeeklyEarnings')) { P[key] = null; persist(); return true; }
    const n = numIn(el.value, lo, hi, null);
    if (n === null) { el.value = P[key] ?? ''; toast(`Please use a number from ${lo} to ${hi}.`); return false; }
    P[key] = n;
    persist();
    return true;
  }
  function paySide() { return paySettingsCard(); }

  function saveEntry() {
    const f = calForm, v = id => ($(id) ? $(id).value : '');
    const s = v('efStart').slice(0, 16), e = v('efEnd').slice(0, 16), note = v('efNote').trim();
    const err = m => { setHTML('efError', esc(m)); return false; };
    if (!isDateTime(s) || !isDateTime(e)) return err('Please add a start and an end, each with a date and time.');
    if (e <= s) return err('The end needs to be after the start. For overnight, set the end to the next day.');
    if (msBetween(s, e) > 24 * 3600000) return err("That's longer than 24 hours — please check the dates.");
    state.rota.entries.push({ id: 'e' + uid(), kind: f.type, start: s, end: e, note: note.slice(0, 80) });
    state.rota.entries.sort((a, b) => (a.start < b.start ? -1 : 1));
    persist();
    calForm = null;
    onContextChanged();
    toast(f.type === 'overtime' ? 'Overtime added.' : 'Absence recorded.');
    return true;
  }

  }

    const k = todayKey(), c = ensureContext(k);
    const v = id => ($(id) ? $(id).value : '');
    const st = v('sst').slice(0, 5), et = v('set').slice(0, 5);
    c.sleep.start = isTime(st) && isDateKey(v('ssd')) ? `${v('ssd')}T${st}` : null;
    c.sleep.end = isTime(et) && isDateKey(v('sed')) ? `${v('sed')}T${et}` : null;
    const est = v('sest');
    const n = Number(est);
    if (est === '') c.sleep.estimatedHours = null;
    else if (n > 0 && n <= 24) c.sleep.estimatedHours = Math.round(n * 4) / 4;
    else { toast('A sleep estimate needs to be between 0 and 24 hours.'); $('sest').value = c.sleep.estimatedHours ?? ''; }
    persist();
  }

  function saveSetting(el) {
    const st = state.settings, key = el.dataset.setting;
    if (key === 'bufferMinutes' || key === 'gapMinutes') {
      const max = key === 'bufferMinutes' ? 240 : 60;
      const n = intIn(el.value, 0, max, null);
      if (n === null) { el.value = st[key]; toast(`Please use a number from 0 to ${max}.`); return false; }
      st[key] = n;
    } else {
      const t = el.value.slice(0, 5);
      const ok = isTime(t) && (key === 'earliestTime' ? t < st.latestTime : t > st.earliestTime);
      if (!ok) { el.value = st[key]; toast('The earliest task time needs to be before the finish time.'); return false; }
      st[key] = t;
    }
    persist();
    return true;
  }

  function defaultCommitTimes(kind) {
    const k = todayKey();
    let s = Math.ceil((nowMin(k) + 1) / 60) * 60;
    if (s > 1380) s = 1440 + 9 * 60; // late evening: suggest tomorrow morning
    const len = kind === 'work' ? 480 : 60;
    return { start: minToDt(s, k), end: minToDt(s + len, k) };
  }

  function saveCommitment() {
    snapshotCommitForm();
    const f = commitForm;
    const kind = f.kind === 'work' ? 'work' : 'appointment';
    const err = msg => { $('cfError').textContent = msg; return false; };
    if (!isDateTime(f.start) || !isDateTime(f.end)) return err('Please add a start and an end, each with a date and time.');
    if (f.end <= f.start) return err('The end needs to be after the start. For a night shift, set the end to the next day.');
    if (dtToMin(f.end, f.start.slice(0, 10)) - dtToMin(f.start, f.start.slice(0, 10)) > 7 * 1440) return err("That's longer than a week — please check the dates.");
    const title = f.title.trim() || KIND_LABEL[kind];
    if (f.id) {
      const c = state.commitments.find(x => x.id === f.id);
      if (c) Object.assign(c, { kind, title, start: f.start, end: f.end });
    } else {
      state.commitments.push({ id: 'c' + uid(), kind, title, start: f.start, end: f.end });
    }
    state.commitments.sort((a, b) => (a.start < b.start ? -1 : a.start > b.start ? 1 : 0));
    persist();
    commitForm = null;
    return true;
  }

  // ======================================================================
  // Events
  // ======================================================================
  function findTask(dayKey, id) {
    const d = state.days[dayKey];
    return d ? d.tasks.find(t => t.uid === id) : null;
  }
  const propItem = id => (proposal ? proposal.items.find(i => i.uid === id) : null);
  function scrollToProposal() {
    const el = $('proposalCard');
    if (el && el.scrollIntoView) el.scrollIntoView({ block: 'start' });
  }

  document.addEventListener('input', e => {
    if (e.target.id === 'energy') {
      const v = Number(e.target.value);
      $('energyLabel').textContent = `${v} · ${ENERGY_LABEL[v]}`;
      e.target.style.setProperty('--fill', `${(v - 1) * 25}%`);
    }
  });

  document.addEventListener('toggle', e => {
    if (e.target.id === 'ctxDetails') contextOpen = e.target.open;
  }, true);

  document.addEventListener('change', e => {
    const el = e.target;
    const k = todayKey();
    if (el.id === 'importFile') {
      const file = el.files && el.files[0];
      el.value = '';
      if (file) importFile(file);
      return;
    }
    if (el.dataset.cal) { handleCalChange(el); return; }
    if (el.dataset.pf) { handlePatternInput(el); return; }
    if (el.dataset.colour) {
      if (isHex(el.value)) { state.rota.colours[el.dataset.colour] = el.value.toLowerCase(); persist(); render(); }
      return;
    }
    if (el.dataset.pay) {
      if (!savePaySetting(el)) return;
      if (['sickPay', 'frequency'].includes(el.dataset.pay)) render(); else $('app').innerHTML = payMain();
      return;
    }
    if (el.hasAttribute('data-bh-region')) {
      if (BH_REGIONS[el.value]) { state.bankHolidays.region = el.value; bhIndex = null; persist(); render(); }
      return;
    }
    if (el.id === 'energy') {
      ensureContext(k).energy = Number(el.value);
      persist();
      onContextChanged();
      refresh();
      return;
    }
    if (el.dataset.ctx === 'sleep') { saveSleepFromDom(); onContextChanged(); refresh(); return; }
    if (el.dataset.setting) { if (saveSetting(el)) { onContextChanged(); refresh(); } return; }
    if (el.dataset.action === 'prop-time' || el.dataset.action === 'prop-minutes') {
      const it = propItem(el.dataset.uid);
      if (!it) return;
      if (el.dataset.action === 'prop-time') {
        const t = el.value.slice(0, 5);
        it.start = isTime(t) ? timeToMin(t) : null;
        it.anytime = !isTime(t);
      } else {
        const m = intIn(el.value, 5, 600, null);
        if (m === null) { el.value = it.minutes; toast('Please use 5 to 600 minutes.'); return; }
        it.minutes = m;
      }
      proposal.touched = true;
      refresh();
      return;
    }
    if (el.dataset.action === 'toggle') {
      const t = findTask(el.dataset.day, el.dataset.uid);
      if (!t) return;
      markDone(el.dataset.day, t, el.checked);
      return;
    }
    const row = el.closest('.edit-row');
    if (row && el.dataset.field) {
      const item = state.lists[row.dataset.cat].find(t => t.id === row.dataset.id);
      if (!item) return;
      if (el.dataset.field === 'title') {
        const v = el.value.trim();
        if (v) item.title = v; else el.value = item.title;
      } else {
        const m = cleanMinutes(el.value, null);
        if (m) item.minutes = m; else el.value = item.minutes;
      }
      persist();
      toast('Saved.');
    }
  });

  document.addEventListener('click', e => {
    const btn = e.target.closest('button[data-action]');
    if (!btn) return;
    const a = btn.dataset.action;
    const k = todayKey();

    switch (a) {
      case 'cal-prev':
      case 'cal-next': {
        const dir = a === 'cal-next' ? 1 : -1;
        if (calView === 'month') calMonth = shiftMonth(calMonth + '-01', dir).slice(0, 7);
        else agendaStart = shift(agendaStart || k, dir * 28);
        break;
      }
      case 'cal-today':
        calMonth = k.slice(0, 7); calSelected = k; agendaStart = k;
        break;
      case 'cal-view':
        calView = btn.dataset.v === 'agenda' ? 'agenda' : 'month';
        if (calView === 'agenda') agendaStart = calMonth === k.slice(0, 7) ? k : calMonth + '-01';
        break;
      case 'cal-select': {
        calSelected = btn.dataset.date;
        if (calForm && calForm.kind === 'entry') calForm = null;
        commitForm = null;
        if (calView === 'month' && calSelected.slice(0, 7) !== calMonth) calMonth = calSelected.slice(0, 7);
        render();
        const det = $('detailsCard');
        if (det && det.scrollIntoView) det.scrollIntoView({ block: 'start', behavior: motionAllowed() ? 'smooth' : 'auto' });
        return;
      }
      case 'pattern-new': {
        openPatternForm();
        render();
        const pc = $('patternCard');
        if (pc && pc.scrollIntoView) pc.scrollIntoView({ block: 'start', behavior: motionAllowed() ? 'smooth' : 'auto' });
        return;
      }
      case 'pattern-cancel':
        calForm = null;
        break;
      case 'pattern-save':
        if (!savePattern()) return;
        break;
      case 'seg-add':
        if (calForm && calForm.segments.length < 12) calForm.segments.push({ type: 'off', count: 1 });
        break;
      case 'seg-remove':
        if (calForm && calForm.segments.length > 1) calForm.segments.splice(+btn.dataset.i, 1);
        break;
      case 'pattern-remove': {
        const v = state.rota.patterns.find(x => x.id === btn.dataset.id);
        if (!v || !confirm(`Remove the pattern change starting ${shortDate(v.effectiveFrom)}?`)) return;
        state.rota.patterns = state.rota.patterns.filter(x => x !== v);
        persist();
        onContextChanged();
        break;
      }
      case 'entry-new': {
        const d = calSelected, p = plannedFor(d), ot = btn.dataset.kind === 'overtime';
        const base = p && p.works ? (ot ? p.endDt : p.startDt) : d + 'T09:00';
        calForm = { kind: 'entry', type: ot ? 'overtime' : 'unauthorised', date: d, start: base, end: minToDt(dtToMin(base, d) + 120, d) };
        break;
      }
      case 'entry-cancel':
        calForm = null;
        break;
      case 'entry-save':
        if (!saveEntry()) return;
        break;
      case 'entry-del': {
        const e = state.rota.entries.find(x => x.id === btn.dataset.id);
        if (!e || !confirm(`Remove this ${STATUS_LABEL[e.kind].toLowerCase()}?`)) return;
        state.rota.entries = state.rota.entries.filter(x => x !== e);
        persist();
        onContextChanged();
        break;
      }
      case 'cal-appt': {
        const d = btn.dataset.date;
        commitForm = { key: uid(), id: null, kind: 'appointment', title: '', start: d + 'T09:00', end: d + 'T10:00' };
        render();
        if ($('cfTitle')) $('cfTitle').focus();
        return;
      }
      case 'cal-reset-date':
        if (!confirm('Clear the changes for this date? Overtime, absences and appointments stay.')) return;
        delete state.rota.overrides[calSelected];
        persist();
        onContextChanged();
        break;
      case 'colours-reset':
        state.rota.colours = Object.assign({}, DEFAULT_COLOURS);
        persist();
        break;
      case 'bh-refresh':
        fetchBankHolidays(true);
        return;
      case 'pay-prev': payOffset--; break;
      case 'pay-next': payOffset++; break;
      case 'pay-now': payOffset = 0; break;
      case 'theme': {
        state.settings.theme = THEMES[(THEMES.indexOf(state.settings.theme) + 1) % THEMES.length];
        persist();
        if (motionAllowed() && document.startViewTransition) document.startViewTransition(applyTheme); // soft cross-fade
        else applyTheme();
        toast(`Theme: ${THEME_LABEL[state.settings.theme]}`);
        return;
      }
      case 'motion':
        state.settings.motion = state.settings.motion === 'off' ? 'auto' : 'off';
        persist();
        applyTheme();
        toast(state.settings.motion === 'off' ? 'Animations off.' : deviceReducesMotion() ? 'Animations on — but your device asks for less motion, so they stay off.' : 'Animations on.');
        break;
      case 'timer-start':
      case 'timer-focus': {
        const t = findTask(k, btn.dataset.uid);
        if (!t || t.done) return;
        const switching = state.timer && state.timer.uid !== t.uid;
        startTimer(t.uid, a === 'timer-start' ? 'start' : 'focus', a === 'timer-start' ? 2 : t.minutes);
        if (switching) toast('Switched the timer to this task.');
        render();
        const card = $('timerCard');
        if (card && card.scrollIntoView) card.scrollIntoView({ block: 'start', behavior: motionAllowed() ? 'smooth' : 'auto' });
        return;
      }
      case 'timer-pause': {
        const t = state.timer;
        if (t && t.startedAt && !t.finished) { t.accumulatedMs += Date.now() - t.startedAt; t.startedAt = null; persist(); }
        refresh();
        return;
      }
      case 'timer-resume': {
        const t = state.timer;
        if (t && !t.startedAt && !t.finished) { t.startedAt = Date.now(); persist(); }
        refresh();
        return;
      }
      case 'timer-plus5': {
        const t = state.timer;
        if (!t) return;
        t.accumulatedMs = Math.min(t.accumulatedMs, t.durationSec * 1000);
        t.durationSec += 300;
        t.finished = false;
        t.startedAt = Date.now();
        persist();
        ensureTicking();
        refresh();
        return;
      }
      case 'timer-keep': {
        const t = state.timer, task = timerTask();
        if (!t || !task) return;
        Object.assign(t, { kind: 'focus', durationSec: Math.max(5, task.minutes - 2) * 60, accumulatedMs: 0, startedAt: Date.now(), finished: false });
        persist();
        ensureTicking();
        refresh();
        return;
      }
      case 'timer-done': {
        const task = timerTask();
        if (task && !task.done) { markDone(state.timer.dayKey, task, true); return; }
        state.timer = null;
        persist();
        ensureTicking();
        break;
      }
      case 'timer-stop':
        state.timer = null;
        persist();
        ensureTicking();
        toast("Timer stopped — that's completely fine.");
        break;
      case 'build': {
        if (state.days[k]) break;
        const energy = Number(($('energy') || {}).value) || contextFor(k).energy || 3;
        ensureContext(k).energy = energy;
        persist();
        proposal = proposeBuild(k, energy);
        render();
        scrollToProposal();
        return;
      }
      case 'review':
        if (!state.days[k] || state.days[k].rest) break;
        proposal = proposeReview(k);
        render();
        scrollToProposal();
        return;
      case 'prop-apply':
        applyProposal();
        break;
      case 'prop-cancel':
        proposal = null;
        break;
      case 'prop-edit':
        if (proposal) proposal.editing = true;
        refresh();
        return;
      case 'prop-done-edit':
        if (proposal) proposal.editing = false;
        refresh();
        return;
      case 'prop-refresh':
        proposal = proposal && proposal.mode === 'review'
          ? (state.days[k] && !state.days[k].rest ? proposeReview(k) : null)
          : (state.days[k] ? null : proposeBuild(k, contextFor(k).energy || 3));
        refresh();
        return;
      case 'prop-resuggest':
        if (!proposal) return;
        proposal.items.forEach(it => { if (!it.done && it.status === 'today') { it.start = null; it.anytime = false; } });
        placeItems(proposal);
        proposal.touched = true;
        refresh();
        return;
      case 'prop-shorten': {
        const it = propItem(btn.dataset.uid);
        if (!it || !it.maxFit) return;
        it.minutes = it.maxFit;
        it.start = null;
        placeItems(proposal);
        proposal.touched = true;
        refresh();
        return;
      }
      case 'prop-later': {
        const it = propItem(btn.dataset.uid);
        if (!it) return;
        it.status = 'later';
        it.start = null;
        it.anytime = false;
        proposal.touched = true;
        refresh();
        return;
      }
      case 'prop-keep': {
        const it = propItem(btn.dataset.uid);
        if (!it) return;
        it.status = 'today';
        it.note = null;
        it.start = null;
        placeItems(proposal);
        proposal.touched = true;
        refresh();
        return;
      }
      case 'prop-anytime': {
        const it = propItem(btn.dataset.uid);
        if (!it) return;
        it.start = null;
        it.anytime = true;
        it.reason = null;
        proposal.touched = true;
        refresh();
        return;
      }
      case 'commit-new': {
        const kind = btn.dataset.kind === 'work' ? 'work' : 'appointment';
        commitForm = Object.assign({ key: uid(), id: null, kind, title: kind === 'work' ? 'Work shift' : '' }, defaultCommitTimes(kind));
        render();
        if ($('cfTitle')) $('cfTitle').focus();
        return;
      }
      case 'commit-edit': {
        const c = state.commitments.find(x => x.id === btn.dataset.id);
        if (!c) return;
        commitForm = { key: uid(), id: c.id, kind: c.kind, title: c.title, start: c.start, end: c.end };
        render();
        return;
      }
      case 'commit-save':
        if (!saveCommitment()) return;
        onContextChanged();
        toast('Saved.');
        break;
      case 'commit-cancel':
        commitForm = null;
        break;
      case 'commit-del': {
        const c = state.commitments.find(x => x.id === btn.dataset.id);
        if (!c || !confirm(`Remove "${c.title}"?`)) return;
        state.commitments = state.commitments.filter(x => x !== c);
        persist();
        onContextChanged();
        break;
      }
      case 'skip':
        if (!state.days[k]) { proposal = null; makeRestDay(k, null); toast('Rest day it is. Your learning count is untouched.'); }
        break;
      case 'swap-rest': {
        const d = state.days[k];
        if (!d || d.tasks.some(t => t.done)) return;
        proposal = null;
        makeRestDay(k, d.energy);
        toast('Rest day it is. Anything carried over is back in your queue.');
        break;
      }
      case 'restart': {
        const d = state.days[k];
        if (!d) break;
        const msg = d.tasks.some(t => t.done)
          ? "Start today over? Today's plan and its ticks will be cleared so you can choose your energy again."
          : "Start today over? Today's plan will be cleared so you can choose your energy again.";
        if (!confirm(msg)) return;
        d.tasks.forEach(releaseTask);
        delete state.days[k];
        proposal = null;
        persist();
        break;
      }
      case 'evening':
        view = 'evening'; eveningKey = k;
        break;
      case 'evening-yesterday':
        view = 'evening'; eveningKey = shift(k, -1);
        break;
      case 'finish-evening': {
        const d = state.days[eveningKey];
        if (d) { d.checkedIn = true; persist(); }
        view = 'auto'; eveningKey = null;
        toast('All saved. See you tomorrow.');
        break;
      }
      case 'roll': {
        const t = findTask(btn.dataset.day, btn.dataset.uid);
        if (t) toggleRoll(btn.dataset.day, t);
        break;
      }
      case 'shrink':
        acceptShrink();
        break;
      case 'swap-learning':
        swapInLearning(btn.dataset.uid);
        break;
      case 'add-learning':
        swapInLearning(null);
        break;
      case 'dismiss-nudge':
        nudgeVisible = false;
        break;
      case 'edit':
        view = 'edit';
        window.scrollTo(0, 0);
        break;
      case 'back':
        view = 'auto';
        break;
      case 'add': {
        const cat = btn.dataset.cat;
        state.lists[cat].push({ id: cat[0] + uid(), title: 'New task', minutes: 20 });
        persist();
        render();
        const inputs = document.querySelectorAll(`.edit-row[data-cat="${cat}"] input.t`);
        const last = inputs[inputs.length - 1];
        if (last) { last.focus(); last.select(); }
        return;
      }
      case 'up':
      case 'down':
      case 'del': {
        const row = btn.closest('.edit-row');
        const list = state.lists[row.dataset.cat];
        const i = list.findIndex(t => t.id === row.dataset.id);
        if (i < 0) return;
        if (a === 'del') {
          if (!confirm(`Remove "${list[i].title}"? Past days keep their history.`)) return;
          list.splice(i, 1);
        } else {
          const j = a === 'up' ? i - 1 : i + 1;
          if (j < 0 || j >= list.length) return;
          [list[i], list[j]] = [list[j], list[i]];
        }
        persist();
        break;
      }
      case 'unqueue':
        state.queue = state.queue.filter(q => q.qid !== btn.dataset.qid);
        persist();
        break;
      case 'reset-lists':
        if (!confirm('Reset all three lists to the starter tasks? Your history and queue stay as they are.')) return;
        state.lists = clone(SEED);
        persist();
        toast('Lists reset.');
        break;
      case 'export':
        exportData();
        return;
      case 'import':
        $('importFile').click();
        return;
      case 'download-damaged':
        download(`myday-unreadable-${todayKey()}.json`, damagedRaw || '');
        return;
      case 'start-fresh':
        if (!confirm('Start fresh? The unreadable saved data will be replaced. Download it first if you might want it later.')) return;
        if (damagedKey && damagedKey !== STORAGE_KEY) removeKey(damagedKey);
        saveBlocked = false;
        damagedRaw = null;
        state = freshState();
        persist();
        checkNudge();
        break;
    }
    render();
  });

  // Keep the date honest: re-check when the app comes back into view and every 30 seconds (covers midnight).
  function onClock() {
    if (todayKey() !== renderedDay) { checkNudge(); render(); }
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') { checkNudge(); render(); tickTimer(); }
  });
  setInterval(onClock, 30000);
  window.addEventListener('hashchange', () => {
    const next = sectionFromHash();
    if (next !== section) { section = next; view = 'auto'; eveningKey = null; commitForm = null; calForm = null; }
    render();
    window.scrollTo(0, 0);
    if (section !== 'today') maybeFetchBankHolidays();
  });
  if (reduceQuery && reduceQuery.addEventListener) reduceQuery.addEventListener('change', () => renderFooter());

  boot();
  ensureTicking();
  checkNudge();
  render();
  if (section !== 'today') maybeFetchBankHolidays();
  if (bootNotice) toast(bootNotice);
})();
</script>
</body>
</html>
