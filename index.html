  // Chart tooltips on hover, focus or tap.
  function chartTip(e) {
    const g = e.target && e.target.closest ? e.target.closest('.ch-pt') : null;
    document.querySelectorAll('.ch-tip.show').forEach(t => { if (!g || !t.parentNode.contains(g)) t.classList.remove('show'); });
    if (!g) return;
    const fig = g.closest('.chart'), tip = fig.querySelector('.ch-tip'), fr = fig.getBoundingClientRect(), gr = g.querySelector('.ch-dot').getBoundingClientRect();
    tip.textContent = g.dataset.tip;
    tip.style.left = (gr.left - fr.left + gr.width / 2) + 'px';
    tip.style.top = (gr.top - fr.top) + 'px';
    tip.classList.add('show');
  }

  // ======================================================================
  // Study: "What should I study or revise today, given my time, energy and progress?"
  // Stored under state.study, added alongside the existing data (no existing record
  // changes, so no migration). The roadmap is a nested outline:
  //   Stage → Course → Module → Section → Task
  // Completion only ever counts tasks you've marked complete — it isn't mastery.
  // ======================================================================
  const ST = () => state.study;
  const STARTER_STAGES = ['Foundations', 'Web', 'Security Fundamentals', 'Practical Development'];
  const STUDY_LEVELS = ['stage', 'course', 'module', 'section', 'task'];
  const listOf = v => (Array.isArray(v) ? v : []);

  function emptyStudy() {
    return {
      // [{ id, title, courses: [{ id, title, url, minutes, listId, archived, modules: [{ id, title, sections: [{ id, title, tasks: [task] }] }] }] }]
      // task: { id, title, minutes, url, kind: 'learn'|'practical', note, done, doneOn }
      stages: [],
      focusCourseId: null, // the course on the dashboard (otherwise the first one with work left)
      // Concepts are shared by learning (check-ins) and revision.
      // { id, title, taskIds, createdOn, kind: 'written'|'choice', prompt, answer, explanation, choices, correct, hint, source, note,
      //   review: { reps, interval, lapses, due } }
      concepts: [],
      // Learning sessions. Time is wall-clock based, so it keeps counting while the phone sleeps.
      // { id, courseId, taskId, title, date, startedAt, plannedMin, short, status: 'active'|'done', runningSince, activeMs, endedAt,
      //   checkin: { conceptIds, clarity, takeaway, question, note } | null, taskDone: true|false|null (your answer), todayUid }
      sessions: [],
      activeId: null,      // the session in progress, if any
      // One record per answered revision question (kept even if the concept is later removed).
      // { id, conceptId, title, date, at, kind, outcome: 'right'|'partly'|'wrong'|'notsure'|null, graded: 'auto'|'self'|null,
      //   chosen, support: 'own'|'hint'|'notes', rating: 'again'|'hard'|'good', gap, due }
      reviews: [],
      settings: { vault: '', showClock: true }
    };
  }
  const CLARITY = { understand: 'Understand', partly: 'Partly understand', notyet: 'Not yet' };
  const OUTCOME = { right: 'Right', partly: 'Partly right', wrong: 'Not right', notsure: 'Not sure' };
  const SUPPORT = { own: 'On my own', hint: 'Used a hint', notes: 'Checked notes' };
  const RATING = { again: 'Again', hard: 'Hard', good: 'Good' };

  function normalizeStudy(raw, report) {
    const st = emptyStudy();
    if (!isObj(raw)) return st;
    const seen = new Set();
    // Every item needs a title, and ids must be unique across the whole outline.
    const item = (o, prefix) => {
      if (!isObj(o) || !str(o.title)) { report.dropped++; return null; }
      const id = typeof o.id === 'string' && o.id && !seen.has(o.id) ? o.id : prefix + uid();
      seen.add(id);
      return { id, title: str(o.title, 120) };
    };
    for (const sgRaw of listOf(raw.stages)) {
      const sg = item(sgRaw, 'sg');
      if (!sg) continue;
      sg.courses = [];
      for (const cRaw of listOf(sgRaw.courses)) {
        const c = item(cRaw, 'co');
        if (!c) continue;
        Object.assign(c, { url: safeUrl(str(cRaw.url, 400)), minutes: intIn(cRaw.minutes, 5, 600, 30), listId: typeof cRaw.listId === 'string' ? cRaw.listId : null, archived: cRaw.archived === true, modules: [] });
        for (const mRaw of listOf(cRaw.modules)) {
          const m = item(mRaw, 'md');
          if (!m) continue;
          m.sections = [];
          for (const sRaw of listOf(mRaw.sections)) {
            const s = item(sRaw, 'sc');
            if (!s) continue;
            s.tasks = [];
            for (const tRaw of listOf(sRaw.tasks)) {
              const t = item(tRaw, 'tk');
              if (!t) continue;
              const done = tRaw.done === true;
              Object.assign(t, { minutes: intIn(tRaw.minutes, 5, 600, 30), url: safeUrl(str(tRaw.url, 400)), kind: tRaw.kind === 'practical' ? 'practical' : 'learn', note: str(tRaw.note, 300), done, doneOn: done && isDateKey(tRaw.doneOn) ? tRaw.doneOn : null });
              s.tasks.push(t);
            }
            m.sections.push(s);
          }
          c.modules.push(m);
        }
        sg.courses.push(c);
      }
      st.stages.push(sg);
    }
    if (st.stages.some(sg => sg.courses.some(c => c.id === raw.focusCourseId))) st.focusCourseId = raw.focusCourseId;
    if (isObj(raw.settings)) { st.settings.vault = str(raw.settings.vault, 100); st.settings.showClock = raw.settings.showClock !== false; }

    const taskIds = new Set(st.stages.flatMap(sg => sg.courses.flatMap(c => tasksUnder('course', c).map(t => t.id))));
    for (const x of listOf(raw.concepts)) {
      if (!isObj(x) || !str(x.title)) { report.dropped++; continue; }
      const id = typeof x.id === 'string' && x.id && !seen.has(x.id) ? x.id : 'cp' + uid();
      seen.add(id);
      const choices = listOf(x.choices).slice(0, 6).map(c => (typeof c === 'string' ? c.trim().slice(0, 200) : ''));
      const rv = isObj(x.review) ? x.review : {};
      st.concepts.push({
        id, title: str(x.title, 120), taskIds: [...new Set(listOf(x.taskIds).filter(t => taskIds.has(t)))], createdOn: isDateKey(x.createdOn) ? x.createdOn : todayKey(),
        kind: x.kind === 'choice' ? 'choice' : 'written', prompt: str(x.prompt, 1000), answer: str(x.answer, 2000), explanation: str(x.explanation, 4000),
        choices, correct: Number.isInteger(x.correct) && choices[x.correct] ? x.correct : null, hint: str(x.hint, 500), source: str(x.source, 400), note: str(x.note, 300),
        review: { reps: intIn(rv.reps, 0, 100000, 0), interval: intIn(rv.interval, 0, 365, 0), lapses: intIn(rv.lapses, 0, 100000, 0), due: isDateKey(rv.due) ? rv.due : null }
      });
    }
    const conceptIds = new Set(st.concepts.map(c => c.id));
    for (const x of listOf(raw.sessions)) {
      if (!isObj(x) || typeof x.id !== 'string' || !x.id || seen.has(x.id) || !isDateKey(x.date)) { report.dropped++; continue; }
      seen.add(x.id);
      const ci = isObj(x.checkin) ? x.checkin : null;
      st.sessions.push({
        id: x.id, courseId: typeof x.courseId === 'string' ? x.courseId : null, taskId: typeof x.taskId === 'string' ? x.taskId : null,
        title: str(x.title, 250) || 'Study session', date: x.date, startedAt: str(x.startedAt, 20), plannedMin: intIn(x.plannedMin, 1, 600, 30), short: x.short === true,
        status: x.status === 'active' ? 'active' : 'done', runningSince: Number.isFinite(x.runningSince) ? x.runningSince : null,
        activeMs: Number.isFinite(x.activeMs) && x.activeMs >= 0 ? x.activeMs : 0, endedAt: typeof x.endedAt === 'string' ? x.endedAt : null,
        checkin: ci ? { conceptIds: listOf(ci.conceptIds).filter(c => conceptIds.has(c)), clarity: CLARITY[ci.clarity] ? ci.clarity : null, takeaway: str(ci.takeaway, 500), question: str(ci.question, 500), note: str(ci.note, 300) } : null,
        taskDone: x.taskDone === true ? true : x.taskDone === false ? false : null, todayUid: typeof x.todayUid === 'string' ? x.todayUid : null
      });
    }
    for (const x of listOf(raw.reviews)) {
      if (!isObj(x) || typeof x.conceptId !== 'string' || !isDateKey(x.date) || !RATING[x.rating]) { report.dropped++; continue; }
      const id = typeof x.id === 'string' && x.id && !seen.has(x.id) ? x.id : 'rv' + uid();
      seen.add(id);
      st.reviews.push({
        id, conceptId: x.conceptId, title: str(x.title, 120), date: x.date, at: str(x.at, 20), kind: x.kind === 'choice' ? 'choice' : 'written',
        outcome: OUTCOME[x.outcome] ? x.outcome : null, graded: x.graded === 'auto' || x.graded === 'self' ? x.graded : null,
        chosen: Number.isInteger(x.chosen) ? x.chosen : null, support: SUPPORT[x.support] ? x.support : 'own', rating: x.rating,
        gap: intIn(x.gap, 1, 180, 1), due: isDateKey(x.due) ? x.due : null
      });
    }
    // Only one session can be in progress.
    const active = st.sessions.filter(x => x.status === 'active');
    const keep = active.find(x => x.id === raw.activeId) || active[0] || null;
    for (const x of active) if (x !== keep) { x.status = 'done'; x.runningSince = null; }
    st.activeId = keep ? keep.id : null;
    return st;
  }

  // ---------- Finding things in the outline ----------
  // Every item with where it sits. Rebuilt when needed — the outline is small.
  function stIndex() {
    const ix = { stage: new Map(), course: new Map(), module: new Map(), section: new Map(), task: new Map(), courseTasks: new Map() };
    for (const sg of ST().stages) {
      ix.stage.set(sg.id, { node: sg, list: ST().stages });
      for (const c of sg.courses) {
        const tasks = [];
        ix.course.set(c.id, { node: c, stage: sg, list: sg.courses });
        for (const m of c.modules) {
          ix.module.set(m.id, { node: m, course: c, stage: sg, list: c.modules });
          for (const s of m.sections) {
            ix.section.set(s.id, { node: s, module: m, course: c, stage: sg, list: m.sections });
            for (const t of s.tasks) { ix.task.set(t.id, { node: t, section: s, module: m, course: c, stage: sg, list: s.tasks }); tasks.push(t); }
          }
        }
        ix.courseTasks.set(c.id, tasks);
      }
    }
    return ix;
  }
  function stFind(ix, id) {
    for (const level of STUDY_LEVELS) { const e = ix[level].get(id); if (e) return Object.assign({ level }, e); }
    return null;
  }
  const stChildren = { stage: 'courses', course: 'modules', module: 'sections', section: 'tasks' };
  const tasksUnder = (level, n) => (level === 'task' ? [n] : level === 'section' ? n.tasks : n[stChildren[level]].flatMap(x => tasksUnder(STUDY_LEVELS[STUDY_LEVELS.indexOf(level) + 1], x)));

  // Completion = tasks marked complete ÷ tasks added. Rounded down, so 100% only when every task is done.
  function completion(tasks) {
    const total = tasks.length, done = tasks.filter(t => t.done).length;
    return { total, done, pct: total ? Math.floor((done / total) * 100) : null };
  }
  const completionText = c => (c.total ? `${c.done} of ${c.total} task${c.total === 1 ? '' : 's'} complete (${c.pct}%)` : 'No tasks added yet');
  const barHtml = c => (c.total ? `<div class="st-bar" aria-hidden="true"><span style="width:${c.pct}%"></span></div>` : '');

  // The course on the dashboard: the one you chose, otherwise the first with work left.
  function focusCourse(ix) {
    const chosen = ix.course.get(ST().focusCourseId);
    if (chosen && !chosen.node.archived) return chosen.node;
    const live = [...ix.course.values()].map(e => e.node).filter(c => !c.archived);
    return live.find(c => ix.courseTasks.get(c.id).some(t => !t.done)) || live[0] || null;
  }
  const stNextTask = (ix, c) => ix.courseTasks.get(c.id).find(t => !t.done) || null;
  const taskPath = (ix, id) => { const e = ix.task.get(id); return e ? `${e.stage.title} › ${e.module.title} › ${e.section.title}` : ''; };

  // ---------- First-time setup (a proposal: nothing is saved until you choose) ----------
  let stSetup = null; // [{ listId, title, minutes, stage, keep }]
  // A first guess at a stage from the item's own title. You can change each one before saving.
  function stageGuess(title) {
    if (/pre-security|network|linux|basics|fundamental|intro/i.test(title)) return 'Foundations';
    if (/\bweb\b/i.test(title)) return 'Web';
    if (/bandit|wargame|ctf|project|lab\b|practical/i.test(title)) return 'Practical Development';
    if (/security/i.test(title)) return 'Security Fundamentals';
    return 'Foundations';
  }
  // "TryHackMe: Pre-Security path — one section" → "TryHackMe: Pre-Security path"
  const courseTitleFrom = t => t.replace(/\s+[—–-]\s+one\s+\w+$/i, '').trim() || t;
  function proposeSetup() {
    stSetup = state.lists.learning.map(l => ({ listId: l.id, title: courseTitleFrom(l.title), minutes: l.minutes, stage: stageGuess(l.title), keep: true }));
  }
  function applySetup(withCourses) {
    if (ST().stages.length) return; // never replace a roadmap that already exists
    const stages = STARTER_STAGES.map(title => ({ id: 'sg' + uid(), title, courses: [] }));
    if (withCourses && stSetup) {
      for (const r of stSetup) {
        if (!r.keep) continue;
        (stages.find(s => s.title === r.stage) || stages[0]).courses.push({ id: 'co' + uid(), title: r.title, url: '', minutes: r.minutes, listId: r.listId, archived: false, modules: [] });
      }
    }
    ST().stages = stages;
    stSetup = null;
    persist();
  }

  // ---------- Editing the outline ----------
  let stEdit = false;           // roadmap edit mode
  const stOpen = new Map();     // roadmap items you opened or closed (this visit)
  const newStudyItem = (level, parent) => {
    const base = { id: { stage: 'sg', course: 'co', module: 'md', section: 'sc', task: 'tk' }[level] + uid(), title: `New ${level}` };
    if (level === 'stage') return Object.assign(base, { courses: [] });
    if (level === 'course') return Object.assign(base, { url: '', minutes: 30, listId: null, archived: false, modules: [] });
    if (level === 'module') return Object.assign(base, { sections: [] });
    if (level === 'section') return Object.assign(base, { tasks: [] });
    return Object.assign(base, { minutes: parent && parent.minutes ? parent.minutes : 30, url: '', kind: 'learn', note: '', done: false, doneOn: null });
  };
  function removeStudyItem(e) {
    e.list.splice(e.list.indexOf(e.node), 1);
    const ix = stIndex();
    if (!ix.course.has(ST().focusCourseId)) ST().focusCourseId = null;
    for (const c of ST().concepts) c.taskIds = c.taskIds.filter(id => ix.task.has(id)); // concepts stay; only the links go
  }
  // Add a concept by name to a task (or reuse one with the same name).
  function conceptNamed(title, taskId) {
    let c = ST().concepts.find(x => x.title.toLowerCase() === title.toLowerCase());
    if (!c) { c = newConcept(title, taskId); ST().concepts.push(c); }
    else if (taskId && !c.taskIds.includes(taskId)) c.taskIds.push(taskId);
    return c;
  }

  // ---------- Learning sessions ----------
  const activeStudy = () => (ST().activeId ? ST().sessions.find(s => s.id === ST().activeId) || null : null);
  const sessionMs = s => s.activeMs + (s.runningSince ? Date.now() - s.runningSince : 0);
  const fmtElapsed = ms => { const t = Math.floor(ms / 1000), h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60); return (h ? h + ':' + pad(m) : pad(m)) + ':' + pad(t % 60); };
  const sessionMinutes = s => Math.round(sessionMs(s) / 60000);
  let stLength = {};  // minutes you chose for a task on the dashboard (this visit)

  // A suggested length for right now: the estimate, trimmed for low energy and to fit the free
  // time before your next shift, appointment or planned task. Always yours to change.
  function suggestLength(base) {
    const k = todayKey(), why = [];
    let m = base;
    const energy = contextFor(k).energy || (state.days[k] && state.days[k].energy) || null;
    const cap = energy ? { 1: 15, 2: 20, 3: 30 }[energy] : null;
    if (cap && m > cap) { m = cap; why.push(`energy ${energy} today`); }
    const d = state.days[k], now = nowMin(k);
    const busy = d ? d.tasks.filter(t => t.scheduledStart && !t.done).map(t => { const s = dtToMin(t.scheduledStart, k); return { start: s, end: s + t.minutes }; }) : [];
    const seg = freeSegments(k, busy).find(g => g.start <= now + 5 && g.end > now);
    if (seg) {
      const free = seg.end - Math.max(now, seg.start);
      const next = blocksFor(k).find(b => b.start === seg.end);
      const before = next ? next.label.replace(/^Prep\/travel for /, '') : seg.end === timeToMin(state.settings.latestTime) ? `${state.settings.latestTime}, your usual finish time` : 'your next plan';
      if (free < m) { m = Math.max(10, Math.floor(free / 5) * 5); why.push(`${fmtDuration(free)} free before ${before}`); }
    }
    return { minutes: Math.max(5, Math.round(m / 5) * 5 || 5), why };
  }

  function startStudySession(courseId, taskId, minutes, short) {
    if (activeStudy()) return activeStudy();
    const ix = stIndex(), c = ix.course.get(courseId), t = taskId ? ix.task.get(taskId) : null;
    if (!c) return null;
    const s = {
      id: 'ss' + uid(), courseId, taskId: t ? taskId : null, title: t ? `${c.node.title} · ${t.node.title}` : c.node.title,
      date: todayKey(), startedAt: localStamp(), plannedMin: minutes, short: !!short, status: 'active', runningSince: Date.now(), activeMs: 0,
      endedAt: null, checkin: null, taskDone: null, todayUid: null
    };
    ST().sessions.push(s);
    ST().activeId = s.id;
    persist();
    return s;
  }
  function pauseStudy(s) { if (s.runningSince) { s.activeMs += Date.now() - s.runningSince; s.runningSince = null; persist(); } }
  function resumeStudy(s) { if (!s.runningSince) { s.runningSince = Date.now(); persist(); } }
  function finishStudy(s) {
    pauseStudy(s);
    s.status = 'done';
    s.endedAt = localStamp();
    ST().activeId = null;
    persist();
  }
  // A finished session makes that day a learning day. Days are counted once, however many sessions.
  const studiedOn = k => ST().sessions.some(s => s.status === 'done' && s.date === k);

  // ---------- Check-in after a session (every part optional) ----------
  const conceptById = id => ST().concepts.find(c => c.id === id) || null;
  function ensureCheckin(s) {
    if (!s.checkin) s.checkin = { conceptIds: [], clarity: null, takeaway: '', question: '', note: '' };
    return s.checkin;
  }
  // Concepts offered in a check-in: the ones linked to this task (or this course), plus any already picked.
  function checkinConcepts(s) {
    const ix = stIndex(), ids = s.taskId ? [s.taskId] : (ix.courseTasks.get(s.courseId) || []).map(t => t.id);
    const picked = s.checkin ? s.checkin.conceptIds : [];
    return ST().concepts.filter(c => picked.includes(c.id) || c.taskIds.some(t => ids.includes(t)));
  }
  function newConcept(title, taskId) {
    return { id: 'cp' + uid(), title: title.slice(0, 120), taskIds: taskId ? [taskId] : [], createdOn: todayKey(), kind: 'written', prompt: '', answer: '', explanation: '', choices: [], correct: null, hint: '', source: '', note: '', review: { reps: 0, interval: 0, lapses: 0, due: null } };
  }
  // The learning task on today's plan that matches this course (via your learning list), if any.
  function todayTaskFor(s) {
    const c = stIndex().course.get(s.courseId), d = state.days[s.date];
    if (!c || !c.node.listId || !d || d.rest || s.date !== todayKey()) return null;
    return d.tasks.find(t => t.category === 'learning' && t.taskId === c.node.listId) || null;
  }

  // ---------- Concepts and revision ----------
  const ROUND_SIZE = 5; // questions per revision round — you can always do another round
  // A concept can come up in revision once it has a question and something to check the answer against.
  function questionReady(c) {
    if (!c.prompt) return false;
    if (c.kind === 'choice') return c.choices.filter(Boolean).length >= 2 && c.correct !== null && !!c.choices[c.correct];
    return !!(c.answer || c.explanation);
  }
  // Ready to revise: anything due today or earlier (oldest first), then ones never revised.
  // Missed days don't pile up — you only ever see one round at a time.
  function dueConcepts(k) {
    const ready = ST().concepts.filter(questionReady);
    const due = ready.filter(c => c.review.due && c.review.due <= k).sort((a, b) => (a.review.due < b.review.due ? -1 : a.review.due > b.review.due ? 1 : 0));
    return due.concat(ready.filter(c => !c.review.due));
  }
  const nextReviewDate = k => ST().concepts.filter(questionReady).map(c => c.review.due).filter(d => d && d > k).sort()[0] || null;

  // How revision is scheduled (also explained in the app). Kept simple and predictable:
  //   First review:  Again → tomorrow · Hard → in 2 days · Good → in 4 days
  //   After that:    Again → tomorrow (the gap starts over) · Hard → gap × 1.2 · Good → gap × 2.5
  //   A gap always grows by at least a day and never goes past 180 days. Dates are local calendar days.
  function nextGap(prev, rating) {
    if (rating === 'again') return 1;
    if (!prev) return rating === 'hard' ? 2 : 4;
    return Math.min(180, Math.max(prev + 1, Math.round(prev * (rating === 'hard' ? 1.2 : 2.5))));
  }

  // Cautious labels from the evidence there is. One good answer is never called mastery.
  function conceptEvidence(c) {
    const revs = ST().reviews.filter(r => r.conceptId === c.id);
    const checks = ST().sessions.filter(s => s.checkin && s.checkin.conceptIds.includes(c.id) && s.checkin.clarity);
    const clarity = checks.length ? checks[checks.length - 1].checkin.clarity : null;
    const last = revs[revs.length - 1];
    const own = revs.filter(r => r.outcome === 'right' && r.support === 'own').length;
    let status;
    if (!last) status = clarity === 'notyet' ? 'practice' : 'introduced';
    else if (last.outcome === 'wrong' || last.outcome === 'notsure' || last.rating === 'again') status = 'practice';
    else if (last.outcome === 'right' && last.support === 'own') status = 'recalled';
    else status = 'practising';
    return { status, revs, last, own, clarity };
  }
  const STATUS_TEXT = { introduced: 'Introduced', practice: 'Needs practice', practising: 'Practising', recalled: 'Recalled independently' };
  function evidenceText(ev) {
    if (!ev.last) return ev.clarity ? `Not revised yet · after learning you said “${CLARITY[ev.clarity]}”` : 'Not revised yet';
    const bits = [`${ev.revs.length} review${ev.revs.length === 1 ? '' : 's'}`, `last ${shortDate(ev.last.date)}: ${ev.last.outcome ? OUTCOME[ev.last.outcome] : 'not assessed'}${ev.last.support !== 'own' ? ` (${SUPPORT[ev.last.support].toLowerCase()})` : ''}`];
    if (ev.own) bits.push(`recalled on your own ${ev.own} time${ev.own === 1 ? '' : 's'}`);
    return bits.join(' · ') + (ev.revs.length < 3 ? ' · not enough evidence yet to say more' : '');
  }

  // Obsidian opens the note itself. MyDay can't read or change anything in your vault.
  const obsidianUrl = path => (ST().settings.vault && path ? `obsidian://open?vault=${encodeURIComponent(ST().settings.vault)}&file=${encodeURIComponent(path)}` : '');
  function noteLink(path, attrs) {
    if (!path) return '';
    const url = obsidianUrl(path);
    return url ? `<a class="btn-link" href="${esc(url)}" ${attrs || ''}>Open “${esc(path)}” in Obsidian</a>`
      : `<p class="small muted">Note: ${esc(path)} — add your vault name in <a href="#study/settings">Study settings</a> to open it from here.</p>`;
  }

  // A revision round, kept in memory: answers are only saved when you choose Again / Hard / Good.
  let revRound = null; // { day, ids, i, phase: 'ask'|'shown', typed, chosen, hint, support, outcome, results: [] }
  const freshQuestion = () => ({ phase: 'ask', typed: '', chosen: null, hint: false, support: 'own', outcome: null });
  function startRound() {
    const k = todayKey(), ids = dueConcepts(k).slice(0, ROUND_SIZE).map(c => c.id);
    revRound = ids.length ? Object.assign({ day: k, ids, i: 0, results: [] }, freshQuestion()) : null;
  }
  function rateConcept(rating) {
    const r = revRound, c = conceptById(r.ids[r.i]), k = todayKey();
    if (!c) return;
    const gap = nextGap(c.review.interval, rating);
    c.review = { reps: c.review.reps + 1, interval: gap, lapses: c.review.lapses + (rating === 'again' && c.review.reps ? 1 : 0), due: shift(k, gap) };
    ST().reviews.push({
      id: 'rv' + uid(), conceptId: c.id, title: c.title, date: k, at: localStamp(), kind: c.kind, outcome: r.outcome,
      graded: !r.outcome || r.outcome === 'notsure' ? null : c.kind === 'choice' ? 'auto' : 'self', chosen: r.chosen,
      support: r.support, rating, gap, due: c.review.due
    });
    r.results.push({ id: c.id, outcome: r.outcome, support: r.support, rating });
    r.i++;
    Object.assign(r, freshQuestion());
    persist();
  }

  // The session clock ticks without redrawing the screen.
  function studyTick() {
    const s = state && state.study && activeStudy();
    if (!s || !s.runningSince) return;
    const ms = sessionMs(s);
    if ($('stClock')) $('stClock').textContent = fmtElapsed(ms);
    if ($('stClockBar')) $('stClockBar').style.width = Math.min(100, ms / (s.plannedMin * 600)).toFixed(1) + '%';
    if ($('stReached') && !$('stReached').textContent && ms >= s.plannedMin * 60000) {
      setHTML('stReached', `<p class="timer-msg">That's the ${s.plannedMin} minutes you planned. Finish here, or keep going — either is fine.</p>`);
    }
  }

  // ---------- Views ----------
  function studyMain() {
    const r = route().slice(1), v = r[0] || 'home';
    if (v === 'roadmap') return roadmapView();
    if (v === 'course') return courseView(r[1]);
    if (v === 'task') return studyTaskView(r[1]);
    if (v === 'session') return studySessionView();
    if (v === 'checkin') return checkinView(r[1]);
    if (v === 'revise') return reviseView();
    if (v === 'concepts') return conceptsView();
    if (v === 'concept') return conceptView(r[1]);
    if (v === 'settings') return studySettingsView();
    return studyHome();
  }
  function studySide() { return ''; }

  function setupView() {
    if (!stSetup) proposeSetup();
    const opts = sel => STARTER_STAGES.map(s => `<option value="${esc(s)}" ${s === sel ? 'selected' : ''}>${esc(s)}</option>`).join('');
    return `
      <section class="card next-card">
        <span class="eyebrow">Getting started</span>
        <h2>Set up your study roadmap</h2>
        <p class="small">It's a simple outline: stages, then courses, modules, sections and tasks. MyDay doesn't fill in course contents — you add modules and sections as you reach them.</p>
        ${stSetup.length ? `
          <h3>From your learning list</h3>
          <p class="small muted">Each one becomes a course. The stages are a first guess from the titles — change any before saving.</p>
          ${stSetup.map((r, i) => `
            <div class="st-setup-row">
              <label class="check"><input type="checkbox" data-s="setup-keep" data-i="${i}" ${r.keep ? 'checked' : ''}> <span>${esc(r.title)}</span></label>
              <select data-s="setup-stage" data-i="${i}" aria-label="Stage for ${esc(r.title)}">${opts(r.stage)}</select>
            </div>`).join('')}` : ''}
        <p class="small muted">Starter stages: ${esc(STARTER_STAGES.join(', '))}. Rename, reorder or remove them any time.</p>
        <div class="stack">
          ${stSetup.length ? '<button class="primary" data-action="s-setup" data-with="1">Create my roadmap</button>' : ''}
          <button ${stSetup.length ? '' : 'class="primary"'} data-action="s-setup" data-with="0">Start with empty stages</button>
        </div>
      </section>`;
  }

  function studyHome() {
    if (!ST().stages.length) return setupView();
    const ix = stIndex(), c = focusCourse(ix);
    if (!c) {
      return `<section class="card next-card"><span class="eyebrow">Current focus</span><h2>No courses yet</h2>
        <p class="small muted">Add a course to one of your stages to get started.</p><a class="btn primary" href="#study/roadmap">Open the roadmap</a></section>`;
    }
    const t = stNextTask(ix, c), comp = completion(ix.courseTasks.get(c.id));
    const link = (t && t.url) || c.url, cur = activeStudy();
    // What a session would be: the next task, or the whole course while it has no tasks yet.
    const lengthFor = base => { const sug = suggestLength(base), key = t ? t.id : c.id; return { sug, m: stLength[key] || sug.minutes, key }; };
    const startBlock = base => {
      const { sug, m, key } = lengthFor(base);
      return `
        <div class="st-len" role="group" aria-label="Session length">
          <button class="icon-btn" data-action="s-len" data-key="${esc(key)}" data-m="${m}" data-d="-5" aria-label="5 minutes shorter" ${m <= 5 ? 'disabled' : ''}>−</button>
          <span><strong id="stLen">${m}</strong> min</span>
          <button class="icon-btn" data-action="s-len" data-key="${esc(key)}" data-m="${m}" data-d="5" aria-label="5 minutes longer" ${m >= 240 ? 'disabled' : ''}>+</button>
        </div>
        <p class="small muted" style="margin:0 0 10px">${stLength[key] ? 'Your choice.' : sug.why.length ? `Suggested: ${esc(sug.why.join(' · '))}.` : `The ${t ? 'task' : 'course'}'s usual length.`} Change it if you like.</p>
        <div class="stack">
          <button class="primary" data-action="s-start" data-course="${esc(c.id)}" data-task="${t ? esc(t.id) : ''}" data-m="${m}">Start learning · ${m} min</button>
          ${m > 15 ? `<button data-action="s-start" data-course="${esc(c.id)}" data-task="${t ? esc(t.id) : ''}" data-m="15" data-short="1">Just 15 minutes</button>` : ''}
        </div>`;
    };
    let body;
    if (cur) {
      body = `<p class="small">A session is in progress — finish or resume it before starting another.</p>`;
    } else if (t) {
      body = `<div class="st-path">${esc(taskPath(ix, t.id))}</div>
        <p class="st-next">${esc(t.title)}</p>
        <p class="small muted">About ${fmtDuration(t.minutes)}${t.kind === 'practical' ? ' · Practical' : ''}</p>
        ${startBlock(t.minutes)}`;
    } else if (!comp.total) {
      body = `<p class="small">This course has no sections or tasks yet. You can still start a session and add them later.</p>
        ${startBlock(c.minutes)}
        <a class="btn-link" href="#study/roadmap">Add its modules and sections</a>`;
    } else {
      body = `<p class="small">Every task in this course is marked complete.</p>`;
    }
    const others = [...ix.course.values()].map(e => e.node).filter(x => x !== c && !x.archived);
    return `
      ${cur ? `<section class="card next-card"><span class="eyebrow">In progress${cur.runningSince ? '' : ' · paused'}</span><h2>${esc(cur.title)}</h2>
        <p class="small muted">${sessionMinutes(cur)} min so far</p><a class="btn primary" href="#study/session">${cur.runningSince ? 'Back to the session' : 'Resume'}</a></section>` : ''}
      <section class="card next-card" id="stFocus">
        <span class="eyebrow">Current focus</span>
        <h2 class="st-course-title">${esc(c.title)}</h2>
        ${body}
        ${link ? `<a class="btn-link" href="${esc(link)}" target="_blank" rel="noopener">Open the course link ↗</a>` : ''}
      </section>
      <section class="card">
        <h3>Course completion</h3>
        <p class="small" style="margin:0">${completionText(comp)}</p>
        ${barHtml(comp)}
        <p class="small muted" style="margin:6px 0 0">Counts tasks you've marked complete — not how well you know them.</p>
      </section>
      ${revisionCard()}
      <section class="card">
        <div class="st-links"><a class="btn-link" href="#study/roadmap">Roadmap</a><a class="btn-link" href="#study/concepts">Concepts</a><a class="btn-link" href="#study/settings">Settings</a></div>
        ${others.length ? `<details><summary>Other courses (${others.length})</summary>
          ${others.map(o => `<div class="c-row"><div><strong>${esc(o.title)}</strong><div class="meta">${completionText(completion(ix.courseTasks.get(o.id)))}</div></div><div class="c-actions"><button class="inline" data-action="s-focus" data-id="${esc(o.id)}">Focus on this</button></div></div>`).join('')}
        </details>` : ''}
      </section>`;
  }

  // A small preview: concept names only (never answers), and a separate button to start.
  function revisionCard() {
    const k = todayKey(), due = dueConcepts(k), needQ = ST().concepts.filter(c => !questionReady(c)).length, nextDate = nextReviewDate(k);
    if (!ST().concepts.length) return '';
    return `
      <section class="card" id="stRevision">
        <h3>Revision</h3>
        ${due.length ? `<p class="small">Ready to revise: ${due.slice(0, 3).map(c => esc(c.title)).join(', ')}${due.length > 3 ? ' and more' : ''}.</p>
          <button data-action="s-rev-start">Start revision</button>`
          : `<p class="small muted" style="margin:0">Nothing to revise right now${nextDate ? ` — next on ${esc(shortDate(nextDate))}` : ''}.</p>`}
        ${needQ ? `<p class="small muted" style="margin:10px 0 0">${needQ} concept${needQ === 1 ? ' needs' : 's need'} a revision question. <a href="#study/concepts">Add questions</a></p>` : ''}
      </section>`;
  }

  // In edit mode every item gets a name box and move/remove buttons.
  function editBits(level, n, i, len) {
    return `<div class="st-edit">
        <input type="text" maxlength="120" data-s="title" data-id="${esc(n.id)}" value="${esc(n.title)}" aria-label="${level} name">
        <div class="c-actions">
          <button class="inline" data-action="s-move" data-id="${esc(n.id)}" data-d="-1" aria-label="Move ${esc(n.title)} up" ${i === 0 ? 'disabled' : ''}>↑</button>
          <button class="inline" data-action="s-move" data-id="${esc(n.id)}" data-d="1" aria-label="Move ${esc(n.title)} down" ${i === len - 1 ? 'disabled' : ''}>↓</button>
          <button class="inline" data-action="s-del" data-id="${esc(n.id)}" aria-label="Remove ${esc(n.title)}">✕</button>
        </div>
      </div>`;
  }
  const addBtn = (level, parentId) => `<button class="inline st-add" data-action="s-add" data-level="${level}" data-parent="${esc(parentId || '')}">+ Add a ${level}</button>`;
  const isOpen = (id, byDefault) => (stOpen.has(id) ? stOpen.get(id) : byDefault);

  function roadmapView() {
    const head = `
      <section class="card">
        <div class="card-head"><h2>Roadmap</h2><button class="inline${stEdit ? ' primary' : ''}" data-action="s-edit" aria-pressed="${stEdit}">${stEdit ? 'Done editing' : 'Edit'}</button></div>
        <p class="small muted" style="margin:6px 0 0">Stage → course → module → section → task. Completion counts tasks marked complete; it isn't a measure of mastery.</p>
      </section>`;
    if (!ST().stages.length) return head + setupView();
    const ix = stIndex(), fc = focusCourse(ix), next = fc ? stNextTask(ix, fc) : null, nextE = next && ix.task.get(next.id);
    const taskRow = (t, i, s) => stEdit
      ? `<li class="st-task">${editBits('task', t, i, s.tasks.length)}<a class="btn-link" href="#study/task/${esc(t.id)}">Details</a></li>`
      : `<li class="st-task${t.done ? ' done' : ''}">
          <label class="check"><input type="checkbox" data-s="task-done" data-id="${esc(t.id)}" ${t.done ? 'checked' : ''}><span><span class="title">${esc(t.title)}</span><span class="meta"> · ${t.minutes} min${t.kind === 'practical' ? ' · Practical' : ''}</span></span></label>
          <span class="c-actions">
            ${!t.done && !activeStudy() ? `<button class="inline" data-action="s-start" data-course="${esc(ix.task.get(t.id).course.id)}" data-task="${esc(t.id)}" data-m="${suggestLength(t.minutes).minutes}" aria-label="Start ${esc(t.title)}">Start</button>` : ''}
            <a class="btn-link" href="#study/task/${esc(t.id)}" aria-label="Details for ${esc(t.title)}">Details</a>
          </span>
        </li>`;
    const sectionHtml = (s, i, m) => `
      <div class="st-section">
        ${stEdit ? editBits('section', s, i, m.sections.length) : `<h4>${esc(s.title)}</h4>`}
        <ul class="st-tasks">${s.tasks.map((t, j) => taskRow(t, j, s)).join('')}</ul>
        ${!s.tasks.length && !stEdit ? '<p class="small muted" style="margin:0">No tasks yet.</p>' : ''}
        ${stEdit ? addBtn('task', s.id) : ''}
      </div>`;
    const moduleHtml = (m, i, c) => {
      const comp = completion(tasksUnder('module', m));
      return `
        <details class="st-node" data-node="${esc(m.id)}" ${isOpen(m.id, !!(nextE && nextE.module === m)) ? 'open' : ''}>
          <summary><span>${esc(m.title)}<span class="meta st-sum">${completionText(comp)}</span></span></summary>
          <div class="st-body">
            ${stEdit ? editBits('module', m, i, c.modules.length) : ''}
            ${m.sections.map((s, j) => sectionHtml(s, j, m)).join('') || '<p class="small muted" style="margin:0">No sections yet.</p>'}
            ${stEdit ? addBtn('section', m.id) : ''}
          </div>
        </details>`;
    };
    const courseHtml = (c, i, sg) => {
      const comp = completion(ix.courseTasks.get(c.id)), isFocus = fc && c.id === fc.id;
      return `
        <details class="st-node" data-node="${esc(c.id)}" ${isOpen(c.id, isFocus) ? 'open' : ''}>
          <summary><span><strong>${esc(c.title)}</strong>${isFocus ? ' <span class="chip">Current focus</span>' : ''}${c.archived ? ' <span class="chip">Archived</span>' : ''}<span class="meta st-sum">${completionText(comp)}</span></span></summary>
          <div class="st-body">
            ${stEdit ? editBits('course', c, i, sg.courses.length) : ''}
            ${barHtml(comp)}
            <div class="st-actions">
              ${!isFocus && !c.archived && !stEdit ? `<button class="inline" data-action="s-focus" data-id="${esc(c.id)}">Make this my focus</button>` : ''}
              ${c.url && !stEdit ? `<a class="btn-link" href="${esc(c.url)}" target="_blank" rel="noopener">Course link ↗</a>` : ''}
              <a class="btn-link" href="#study/course/${esc(c.id)}">Course details</a>
            </div>
            ${c.modules.map((m, j) => moduleHtml(m, j, c)).join('') || '<p class="small muted" style="margin:0">No modules yet. Add the course\'s own modules and sections as you reach them.</p>'}
            ${stEdit ? addBtn('module', c.id) : ''}
          </div>
        </details>`;
    };
    return head + ST().stages.map((sg, i) => {
      const comp = completion(tasksUnder('stage', sg));
      return `
        <section class="card">
          ${stEdit ? editBits('stage', sg, i, ST().stages.length) : `<h2>${esc(sg.title)}</h2>`}
          ${comp.total ? `<p class="small muted" style="margin:0">${completionText(comp)}</p>` : ''}
          ${sg.courses.map((c, j) => courseHtml(c, j, sg)).join('') || '<p class="small muted" style="margin:6px 0 0">No courses in this stage yet.</p>'}
          ${stEdit ? addBtn('course', sg.id) : ''}
        </section>`;
    }).join('') + (stEdit ? `<section class="card">${addBtn('stage', '')}</section>` : '');
  }

  // One focused screen while you learn: what you're on, the time, and Pause / Finish.
  function studySessionView() {
    const s = activeStudy();
    if (!s) return '<section class="card"><h2>No session in progress</h2><p class="small muted">Start one from your Study dashboard.</p><a class="btn" href="#study">Back to Study</a></section>';
    const ix = stIndex(), t = s.taskId ? ix.task.get(s.taskId) : null, c = ix.course.get(s.courseId);
    const link = (t && t.node.url) || (c && c.node.url), ms = sessionMs(s), clock = ST().settings.showClock;
    return `
      <section class="card next-card st-session">
        <span class="eyebrow">Learning${s.runningSince ? '' : ' · paused'}${s.date !== todayKey() ? ` · started ${esc(shortDate(s.date))}` : ''}</span>
        ${t ? `<div class="st-path">${esc(c.node.title)} › ${esc(t.section.title)}</div><h2>${esc(t.node.title)}</h2>` : `<h2>${esc(c ? c.node.title : s.title)}</h2>`}
        ${link ? `<a class="btn-link" href="${esc(link)}" target="_blank" rel="noopener">Open the resource ↗</a>` : ''}
        ${clock ? `<div class="st-clock" id="stClock" role="timer" aria-live="off">${fmtElapsed(ms)}</div>
          <p class="small muted" style="text-align:center;margin:0">${s.short ? 'Short session' : 'Planned'}: ${s.plannedMin} min</p>
          <div class="st-bar" aria-hidden="true"><span id="stClockBar" style="width:${Math.min(100, (ms / (s.plannedMin * 60000)) * 100).toFixed(1)}%"></span></div>` : ''}
        <div id="stReached">${ms >= s.plannedMin * 60000 ? `<p class="timer-msg">That's the ${s.plannedMin} minutes you planned. Finish here, or keep going — either is fine.</p>` : ''}</div>
        <div class="stack" style="margin-top:12px">
          <button class="primary" data-action="${s.runningSince ? 's-pause' : 's-resume'}">${s.runningSince ? 'Pause' : 'Resume'}</button>
          <button data-action="s-finish">Finish session</button>
        </div>
        <label class="check"><input type="checkbox" data-s="show-clock" ${clock ? 'checked' : ''}> Show the clock</label>
        <div class="st-actions"><a class="btn-link" href="#study">Back to Study — it keeps ${s.runningSince ? 'running' : 'your place'}</a><button class="link-btn" data-action="s-discard">Discard this session</button></div>
      </section>`;
  }

  function checkinView(id) {
    const s = ST().sessions.find(x => x.id === id);
    if (!s || s.status !== 'done') return '<section class="card"><h2>Session not found</h2><a class="btn" href="#study">Back to Study</a></section>';
    const ix = stIndex(), t = s.taskId ? ix.task.get(s.taskId) : null, ci = s.checkin || { conceptIds: [], clarity: null, takeaway: '', question: '', note: '' };
    const offered = checkinConcepts(s), todayT = todayTaskFor(s);
    const choice = (action, value, label, on) => `<button class="${on ? 'on' : ''}" data-action="${action}" data-v="${value}" aria-pressed="${on}">${label}</button>`;
    return `
      <section class="card">
        <span class="eyebrow">Session finished · ${fmtDuration(Math.max(1, sessionMinutes(s)))}</span>
        <h2>Quick check-in</h2>
        <p class="small muted">Everything here is optional, and it saves as you go. Skip it whenever you like.</p>
        ${t ? `
          <h3>Is “${esc(t.node.title)}” complete?</h3>
          <div class="seg st-seg">${choice('s-ci-task', 1, 'Yes, it\'s complete', s.taskDone === true)}${choice('s-ci-task', 0, 'Not yet', s.taskDone === false)}</div>` : ''}
        <h3>What did you cover?</h3>
        ${offered.length ? `<div class="chip-row">${offered.map(c => `<button class="inline st-pick${ci.conceptIds.includes(c.id) ? ' on' : ''}" data-action="s-ci-concept" data-id="${esc(c.id)}" aria-pressed="${ci.conceptIds.includes(c.id)}">${esc(c.title)}</button>`).join('')}</div>` : '<p class="small muted">No concepts linked to this yet.</p>'}
        <div class="inline-add"><label class="sr-only" for="ciNew">Add a concept</label><input id="ciNew" type="text" maxlength="120" placeholder="Add a concept, e.g. DNS records" enterkeyhint="done"><button class="inline" data-action="s-ci-add">Add</button></div>
        <p class="small muted">Picking a concept just records that you covered it. Its revision question and answer are added separately — nothing is filled in for you.</p>
        <h3>How clear does it feel?</h3>
        <div class="seg st-seg">${Object.keys(CLARITY).map(k => choice('s-ci-clarity', k, CLARITY[k], ci.clarity === k)).join('')}</div>
        <details ${ci.takeaway || ci.question || ci.note ? 'open' : ''}><summary>Add a takeaway, a question or a note link</summary>
          <div class="field"><label class="lbl" for="ciTake">One-line takeaway</label><input id="ciTake" type="text" maxlength="500" data-s="ci-takeaway" data-id="${esc(s.id)}" value="${esc(ci.takeaway)}"></div>
          <div class="field"><label class="lbl" for="ciQ">Something still unclear</label><input id="ciQ" type="text" maxlength="500" data-s="ci-question" data-id="${esc(s.id)}" value="${esc(ci.question)}"></div>
          <div class="field"><label class="lbl" for="ciNote">Obsidian note (path in your vault)</label><input id="ciNote" type="text" maxlength="300" data-s="ci-note" data-id="${esc(s.id)}" value="${esc(ci.note)}" placeholder="e.g. Networking/DNS"></div>
        </details>
        ${todayT ? (todayT.done || s.todayUid ? `<p class="small">“${esc(todayT.title)}” is ticked on today's plan.</p>` : `<button data-action="s-tick-today" data-id="${esc(s.id)}">Also tick “${esc(todayT.title)}” on today's plan</button>`) : ''}
        <div class="row2"><button class="primary" data-action="s-ci-done" data-id="${esc(s.id)}">Done</button><button class="ghost" data-action="s-ci-skip" data-id="${esc(s.id)}">Skip</button></div>
      </section>`;
  }

  // ---------- Revision: one question at a time; the answer isn't on the page until you ask for it ----------
  function reviseView() {
    const k = todayKey();
    if (revRound && revRound.day !== k) revRound = null;
    const r = revRound;
    if (!r || r.i >= r.ids.length) {
      const due = dueConcepts(k), nextDate = nextReviewDate(k), needQ = ST().concepts.filter(c => !questionReady(c)).length;
      const done = r && r.results.length ? `
        <section class="card next-card">
          <span class="eyebrow">Round finished</span>
          <h2>${r.results.length} reviewed</h2>
          <p class="small">Recalled on your own: ${r.results.filter(x => x.outcome === 'right' && x.support === 'own').length}. Each one is scheduled to come back when it's due.</p>
        </section>` : '';
      return `
        <section class="card"><a class="btn-link" href="#study">‹ Study</a><h2>Revision</h2>
          <p class="small muted" style="margin:0">Retrieving what you've learned, one question at a time. Rounds of ${ROUND_SIZE} — stop whenever you like; nothing piles up.</p></section>
        ${done}
        <section class="card">
          ${due.length ? `<p class="small">${due.length > ROUND_SIZE ? `A round of ${ROUND_SIZE} is ready.` : `${due.length} ready to revise.`}</p>
            <button class="primary" data-action="s-rev-start">${r && r.results.length ? 'Do another round' : 'Start revision'}</button>`
            : `<p class="small">Nothing to revise right now.${nextDate ? ` The next review is on ${esc(shortDate(nextDate))}.` : ''}</p>`}
          ${needQ ? `<p class="small muted" style="margin:10px 0 0">${needQ} concept${needQ === 1 ? ' needs' : 's need'} a revision question before ${needQ === 1 ? 'it' : 'they'} can come up. <a href="#study/concepts">Add questions</a></p>` : ''}
        </section>
        <section class="card"><details><summary>How revision is scheduled</summary>
          <p class="small">First review: <strong>Again</strong> → tomorrow · <strong>Hard</strong> → in 2 days · <strong>Good</strong> → in 4 days.</p>
          <p class="small">After that: Again → tomorrow (the gap starts over) · Hard → the last gap × 1.2 · Good → the last gap × 2.5. Gaps always grow by at least a day and stop at 180 days.</p>
          <p class="small muted" style="margin:0">Dates are saved on this device. Concepts never revised come after any that are due.</p>
        </details></section>`;
    }
    const c = conceptById(r.ids[r.i]);
    if (!c) { r.i++; return reviseView(); }
    const shown = r.phase === 'shown', notes = obsidianUrl(c.note);
    const choiceBtn = (text, i) => {
      if (!shown) return `<button class="st-choice" data-action="s-rev-choose" data-i="${i}">${esc(text)}</button>`;
      const right = i === c.correct, mine = i === r.chosen;
      return `<div class="st-choice shown${right ? ' right' : ''}${mine && !right ? ' wrong' : ''}">${right ? '✓ ' : mine ? '✗ ' : ''}${esc(text)}${mine ? ' <span class="meta">(your choice)</span>' : ''}</div>`;
    };
    const gapLabel = rating => { const g = nextGap(c.review.interval, rating); return g === 1 ? 'tomorrow' : `in ${g} days`; };
    return `
      <section class="card next-card st-q">
        <div class="card-head"><span class="eyebrow">Question ${r.i + 1} of ${r.ids.length}</span><a class="btn-link" href="#study">Stop for now</a></div>
        <div class="st-path">${esc(c.title)}</div>
        <h2 class="st-prompt">${esc(c.prompt)}</h2>
        ${c.kind === 'choice' ? `<div class="stack">${c.choices.map((t, i) => (t ? choiceBtn(t, i) : '')).join('')}</div>`
          : shown ? (r.typed ? `<div class="st-yours"><span class="lbl">Your answer</span><p>${esc(r.typed)}</p></div>` : '')
          : `<label class="lbl" for="revTyped">Your answer (optional — you can just think it)</label><textarea id="revTyped" rows="3" data-s="rev-typed">${esc(r.typed)}</textarea>`}
        ${!shown && c.hint ? (r.hint ? `<p class="small st-hint">Hint: ${esc(c.hint)}</p>` : '<button class="link-btn" data-action="s-rev-hint">Show a hint</button>') : ''}
        ${!shown ? `
          <div class="stack" style="margin-top:12px">
            ${c.kind === 'written' ? '<button class="primary" data-action="s-rev-show">Show the answer</button>' : ''}
            <button class="ghost" data-action="s-rev-notsure">Not sure</button>
          </div>
          ${notes ? `<a class="btn-link" href="${esc(notes)}" data-rev-notes="1">Check my notes in Obsidian</a>` : ''}` : `
          ${c.kind === 'choice' ? `<p class="st-verdict">${r.outcome === 'right' ? 'Correct — matches the stored answer.' : r.outcome === 'wrong' ? 'Not this time — the stored answer is marked ✓.' : 'Not sure — the stored answer is marked ✓.'}</p>`
            : `<div class="st-answer"><span class="lbl">Answer</span><p>${esc(c.answer || '—')}</p></div>`}
          ${c.explanation ? `<div class="st-answer"><span class="lbl">Explanation</span><p>${esc(c.explanation)}</p></div>` : ''}
          ${c.source ? `<p class="small muted">Source: ${safeUrl(c.source) ? `<a href="${esc(c.source)}" target="_blank" rel="noopener">${esc(c.source)}</a>` : esc(c.source)}</p>` : ''}
          ${noteLink(c.note)}
          ${c.kind === 'written' && r.outcome !== 'notsure' ? `
            <h3>How did your answer compare?</h3>
            <div class="seg st-seg">${['right', 'partly', 'wrong'].map(o => `<button class="${r.outcome === o ? 'on' : ''}" data-action="s-rev-self" data-v="${o}" aria-pressed="${r.outcome === o}">${OUTCOME[o]}</button>`).join('')}</div>
            <p class="small muted">Self-assessed — MyDay doesn't mark written answers.</p>` : ''}
          <h3>How did you answer?</h3>
          <div class="seg st-seg">${Object.keys(SUPPORT).map(o => `<button class="${r.support === o ? 'on' : ''}" data-action="s-rev-support" data-v="${o}" aria-pressed="${r.support === o}">${SUPPORT[o]}</button>`).join('')}</div>
          <h3>When should it come back?</h3>
          <div class="st-rate">${Object.keys(RATING).map(o => `<button class="${o === 'good' ? 'primary' : ''}" data-action="s-rev-rate" data-v="${o}">${RATING[o]}<span class="meta">${gapLabel(o)}</span></button>`).join('')}</div>`}
      </section>`;
  }

  function conceptsView() {
    const list = ST().concepts, needQ = list.filter(c => !questionReady(c));
    const row = c => { const ev = conceptEvidence(c); return `<div class="c-row"><div><a href="#study/concept/${esc(c.id)}"><strong>${esc(c.title)}</strong></a><div class="meta">${STATUS_TEXT[ev.status]}${questionReady(c) && c.review.due ? ` · next review ${esc(shortDate(c.review.due))}` : ''}</div></div></div>`; };
    return `
      <section class="card">
        <a class="btn-link" href="#study">‹ Study</a>
        <div class="card-head"><h2>Concepts</h2><button class="inline" data-action="s-concept-new">+ New</button></div>
        <p class="small muted" style="margin:6px 0 0">Shared by learning and revision. Labels are cautious — one good answer isn't mastery.</p>
      </section>
      ${needQ.length ? `<section class="card"><h3>Need a revision question (${needQ.length})</h3><p class="small muted">Add a question and an answer or explanation, and they'll come up in revision. Nothing is written for you.</p>${needQ.map(row).join('')}</section>` : ''}
      <section class="card"><h3>All concepts (${list.length})</h3>${list.length ? list.map(row).join('') : '<p class="small muted" style="margin:0">Concepts you add after a session, or here, appear in this list.</p>'}</section>`;
  }

  function conceptView(id) {
    const c = conceptById(id);
    if (!c) return '<section class="card"><h2>Concept not found</h2><a class="btn" href="#study/concepts">Back to concepts</a></section>';
    const ix = stIndex(), ev = conceptEvidence(c), ready = questionReady(c);
    const linked = c.taskIds.map(t => ix.task.get(t)).filter(Boolean), others = [...ix.task.values()].filter(e => !c.taskIds.includes(e.node.id));
    const field = (key, label, value, rows, ph) => `<div class="field"><label class="lbl" for="cp-${key}">${label}</label>${rows
      ? `<textarea id="cp-${key}" rows="${rows}" data-s="cp-${key}" data-id="${esc(c.id)}" ${ph ? `placeholder="${esc(ph)}"` : ''}>${esc(value)}</textarea>`
      : `<input id="cp-${key}" type="text" maxlength="400" data-s="cp-${key}" data-id="${esc(c.id)}" value="${esc(value)}" ${ph ? `placeholder="${esc(ph)}"` : ''}>`}</div>`;
    const checks = ST().sessions.filter(s => s.checkin && s.checkin.conceptIds.includes(c.id));
    return `
      <section class="card">
        <a class="btn-link" href="#study/concepts">‹ Concepts</a>
        <h2>${esc(c.title)}</h2>
        <p class="small"><span class="chip">${STATUS_TEXT[ev.status]}</span> ${esc(evidenceText(ev))}</p>
        ${ready ? '' : '<p class="stale small">Needs a revision question: add a question, plus an answer or explanation (or the choices for multiple choice). MyDay won\'t write these for you.</p>'}
        ${field('title', 'Name', c.title)}
        <div class="field"><label class="lbl" for="cp-kind">Question type</label><select id="cp-kind" data-s="cp-kind" data-id="${esc(c.id)}"><option value="written" ${c.kind === 'written' ? 'selected' : ''}>Written answer (you check it yourself)</option><option value="choice" ${c.kind === 'choice' ? 'selected' : ''}>Multiple choice (checked against the answer you mark)</option></select></div>
        ${field('prompt', 'Revision question', c.prompt, 2)}
        ${c.kind === 'written' ? field('answer', 'Answer', c.answer, 3) : `
          <fieldset class="st-choices"><legend class="lbl">Choices — mark the correct one</legend>
            ${[0, 1, 2, 3].map(i => `<div class="st-choice-edit"><input type="radio" name="cpCorrect" data-s="cp-correct" data-id="${esc(c.id)}" value="${i}" ${c.correct === i ? 'checked' : ''} aria-label="Choice ${i + 1} is correct"><input type="text" maxlength="200" data-s="cp-choice" data-i="${i}" data-id="${esc(c.id)}" value="${esc(c.choices[i] || '')}" aria-label="Choice ${i + 1}"></div>`).join('')}
          </fieldset>`}
        ${field('explanation', 'Explanation', c.explanation, 3)}
        <details ${c.hint || c.source || c.note ? 'open' : ''}><summary>Hint, source and notes</summary>
          ${field('hint', 'Hint (optional)', c.hint)}
          ${field('source', 'Source (optional — a link or a book/course name)', c.source)}
          ${field('note', 'Obsidian note (path in your vault)', c.note, 0, 'e.g. Networking/DNS')}
          ${noteLink(c.note)}
        </details>
      </section>
      <section class="card">
        <h3>Linked learning tasks</h3>
        ${linked.length ? linked.map(e => `<div class="c-row"><div>${esc(e.node.title)}<div class="meta">${esc(e.course.title)}</div></div><div class="c-actions"><button class="inline" data-action="s-cp-unlink" data-id="${esc(c.id)}" data-task="${esc(e.node.id)}" aria-label="Unlink ${esc(e.node.title)}">✕</button></div></div>`).join('') : '<p class="small muted" style="margin:0">Not linked to a task.</p>'}
        ${others.length ? `<div class="inline-add"><select id="cpLink" aria-label="Task to link">${others.map(e => `<option value="${esc(e.node.id)}">${esc(`${e.course.title} › ${e.node.title}`)}</option>`).join('')}</select><button class="inline" data-action="s-cp-link" data-id="${esc(c.id)}">Link</button></div>` : ''}
      </section>
      <section class="card">
        <h3>History</h3>
        ${ev.revs.length ? `<ul class="plain-list">${ev.revs.slice().reverse().map(x => `<li>${esc(shortDate(x.date))} · ${x.outcome ? OUTCOME[x.outcome] : 'Not assessed'}${x.graded === 'self' ? ' (self-assessed)' : ''} · ${SUPPORT[x.support]} · ${RATING[x.rating]}</li>`).join('')}</ul>` : '<p class="small muted">No revision yet.</p>'}
        ${checks.length ? `<p class="small muted" style="margin:8px 0 0">After learning: ${checks.map(s => `${esc(shortDate(s.date))}${s.checkin.clarity ? ` — ${CLARITY[s.checkin.clarity]}` : ''}`).join(' · ')}</p>` : ''}
      </section>
      <section class="card"><button class="ghost" data-action="s-cp-del" data-id="${esc(c.id)}">Remove this concept</button>
        <p class="small muted" style="margin:8px 0 0">Its past reviews stay in your study history.</p></section>`;
  }

  function studySettingsView() {
    const st = ST().settings;
    return `
      <section class="card">
        <a class="btn-link" href="#study">‹ Study</a>
        <h2>Study settings</h2>
        <div class="field"><label class="lbl" for="stVault">Obsidian vault name (optional)</label><input id="stVault" type="text" maxlength="100" data-s="vault" value="${esc(st.vault)}" placeholder="e.g. Notes"></div>
        <p class="small muted">With a vault name, note paths on tasks, concepts and check-ins get an “Open in Obsidian” link. Obsidian opens the note itself — MyDay can't read or change anything in your vault, and Study works fine without it.</p>
        <label class="check"><input type="checkbox" data-s="show-clock" ${st.showClock ? 'checked' : ''}> Show the clock during learning sessions</label>
      </section>`;
  }

  function courseView(id) {
    const ix = stIndex(), e = ix.course.get(id);
    if (!e) return '<section class="card"><h2>Course not found</h2><a class="btn" href="#study/roadmap">Back to the roadmap</a></section>';
    const c = e.node, comp = completion(ix.courseTasks.get(id)), fc = focusCourse(ix);
    const listItem = c.listId ? state.lists.learning.find(l => l.id === c.listId) : null;
    return `
      <section class="card">
        <a class="btn-link" href="#study/roadmap">‹ Roadmap</a>
        <h2>${esc(c.title)}</h2>
        <p class="small" style="margin:0">${completionText(comp)}</p>
        ${barHtml(comp)}
        <div class="field"><label class="lbl" for="coTitle">Name</label><input id="coTitle" type="text" maxlength="120" data-s="title" data-id="${esc(c.id)}" value="${esc(c.title)}"></div>
        <div class="field"><label class="lbl" for="coUrl">Course link (optional)</label><input id="coUrl" type="url" maxlength="400" data-s="url" data-id="${esc(c.id)}" value="${esc(c.url)}" placeholder="https://"></div>
        <div class="field"><label class="lbl" for="coMin">Usual session length (minutes)</label><input id="coMin" type="number" inputmode="numeric" min="5" max="600" data-s="minutes" data-id="${esc(c.id)}" value="${c.minutes}"></div>
        <div class="field"><label class="lbl" for="coStage">Stage</label><select id="coStage" data-s="course-stage" data-id="${esc(c.id)}">${ST().stages.map(sg => `<option value="${esc(sg.id)}" ${sg === e.stage ? 'selected' : ''}>${esc(sg.title)}</option>`).join('')}</select></div>
        <label class="check"><input type="checkbox" data-s="archived" data-id="${esc(c.id)}" ${c.archived ? 'checked' : ''}> Archived — keep it, but leave it off the dashboard</label>
