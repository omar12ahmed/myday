        ${open.some(t => t.fromQueue) ? '<p class="small muted" style="margin:10px 0 0">Anything that was carried over goes back to your queue.</p>' : ''}
      </section>`;
  }

  function renderStreak() {
    if (view === 'edit') { $('streak').innerHTML = ''; return; }
    const k = todayKey(), s = windowDays(), n = s.filter(Boolean).length;
    const tiles = s.map((on, i) => {
      const day = shift(k, i - 6);
      const name = parseKey(day).toLocaleDateString(undefined, { weekday: 'narrow' });
      const full = parseKey(day).toLocaleDateString(undefined, { weekday: 'long' });
      return `<div class="wd${on ? ' on' : ''}${i === 6 ? ' today' : ''}${i === 6 && on && justLearned ? ' just' : ''}" title="${esc(full)}${on ? ': learning done' : ''}"><span class="pip">${on ? '✓' : ''}</span><span class="dl">${esc(name)}</span></div>`;
    }).join('');
    $('streak').innerHTML = `
      <section class="card">
        <div class="streak">
          <strong>Learning days in the last 7: ${n}</strong>
        </div>
        <div class="week" aria-hidden="true">${tiles}</div>
        <p class="muted small" style="margin:0">A rolling count of today and the 6 days before. Missed days and rest days never reset it to zero — older days simply slide out of the window.</p>
      </section>`;
  }

  function renderFooter() {
    $('footer').innerHTML = view === 'edit' ? '' : `
      <div class="row2">
        <button class="ghost inline full" data-action="edit">Edit task lists</button>
        <button class="ghost inline" data-action="export">Export my data</button>
        <button class="ghost inline" data-action="import">Import my data</button>
        <button class="ghost inline full" data-action="motion" aria-pressed="${state.settings.motion !== 'off'}">${
          state.settings.motion === 'off' ? 'Animations: Off' : deviceReducesMotion() ? 'Animations: Off (your device asks for less motion)' : 'Animations: On'}</button>
      </div>
      <p class="storage-note">${storageAvailable ? 'Saved only in this browser.' : 'Saving is unavailable in this browser.'}</p>`;
  }

  function queueNote(prefix) {
    if (!state.queue.length) return '';
    return `<p class="muted small" style="margin-top:12px">${prefix}</p>
      <ul class="queue-list">${state.queue.map(q => `<li>${esc(q.title)}</li>`).join('')}</ul>`;
  }

  // ---------- Context card ----------
  function sleepSummary(k) {
    const sl = contextFor(k).sleep;
    if (sl.start && sl.end) {
      if (sl.end <= sl.start) return 'The wake-up time needs to be after the time you fell asleep — check the days.';
      const m = dtToMin(sl.end, k) - dtToMin(sl.start, k);
      if (m > 1440) return "That's more than 24 hours — check the days.";
      const at = dt => `${relDay(dt.slice(0, 10), k) || 'today'} ${dt.slice(11)}`;
      return `${fmtDuration(m)} of sleep (${at(sl.start)} → ${at(sl.end)}). Tasks won't be suggested while you were asleep.`;
    }
    if (sl.start || sl.end) return 'Add both times to use them — or just give a rough estimate below.';
    if (sl.estimatedHours) return `About ${sl.estimatedHours} h of sleep (your estimate).`;
    return 'Optional. Just for your own record, and so tasks are never suggested while you were asleep.';
  }

  function reviewHint(k) {
    const d = state.days[k];
    if (!d || d.rest) return '';
    const ctx = contextFor(k), bits = [];
    if (ctx.energy && d.energy && ctx.energy !== d.energy) bits.push(`Your energy is now ${ctx.energy} (the plan was made for ${d.energy}).`);
    if (d.tasks.some(t => !t.done && t.scheduledStart && conflictsFor(k, dtToMin(t.scheduledStart, k), t.minutes, [], false).length)) {
      bits.push('Something on today\'s plan now overlaps your commitments.');
    }
    return bits.length ? bits.join(' ') + ' Tap “Review my plan” to see suggested changes.' : '';
  }

  function commitmentRows(list, k) {
    return list.map(c => `
      <div class="c-row">
        <div>
          <span class="chip ${c.kind}">${KIND_LABEL[c.kind]}</span>
          <div class="title">${esc(c.title)}</div>
          <div class="meta">${esc(fmtRange(c.start, c.end, k))}</div>
        </div>
        <div class="c-actions">
          <button class="inline" data-action="commit-edit" data-id="${esc(c.id)}">Edit</button>
          <button class="inline" data-action="commit-del" data-id="${esc(c.id)}" aria-label="Remove ${esc(c.title)}">✕</button>
        </div>
      </div>`).join('');
  }

  function commitFormHtml() {
    const f = commitForm;
    return `
      <div class="c-form" id="cForm" data-key="${f.key}">
        <h4 style="margin-top:0">${f.id ? 'Edit commitment' : f.kind === 'work' ? 'New work shift' : 'New appointment'}</h4>
        <div class="field"><label class="lbl" for="cfKind">Type</label>
          <select id="cfKind"><option value="work" ${f.kind === 'work' ? 'selected' : ''}>Work shift</option><option value="appointment" ${f.kind === 'appointment' ? 'selected' : ''}>Appointment</option></select></div>
        <div class="field"><label class="lbl" for="cfTitle">Title</label><input id="cfTitle" type="text" value="${esc(f.title)}" placeholder="${f.kind === 'work' ? 'Work shift' : 'e.g. Dentist'}"></div>
        <div class="field"><label class="lbl" for="cfStart">Starts</label><input id="cfStart" type="datetime-local" value="${esc(f.start)}"></div>
        <div class="field"><label class="lbl" for="cfEnd">Ends</label><input id="cfEnd" type="datetime-local" value="${esc(f.end)}"></div>
        <p class="small muted" style="margin-top:-4px">A night shift can end the next day — just pick the next date.</p>
        <p class="warn" id="cfError" role="alert"></p>
        <div class="row2">
          <button class="primary" data-action="commit-save">Save</button>
          <button class="ghost" data-action="commit-cancel">Cancel</button>
        </div>
      </div>`;
  }
  function snapshotCommitForm() {
    if (!commitForm || !$('cForm') || $('cForm').dataset.key !== commitForm.key) return;
    commitForm.kind = $('cfKind').value;
    commitForm.title = $('cfTitle').value;
    commitForm.start = $('cfStart').value.slice(0, 16);
    commitForm.end = $('cfEnd').value.slice(0, 16);
  }

  function contextCard(k) {
    const ctx = contextFor(k), sl = ctx.sleep, st = state.settings, y = shift(k, -1);
    const d = state.days[k];
    const dateOpts = sel => {
      const opts = [y, k];
      if (sel && !opts.includes(sel)) opts.unshift(sel);
      return opts.map(x => `<option value="${x}" ${x === sel ? 'selected' : ''}>${x === y ? 'Yesterday' : x === k ? 'Today' : shortDate(x)}</option>`).join('');
    };
    const energy = ctx.energy || (d && d.energy) || 3;
    const todays = commitmentsOn(k);
    const rotaToday = rotaWorkBlocks(k).filter(c => dtToMin(c.end, k) > 0 && dtToMin(c.start, k) < 1440);
    const upcoming = state.commitments.filter(c => !todays.includes(c) && c.start.slice(0, 10) > k);
    const inner = `
      <div class="ctx-block">
        <h3>Sleep</h3>
        <div class="field-row">
          <div class="field"><label class="lbl" for="ssd">Fell asleep</label>
            <select id="ssd" data-ctx="sleep">${dateOpts(sl.start ? sl.start.slice(0, 10) : y)}</select>
            <input id="sst" type="time" data-ctx="sleep" value="${sl.start ? sl.start.slice(11) : ''}" aria-label="Time you fell asleep"></div>
          <div class="field"><label class="lbl" for="sed">Woke up</label>
            <select id="sed" data-ctx="sleep">${dateOpts(sl.end ? sl.end.slice(0, 10) : k)}</select>
            <input id="set" type="time" data-ctx="sleep" value="${sl.end ? sl.end.slice(11) : ''}" aria-label="Time you woke up"></div>
        </div>
        <div class="field"><label class="lbl" for="sest">Don't know the times? A rough estimate in hours (optional)</label>
          <input id="sest" type="number" inputmode="decimal" min="0" max="24" step="0.25" data-ctx="sleep" value="${sl.estimatedHours ?? ''}"></div>
        <p class="small muted" id="sleepSummary" style="margin:0"></p>
      </div>
      <div class="ctx-block">
        <h3>Energy</h3>
        <div class="energy-value" id="energyLabel">${energy} · ${ENERGY_LABEL[energy]}</div>
        <input type="range" min="1" max="5" step="1" value="${energy}" id="energy" aria-label="Energy from 1 to 5" style="--fill:${(energy - 1) * 25}%">
        <div class="ticks"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span></div>
        <p class="small muted" style="margin:0">Your rating is always yours — MyDay never changes it based on sleep or anything else.</p>
      </div>
      <div class="ctx-block">
        <h3>Work &amp; appointments today</h3>
        ${todays.length ? commitmentRows(todays, k) : rotaToday.length ? '' : '<p class="small muted" style="margin:0">Nothing booked today.</p>'}
        ${rotaToday.length ? `<p class="small" style="margin:8px 0 0">From your rota: ${rotaToday.map(c => `${esc(c.title)} ${esc(fmtRange(c.start, c.end, k))}`).join(', ')} · <a href="#calendar">change it in Calendar</a></p>` : ''}
        ${commitForm ? commitFormHtml() : `
        <div class="row2">
          <button class="inline" data-action="commit-new" data-kind="work">+ Work shift</button>
          <button class="inline" data-action="commit-new" data-kind="appointment">+ Appointment</button>
        </div>`}
        ${upcoming.length ? `<details><summary>Coming up on other days (${upcoming.length})</summary>${commitmentRows(upcoming, k)}</details>` : ''}
      </div>
      <div class="ctx-block">
        <h3>Prep &amp; travel</h3>
        <div class="inline-field">
          <input id="bufferMinutes" type="number" inputmode="numeric" min="0" max="240" step="5" data-setting="bufferMinutes" value="${st.bufferMinutes}" aria-label="Prep and travel minutes">
          <span class="small">min before and after each commitment</span>
        </div>
        <details>
          <summary>More scheduling settings</summary>
          <div class="field-row">
            <div class="field"><label class="lbl" for="earliestTime">Earliest task time</label><input id="earliestTime" type="time" data-setting="earliestTime" value="${st.earliestTime}"></div>
            <div class="field"><label class="lbl" for="latestTime">Finish tasks by</label><input id="latestTime" type="time" data-setting="latestTime" value="${st.latestTime}"></div>
          </div>
          <div class="inline-field">
            <input id="gapMinutes" type="number" inputmode="numeric" min="0" max="60" step="5" data-setting="gapMinutes" value="${st.gapMinutes}" aria-label="Breathing room minutes">
            <span class="small">min breathing room between tasks</span>
          </div>
        </details>
      </div>
      ${d && !d.rest ? `
      <div class="ctx-block">
        <p class="small" id="reviewHint"></p>
        <button class="primary" data-action="review">Review my plan</button>
      </div>` : ''}`;
    if (d) {
      return `<details class="card" id="ctxDetails" ${contextOpen || commitForm ? 'open' : ''}><summary><h2>My day's context</h2></summary>${inner}</details>`;
    }
    return `<section class="card"><h2>My day's context</h2><p class="muted small">Fill in whatever helps — all of it is optional.</p>${inner}</section>`;
  }

  // ---------- At a glance ----------
  function glanceCard(k) {
    const st = state.settings, d = state.days[k];
    let tasks = [];
    if (d) {
      tasks = d.tasks.filter(t => t.scheduledStart).map(t => {
        const s = dtToMin(t.scheduledStart, k);
        return { start: s, end: s + t.minutes, title: t.title, sub: t.done ? 'Done' : CAT_LABEL[t.category], cls: `g-task cat-${t.category}` };
      });
    } else if (proposal) {
      tasks = proposal.items.filter(i => i.status === 'today' && i.start !== null)
        .map(i => ({ start: i.start, end: i.start + i.minutes, title: i.task.title, sub: 'Proposed', cls: `g-task g-proposed cat-${i.task.category}` }));
    }
    const rows = [];
    for (const bl of blocksFor(k)) {
      if (bl.type === 'buffer' || bl.end <= 0 || bl.start >= 1440) continue;
      if (bl.type === 'sleep') {
        if (bl.start <= 0) rows.push({ at: bl.end, time: minToTime(bl.end), label: 'Woke up', sub: '', cls: 'g-sleep' });
        else rows.push({ at: bl.start, time: minToTime(bl.start), label: 'Sleep', sub: bl.end > 1440 ? 'until ' + minToTime(bl.end) + ' tomorrow' : 'until ' + minToTime(bl.end), cls: 'g-sleep' });
        continue;
      }
      const c = bl.c;
      rows.push({
        at: Math.max(bl.start, 0), time: fmtRange(c.start, c.end, k), label: c.title,
        sub: (c.rota ? 'From your rota · ' : c.title === KIND_LABEL[c.kind] ? '' : KIND_LABEL[c.kind] + ' · ') + (st.bufferMinutes ? `${st.bufferMinutes} min prep/travel before and after` : 'No prep/travel time'), cls: `g-commit kind-${c.kind}`
      });
    }
    for (const t of tasks) rows.push({ at: t.start, time: rangeMin(t.start, t.end), label: t.title, sub: t.sub, cls: t.cls });
    for (const g of freeSegments(k, tasks)) {
      // Skip short gaps (e.g. the breathing room between tasks) to keep the timeline calm.
      if (g.end - g.start >= 15) rows.push({ at: g.start, time: rangeMin(g.start, g.end), label: 'Available', sub: fmtDuration(g.end - g.start), cls: 'g-free' });
    }
    rows.sort((a, b) => a.at - b.at);
    return `
      <section class="card">
        <h2>Today at a glance</h2>
        ${rows.length ? `<ul class="glance">${rows.map(r => `
          <li class="${r.cls}"><div class="g-time">${esc(r.time)}</div><div class="g-rail" aria-hidden="true"><span class="g-dot"></span></div><div><div class="g-label">${esc(r.label)}</div>${r.sub ? `<div class="g-sub">${esc(r.sub)}</div>` : ''}</div></li>`).join('')}</ul>`
          : '<p class="muted small">No commitments, and no free time left in today\'s task window.</p>'}
        <p class="muted small" style="margin:12px 0 0">Tasks are suggested between ${st.earliestTime} and ${st.latestTime}${st.gapMinutes ? `, with ${st.gapMinutes} min breathing room between them` : ''}.</p>
      </section>`;
  }

  // ---------- Morning actions ----------
  function buildActions(k) {
    return `
      <section class="card">
        <div class="stack">
          <button class="primary" data-action="build">Build my day</button>
          <button data-action="skip">Skip today — make it a rest day</button>
        </div>
        <p class="muted small" style="margin:12px 0 0">Building shows a proposal first — nothing is saved until you apply it. A rest day never resets your learning count.</p>
        ${queueNote('Waiting in your queue (picked first, within today\'s limit):')}
      </section>`;
  }
  function yesterdayCard(k) {
    const yd = state.days[shift(k, -1)];
    const open = yd && !yd.rest && !yd.checkedIn && yd.tasks.some(t => !t.done && !t.rolledQid);
    return open ? `
      <section class="card">
        <p class="small muted">Yesterday's check-in is still open, if you'd like to tick things off or roll them forward first.</p>
        <button data-action="evening-yesterday">Open yesterday's check-in</button>
      </section>` : '';
  }

  // ---------- Proposal ----------
  function proposalCard(animate) {
    const p = proposal, k = p.dayKey, isReview = p.mode === 'review', limit = limitFor(p.energy);
    const order = it => (it.status !== 'today' ? 3e6 : it.start !== null ? it.start : it.done ? -1 : 2e6);
    const items = p.items.slice().sort((a, b) => order(a) - order(b));
    const placed = p.items.filter(i => i.status === 'today' && i.start !== null);
    const empty = !p.items.length;
    return `
      <section class="card proposal" id="proposalCard">
        <span class="eyebrow">Not saved yet</span>
        <h2>${isReview ? 'Proposed changes' : 'Proposed plan'}</h2>
        <p class="muted small">Energy ${p.energy} · room for ${limit} task${limit === 1 ? '' : 's'}. Nothing is saved until you ${isReview ? 'apply the changes' : 'apply it'}.</p>
        ${p.stale ? `<div class="stale"><p class="small" style="margin:0 0 8px">Your context changed after you edited this proposal.</p><button class="inline" data-action="prop-refresh">Start a fresh proposal</button></div>` : ''}
        ${isReview && !propChanges(p) ? '<p class="small">Everything still fits — nothing needs to change.</p>' : ''}
        ${empty ? '<p class="small muted">There\'s nothing to suggest — your task lists are empty. Applying makes today a rest day.</p>' : ''}
        <ul class="tasks">${items.map((it, i) => propRow(it, p, placed, animate ? i : -1)).join('')}</ul>
        <div class="stack" style="margin-top:14px">
          ${p.editing
            ? '<button class="primary" data-action="prop-done-edit">Done editing</button><button data-action="prop-resuggest">Re-suggest all times</button>'
            : `<button class="primary" data-action="prop-apply">${isReview ? 'Apply changes' : 'Apply this plan'}</button>${empty ? '' : '<button data-action="prop-edit">Edit</button>'}`}
          <button class="ghost" data-action="prop-cancel">${isReview ? 'Cancel — keep my plan as it is' : 'Cancel'}</button>
        </div>
      </section>`;
  }

  function changeText(it) {
    if (it.done) return 'Done — kept exactly as it is.';
    if (it.isNew) return it.status === 'today' ? `New — ${it.note || 'added to today'}.` : '';
    if (it.status === 'later') return '';
    const o = it.orig;
    if (o.start === it.start && o.minutes === it.minutes) return 'No change.';
    const was = o.start !== null ? rangeMin(o.start, o.start + o.minutes) : 'no set time';
    return `Was ${was}${o.minutes !== it.minutes ? ` (${o.minutes} min)` : ''}.`;
  }

  function propRow(it, p, placed, staggerIndex) {
    const k = p.dayKey, t = it.task;
    const when = it.status === 'later' ? 'Later'
      : it.start !== null ? rangeMin(it.start, it.start + it.minutes)
      : it.done ? 'Done' : it.anytime ? 'Any time today' : 'No time yet';
    const bits = [minutesLabel(it.minutes, t.baseMinutes, t.shrunk && it.minutes === t.minutes)];
    if (t.fromQueue) bits.push('carried over');
    const change = p.mode === 'review' ? changeText(it) : '';
    const others = placed.filter(o => o !== it).map(o => ({ start: o.start, end: o.start + o.minutes, label: o.task.title }));
    const warns = it.status === 'today' && it.start !== null && !it.done ? conflictsFor(k, it.start, it.minutes, others, true) : [];
    const unplaced = it.status === 'today' && it.start === null && !it.done && !it.anytime && it.reason;
    const editable = !it.done && it.status === 'today';
    return `
      <li class="prop-item cat-${t.category}${it.status === 'later' ? ' later' : ''}${staggerIndex >= 0 ? ' stagger" style="--i:' + staggerIndex : ''}">
        <div class="prop-when">${esc(when)}</div>
        <span class="chip ${t.category}">${CAT_LABEL[t.category]}</span>
        <div class="title">${esc(t.title)}</div>
        <div class="meta">${esc(bits.join(' · '))}</div>
        ${change ? `<div class="change">${esc(change)}</div>` : ''}
        ${warns.map(w => `<div class="warn">⚠ ${esc(w)}</div>`).join('')}
        ${unplaced ? `
          <p class="why">Unscheduled: ${esc(it.reason)}</p>
          <div class="row2">
            ${it.maxFit ? `<button class="inline" data-action="prop-shorten" data-uid="${it.uid}">Shorten to ${it.maxFit} min</button>` : ''}
            <button class="inline" data-action="prop-later" data-uid="${it.uid}">Leave for later</button>
          </div>` : ''}
        ${it.anytime && it.status === 'today' && !it.done ? '<p class="why">No set time — do it whenever suits you today.</p>' : ''}
        ${it.status === 'later' ? `
          <p class="why">${esc(it.note ? it.note + ' ' : '')}It'll wait in your queue for another day.</p>
          <button class="inline" data-action="prop-keep" data-uid="${it.uid}">Keep it today</button>` : ''}
        ${p.editing && editable ? `
          <div class="edit-ctl">
            <div class="field-row">
              <div class="field"><label class="lbl" for="pt-${it.uid}">Start</label><input id="pt-${it.uid}" type="time" data-action="prop-time" data-uid="${it.uid}" value="${it.start !== null ? minToTime(it.start) : ''}"></div>
              <div class="field"><label class="lbl" for="pm-${it.uid}">Minutes</label><input id="pm-${it.uid}" type="number" inputmode="numeric" min="5" max="600" step="5" data-action="prop-minutes" data-uid="${it.uid}" value="${it.minutes}"></div>
            </div>
            <div class="row2" style="margin-top:0">
              <button class="inline" data-action="prop-anytime" data-uid="${it.uid}">No set time</button>
              <button class="inline" data-action="prop-later" data-uid="${it.uid}">Leave for later</button>
            </div>
          </div>` : ''}
      </li>`;
  }

  // ---------- Plan ----------
  function energyLine(d) {
    if (d.rest) return 'Rest day. Nothing is required, and nothing is lost.';
    if (d.energy <= 2) return 'Low-energy day — one small thing is plenty.';
    if (d.energy === 3) return 'Medium energy — two things, no rush.';
    return 'Good energy — three things, and stopping early is still fine.';
  }

  function restCard() {
    return `
      <ul class="tasks"><li>
        <div class="task static cat-rest">
          <span class="rest-icon" aria-hidden="true"></span>
          <div>
            <span class="chip rest">Rest</span>
            <div class="title">Rest. That's the whole plan.</div>
            <div class="meta">Nothing to tick off today.</div>
          </div>
        </div>
      </li></ul>`;
  }

  function taskRow(t, dayKey, withRoll, nextUid) {
    const bits = [];
    if (t.scheduledStart) bits.push(`${t.scheduledStart.slice(11)}–${t.scheduledEnd.slice(11)}`);
    bits.push(minutesLabel(t.minutes, t.baseMinutes, t.shrunk));
    if (t.fromQueue) bits.push('carried over');
    let warn = '';
    if (!t.done && t.scheduledStart && dayKey === todayKey()) {
      const c = conflictsFor(dayKey, dtToMin(t.scheduledStart, dayKey), t.minutes, [], false);
      if (c.length) warn = `<div class="warn">⚠ ${esc(c[0])} — “Review my plan” can find a new time.</div>`;
    }
    return `
      <li>
        <label class="task cat-${t.category}${t.done ? ' done' : ''}${t.uid === justDoneUid ? ' just-done' : ''}">
          <input type="checkbox" data-action="toggle" data-uid="${t.uid}" data-day="${dayKey}" ${t.done ? 'checked' : ''}>
          <span class="box"></span>
          <div>
            <span class="chip ${t.category}">${CAT_LABEL[t.category]}</span>
            <div class="title">${esc(t.title)}</div>
            <div class="meta">${esc(bits.join(' · '))}</div>
            ${warn}
          </div>
        </label>
        ${!withRoll && !t.done && dayKey === todayKey() ? `
        <div class="task-actions">
          <button class="inline${t.uid === nextUid ? '' : ' ghost'}" data-action="timer-start" data-uid="${t.uid}">Just start · 2 min</button>
          <button class="inline ghost" data-action="timer-focus" data-uid="${t.uid}">Focus · ${t.minutes} min</button>
        </div>` : ''}
        ${withRoll && !t.done ? `
        <div class="roll">
          <button class="inline${t.rolledQid ? ' on' : ''}" data-action="roll" data-uid="${t.uid}" data-day="${dayKey}">
            ${t.rolledQid ? '✓ Rolling to tomorrow' : 'Roll to tomorrow'}
          </button>
        </div>` : ''}
      </li>`;
  }

  function sortedTasks(d) {
    const timed = d.tasks.filter(t => t.scheduledStart).sort((a, b) => (a.scheduledStart < b.scheduledStart ? -1 : 1));
    return { timed, untimed: d.tasks.filter(t => !t.scheduledStart) };
  }

  function tasksHtml(d, k, withRoll) {
    const { timed, untimed } = sortedTasks(d);
    const next = withRoll ? null : nextTask(k, d);
    const nextUid = next ? next.uid : null;
    return `<ul class="tasks">${timed.map(t => taskRow(t, k, withRoll, nextUid)).join('')}</ul>
      ${untimed.length ? `${timed.length ? '<h4>Any time today</h4>' : ''}<ul class="tasks"${timed.length ? ' style="margin-top:0"' : ''}>${untimed.map(t => taskRow(t, k, withRoll, nextUid)).join('')}</ul>` : ''}`;
  }

  const compactDuration = m => { const h = Math.floor(m / 60), r = m % 60; return h ? (r ? `${h}h ${r}m` : `${h}h`) : `${r}m`; };
  // The task to show as "next": the first open timed task that isn't over yet, else any open task.
  function nextTask(k, d) {
    const open = d.tasks.filter(t => !t.done);
    const timed = open.filter(t => t.scheduledStart).sort((a, b) => (a.scheduledStart < b.scheduledStart ? -1 : 1));
    const now = nowMin(k);
    return timed.find(t => dtToMin(t.scheduledStart, k) + t.minutes > now) || timed[0] || open[0] || null;
  }
  function planStats(k, d) {
    const total = d.tasks.length, done = d.tasks.filter(t => t.done).length;
    const next = nextTask(k, d);
    const nextV = next ? (next.scheduledStart ? next.scheduledStart.slice(11) : 'Any time') : 'All done';
    const nextS = next ? next.title : 'for today';
    const nextKey = nextV + '|' + nextS;
    const changed = lastNext !== null && lastNext !== nextKey && motionAllowed();
    lastNext = nextKey;
    const busy = d.tasks.filter(t => t.scheduledStart).map(t => { const s = dtToMin(t.scheduledStart, k); return { start: s, end: s + t.minutes }; });
    const free = freeSegments(k, busy).reduce((a, g) => a + g.end - g.start, 0);
    return `
      <div class="stats">
        <div class="stat"><div class="stat-l">Done</div><div class="stat-v">${done} of ${total}</div><div class="stat-s">${done === total ? 'Lovely' : 'So far'}</div></div>
        <div class="stat"><div class="stat-l">Next</div><div class="stat-v${changed ? ' changed' : ''}">${esc(nextV)}</div><div class="stat-s">${esc(nextS)}</div></div>
        <div class="stat"><div class="stat-l">Free</div><div class="stat-v">${compactDuration(free)}</div><div class="stat-s">left today</div></div>
      </div>`;
  }

  function planCard(k) {
    const d = state.days[k];
    const anyDone = d.tasks.some(t => t.done);
    const secondary = [];
    if (!d.rest) secondary.push('<button class="ghost inline" data-action="review">Review my plan</button>');
    if (!d.rest && !anyDone) secondary.push('<button class="ghost inline" data-action="swap-rest">Swap for a rest day</button>');
    secondary.push('<button class="ghost inline" data-action="restart">Start today over</button>');
    if (secondary.length % 2) secondary[secondary.length - 1] = secondary[secondary.length - 1].replace('class="ghost inline"', 'class="ghost inline full"');
    return `
      <section class="card">
        <h2>${d.rest ? 'Today is a rest day' : "Here's your day"}</h2>
        <p class="muted small">${energyLine(d)}</p>
        ${!d.rest && d.tasks.length ? planStats(k, d) : ''}
        ${d.rest ? restCard() : d.tasks.length ? tasksHtml(d, k, false) : '<p class="small muted">Nothing on today\'s list — everything is waiting in your queue.</p>'}
        ${d.rest ? '' : `
        <div class="stack" style="margin-top:14px">
          <button class="primary" data-action="evening">Evening check-in</button>
        </div>`}
        <div class="row2">${secondary.join('')}</div>
        ${queueNote(d.rest ? 'Your queue is waiting safely for another day:' : 'Still waiting in your queue for a later day:')}
      </section>`;
  }

  function summary(d) {
    if (d.rest) return 'Rest day — resting was the plan, and that counts.';
    const n = d.tasks.length, done = d.tasks.filter(t => t.done).length;
    if (!n) return 'Nothing was planned.';
    if (done === n) return n === 1
      ? '1 of 1 done — that was the whole plan, and you did it.'
      : `${done} of ${n} done — that's the whole plan. Go easy on yourself tonight.`;
    if (done === 0) return `0 of ${n} done — some days are like that. Rolling it forward is exactly how this is supposed to work.`;
    return `${done} of ${n} done — rolling the rest forward is exactly how this is supposed to work.`;
  }

  function eveningView(k) {
    const d = state.days[k], isToday = k === todayKey();
    return `
      <section class="card">
        <h2>${isToday ? 'Evening check-in' : "Yesterday's check-in"}</h2>
        <p class="muted small">Tick what got done. Anything else can simply roll forward.</p>
        ${d.rest ? restCard() : tasksHtml(d, k, true)}
        <div class="summary">${summary(d)}</div>
        <button class="primary" data-action="finish-evening">All set</button>
      </section>`;
  }

  function editView() {
    const counts = sessionCounts();
    const section = cat => `
      <section class="card">
        <h3>${CAT_LABEL[cat]}${cat === 'learning' ? ' — roadmap order, repeats after the last' : ''}</h3>
        ${state.lists[cat].map((t, i) => `
          <div class="edit-row" data-cat="${cat}" data-id="${esc(t.id)}">
            <input class="t" type="text" data-field="title" value="${esc(t.title)}" aria-label="Task name">
            <div class="count">${cat === 'learning' ? 'Sessions completed' : 'Times done'}: ${counts[t.id] || 0}</div>
            <input class="m" data-field="minutes" type="number" inputmode="numeric" min="1" max="600" value="${t.minutes}" aria-label="Minutes">
            <span class="minlabel">min</span>
            <button data-action="up" aria-label="Move up" ${i === 0 ? 'disabled' : ''}>↑</button>
            <button data-action="down" aria-label="Move down" ${i === state.lists[cat].length - 1 ? 'disabled' : ''}>↓</button>
            <button data-action="del" aria-label="Remove">✕</button>
          </div>`).join('')}
        <button class="inline" style="margin-top:10px" data-action="add" data-cat="${cat}">+ Add a ${CAT_LABEL[cat].toLowerCase()} task</button>
      </section>`;
    return `
      <section class="card">
        <h2>Your task lists</h2>
        <p class="muted small">Changes save automatically and apply from the next day you build.</p>
        <button class="primary" data-action="back">Done</button>
      </section>
      ${CATS.map(section).join('')}
      <section class="card">
        <h3>Queue</h3>
        ${state.queue.length ? state.queue.map(q => `
          <div class="q-row">
            <span>${esc(q.title)} <span class="muted small">· from ${esc(prettyDate(q.queuedOn))}</span></span>
            <button class="inline" data-action="unqueue" data-qid="${esc(q.qid)}">Remove</button>
          </div>`).join('') : '<p class="muted small" style="margin:0">Nothing waiting.</p>'}
      </section>
      <button class="ghost" data-action="reset-lists">Reset to the starter lists</button>`;
  }

  // ======================================================================
  // Motion, focus timer, celebration and the learning garden
  // ======================================================================
  const reduceQuery = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
  const deviceReducesMotion = () => !!(reduceQuery && reduceQuery.matches);
  const motionAllowed = () => state.settings.motion !== 'off' && !deviceReducesMotion();
  let justDoneUid = null;   // task that was just ticked: plays the tick animation once
  let justLearned = false;  // a learning session was just completed: grows the garden
  let lastScreen = null;    // for the fade between screens
  let lastNext = null;      // for the "Next" tile update

  // ---------- Focus timer (wall-clock based, so it keeps time while the phone sleeps) ----------
  const RING_C = 2 * Math.PI * 52;
  let timerInterval = null;
  function fmtClock(ms) {
    const s = Math.ceil(ms / 1000), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = s % 60;
    return (h ? h + ':' + pad(m) : pad(m)) + ':' + pad(r);
  }
  function timerRemainingMs(t) {
    const elapsed = t.accumulatedMs + (t.startedAt ? Date.now() - t.startedAt : 0);
    return Math.max(0, t.durationSec * 1000 - elapsed);
  }
  function timerTask() {
    const t = state.timer, d = t && state.days[t.dayKey];
    return d ? d.tasks.find(x => x.uid === t.uid) || null : null;
  }
  // The timer only belongs to an open task on today's plan; anything else is cleared.
  function activeTimer() {
    const t = state.timer;
    if (!t) return null;
    const task = timerTask();
    if (t.dayKey !== todayKey() || !task || task.done) { state.timer = null; persist(); ensureTicking(); return null; }
    return t;
  }
  function ensureTicking() {
    if (state.timer && !timerInterval) timerInterval = setInterval(tickTimer, 1000);
    if (!state.timer && timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  }
  function startTimer(uid, kind, minutes) {
    state.timer = { uid, dayKey: todayKey(), kind, durationSec: Math.max(1, minutes) * 60, startedAt: Date.now(), accumulatedMs: 0, finished: false };
    persist();
    ensureTicking();
  }
  function tickTimer() {
    const t = state.timer;
    if (!t) { ensureTicking(); return; }
    if (!t.finished && t.startedAt && timerRemainingMs(t) <= 0) {
      t.finished = true;
      t.accumulatedMs = t.durationSec * 1000;
      t.startedAt = null;
      persist();
      try { if (navigator.vibrate) navigator.vibrate(120); } catch (e) { /* not supported */ }
      setHTML('slot-timer', timerCard());
      return;
    }
    const el = $('timerTime'), ring = $('ringFill');
    if (!el || !ring) return;
    const rem = timerRemainingMs(t);
    el.textContent = fmtClock(rem);
    ring.style.strokeDashoffset = (RING_C * (1 - rem / (t.durationSec * 1000))).toFixed(2);
  }

  function timerCard() {
    const t = activeTimer();
    if (!t) return '';
    const task = timerTask();
    const rem = timerRemainingMs(t), total = t.durationSec * 1000;
    const paused = !t.startedAt && !t.finished;
    const isStart = t.kind === 'start';
    let body;
    if (t.finished && isStart) {
      body = `<p class="timer-msg">Two minutes done — you started, and that's the hardest part.</p>
        <div class="stack" style="margin-top:12px">
          <button class="primary" data-action="timer-keep">Keep going · ${Math.max(5, task.minutes - 2)} min</button>
          <div class="row2" style="margin-top:0"><button data-action="timer-done">Tick it off</button><button class="ghost" data-action="timer-stop">Stop here</button></div>
        </div>`;
    } else if (t.finished) {
      body = `<p class="timer-msg">Time's up — nice focus. Tick it off, or keep going if you like.</p>
        <div class="stack" style="margin-top:12px">
          <button class="primary" data-action="timer-done">Tick it off</button>
          <div class="row2" style="margin-top:0"><button data-action="timer-plus5">+5 minutes</button><button class="ghost" data-action="timer-stop">Stop timer</button></div>
        </div>`;
    } else {
      body = `<div class="stack">
          <button class="primary" data-action="${paused ? 'timer-resume' : 'timer-pause'}">${paused ? 'Resume' : 'Pause'}</button>
          <div class="row2" style="margin-top:0"><button data-action="timer-done">Tick it off</button><button class="ghost" data-action="timer-stop">Stop</button></div>
        </div>`;
    }
    return `
      <section class="card timer-card cat-${task.category}" id="timerCard">
        <span class="eyebrow">${isStart ? 'Just start' : 'Focus'}</span>
        <div class="timer-wrap">
          <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
            <circle class="ring-track" cx="60" cy="60" r="52"/>
            <circle class="ring-fill" id="ringFill" cx="60" cy="60" r="52" stroke-dasharray="${RING_C.toFixed(2)}" style="stroke-dashoffset:${(RING_C * (1 - rem / total)).toFixed(2)}"/>
          </svg>
          <div class="ring-center"><div class="ring-time" id="timerTime" role="timer">${fmtClock(rem)}</div><div class="ring-sub">${t.finished ? 'done' : paused ? 'paused' : 'left'}</div></div>
        </div>
        <div class="title">${esc(task.title)}</div>
        <p class="muted small" style="margin:4px 0 14px">${isStart ? 'Just two minutes. You can stop after — starting is the hard part.' : 'One thing at a time. Stopping early is completely fine.'}</p>
        ${body}
      </section>`;
  }

  // ---------- Ticking a task off (checkbox or timer) ----------
  function markDone(dayKey, t, done) {
    setDone(t, done);
    let celebrateNow = false;
    if (done) {
      if (state.timer && state.timer.uid === t.uid) { state.timer = null; ensureTicking(); }
      justDoneUid = t.uid;
      if (t.category === 'learning') justLearned = true;
      const d = state.days[dayKey];
      if (dayKey === todayKey() && d && !d.rest && d.tasks.length && d.tasks.every(x => x.done) && state.celebratedOn !== dayKey) {
        state.celebratedOn = dayKey; // once a day, however often things are re-ticked
        celebrateNow = true;
      }
      persist();
      toast(celebrateNow ? "That's the whole plan — lovely." : 'Nice. That counts.');
    }
    render();
    if (celebrateNow) celebrate();
  }

  // A soft, short burst of colour from the plan card. Skipped entirely when motion is off.
  function celebrate() {
    if (!motionAllowed()) return;
    const card = document.querySelector('#slot-plan .card') || document.querySelector('#app .card');
    if (!card) return;
    const r = card.getBoundingClientRect();
    const layer = document.createElement('div');
    layer.className = 'burst';
    layer.setAttribute('aria-hidden', 'true');
    layer.style.left = (r.left + r.width / 2) + 'px';
    layer.style.top = Math.min(window.innerHeight - 80, Math.max(90, r.top + 70)) + 'px';
    const colours = ['--learning', '--admin', '--health', '--rest', '--primary', '--appt'];
    for (let i = 0; i < 18; i++) {
      const a = (i / 18) * Math.PI * 2 + Math.random() * 0.3, dist = 70 + Math.random() * 60;
      const dot = document.createElement('span');
      dot.style.setProperty('--dx', (Math.cos(a) * dist).toFixed(1) + 'px');
      dot.style.setProperty('--dy', (Math.sin(a) * dist).toFixed(1) + 'px');
      dot.style.background = `var(${colours[i % colours.length]})`;
      dot.style.animationDelay = Math.round(Math.random() * 80) + 'ms';
      layer.appendChild(dot);
    }
    document.body.appendChild(layer);
    setTimeout(() => layer.remove(), 1600);
  }

  // ---------- Learning garden: one leaf per session, five leaves make a flower. It never shrinks. ----------
  // Ticked learning tasks plus finished Study sessions. A session that also ticked a Today task counts once.
  function learningSessions() {
    let n = 0;
    for (const d of Object.values(state.days)) for (const t of d.tasks) if (t.category === 'learning' && t.done) n++;
    return n + state.study.sessions.filter(s => s.status === 'done' && !s.todayUid).length;
  }
  function gardenCard() {
    const n = learningSessions(), flowers = Math.floor(n / 5), leaves = n % 5;
    const shown = Math.min(flowers, 18);
    const back = [], front = [];
    for (let i = 0; i < shown; i++) {
      const row = i < 9 ? 0 : 1, col = i % 9;
      const x = row ? 29 + col * 22 : 18 + col * 22;
      const base = row ? 110 : 120, top = base - (row ? 24 : 34);
      const petals = [0, 1, 2, 3, 4].map(p => {
        const a = (p * 72 - 90) * Math.PI / 180;
        return `<circle cx="${(x + Math.cos(a) * 4.6).toFixed(1)}" cy="${(top + Math.sin(a) * 4.6).toFixed(1)}" r="4.2"/>`;
      }).join('');
      let flower = `<g class="gd-flower"><line class="gd-stem" x1="${x}" y1="${base}" x2="${x}" y2="${top}"/><g class="pf-${i % 4}">${petals}</g><circle class="gd-center" cx="${x}" cy="${top}" r="2.6"/></g>`;
      if (justLearned && leaves === 0 && i === flowers - 1) flower = `<g class="gd-grow" style="transform-origin:50% 100%">${flower}</g>`;
      (row ? back : front).push(flower);
    }
    const sx = 276, sb = 116, sprout = [];
    if (n === 0) sprout.push(`<ellipse class="gd-seed" cx="${sx}" cy="${sb - 2}" rx="6" ry="4"/>`);
    else {
      const h = 16 + leaves * 14;
      sprout.push(`<line class="gd-stem" x1="${sx}" y1="${sb + 4}" x2="${sx}" y2="${sb - h}"/>`);
      for (let j = 0; j < leaves; j++) {
        const side = j % 2 ? 1 : -1, y = sb - 12 - j * 14, cx = sx + side * 9;
        const leaf = `<ellipse class="gd-leaf" cx="${cx}" cy="${y}" rx="9" ry="4.2" transform="rotate(${side * -28} ${cx} ${y})"/>`;
        sprout.push(justLearned && j === leaves - 1 ? `<g class="gd-grow" style="transform-origin:${side < 0 ? '100%' : '0%'} 50%">${leaf}</g>` : leaf);
      }
      sprout.push(`<circle class="gd-bud" cx="${sx}" cy="${sb - h}" r="3"/>`);
    }
    const plural = (x, one, many) => `${x} ${x === 1 ? one : many}`;
    const caption = n === 0
      ? 'Each learning session you finish grows a leaf, and five leaves make a flower. It only ever grows.'
      : `${plural(n, 'learning session', 'learning sessions')} so far · ${plural(flowers, 'flower', 'flowers')} and a sprout with ${plural(leaves, 'leaf', 'leaves')}. Missed days never take anything away.`;
    return `
      <section class="card garden">
        <h2>Your learning garden</h2>
        <svg viewBox="0 30 320 100" role="img" aria-label="${esc(caption)}">
          <path class="gd-ground" d="M0 116 Q160 104 320 116 L320 130 L0 130 Z"/>
          ${flowers > 18 ? `<text class="gd-more" x="6" y="46">+${flowers - 18} more flowers</text>` : ''}
          ${back.join('')}${front.join('')}${sprout.join('')}
        </svg>
        <p class="muted small" style="margin:0" id="gardenCaption">${esc(caption)}</p>
      </section>`;
  }
  function renderGarden() { $('garden').innerHTML = view === 'edit' ? '' : gardenCard(); }

  // ======================================================================
  // Navigation
  // ======================================================================
  const navSvg = body => `<svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${body}</svg>`;
  const SECTIONS = [
    { id: 'today', label: 'Today', ready: true, icon: navSvg('<circle cx="12" cy="12" r="9"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/>') },
    { id: 'calendar', label: 'Calendar', ready: true, icon: navSvg('<rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>') },
    { id: 'pay', label: 'Pay', ready: true, icon: navSvg('<path d="M15.5 6.5A4 4 0 0 0 8.5 9v3.5c0 2.5-1 4.5-2.5 5.5h12M6.5 12.5h7"/>') },
    { id: 'health', label: 'Health', ready: true, icon: navSvg('<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>') },
    { id: 'study', label: 'Study', ready: true, icon: navSvg('<path d="M3 5.5c2.7-1.6 5.7-1.6 9 .6 3.3-2.2 6.3-2.2 9-.6V19c-2.7-1.6-5.7-1.6-9 .6-3.3-2.2-6.3-2.2-9-.6z"/><path d="M12 6.1v13.5"/>') },
    // Planned sections. They stay out of the navigation until they're built,
    // so nothing unfinished ever looks like a working control.
    { id: 'ideas', label: 'Ideas', ready: false }
  ];
  function sectionFromHash() {
    const id = (location.hash || '').replace('#', '').split('/')[0];
    const s = SECTIONS.find(x => x.id === id && x.ready);
    return s ? s.id : 'today';
  }
  let section = sectionFromHash();
  function renderNav() {
    $('nav').innerHTML = saveBlocked ? '' : SECTIONS.filter(s => s.ready).map(s => `
      <a class="nav-item" href="#${s.id}" ${s.id === section ? 'aria-current="page"' : ''}>
        <span class="nav-icon">${s.icon}</span><span class="nav-label">${s.label}</span>
      </a>`).join('');
  }

  // ======================================================================
  // Shift rota: pattern versions + per-date overrides + separate entries
  // ======================================================================
  const SHIFT_TYPES = ['day', 'night', 'off'];
  const PLANNED_TYPES = ['day', 'night', 'off', 'custom'];
  const ACTUAL_STATUSES = ['worked', 'sick', 'annual_leave', 'cancelled', 'off', 'custom'];
  const ENTRY_KINDS = ['overtime', 'unauthorised'];
  const STATUS_LABEL = {
    day: 'Day shift', night: 'Night shift', off: 'Off', custom: 'Custom', sick: 'Sick', annual_leave: 'Annual leave',
    cancelled: 'Cancelled', unauthorised: 'Unauthorised absence', overtime: 'Overtime', appointment: 'Appointment', worked: 'Worked'
  };
  const SHORT_LABEL = { day: 'Day', night: 'Night', off: 'Off', custom: 'Custom', sick: 'Sick', annual_leave: 'Leave', cancelled: 'Cancel', unauthorised: 'Absent', overtime: '+OT', appointment: 'Appt' };
  const DEFAULT_COLOURS = {
    day: '#2f8f4e', night: '#a8d5f7', off: '#c9d1cc', sick: '#f5a3a3', unauthorised: '#111111',
    annual_leave: '#c9b5ec', cancelled: '#a7a7a7', custom: '#f1c66a', overtime: '#f0a05a', appointment: '#a9b0e0'
  };
  const DEFAULT_TIMES = { day: { start: '07:00', end: '19:00' }, night: { start: '19:00', end: '07:00' } };
  const DEFAULT_CYCLE = ['day', 'day', 'day', 'day', 'off', 'off', 'off', 'off', 'night', 'night', 'night', 'night', 'off', 'off', 'off', 'off'];
  const isHex = s => typeof s === 'string' && /^#[0-9a-f]{6}$/i.test(s);
  const mod = (a, n) => ((a % n) + n) % n;

  function emptyRota() { return { patterns: [], overrides: {}, entries: [], colours: Object.assign({}, DEFAULT_COLOURS) }; }

  function normalizeRota(raw, report) {
    const r = emptyRota();
    if (!isObj(raw)) return r;
    if (Array.isArray(raw.patterns)) {
      const byFrom = new Map();
      for (const v of raw.patterns) {
        if (!isObj(v) || !isDateKey(v.anchor) || !Array.isArray(v.cycle) || !v.cycle.length || v.cycle.length > 56 || !v.cycle.every(t => SHIFT_TYPES.includes(t))) { report.dropped++; continue; }
        const times = {};
        for (const t of ['day', 'night']) {
          const tv = isObj(v.times) && isObj(v.times[t]) ? v.times[t] : {};
          times[t] = { start: isTime(tv.start) ? tv.start : DEFAULT_TIMES[t].start, end: isTime(tv.end) ? tv.end : DEFAULT_TIMES[t].end };
        }
        const breaks = { day: intIn(isObj(v.breaks) ? v.breaks.day : 0, 0, 240, 0), night: intIn(isObj(v.breaks) ? v.breaks.night : 0, 0, 240, 0) };
        const from = isDateKey(v.effectiveFrom) ? v.effectiveFrom : null;
        byFrom.set(from || '', { id: typeof v.id === 'string' && v.id ? v.id : 'p' + uid(), effectiveFrom: from, anchor: v.anchor, cycle: v.cycle.slice(), times, breaks });
      }
      r.patterns = [...byFrom.values()].sort((a, b) => ((a.effectiveFrom || '') < (b.effectiveFrom || '') ? -1 : 1));
    }
    if (isObj(raw.overrides)) {
      for (const d of Object.keys(raw.overrides)) {
        const o = raw.overrides[d];
        if (!isDateKey(d) || !isObj(o)) { report.dropped++; continue; }
        const out = {};
        if (isObj(o.planned) && PLANNED_TYPES.includes(o.planned.type)) {
          const p = { type: o.planned.type };
          if (isTime(o.planned.start) && isTime(o.planned.end)) { p.start = o.planned.start; p.end = o.planned.end; }
          if (typeof o.planned.label === 'string' && o.planned.label.trim()) p.label = o.planned.label.trim().slice(0, 40);
          if (o.planned.breakMin !== undefined) p.breakMin = intIn(o.planned.breakMin, 0, 240, 0);
          out.planned = p;
        }
        if (isObj(o.actual) && ACTUAL_STATUSES.includes(o.actual.status)) {
          const a = { status: o.actual.status };
          if (isTime(o.actual.start) && isTime(o.actual.end)) { a.start = o.actual.start; a.end = o.actual.end; }
          if (typeof o.actual.label === 'string' && o.actual.label.trim()) a.label = o.actual.label.trim().slice(0, 40);
          if (a.status === 'custom') a.paid = o.actual.paid === true;
          out.actual = a;
        }
        if (out.planned || out.actual) r.overrides[d] = out; else report.dropped++;
      }
    }
    if (Array.isArray(raw.entries)) {
      for (const e of raw.entries) {
        if (!isObj(e) || !ENTRY_KINDS.includes(e.kind) || !isDateTime(e.start) || !isDateTime(e.end) || e.end <= e.start) { report.dropped++; continue; }
        r.entries.push({ id: typeof e.id === 'string' && e.id ? e.id : 'e' + uid(), kind: e.kind, start: e.start, end: e.end, note: typeof e.note === 'string' ? e.note.slice(0, 80) : '' });
      }
      r.entries.sort((a, b) => (a.start < b.start ? -1 : 1));
    }
    if (isObj(raw.colours)) for (const k of Object.keys(DEFAULT_COLOURS)) if (isHex(raw.colours[k])) r.colours[k] = raw.colours[k].toLowerCase();
    return r;
  }

  // Times for a shift shown on its own date: "19:00–07:00 (next day)".
  function fmtShiftRange(s, e, d) {
    const tag = x => (x === d ? '' : dayDiff(x, d) === 1 ? ' (next day)' : dayDiff(x, d) === -1 ? ' (day before)' : ` (${shortDate(x)})`);
    return `${s.slice(11)}${tag(s.slice(0, 10))}–${e.slice(11)}${tag(e.slice(0, 10))}`;
  }

  // The pattern version in force on a date: the latest one whose effective date has arrived.
  function patternFor(d) {
    let best = null;
    for (const v of state.rota.patterns) {
      if (v.effectiveFrom && v.effectiveFrom > d) continue;
      if (!best || (v.effectiveFrom || '') >= (best.effectiveFrom || '')) best = v;
    }
    return best;
  }
  // End time on or before the start time means the shift ends the next day (e.g. 19:00–07:00).
  const endDateFor = (d, start, end) => (end <= start ? shift(d, 1) : d);

  // What the rota says for a date (pattern, unless this one date was changed).
  function plannedFor(d) {
    const v = patternFor(d), ov = state.rota.overrides[d], po = ov && ov.planned;
    let type = v ? v.cycle[mod(dayDiff(d, v.anchor), v.cycle.length)] : null;
    let source = v ? 'rota' : 'none';
    if (po) { type = po.type; source = 'changed'; }
    if (!type) return null;
    let start = null, end = null, breakMin = 0, label = null;
    if (type === 'day' || type === 'night') {
      const tv = v ? v.times[type] : DEFAULT_TIMES[type];
      start = po && po.start ? po.start : tv.start;
      end = po && po.start ? po.end : tv.end;
      breakMin = po && po.breakMin !== undefined ? po.breakMin : v ? v.breaks[type] : 0;
    } else if (type === 'custom') {
      label = (po && po.label) || 'Custom';
      if (po && po.start) { start = po.start; end = po.end; breakMin = po.breakMin || 0; }
    }
    const startDt = start ? `${d}T${start}` : null;
    const endDt = start ? `${endDateFor(d, start, end)}T${end}` : null;
    return { date: d, type, label, start, end, startDt, endDt, breakMin, source, works: !!startDt };
  }

  // What actually happened. Nothing recorded = assumed to go as planned (shown as "assumed").
  function actualFor(d) {
    const p = plannedFor(d), ov = state.rota.overrides[d], a = ov && ov.actual;
    if (!a) {
      return p && p.works
        ? { status: 'worked', assumed: true, startDt: p.startDt, endDt: p.endDt, breakMin: p.breakMin, works: true, paidCustom: false }
        : { status: 'off', assumed: true, works: false };
    }
    if (a.status === 'worked') {
      const s = a.start || (p && p.start), e = a.start ? a.end : (p && p.end);
      if (!s) return { status: 'worked', assumed: false, works: false };
      return { status: 'worked', assumed: false, startDt: `${d}T${s}`, endDt: `${endDateFor(d, s, e)}T${e}`, breakMin: p ? p.breakMin : 0, works: true, edited: !!a.start };
    }
    if (a.status === 'custom') {
      const works = !!a.start;
      return { status: 'custom', assumed: false, label: a.label || 'Custom', paidCustom: !!a.paid, works,
        startDt: works ? `${d}T${a.start}` : null, endDt: works ? `${endDateFor(d, a.start, a.end)}T${a.end}` : null, breakMin: 0 };
    }
    return { status: a.status, assumed: false, works: false };
  }

  function setOverride(d, part, value) {
    const o = Object.assign({}, state.rota.overrides[d] || {});
    if (value) o[part] = value; else delete o[part];
    if (o.planned || o.actual) state.rota.overrides[d] = o; else delete state.rota.overrides[d];
    persist();
  }

  // Real elapsed time between two local wall-clock times (so DST nights are 11 or 13 hours).
  function dtToDate(dt) { return new Date(+dt.slice(0, 4), +dt.slice(5, 7) - 1, +dt.slice(8, 10), +dt.slice(11, 13), +dt.slice(14, 16)); }
  const msBetween = (a, b) => dtToDate(b) - dtToDate(a);
  function overlapMs(a1, a2, b1, b2) { return Math.max(0, Math.min(a2, b2) - Math.max(a1, b1)); }

  function entriesOn(d) { return state.rota.entries.filter(e => e.start.slice(0, 10) === d); }
  function entriesTouching(d) { return state.rota.entries.filter(e => e.start.slice(0, 10) <= d && e.end.slice(0, 10) >= d && e.end > d + 'T00:00'); }

  // Unauthorised absence that overlaps the shift starting on date d (ms), and whether it covers it all.
  function absenceOn(d) {
    const a = actualFor(d);
    if (!a.works) return { ms: 0, whole: false, any: entriesOn(d).some(e => e.kind === 'unauthorised') };
    const s = +dtToDate(a.startDt), e = +dtToDate(a.endDt);
    let ms = 0;
    for (const x of state.rota.entries) if (x.kind === 'unauthorised') ms += overlapMs(s, e, +dtToDate(x.start), +dtToDate(x.end));
    ms = Math.min(ms, e - s);
    return { ms, whole: ms > 0 && ms >= e - s, any: ms > 0 };
  }

  // The status shown in the calendar for a date, with its colour key and label.
  function displayStatus(d) {
    const p = plannedFor(d), a = actualFor(d), ua = absenceOn(d);
    if (ua.whole) return { key: 'unauthorised', label: STATUS_LABEL.unauthorised, short: SHORT_LABEL.unauthorised, p, a };
    if (!a.assumed && a.status !== 'worked') {
      if (a.status === 'custom') return { key: 'custom', label: a.label, short: a.label, p, a };
      return { key: a.status, label: STATUS_LABEL[a.status], short: SHORT_LABEL[a.status], p, a };
    }
    if (!p) return { key: null, label: '', short: '', p, a };
    if (p.type === 'custom') return { key: 'custom', label: p.label, short: p.label, p, a };
    return { key: p.type, label: STATUS_LABEL[p.type], short: SHORT_LABEL[p.type], p, a };
  }

  // Readable text on any background colour: black or white, whichever contrasts more.
  function lum(hex) {
    const c = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255).map(v => (v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4));
    return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
  }
  const textOn = hex => ((1.05) / (lum(hex) + 0.05) >= (lum(hex) + 0.05) / 0.05 ? '#ffffff' : '#000000');
  function chip(key, text, extraClass) {
    const c = state.rota.colours[key] || '#888888';
    return `<span class="rchip${extraClass ? ' ' + extraClass : ''}" style="--c:${c};--t:${textOn(c)}">${esc(text)}</span>`;
  }

  // Work time from the rota for Today's planning: actual shifts (or planned, if not yet recorded) and overtime.
  function rotaWorkBlocks(k) {
    const out = [];
    for (const d of [shift(k, -1), k, shift(k, 1)]) {
      const a = actualFor(d);
      if (!a.works || (a.status === 'custom' && !a.paidCustom && !a.startDt)) continue;
      const p = plannedFor(d);
      const title = a.status === 'custom' ? a.label : p && p.type === 'night' ? 'Night shift' : p && p.type === 'day' ? 'Day shift' : 'Shift';
      out.push({ kind: 'work', rota: true, title, start: a.startDt, end: a.endDt });
    }
    for (const e of state.rota.entries) {
      if (e.kind !== 'overtime') continue;
      if (e.end.slice(0, 10) < shift(k, -1) || e.start.slice(0, 10) > shift(k, 1)) continue;
      out.push({ kind: 'work', rota: true, title: 'Overtime', start: e.start, end: e.end });
    }
    return out;
  }

  // Everything with a time on a date, for overlap checks.
  function timedItemsOn(d) {
    const items = [];
    const dayStart = +dtToDate(d + 'T00:00'), dayEnd = +dtToDate(shift(d, 1) + 'T00:00');
    const add = (label, s, e, kind) => {
      const a = +dtToDate(s), b = +dtToDate(e);
      if (overlapMs(a, b, dayStart, dayEnd) > 0) items.push({ label, s: a, e: b, kind, startDt: s, endDt: e });
    };

  // ======================================================================

  function defaultPay() {

      frequency: 'monthly', periodAnchor: todayKey().slice(0, 8) + '01',

  function numIn(v, lo, hi, fallback) {

    p.sickPay = ['ssp', 'full', 'percent'].includes(raw.sickPay) ? raw.sickPay : 'ssp';

  function shiftMonth(k, n) { const [y, m, d] = k.split('-').map(Number); return keyOf(new Date(y, m - 1 + n, d, 12)); }
  function periodContaining(x) {
    const p = state.pay;
    if (p.frequency === 'monthly') {
      const day = Math.min(28, Number(p.periodAnchor.slice(8, 10)));
      let start = x.slice(0, 8) + pad(day);
      if (start > x) start = shiftMonth(start, -1);

  function parseTaxCode(raw) {

    if (!scottish && /^D[01]$/.test(c)) return { scottish, flatRate: [0.40, 0.45][+c[1]] };
    const m = c.match(/^(\d{1,5})[LMNT]$/);
    if (m) return { scottish, allowance: Number(m[1]) === 0 ? 0 : Number(m[1]) * 10 + 9 };

  }

  const floor2 = n => Math.floor(n * 100 + 1e-9) / 100;
  const round2 = n => Math.round(n * 100) / 100;

  // Estimated deductions for one pay period (non-cumulative, like a "Week 1/Month 1" code).
  function deductionsFor(gross, freq, taxYear) {
    const R = TAX_YEARS[taxYear], out = { tax: 0, ni: 0, sl: 0, pgl: 0, notes: [], ok: !!R };
    if (!R) { out.notes.push(`No tax rates are stored for the ${taxYear}/${String(taxYear + 1).slice(2)} tax year, so deductions aren't estimated.`); return out; }
    const per = freq === 'monthly' ? null : FREQ_DAYS[freq] / 7;
    const frac = freq === 'monthly' ? 1 / 12 : per / 52;
    const code = parseTaxCode(state.pay.taxCode);
    if (code.error) out.notes.push(code.error);

  // ---------- Hours and money for one working interval ----------
  // Splits paid hours into normal and bank-holiday hours. Unpaid break is taken proportionally.
  function bankHolidayMs(sMs, eMs, startDate) {
    if (state.pay.bankHolidayHours === 'shift') return bankHolidayOn(startDate) ? eMs - sMs : 0;
    let ms = 0;
    for (let d = shift(startDate, -1); d <= keyOf(new Date(eMs)); d = shift(d, 1)) {
      if (!bankHolidayOn(d)) continue;
      ms += overlapMs(sMs, eMs, +dtToDate(d + 'T00:00'), +dtToDate(shift(d, 1) + 'T00:00'));
    }
    return ms;
  }
  function payInterval(acc, segs, breakMin, startDate, typeMult, kind) {
    const rate = state.pay.hourlyRate || 0, bhMult = state.pay.bankHolidayMultiplier;
    const totalMs = segs.reduce((a, s) => a + (s[1] - s[0]), 0);
    if (totalMs <= 0) return 0;
    const shiftMs = segs.fullMs || totalMs;
    const ratio = Math.max(0, shiftMs - breakMin * 60000) / shiftMs;
    const hours = (totalMs / 3600000) * ratio;
    const bhHours = (segs.reduce((a, s) => a + bankHolidayMs(s[0], s[1], startDate), 0) / 3600000) * ratio;
    const bhPremium = bhHours * rate * Math.max(0, Math.max(bhMult, typeMult) - typeMult);
    acc.bhHours += bhHours;
    acc.bhPremium += bhPremium;

    else {

  function plannedValue(p) {

  // ---------- Statutory Sick Pay ----------
  const isQualifyingDay = d => { const p = plannedFor(d); return !!(p && p.works); };

    const sunday = shift(d, -parseKey(d).getDay());

    for (let i = 0; i < 7; i++) if (isQualifyingDay(shift(sunday, i))) n++;
    return n;
  }

    if (state.pay.averageWeeklyEarnings !== null) return { value: state.pay.averageWeeklyEarnings, source: 'entered' };
    if (!state.pay.hourlyRate) return { value: null, source: 'unknown' };
    let sum = 0;

    return { value: round2(sum / 8), source: 'estimated' };
  }
  // SSP for every sick qualifying day: { date: { amount, note, weekly, qds } }.
  function sspSchedule() {

    const runs = [];
    for (const d of sick) {

  // ---------- One pay period: scheduled (rota only) vs actual (what happened) ----------
  function blankTotals() {

      basic: 0, nightPremium: 0, overtimePay: 0, bhPremium: 0, leavePay: 0, sickPay: 0, otherPay: 0, gross: 0 };
  }
  function computePeriod(per) {

    const ssp = sspSchedule();
    const today = todayKey();

    }
    for (const t of [sched, act]) {
      for (const k of ['basic', 'nightPremium', 'overtimePay', 'bhPremium', 'leavePay', 'sickPay', 'otherPay']) t[k] = round2(t[k]);
      t.gross = round2(t.basic + t.nightPremium + t.overtimePay + t.bhPremium + t.leavePay + t.sickPay + t.otherPay);
      const ty = taxYearOf(per.end);
      t.ded = deductionsFor(t.gross, pay.frequency, ty);
      t.net = round2(t.gross - t.ded.tax - t.ded.ni - t.ded.sl - t.ded.pgl);
    }
    const firstSick = Object.values(ssp).find(v => v.weekly);
    return { sched, act, notes, sspInfo: firstSick || null };
  }

  // ======================================================================
  // Calendar view
  // ======================================================================
  let calMonth = null;     // 'YYYY-MM' being shown
  let calSelected = null;  // selected date
  let calView = 'month';   // 'month' | 'agenda'

  function calendarMain() {
    const k = todayKey();
